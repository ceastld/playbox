<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#031018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>浩劫 · HAVOC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23031018'/%3E%3Cpath d='M6 8h20v2H6zm2 2h16v12H8z' fill='none' stroke='%2319c8ff' stroke-width='1.2'/%3E%3Cpath d='M16 6l3 5h-6z' fill='%2300f0ff'/%3E%3Ccircle cx='16' cy='20' r='2.2' fill='%23ffe36b'/%3E%3Cpath d='M14 22h4v5l-2 3-2-3z' fill='%2319c8ff'/%3E%3Crect x='22' y='18' width='4' height='8' rx='.6' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>浩劫</b>
        <span>HAVOC</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 界</span>
          <span id="tag-label">星域</span>
          <div class="fill" id="timer-wrap" hidden title="反应堆倒计时">
            <em>核</em>
            <div class="fill-track" aria-hidden="true"><i id="timer-bar"></i></div>
            <b id="timer-num">0</b>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="浩劫游戏区，先在星域开火对接空间站，再侧向跑跳冲进基地引爆反应堆并逃出"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <div class="pad-move">
          <button type="button" id="btn-left" aria-label="左">左</button>
          <button type="button" id="btn-right" aria-label="右">右</button>
        </div>
        <div class="pad-act">
          <button type="button" id="btn-up" aria-label="上或跳">上</button>
          <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
          <button type="button" id="btn-fire" aria-label="射击">射</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">HAVOC</p>
          <h1 id="ov-title">浩劫</h1>
          <p class="lead" id="ov-lead">先在星域开火，对接空间站。<br />再冲进基地，引爆反应堆，在倒计时内逃出。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞或跑 · 空格射击/跳跃 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-raid">突袭</button>
            <button type="button" id="btn-rush">狂奔</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">星域开火对接 · 基地跑跳拆堆 · 倒计时内逃出</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
