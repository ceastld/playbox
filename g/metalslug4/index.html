<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140810" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>金弹4 · MSL4</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140810'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231a0c14' stroke='%23ff8a1a' stroke-width='1.4'/%3E%3Cpath d='M4 26h24' stroke='%23ff8a1a' stroke-width='1.4' opacity='.7'/%3E%3Crect x='14' y='15' width='14' height='8' rx='1' fill='%234a2838' stroke='%23ff8a1a' stroke-width='.5'/%3E%3Crect x='20' y='12' width='9' height='3' fill='%23c85a8a'/%3E%3Ccircle cx='17' cy='24' r='2.2' fill='%231a140c'/%3E%3Ccircle cx='25' cy='24' r='2.2' fill='%231a140c'/%3E%3Ccircle cx='9' cy='16' r='2.4' fill='%23f4d6b0'/%3E%3Crect x='7.2' y='18' width='4' height='5' rx='.5' fill='%2324488c'/%3E%3Cpath d='M6 15h5' stroke='%23ff3db8' stroke-width='1.2'/%3E%3Cpath d='M8 10 q4 -6 2 -2' stroke='%2300f0ff' stroke-width='.8' fill='none' opacity='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>金弹4</b>
        <span>MSL4</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">欧巷</span>
          <span id="tag-label">金弹4</span>
          <span id="route-label" class="route" hidden>雨街</span>
          <span id="nade-label" class="nades">雷 8</span>
          <span id="gun-label" class="gun">手枪</span>
          <span id="ride-label" class="ride" hidden>布雷德</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-stage" aria-pressed="true">金弹4</button>
          <button type="button" id="mode-core" aria-pressed="false">弹核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="金弹4，侧向跑跳开火，伞降，布雷德，火箭追弹，撞上即死"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-duck" aria-label="蹲下">蹲</button>
        <button type="button" id="btn-nade" aria-label="手雷">雷</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MSL4</p>
          <h1 id="ov-title">金弹4</h1>
          <p class="lead" id="ov-lead">侧向跑跳开火。欧巷分屋脊 / 雨街，雨寺分廊上 / 庭下。<br />开布雷德、丢雷、空中按上伞降，打到智核坦。撞上即死，载具撞毁丢命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走跳 · 空格开火 · Shift/Z 手雷 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-stage">金弹4</button>
            <button type="button" id="btn-core">弹核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳开火 · Shift/Z 手雷 · 伞降 · 开布雷德 · 撞上即死</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
