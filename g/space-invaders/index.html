<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#08160a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>侵者 · INVD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308160a'/%3E%3Cpath d='M8 5h2v2H8zm14 0h2v2h-2zM10 7h12v2H10zM7 9h18v3H7zm2 3h3v2H9zm13 0h3v2h-3z' fill='%236cff3a'/%3E%3Cpath d='M12 15h8v2h-8zM6 13h2v2H6zm18 0h2v2h-2z' fill='%23ff3db8'/%3E%3Crect x='5' y='21' width='6' height='3' fill='%232ee07a'/%3E%3Crect x='13' y='21' width='6' height='3' fill='%232ee07a'/%3E%3Crect x='21' y='21' width='6' height='3' fill='%232ee07a'/%3E%3Cpath d='M13 25h6v2h-6zm-2 2h10v2H11z' fill='%2300f0c8'/%3E%3Crect x='15' y='23' width='2' height='4' fill='%23eaffde'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>侵者</b>
        <span>INVD</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">侵者</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="侵者游戏区，底部炮台左右移动开火，编队横移下压，掩体可藏，四波后见侵王"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">INVD</p>
          <h1 id="ov-title">侵者</h1>
          <p class="lead" id="ov-lead">炮台左右开火。编队横移下压，藏进四座掩体。四波之后侵王降临。</p>
          <p class="ops" id="ov-ops">← → / WASD 移动 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">侵者</button>
            <button type="button" id="btn-core">侵核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">藏进掩体 · 编队推进 · 四波见侵王</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
