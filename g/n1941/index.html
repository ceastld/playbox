<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>四一 · N141</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M6 23h20' stroke='%23c45a28' stroke-width='2'/%3E%3Cpath d='M16 5l1.2 7 5 .5-4 3.2 1.4 5.2L16 18l-3.6 2.9 1.4-5.2-4-3.2 5-.5z' fill='none' stroke='%23ffe36b' stroke-width='.7' opacity='.45'/%3E%3Cpath d='M10 12v11 M22 12v11' stroke='%23ff7a29' stroke-width='1.7'/%3E%3Cpath d='M8 12h16' stroke='%23ff7a29' stroke-width='1.5'/%3E%3Cpath d='M16 7v10' stroke='%23ffe36b' stroke-width='1.4'/%3E%3Cpath d='M8 23h5 M19 23h5' stroke='%23ff7a29' stroke-width='1.6'/%3E%3Cellipse cx='16' cy='14' rx='2.2' ry='3' fill='%23fff4ea'/%3E%3Cpath d='M16 4v6 M14 8l2-4 2 4' stroke='%23ffe36b' stroke-width='.9' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>四一</b>
        <span>N141</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">四一</span>
          <span id="wpn-label" class="wpn">雷</span>
          <span id="bolt-label" class="bolts">闪 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bolt" title="Shift / Z" aria-label="落雷清弹">闪</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="四一游戏区，垂直卷轴，空格射击，Shift 落雷清弹炸舰"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-bolt" aria-label="落雷清弹">闪</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">N141</p>
          <h1 id="ov-title">四一</h1>
          <p class="lead" id="ov-lead">双尾闪电。空格连射扫空打舰，Shift 落雷清弹炸航母。吉尔伯特、马绍尔、特鲁克。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击 · Shift / Z 落雷 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">四一</button>
            <button type="button" id="btn-core">海核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格扫空打舰 · Shift 落雷清弹炸舰 · 吃 雷 加宽</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
