<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#030a08" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>蜈袭 · CENTI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030a08'/%3E%3Ccircle cx='7' cy='10' r='2.2' fill='%23ff3db8'/%3E%3Ccircle cx='16' cy='8' r='2.2' fill='%23ff3db8'/%3E%3Ccircle cx='24' cy='11' r='2' fill='%23ff3db8'/%3E%3Ccircle cx='6' cy='16' r='2.4' fill='%233dff8a'/%3E%3Ccircle cx='11' cy='16' r='2.1' fill='%2314e070'/%3E%3Ccircle cx='16' cy='17' r='2.1' fill='%2314e070'/%3E%3Ccircle cx='21' cy='16' r='2.1' fill='%2314e070'/%3E%3Ccircle cx='26' cy='15' r='2.4' fill='%237affb0'/%3E%3Cpath d='M14 26h4v2h-4zm-2 2h8v2H12z' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>蜈袭</b>
        <span>CENTI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">CLASSIC</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="蜈袭游戏区，底部射击蜈蚣，击中会断开"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CENTI</p>
          <h1 id="ov-title">蜈袭</h1>
          <p class="lead" id="ov-lead">打头打尾，虫链会断。蘑菇挡路，蜘蛛扎底栏。</p>
          <p class="ops" id="ov-ops">方向键 / 指针移动 · 空格或点按开火 · A 自动 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-forest">密林</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向键移动 · 空格开火 · A 自动 · 击中身节即断开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
