<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>推球 · DO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%2312080c' stroke='%23ff6a22' stroke-width='1.3'/%3E%3Ccircle cx='11' cy='12' r='2.1' fill='%23ff3d58'/%3E%3Ccircle cx='14.2' cy='12' r='2.1' fill='%23ff3d58'/%3E%3Cpath d='M12.6 9.2c.4-1.6 1.8-1.8 2.2-.2' stroke='%233dff88' stroke-width='1.1' fill='none'/%3E%3Ccircle cx='22' cy='20' r='3.2' fill='%23ffe36b'/%3E%3Ccircle cx='21.2' cy='19.1' r='1' fill='%23fff8d0'/%3E%3Ccircle cx='10' cy='21' r='2.4' fill='%23ff6a22'/%3E%3Ccircle cx='9.3' cy='20.4' r='.7' fill='%23fff'/%3E%3Ccircle cx='10.8' cy='20.4' r='.7' fill='%23fff'/%3E%3Cpath d='M16 8.2l2.4 4.2H13.6z' fill='%23ff6a22'/%3E%3Ccircle cx='16' cy='7.6' r='1.15' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>推球</b>
        <span>DO</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em id="round-em">关</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box" hidden>
            <em>连碾</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">果园</span>
          <div class="letters" id="letters" aria-label="EXTRA">
            <i>E</i><i>X</i><i>T</i><i>R</i><i>A</i>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <div class="board" id="board">
          <canvas id="c" tabindex="0" role="application" aria-label="推球，挖掘果园，空格沿隧道扔魔力球碾怪，收光樱桃过关"></canvas>
        </div>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-throw" aria-label="扔球">扔</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DO</p>
          <h1 id="ov-title">推球</h1>
          <p class="lead" id="ov-lead">挖开果园，推魔力球碾怪。收光樱桃过关。</p>
          <p class="ops" id="ov-ops">方向键或 WASD 走挖 · 空格扔球 · 触屏滑向 + 扔 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-garden">果园</button>
            <button type="button" id="btn-hunt">追击</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">挖隧道 · 空格把魔力球沿路扔出去碾怪 · 收光樱桃过关</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
