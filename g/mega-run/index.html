<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>洛克 · MEGA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041018'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23081620' stroke='%2319c8ff' stroke-width='1.4'/%3E%3Ccircle cx='14' cy='13' r='5' fill='%2319c8ff'/%3E%3Crect x='12' y='12' width='7' height='2.4' rx='.6' fill='%23041018'/%3E%3Crect x='11' y='17.4' width='6.4' height='7' rx='1' fill='%2300a8e8'/%3E%3Crect x='16.6' y='18' width='9' height='2.2' rx='.5' fill='%23ffe36b'/%3E%3Cpath d='M4 25h24' stroke='%2300f0ff' stroke-width='1.2' opacity='.45'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>洛克</b>
        <span>MEGA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">电弧</span>
          <span id="tag-label">选关</span>
          <span id="hp-label" class="hp">HP 28</span>
          <span id="gun-label" class="gun">标准</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-select" aria-pressed="true">选关</button>
          <button type="button" id="mode-fort" aria-pressed="false">要塞</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="洛克，侧向跑跳，空格射击按住充能，击败首领夺取武器"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-wpn" aria-label="切换武器">武</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="射击，按住充能">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-slide" aria-label="滑铲">滑</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MEGA</p>
          <h1 id="ov-title">洛克</h1>
          <p class="lead" id="ov-lead">侧向跑跳，空格射击，按住充能。<br />击败首领，夺走武器，冲进要塞。</p>
          <p class="ops" id="ov-ops">WASD / 方向键 走跳滑 · 空格射击充能 · 1-4 换武器 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-select">选关</button>
            <button type="button" id="btn-fort">要塞</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · 空格射击按住充能 · 1-4 换武器 · 滑铲过低缝 · 血格打空丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
