<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041816" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>瓦特 · VRTH</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041816'/%3E%3Cpath d='M4 24h24' stroke='%231a6a58' stroke-width='2'/%3E%3Cpath d='M16 6l8 14h-5l-3 6-3-6H8z' fill='%231ee8c4'/%3E%3Cpath d='M16 9l4 9h-8z' fill='%23e6fff8'/%3E%3Crect x='15' y='14' width='2' height='8' fill='%23ffe36b'/%3E%3Cpath d='M10 18h4 M18 18h4' stroke='%231ee8c4' stroke-width='1.6'/%3E%3Cpath d='M12 4l2 5 M20 4l-2 5' stroke='%23ffe36b' stroke-width='.9' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>瓦特</b>
        <span>VRTH</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">空袭</span>
          <span id="wpn-label" class="wpn">火</span>
          <span id="spd-label" class="spd">速</span>
          <span id="bomb-label" class="bombs">焰 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="焰弹">焰</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="瓦特游戏区，纵向卷轴，空格射击，Shift 扔焰弹，捡 火束追速"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="焰弹">焰</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">VRTH</p>
          <h1 id="ov-title">瓦特</h1>
          <p class="lead" id="ov-lead">纵向卷轴。捡 火/束/追 切武装，速加快。Shift 扔焰弹燎空。短关之后是机甲。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格开火 · Shift / Z 焰弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">空袭</button>
            <button type="button" id="btn-storm">密弹</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向移动 · 空格开火 · Shift 焰弹 · 捡 火/束/追/速</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
