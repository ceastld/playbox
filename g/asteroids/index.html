<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#030814" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>岩带 · ROCK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030814'/%3E%3Cpolygon points='8,10 16,6 22,12 18,20 10,18' fill='none' stroke='%235cb8ff' stroke-width='1.3'/%3E%3Cpolygon points='20,16 27,14 29,20 24,24 19,21' fill='none' stroke='%2300e8ff' stroke-width='1.2'/%3E%3Cpolygon points='16,18 20,28 12,26' fill='none' stroke='%23e8f4ff' stroke-width='1.4'/%3E%3Cpath d='M16 28 L14.6 31 L16 29.6 L17.4 31 Z' fill='%2300e8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>岩带</b>
        <span>ROCK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">岩带</span>
          <span id="tag-label">ROCK</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="岩带游戏区，惯性拧船，出边绕回，打裂岩石"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-ccw" aria-label="左转">↺</button>
          <button type="button" class="pad thrust" id="pad-thrust" aria-label="推进">▲</button>
          <button type="button" class="pad" id="pad-cw" aria-label="右转">↻</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad hyper" id="pad-hyper" aria-label="跃迁">跃</button>
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">火</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ROCK</p>
          <h1 id="ov-title">岩带</h1>
          <p class="lead" id="ov-lead">惯性拧船，出边绕回。大岩裂中、中裂小。飞碟稍后入场。跃迁有风险。</p>
          <p class="ops" id="ov-ops">A D / ← → 转向 · W / ↑ 推进 · 空格开火 · Shift 跃迁</p>
          <div class="ov-actions">
            <button type="button" id="btn-belt">岩带</button>
            <button type="button" id="btn-swarm">乱飞</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 推进 · 空格开火 · Shift 跃迁 · 出边绕回</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
