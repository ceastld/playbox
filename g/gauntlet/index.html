<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0704" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>地牢 · GAUN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0704'/%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23140c06' stroke='%23ff7a18' stroke-width='1.4'/%3E%3Cpath d='M8 8h6v3H8zm10 4h6v2h-6zM7 18h4v3H7zM20 20h5v3h-5z' fill='%23ff7a18' opacity='.85'/%3E%3Ccircle cx='12' cy='21' r='2.2' fill='%2300f0ff'/%3E%3Crect x='13.6' y='20.2' width='6.2' height='1.4' rx='.4' fill='%23ffe36b'/%3E%3Cpath d='M20 11l3 4-1.2.9-3-4z' fill='%23ffe36b'/%3E%3Ccircle cx='22' cy='24' r='2.4' fill='%236dff9a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>地牢</b>
        <span>GAUN</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score hp" id="hp-box">
            <em>生命</em>
            <b id="hp">100</b>
            <span class="hp-track" aria-hidden="true"><i id="hp-fill"></i></span>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">清廊</span>
          <span id="tag-label">器 —</span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-clear" aria-pressed="true">清廊</button>
          <button type="button" id="mode-horde" aria-pressed="false">尸潮</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="地牢迷宫，四向走，空格射击，贴身斩发生器，捡食物，生命一直掉，出口随时可进"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GAUN</p>
          <h1 id="ov-title">地牢</h1>
          <p class="lead" id="ov-lead">四向跑迷宫。空格射弹，贴身挥剑砸发生器。<br />生命一直在掉，食物回血。出口随时可进，别磨太久。</p>
          <p class="ops" id="ov-ops">WASD / 方向键四向走 · 空格射击 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-clear">清廊</button>
            <button type="button" id="btn-horde">尸潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">四向走 · 空格射击 · 贴身斩发生器 · 生命一直掉 · 出口随时可进</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
