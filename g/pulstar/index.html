<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#031418" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星脉 · PULS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23031418'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%2300e8d4' stroke-width='1.4' opacity='.7'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%233dffc4' stroke-width='1' opacity='.9'/%3E%3Cpath d='M6 16l12-4.5v9z' fill='%2300e8d4'/%3E%3Cpath d='M12 13.6h8v4.8h-8z' fill='%23e4fffb'/%3E%3Cpath d='M20 16l8-3.2v6.4z' fill='%233dffc4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星脉</b>
        <span>PULS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">星脉</span>
          <span id="pwr-label" class="pwr">火 0</span>
          <div class="fill" id="pulse-wrap" title="脉冲">
            <em>脉</em>
            <div class="fill-track" aria-hidden="true"><i id="pulse-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="脉冲弹">脉</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星脉游戏区，横向卷轴，空格连射，命中积蓄脉冲，Shift 放脉冲弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PULS</p>
          <h1 id="ov-title">星脉</h1>
          <p class="lead" id="ov-lead">横向卷轴。空格连射，命中积蓄脉冲，Shift 放脉冲弹清弹伤敌。每关中 Boss 与关底 Boss。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · Shift / Z 脉冲弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">星脉</button>
            <button type="button" id="btn-storm">脉冲</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · 命中积蓄 · Shift 放脉冲弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
