<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0814" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>怒四 · SOR4</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0814'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23120e1c' stroke='%23ffb020' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23ffb020' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='12' cy='13' r='3.4' fill='%23ffe36b'/%3E%3Crect x='9.4' y='16.2' width='5.4' height='7' rx='.8' fill='%23ffb020'/%3E%3Crect x='9.6' y='22.6' width='2.1' height='3.2' fill='%2318c8c8'/%3E%3Crect x='12.6' y='22.6' width='2.1' height='3.2' fill='%2318c8c8'/%3E%3Cpath d='M15.6 14.4l9-1.2-5.2 4.2z' fill='%2300e8ff'/%3E%3Cpath d='M22 8l1.2 2.6 2.8.2-2.2 1.8.8 2.6-2.6-1.4-2.6 1.4.8-2.6-2.2-1.8 2.8-.2z' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>怒四</b>
        <span>SOR4</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">画廊</span>
          <span id="tag-label">怒四</span>
          <span id="grab-label" class="wep">徒手</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill" id="sp-wrap" title="星能">
            <em>星</em>
            <div class="fill-track sp" aria-hidden="true"><i id="sp-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-street" aria-pressed="true">怒四</button>
          <button type="button" id="mode-core" aria-pressed="false">怒核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="怒四，沿街走位出拳，浮空连打，星冲打飞，星砸砸地"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-punch" aria-label="出拳">拳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-spec" aria-label="星砸">砸</button>
        <button type="button" id="btn-blitz" aria-label="星冲">冲</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SOR4</p>
          <h1 id="ov-title">怒四</h1>
          <p class="lead" id="ov-lead">沿街清场。出拳三连末击打浮空，空中再打可连浮。星冲打飞，星砸砸地。打穿三关，最后是罪主。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 空格出拳 · Shift / Z 星砸 · 双击方向星冲 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-street">怒四</button>
            <button type="button" id="btn-core">怒核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走出拳 · 浮空连打 · 星冲打飞 · 星砸砸地 · 血空丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
