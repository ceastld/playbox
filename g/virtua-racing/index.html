<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#06141a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>虚赛 · VRAC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306141a'/%3E%3Cpath d='M2 20 L16 10 L30 20 V30 H2Z' fill='%230a1c24'/%3E%3Cpath d='M8 30 L14 16 L18 16 L24 30' fill='%2300e4d0' opacity='.5'/%3E%3Cellipse cx='16' cy='24' rx='7' ry='2.4' fill='%23040608'/%3E%3Cpath d='M10 24 L13 17 H19 L22 24 Z' fill='%2300e4d0'/%3E%3Crect x='12.2' y='18.2' width='7.6' height='2.2' rx='.3' fill='%23e8fbff'/%3E%3Crect x='11' y='16.4' width='10' height='1.8' rx='.2' fill='%23ffe36b'/%3E%3Crect x='10.4' y='22.4' width='3.2' height='3.4' rx='.4' fill='%23101820'/%3E%3Crect x='18.4' y='22.4' width='3.2' height='3.4' rx='.4' fill='%23101820'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>虚赛</b>
        <span>VRAC</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">44.0</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>时速</em>
            <b id="spd">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">圈 1/3</span>
          <span id="tag-label">虚赛</span>
          <div class="fill clock" id="time-wrap" title="剩余时间">
            <em>限</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <div class="fill turbo" id="draft-wrap" title="吸力 / 喷">
            <em>喷</em>
            <div class="fill-track" aria-hidden="true"><i id="draft-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-boost" title="Shift / Z" aria-label="喷">喷</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="虚赛，进屏多边形赛道，贴尾吸力，喷出去，别撞到超时"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">VRAC</p>
          <h1 id="ov-title">虚赛</h1>
          <p class="lead" id="ov-lead">进屏多边形。贴尾吸力，喷出去超车。圈满之后是终段车团。</p>
          <p class="ops" id="ov-ops">方向 / WASD 转向 · 空格 / ↑ 油门 · Shift / Z 喷 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-core">虚赛</button>
            <button type="button" id="btn-dense">赛核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再冲</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 油门 · Shift 喷 · 贴尾吸力 · 别撞 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
