<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>双驶 · ORUN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M2 18 L16 8 L30 18 V30 H2Z' fill='%231a0c08'/%3E%3Cpath d='M6 30 L14 16 L18 16 L26 30' fill='%23ff5a28' opacity='.55'/%3E%3Crect x='4' y='22' width='10' height='5' rx='1' fill='%23ff5a28'/%3E%3Crect x='18' y='22' width='10' height='5' rx='1' fill='%2300e8ff'/%3E%3Crect x='15' y='8' width='2' height='22' fill='%23ffe36b' opacity='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>双驶</b>
        <span>ORUN</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">48.0</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>时速</em>
            <b id="spd">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">焰湾</span>
          <span id="tag-label">双驶</span>
          <span id="gap-label" class="gap">并驾</span>
          <div class="fill clock" id="time-wrap" title="剩余时间">
            <em>限</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <div class="fill turbo" id="turbo-wrap" title="涡轮">
            <em>涡</em>
            <div class="fill-track" aria-hidden="true"><i id="turbo-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-turbo" title="Shift / Z" aria-label="涡轮">涡</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="双驶，左右分屏进屏对开，把对手从弯里甩开，别超时"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ORUN</p>
          <h1 id="ov-title">双驶</h1>
          <p class="lead" id="ov-lead">左右分屏进屏对开。把对手从弯里甩开。短关之后是终段驶团。</p>
          <p class="ops" id="ov-ops">方向 / WASD 转向 · 空格油门 · Shift / Z 涡轮 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-core">双驶</button>
            <button type="button" id="btn-dense">驶核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再冲</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · 空格油门 · Shift 涡轮甩开 · 分叉选路 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
