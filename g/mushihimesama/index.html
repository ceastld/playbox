<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#06140c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>虫姬 · MUSHI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306140c'/%3E%3Cellipse cx='16' cy='20' rx='7' ry='5' fill='%233dff6a'/%3E%3Cpath d='M16 8l3.2 6H12.8z' fill='%23ff7ad4'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%23ffe8a0'/%3E%3Ccircle cx='8' cy='18' r='2.2' fill='%237affc4'/%3E%3Ccircle cx='24' cy='18' r='2.2' fill='%237affc4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>虫姬</b>
        <span>MUSHI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">虫林</span>
          <span id="wpn-label" class="wpn">散</span>
          <div class="fill" id="bloom-wrap" title="露华">
            <em>露</em>
            <div class="fill-track" aria-hidden="true"><i id="bloom-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="虫姬游戏区，八向移动，空格射击，选项珠跟舰，停住收束"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MUSHI</p>
          <h1 id="ov-title">虫姬</h1>
          <p class="lead" id="ov-lead">纵卷虫林。空格连射，选项珠跟舰。移动散开，停住收束。击破洒露华。短关之后是虫后。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-forest">虫林</button>
            <button type="button" id="btn-sea">虫海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">选项珠跟舰 · 停住收束 · 击破洒露</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
