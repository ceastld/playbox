<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>扑灯 · MOTH</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cellipse cx='10' cy='20' rx='6' ry='3.2' fill='none' stroke='%23ff3db8' stroke-width='1.3'/%3E%3Cellipse cx='10' cy='20' rx='3.4' ry='1.6' fill='%23ff3db8' opacity='.55'/%3E%3Crect x='20' y='7' width='7' height='10' rx='1.4' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Ccircle cx='23.5' cy='12' r='1.6' fill='%23ffe36b'/%3E%3Cpath d='M23.5 17v4' stroke='%2300f0ff' stroke-width='1.2' stroke-linecap='round'/%3E%3Cpath d='M16 26l1.2-5 2.6 1.6z' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>扑灯</b>
        <span>MOTH</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="入灯">
          <em>蛾</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0/1</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 夜</span>
          <span id="time-label">40s</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="扑灯庭院"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MOTH</p>
          <h1 id="ov-title">扑灯</h1>
          <p class="lead" id="ov-lead">蛾会扑向最亮的光。把灯靠近它们，<br />再绕开火，送到青灯里。</p>
          <p class="ops" id="ov-ops">WASD / 方向键提灯 · 按住拖动 · M 静音</p>
          <button type="button" id="ov-btn">提灯</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">灯靠近蛾 · 绕开火 · 送到青灯</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
