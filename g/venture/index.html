<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0706" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>秘窟 · VENT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0706'/%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23120808' stroke='%23ff8a2a' stroke-width='1.4'/%3E%3Cpath d='M7 8h6v5H7zm12 0h6v5h-6zM7 19h6v5H7zm12 0h6v5h-6z' fill='none' stroke='%23ff8a2a' stroke-width='1.1'/%3E%3Cpath d='M10 13v3h12v-3M13 16v3M19 16v3' stroke='%2300f0ff' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='16.5' r='2.1' fill='%23ffe36b'/%3E%3Cpath d='M17.8 16.5h4' stroke='%2300f0ff' stroke-width='1.3' stroke-linecap='round'/%3E%3Crect x='22' y='9' width='2.4' height='3.4' rx='.4' fill='%23ffe36b'/%3E%3Ccircle cx='9.5' cy='10.5' r='1.3' fill='%23ff5a1f'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>秘窟</b>
        <span>VENT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">寻宝</span>
          <span id="tag-label">宝 —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-hunt" aria-pressed="true">寻宝</button>
          <button type="button" id="mode-chase" aria-pressed="false">追逼</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="秘窟走廊，进房间抢宝物，朝面射击，别被堵住门，廊里别耽搁"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">VENT</p>
          <h1 id="ov-title">秘窟</h1>
          <p class="lead" id="ov-lead">走廊进房抢宝物。怪物会追，别被堵住门。<br />廊里耽搁，廊兽就会来。碰到掉命。</p>
          <p class="ops" id="ov-ops">WASD / 方向键走 · 空格朝面射击 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-hunt">寻宝</button>
            <button type="button" id="btn-chase">追逼</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">进房抢宝 · 别堵在门口 · 廊里别耽搁</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
