<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>弹射 · SLING</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='22' cy='12' r='7' fill='none' stroke='%23ff3db8' stroke-width='2'/%3E%3Cpath d='M6 26 C10 16 14 12 20 12' fill='none' stroke='%2300f0ff' stroke-width='2'/%3E%3Ccircle cx='8' cy='24' r='3' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>弹射</b>
        <span>SLING</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="power-label">—</span>
          <span class="pips" id="pips" aria-label="剩余光球"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="弹射光球"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SLING</p>
          <h1 id="ov-title">弹射</h1>
          <p class="lead" id="ov-lead">拉开光弦，把光球打进移动的环。<br />穿过环心才算。擦到环壁或落地都会碎。</p>
          <p class="ops" id="ov-ops">拖动拉弓 · A/D 瞄准 · W/S 力度 · 空格弹出 · M 静音</p>
          <button type="button" id="ov-btn">拉弦</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">拉开 · 对准环心 · 松手弹出</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
