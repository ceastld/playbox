<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140608" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>追缉 · CHASE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140608'/%3E%3Cpath d='M2 20h28v2H2z' fill='%23ff4814'/%3E%3Cpath d='M6 22 L16 12 L26 22' fill='%231a0a12'/%3E%3Crect x='11' y='18' width='10' height='6' rx='.8' fill='%23e8eef4'/%3E%3Crect x='12.2' y='19.1' width='3' height='1.6' rx='.25' fill='%2300e8ff'/%3E%3Crect x='16.8' y='19.1' width='3' height='1.6' rx='.25' fill='%23ff2d78'/%3E%3Crect x='13.4' y='16.2' width='5.2' height='2' rx='.3' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>追缉</b>
        <span>CHASE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">45.0</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>时速</em>
            <b id="spd">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">湾岸</span>
          <span id="tag-label">追车</span>
          <div class="fill clock" id="time-wrap" title="剩余时间">
            <em>限</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <div class="fill turbo" id="turbo-wrap" title="涡轮">
            <em>涡</em>
            <div class="fill-track" aria-hidden="true"><i id="turbo-bar"></i></div>
          </div>
          <div class="fill wound" id="wound-wrap" title="目标损伤">
            <em>伤</em>
            <div class="fill-track" aria-hidden="true"><i id="wound-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连撞</span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-turbo" title="空格" aria-label="涡轮">涡</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="追缉，后视警车，涡轮追逃车，撞停目标"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CHASE</p>
          <h1 id="ov-title">追缉</h1>
          <p class="lead" id="ov-lead">后视警车。涡轮追上逃车，连续撞击直到它停下来。</p>
          <p class="ops" id="ov-ops">← → / D 转向 · ↑ W 油门 · ↓ S 刹车 · 空格涡轮 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-chase">追车</button>
            <button type="button" id="btn-night">夜追</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再追</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 油门 · 空格涡轮 · 撞停目标 · A 自动 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
