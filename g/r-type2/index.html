<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041820" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>武装2 · RT2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041820'/%3E%3Cpath d='M0 0h32v6H0zM0 26h32v6H0z' fill='%230a2430'/%3E%3Cpath d='M0 6h32M0 26h32' stroke='%232ec4f0' stroke-width='1.1'/%3E%3Cpath d='M5 16l8-3.2V19z' fill='%237af0ff'/%3E%3Crect x='10' y='14.1' width='7.2' height='3.8' rx='.5' fill='%23c8f6ff'/%3E%3Cpolygon points='22,12 26,16 22,20 18,16' fill='%2314d0c8'/%3E%3Ccircle cx='22' cy='16' r='1.4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>武装2</b>
        <span>RT2</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">废都</span>
          <span id="tag-label">突入</span>
          <span id="force-label" class="form front">前核</span>
          <div class="fill" id="chg-wrap" title="蓄力">
            <em>蓄</em>
            <div class="fill-track" aria-hidden="true"><i id="chg-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="武装2游戏区，横向卷轴，空格蓄力波炮，力核前后对接"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RT2</p>
          <h1 id="ov-title">武装2</h1>
          <p class="lead" id="ov-lead">力核前后对接。空格蓄力放波炮，满波把力核打出去，再飞过去对接。短关之后打要塞。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击（按住蓄力）· R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">突入</button>
            <button type="button" id="btn-storm">密械</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再突</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">前核探射反弹 · 后核向后打 · 满波把力核打出去再对接</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
