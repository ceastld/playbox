<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>盖印 · STAMP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='6' y='18' width='20' height='10' rx='1.2' fill='none' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Crect x='10' y='6' width='12' height='12' rx='1.4' fill='%23120814' stroke='%23ff3db8' stroke-width='1.6'/%3E%3Cpath d='M16 9.2v5.6M13.2 12h5.6' stroke='%23ffe36b' stroke-width='1.5' stroke-linecap='round'/%3E%3Crect x='14.4' y='3.4' width='3.2' height='3.2' rx='1' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>盖印</b>
        <span>STAMP</span>
      </div>
      <div class="status">
        <div class="meters">
          <div class="fill" id="fit-wrap" title="重合">
            <em>合</em>
            <div class="fill-track" aria-hidden="true"><i id="fit-bar"></i></div>
          </div>
          <div class="fill fall" id="fall-wrap" title="下落">
            <em>落</em>
            <div class="fill-track" aria-hidden="true"><i id="fall-bar"></i></div>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 印</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-stamp" title="空格" aria-label="盖下">盖</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="盖印对齐"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">STAMP</p>
          <h1 id="ov-title">盖印</h1>
          <p class="lead" id="ov-lead">印落下前把图案对齐纸。<br />合上会亮金，空格或点「盖」提前按下。</p>
          <p class="ops" id="ov-ops">WASD / 方向键挪印 · Q E 旋转 · 拖动 / 拖圆环 · 空格盖下 · M 静音</p>
          <button type="button" id="ov-btn">开盖</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">对上金光再盖 · 印会自己落下</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
