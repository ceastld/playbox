<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#081208" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>外域 · OZON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23081208'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%230c1a08' stroke='%23b4ff1a' stroke-width='1.4'/%3E%3Cpath d='M6 6v6M26 6v8M10 4v5M22 5v6' stroke='%236a8a28' stroke-width='1.6' opacity='.7'/%3E%3Cellipse cx='16' cy='20' rx='7' ry='4.2' fill='%23b4ff1a'/%3E%3Crect x='12.4' y='14' width='7.2' height='7' rx='1.2' fill='%23deff6a'/%3E%3Crect x='13.6' y='15.4' width='4.8' height='2.4' fill='%2300e8ff'/%3E%3Crect x='11.2' y='21.6' width='3' height='3.4' fill='%2378c020'/%3E%3Crect x='17.6' y='21.6' width='3' height='3.4' fill='%2378c020'/%3E%3Cpath d='M16 14l1.6-5 1.2 1.6' fill='%23ffe36b'/%3E%3Ccircle cx='24' cy='11' r='1.6' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>外域</b>
        <span>OZON</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">沙脊</span>
          <span id="tag-label">外域</span>
          <span id="gun-label" class="gun">机炮</span>
          <div class="fill" id="ball-wrap" title="超球">
            <em>球</em>
            <div class="fill-track" aria-hidden="true"><i id="ball-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-zone" aria-pressed="true">外域</button>
          <button type="button" id="mode-rain" aria-pressed="false">谷雨</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="外域，驾驶机甲往上推进，空格射击，Shift 跳跃，撞上丢命"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">OZON</p>
          <h1 id="ov-title">外域</h1>
          <p class="lead" id="ov-lead">驾驶机甲往上推进。空格朝面向开火，超球会撞墙弹回来。Shift 跳起越过贴地弹和爬虫。撞上丢一条命。清波之后是关底。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 空格射击 · Shift / Z 跳 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-zone">外域</button>
            <button type="button" id="btn-rain">谷雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">八向走射 · 跳越贴地 · 超球撞墙弹回 · 撞上丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
