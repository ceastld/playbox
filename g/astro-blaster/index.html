<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星炮 · GUN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M8 8h2v2H8zm14 0h2v2h-2zM10 10h12v2H10zM8 12h16v3H8zm2 3h2v2h-2zm12 0h2v2h-2z' fill='%23ff7a29'/%3E%3Ccircle cx='16' cy='9' r='3' fill='none' stroke='%23ffe36b' stroke-width='1.2'/%3E%3Cpath d='M13 24h6v2h-6zm-2 2h10v2H11z' fill='%2300f0ff'/%3E%3Crect x='15' y='21' width='2' height='4' fill='%23fff4ea'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星炮</b>
        <span>GUN</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">连射</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
        <div class="meters" aria-hidden="true">
          <div class="meter fuel" id="fuel-meter">
            <em>燃料</em>
            <span><i id="fuel-bar"></i></span>
          </div>
          <div class="meter heat" id="heat-meter">
            <em>热度</em>
            <span><i id="heat-bar"></i></span>
          </div>
          <div class="warp-pip" id="warp-pip" title="跃迁">跃</div>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-warp" title="S / ↓ / Shift" aria-label="跃迁">跃</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星炮游戏区，底部飞船左右移动向上开火，燃料会掉，打爆敌机捡燃料，跃迁可把敌弹变慢"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GUN</p>
          <h1 id="ov-title">星炮</h1>
          <p class="lead" id="ov-lead">连射编队。燃料一直掉，打爆敌机捡燃料。跃迁可把敌弹变慢。空仓掉得更快。</p>
          <p class="ops" id="ov-ops">← → 移动 · 空格开火 · S 跃迁 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-camp">连射</button>
            <button type="button" id="btn-end">空仓</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 移动 · 空格开火 · 打敌机捡燃料 · S 跃迁 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
