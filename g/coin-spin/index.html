<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>旋币 · SPIN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cellipse cx='16' cy='18' rx='11' ry='4.4' fill='%23100818' stroke='%23ff3db8' stroke-width='1.4'/%3E%3Crect x='13.2' y='16.2' width='5.6' height='3.6' fill='%2305030c' stroke='%2300f0ff' stroke-width='0.9' transform='rotate(18 16 18)'/%3E%3Crect x='14.6' y='8' width='2.8' height='12' fill='%230a1820' stroke='%2300f0ff' stroke-width='0.8'/%3E%3Cellipse cx='16' cy='12.2' rx='9.5' ry='3.6' fill='%231a1206' stroke='%23ffe36b' stroke-width='1.3'/%3E%3Crect x='13.6' y='10.6' width='4.8' height='3.2' fill='%2305030c' stroke='%2300f0ff' stroke-width='0.8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>旋币</b>
        <span>SPIN</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="本柱已叠">
          <em>枚</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0/0</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 柱</span>
          <span id="tag-label">初旋</span>
          <span id="qi-label">齐 0</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="旋币叠柱"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-drop" aria-label="落下">落</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SPIN</p>
          <h1 id="ov-title">旋币</h1>
          <p class="lead" id="ov-lead">方孔旋着，对准立柱再叠上去。<br />孔亮青的瞬间落下。</p>
          <p class="ops" id="ov-ops">空格 / 点击落下 · 叠满十柱 · M 静音</p>
          <button type="button" id="ov-btn">开旋</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方孔对上立柱再落 · 空格 / 点击</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
