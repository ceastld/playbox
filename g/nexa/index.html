<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#060b1a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星核 · NEXA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23060b1a'/%3E%3Cpath d='M2 8h28M2 24h28' stroke='%234d7cff' stroke-width='1' opacity='.7'/%3E%3Cpath d='M4 16l11-4.2v8.4z' fill='%23e8f0ff'/%3E%3Crect x='12' y='13.4' width='8' height='5.2' rx='.5' fill='%234d7cff'/%3E%3Ccircle cx='22' cy='16' r='4' fill='none' stroke='%236ae8ff' stroke-width='1.3'/%3E%3Ccircle cx='22' cy='16' r='1.5' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星核</b>
        <span>NEXA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">外轨</span>
          <span id="tag-label">星核</span>
          <span id="beam-label" class="beam">核</span>
          <span id="pow-label" class="pow">火 1</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-beam" title="Shift / Z" aria-label="蓄核束">核</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星核游戏区，横向卷轴，空格射击，Shift 蓄核束打穿核心"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="蓄核束">核</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">NEXA</p>
          <h1 id="ov-title">星核</h1>
          <p class="lead" id="ov-lead">沿轨道突袭。空格连射，Shift 蓄核束打穿核心。满核连锁爆。撞机、中弹、擦轨都掉命。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 核束 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-core">星核</button>
            <button type="button" id="btn-rail">核轨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · Shift 蓄核束打穿核心 · 满核连锁</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
