<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>引虫 · SWARM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M16 4 L18.2 11.2 L26 12 L18.2 14.6 L16 22 L13.8 14.6 L6 12 L13.8 11.2 Z' fill='%23ff3db8'/%3E%3Ccircle cx='22' cy='22' r='3.2' fill='%2300f0ff'/%3E%3Ccircle cx='17' cy='24.5' r='2' fill='%23ff3db8'/%3E%3Ccircle cx='13' cy='26' r='1.4' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>引虫</b>
        <span>SWARM</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="herd-label">—</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="引虫场地"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SWARM</p>
          <h1 id="ov-title">引虫</h1>
          <p class="lead" id="ov-lead">你是领头。虫群会延迟、会抄近路。<br />绕开品红刺，把整群停进青色巢。</p>
          <p class="ops" id="ov-ops">WASD / 方向键领飞 · 拖拽跟随 · M 静音</p>
          <button type="button" id="ov-btn">开引</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">领头绕远 · 尾巴抄近 · 进巢停住</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
