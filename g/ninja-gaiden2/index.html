<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#100306" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>忍影 · NGD2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100306'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%2318080a' stroke='%23ff3a14' stroke-width='1.4'/%3E%3Ccircle cx='24' cy='8' r='4' fill='%23ffe36b'/%3E%3Cpath d='M4 24h24' stroke='%23ff3a14' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='13' cy='12' r='3.2' fill='%2318080a'/%3E%3Crect x='10.4' y='15' width='5.2' height='7.2' rx='.8' fill='%23ff3a14'/%3E%3Crect x='10.2' y='17.6' width='5.6' height='1.3' fill='%23ffe36b'/%3E%3Cpath d='M16 14l9-2-6 4z' fill='%2300f0ff'/%3E%3Ccircle cx='22' cy='20' r='4.4' fill='none' stroke='%23ff7a3a' stroke-width='1.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>忍影</b>
        <span>NGD2</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">荒祠</span>
          <span id="tag-label">忍影</span>
          <span id="ninj-label" class="ninj">轮 3</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-raid" aria-pressed="true">忍影</button>
          <button type="button" id="mode-core" aria-pressed="false">影核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="忍影，侧向走跳，近斩，Shift 放出滚场炎轮，关底暗主"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-slash" aria-label="斩">斩</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-ninj" aria-label="炎轮忍术">轮</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">NGD2</p>
          <h1 id="ov-title">忍影</h1>
          <p class="lead" id="ov-lead">侧跳斩杀，炎轮滚场。<br />闯过三关，暗主现身。Shift 放出炎轮。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳 · 空格近斩 · Shift / Z 炎轮 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">忍影</button>
            <button type="button" id="btn-core">影核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · 空格近斩 · Shift 炎轮 · 闯关见暗主 · 挨打丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
