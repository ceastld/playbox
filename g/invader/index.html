<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#03140a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>侵星 · INV</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303140a'/%3E%3Cpath d='M8 6h2v2H8zm14 0h2v2h-2zM10 8h12v2H10zM8 10h16v3H8zm2 3h2v2h-2zm12 0h2v2h-2z' fill='%232ae070'/%3E%3Cpath d='M6 14h2v2H6zm18 0h2v2h-2zM12 16h8v2h-8z' fill='%23ff3db8'/%3E%3Crect x='6' y='22' width='5' height='3' fill='%2312c45a'/%3E%3Crect x='14' y='22' width='5' height='3' fill='%2312c45a'/%3E%3Crect x='22' y='22' width='4' height='3' fill='%2312c45a'/%3E%3Cpath d='M13 26h6v2h-6zm-2 2h10v2H11z' fill='%2300f0c8'/%3E%3Crect x='15' y='24' width='2' height='3' fill='%23e8fff2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>侵星</b>
        <span>INV</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">防线</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="侵星游戏区，底部炮台左右移动开火，击落行进外星人和飞碟"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">INV</p>
          <h1 id="ov-title">侵星</h1>
          <p class="lead" id="ov-lead">五行外星人横队推进。一发在空。四座掩体可被啃穿。飞碟定时掠过。</p>
          <p class="ops" id="ov-ops">← → / WASD 移动 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-line">防线</button>
            <button type="button" id="btn-night">夜袭</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 移动 · 空格开火 · 一发在空 · 守住防线</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
