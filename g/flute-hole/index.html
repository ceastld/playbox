<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>笛孔 · FLUTE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='13.4' width='26' height='5.2' rx='2.6' fill='%23140a22' stroke='%2300f0ff' stroke-width='1.2'/%3E%3Ccircle cx='8' cy='16' r='1.15' fill='%23ffe36b'/%3E%3Ccircle cx='13.2' cy='16' r='1.35' fill='%23ff3db8'/%3E%3Ccircle cx='17.4' cy='16' r='1.35' fill='%23ff3db8'/%3E%3Ccircle cx='21.6' cy='16' r='1.15' fill='none' stroke='%2300f0ff' stroke-width='0.9'/%3E%3Ccircle cx='25.6' cy='16' r='1.15' fill='none' stroke='%2300f0ff' stroke-width='0.9'/%3E%3Cpath d='M3 16 C1 14 1 12 4 11' fill='none' stroke='%2300f0ff' stroke-width='1.1' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>笛孔</b>
        <span>FLUTE</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="已吹">
          <em>字</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0/0</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 句</span>
          <span id="pitch-label">孔 —</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-listen" title="L" aria-label="听句">听</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="按孔吹出目标短句"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FLUTE</p>
          <h1 id="ov-title">笛孔</h1>
          <p class="lead" id="ov-lead">从吹口连着按孔，对准高亮的字再吹。<br />中间漏了，音会偏高。</p>
          <p class="ops" id="ov-ops">点孔开关 · 1–6 / ASDFJK 按住 · 空格吹 · X 松开 · M 静音</p>
          <button type="button" id="ov-btn">启唇</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">从吹口连着按 · 对准再吹 · 漏孔会偏高</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
