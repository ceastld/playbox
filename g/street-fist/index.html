<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0402" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>街霸 · FIST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0402'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23140808' stroke='%23ff2e0a' stroke-width='1.4'/%3E%3Cpath d='M4 25h24' stroke='%23ff2e0a' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='11' cy='12' r='3.1' fill='%23e8b090'/%3E%3Crect x='8.4' y='15' width='5.2' height='7.2' rx='.8' fill='%23ff2e0a'/%3E%3Crect x='8.2' y='19.2' width='5.6' height='1.3' fill='%23ffe36b'/%3E%3Ccircle cx='21' cy='12' r='3.1' fill='%23e8b090'/%3E%3Crect x='18.4' y='15' width='5.2' height='7.2' rx='.8' fill='%2300c8e8'/%3E%3Cpath d='M14 17h4' stroke='%2300f0ff' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='17' r='1.4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>街霸</b>
        <span>FIST</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">对战</span>
          <span id="tag-label">青影</span>
          <span id="round-label">第1局</span>
          <div class="hp-duo" aria-hidden="true">
            <div class="fill p1" title="体力">
              <em id="p1-name">赤拳</em>
              <div class="fill-track"><i id="hp1"></i></div>
            </div>
            <span class="timer" id="timer">99</span>
            <div class="fill p2" title="对手体力">
              <div class="fill-track"><i id="hp2"></i></div>
              <em id="p2-name">青影</em>
            </div>
          </div>
          <span class="pips" id="pips1" aria-label="己方局分"></span>
          <span class="pips pips-foe" id="pips2" aria-label="对手局分"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-versus" aria-pressed="true">对战</button>
          <button type="button" id="mode-gauntlet" aria-pressed="false">无尽</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="街霸，左右走跳蹲，ZXC 拳踢，下前拳放气波"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="跳">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-down" aria-label="蹲">蹲</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-lp" aria-label="轻拳">轻</button>
        <button type="button" id="btn-hp" aria-label="重拳">重</button>
        <button type="button" id="btn-kick" aria-label="踢">踢</button>
        <button type="button" id="btn-wave" aria-label="气波">波</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FIST</p>
          <h1 id="ov-title">街霸</h1>
          <p class="lead" id="ov-lead">出拳出腿，气波升龙。先赢两局。<br />蹲防低扫，站防跳攻，下前拳放气波。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳蹲 · Z 轻拳 · X 重拳 · C 踢 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-versus">对战</button>
            <button type="button" id="btn-gauntlet">无尽</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳蹲 · Z 轻 / X 重 / C 踢 · 下前拳 气波 · 前跳 Z 升龙</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
