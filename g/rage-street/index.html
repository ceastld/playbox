<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0306" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>怒街 · RAGE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0306'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%2314080c' stroke='%23ff2244' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23ff2244' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='13' cy='13' r='3.6' fill='%23ffe36b'/%3E%3Crect x='10.4' y='16.2' width='5.4' height='7' rx='.9' fill='%23ff2244'/%3E%3Crect x='10.6' y='22.6' width='2.1' height='3.2' fill='%233a5ad0'/%3E%3Crect x='13.6' y='22.6' width='2.1' height='3.2' fill='%233a5ad0'/%3E%3Cpath d='M16 14l8-1-5 4z' fill='%2300f0ff'/%3E%3Crect x='21' y='20' width='6' height='2.2' rx='.4' fill='%23c48a3a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>怒街</b>
        <span>RAGE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">霓虹街</span>
          <span id="tag-label">街区</span>
          <span id="wep-label" class="wep">拳头</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体力</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-street" aria-pressed="true">街区</button>
          <button type="button" id="mode-endless" aria-pressed="false">无尽</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="怒街，沿街走跳出拳，三连击，C 爆发耗血，捡铁管飞刀"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-punch" aria-label="出拳">拳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-spec" aria-label="爆发">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RAGE</p>
          <h1 id="ov-title">怒街</h1>
          <p class="lead" id="ov-lead">沿街清场，三连拳，C 爆发耗血。<br />捡铁管和飞刀，打穿街区。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 空格 / X 跳 · Z 拳 · C 爆发 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-street">街区</button>
            <button type="button" id="btn-endless">无尽</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳拳 · C 爆发耗血 · 捡管刀 · 血空丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
