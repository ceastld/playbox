<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#061018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>超音 · BURNER</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23061018'/%3E%3Cpath d='M2 20 L16 12 L30 20 V28 H2Z' fill='%230a2a40'/%3E%3Cpath d='M16 8l4 8h-8z' fill='%2300c8ff'/%3E%3Cpath d='M10 16h12l-2 3H12z' fill='%23ff3db8'/%3E%3Crect x='14' y='18' width='4' height='8' rx='.6' fill='%235ce8ff'/%3E%3Cpath d='M14 26l2 4 2-4' fill='%23ff9a3c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>超音</b>
        <span>BURNER</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>MACH</em>
            <b id="spd">0.8</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">远海</span>
          <span id="tag-label">巡航</span>
          <div class="fill" id="ab-wrap" title="加力">
            <em>加</em>
            <div class="fill-track" aria-hidden="true"><i id="ab-bar"></i></div>
          </div>
          <span id="msl-label" class="msl" title="导弹">弹 10</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-msl" title="Z / Shift" aria-label="导弹">弹</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="超音，冲进画面，锁定导弹，躲开来弹，加力超音速"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BURNER</p>
          <h1 id="ov-title">超音</h1>
          <p class="lead" id="ov-lead">冲进画面。锁定导弹，躲开来弹，按住上加力。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格机炮 · Z / Shift 导弹 · 按住上 加力 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-cruise">巡航</button>
            <button type="button" id="btn-sonic">超音速</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向移动 · 空格机炮 · Z 锁定导弹 · 按住上 加力 · 躲来弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
