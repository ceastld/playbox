<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#021018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>岩变 · BLAST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23021018'/%3E%3Cpolygon points='16,5 20,16 16,14 12,16' fill='none' stroke='%2300e8ff' stroke-width='1.3'/%3E%3Cpolygon points='7,11 13,9 16,18 10,20' fill='none' stroke='%234ec8ff' stroke-width='1.1'/%3E%3Cpolygon points='22,12 27,14 25,22 19,20' fill='none' stroke='%23ffe36b' stroke-width='1.15'/%3E%3Cellipse cx='10' cy='24' rx='5' ry='3.2' fill='none' stroke='%237dff6a' stroke-width='1.2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>岩变</b>
        <span>BLAST</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">岩变</span>
          <span id="tag-label">BLAST</span>
          <span id="form-label" class="form-chip">战机</span>
          <span id="pup-label" class="combo" hidden></span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="岩变游戏区，惯性拧船，出边绕回，C 变身，打裂岩石与绿黏"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-ccw" aria-label="左转">↺</button>
          <button type="button" class="pad thrust" id="pad-thrust" aria-label="推进">▲</button>
          <button type="button" class="pad" id="pad-cw" aria-label="右转">↻</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad morph" id="pad-morph" aria-label="变身">变</button>
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">火</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BLAST</p>
          <h1 id="ov-title">岩变</h1>
          <p class="lead" id="ov-lead">出边绕回。大岩裂中、中裂小。C 变身：快艇快、战机稳、重炮砸黏。绿黏会吃能量。</p>
          <p class="ops" id="ov-ops">A D / ← → 转向 · W / ↑ 推进 · 空格开火 · C 变身</p>
          <div class="ov-actions">
            <button type="button" id="btn-belt">岩变</button>
            <button type="button" id="btn-swarm">乱飞</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 推进 · 空格开火 · C 变身 · 出边绕回</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
