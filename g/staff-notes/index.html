<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>拾谱 · STAFF</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M5 8 H27 M5 13 H27 M5 18 H27 M5 23 H27 M5 28 H27' stroke='%2300f0ff' stroke-width='1'/%3E%3Cellipse cx='18' cy='18' rx='4.2' ry='3' fill='%23ff3db8' transform='rotate(-22 18 18)'/%3E%3Cpath d='M21.6 16.6 V6' stroke='%23ff3db8' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>拾谱</b>
        <span>STAFF</span>
      </div>
      <div class="status">
        <span id="stage-label">五线拾音</span>
        <div class="row">
          <span id="hit-label">拾 —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="五线谱拾音"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">STAFF</p>
          <h1 id="ov-title">拾谱</h1>
          <p class="lead" id="ov-lead">音从右侧落到五线上。<br />把拾音对准高低，接住它们。</p>
          <p class="ops" id="ov-ops">W/S 或 ↑↓ 高低 · 拖动画布 · 1–9 跳线 · M 静音</p>
          <button type="button" id="ov-btn">拾谱</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">对准谱面高低 · 接住落下的音</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
