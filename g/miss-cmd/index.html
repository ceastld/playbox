<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>防空 · MISSILE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M4 28 L8 20 L12 28Z' fill='%23ff4a28'/%3E%3Cpath d='M14 28 L16 18 L18 28Z' fill='%23ff4a28'/%3E%3Cpath d='M20 28 L24 20 L28 28Z' fill='%23ff4a28'/%3E%3Crect x='6' y='26' width='3' height='3' fill='%23ffe36b'/%3E%3Crect x='10.5' y='25' width='2.2' height='4' fill='%23ffe36b'/%3E%3Crect x='19.2' y='25.5' width='2.4' height='3.5' fill='%23ffe36b'/%3E%3Crect x='23' y='26' width='3' height='3' fill='%23ffe36b'/%3E%3Cpath d='M7 4 L13 16' stroke='%23ff6a22' stroke-width='1.2'/%3E%3Cpath d='M22 3 L18 14' stroke='%23ff3db8' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='14' r='5' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='14' r='2' fill='%23e8ffff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>防空</b>
        <span>MISSILE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">防空</span>
          <span id="tag-label">MISSILE</span>
          <span id="ammo-label">弹 30</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余城市"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="防空游戏区，点击发射爆弹拦截来袭导弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MISSILE</p>
          <h1 id="ov-title">防空</h1>
          <p class="lead" id="ov-lead">炸掉落弹，护住六城。</p>
          <p class="ops" id="ov-ops">点按瞄准开火 · 1 2 3 选炮台 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-meteor">流星</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点按开火 · 火球吞弹 · 护住六城</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
