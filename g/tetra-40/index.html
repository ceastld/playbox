<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>四十行 · SPRINT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%23120818' stroke='%23e14cff' stroke-width='1.3'/%3E%3Crect x='8' y='8' width='6' height='6' rx='1.2' fill='%232de8f0'/%3E%3Crect x='14' y='8' width='6' height='6' rx='1.2' fill='%232de8f0'/%3E%3Crect x='20' y='8' width='6' height='6' rx='1.2' fill='%232de8f0'/%3E%3Crect x='8' y='14' width='6' height='6' rx='1.2' fill='%232de8f0'/%3E%3Ctext x='16' y='26' text-anchor='middle' font-size='7' font-family='sans-serif' font-weight='800' fill='%23ffe36b'%3E40%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="mode-sprint">
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>四十行</b>
        <span id="brand-sub">SPRINT</span>
      </div>
      <div class="scores" aria-live="polite">
        <div class="score hud-sprint" id="remain-box">
          <em>剩余</em>
          <b id="remain">40</b>
        </div>
        <div class="score hud-sprint time" id="time-box">
          <em>用时</em>
          <b id="time">0.000</b>
        </div>
        <div class="score hud-sprint best">
          <em>最佳</em>
          <b id="best-sprint">—</b>
        </div>
        <div class="score hud-marathon" id="score-box">
          <em>分数</em>
          <b id="score">0</b>
          <span id="score-add" class="score-add" hidden>+0</span>
        </div>
        <div class="score hud-marathon">
          <em>行数</em>
          <b id="lines">0</b>
        </div>
        <div class="score hud-marathon">
          <em>等级</em>
          <b id="level">1</b>
        </div>
        <div class="score hud-marathon best">
          <em>最高</em>
          <b id="best-marathon">0</b>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-sprint" aria-pressed="true">四十行</button>
          <button type="button" id="mode-marathon" aria-pressed="false">马拉松</button>
        </div>
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="play" id="play">
        <div class="well-frame" id="well-frame">
          <canvas id="well" tabindex="0" role="application" aria-label="四十行方块井，十列二十行"></canvas>
          <div class="rail" id="rail" aria-hidden="true"><i id="rail-fill"></i></div>
          <p class="ready" id="ready">按键开始计时</p>
        </div>
        <aside class="side">
          <div class="next-box">
            <em>下一个</em>
            <canvas id="next" width="120" height="120" aria-label="下一块"></canvas>
          </div>
          <div class="side-stat hud-sprint">
            <em>剩余</em>
            <b id="remain-side">40</b>
          </div>
          <div class="side-stat hud-marathon">
            <em>等级</em>
            <b id="level-side">1</b>
          </div>
        </aside>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ov-title" aria-hidden="true">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SPRINT</p>
          <h1 id="ov-title">清完了</h1>
          <p class="lead" id="ov-lead"></p>
          <div class="ov-actions">
            <button type="button" id="ov-retry">重开</button>
          </div>
        </div>
      </div>
    </div>

    <div class="pads" id="pads">
      <button type="button" id="pad-left" aria-label="左移">左</button>
      <button type="button" id="pad-rot" aria-label="旋转">转</button>
      <button type="button" id="pad-right" aria-label="右移">右</button>
      <button type="button" id="pad-drop" aria-label="硬降">降</button>
    </div>

    <footer class="hint" id="hint">清四十行，比谁快。方向键移动，上键或 X 旋转，空格硬降。A 自动。按键开始计时。</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
