<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>2048 · TILES</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='4' width='11' height='11' rx='2' fill='%233d301c'/%3E%3Crect x='17' y='4' width='11' height='11' rx='2' fill='%23a85a10'/%3E%3Crect x='4' y='17' width='11' height='11' rx='2' fill='%23ffc430'/%3E%3Crect x='17' y='17' width='11' height='11' rx='2' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>2048</b>
        <span>TILES</span>
      </div>
      <div class="scores">
        <div class="score" id="score-box">
          <em>分数</em>
          <b id="score">0</b>
          <span id="score-add" class="score-add" hidden>+0</span>
        </div>
        <div class="score best">
          <em>最高</em>
          <b id="best">0</b>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <div class="board" id="board" tabindex="0" role="application" aria-label="2048 棋盘">
          <div class="grid-bg" id="grid-bg" aria-hidden="true"></div>
          <div class="tiles" id="tiles"></div>
        </div>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TILES</p>
          <h1 id="ov-title">2048</h1>
          <p class="lead" id="ov-lead"></p>
          <div class="ov-actions">
            <button type="button" id="ov-continue">继续</button>
            <button type="button" id="ov-retry">重开</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint">滑动格子，相同数字合并。合到 2048。</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
