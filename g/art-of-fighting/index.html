<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>拳道 · AOF</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M4 24h24' stroke='%23ff4a14' stroke-width='1.2' opacity='.5'/%3E%3Crect x='6' y='16' width='8' height='8' rx='1' fill='%23ff7a28'/%3E%3Crect x='18' y='15' width='8' height='9' rx='1' fill='%23f4efe6'/%3E%3Ccircle cx='10' cy='13.4' r='2.3' fill='%23e8b090'/%3E%3Ccircle cx='22' cy='12.6' r='2.3' fill='%23e8b090'/%3E%3Cpath d='M10 16h6' stroke='%23ffe36b' stroke-width='1.4' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='8' r='4' fill='%23ff9a3a' opacity='.75'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>拳道</b>
        <span>AOF</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连打</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">拳道</span>
          <span id="tag-label">白隼</span>
          <span id="round-label">第1局</span>
          <div class="hp-duo" aria-hidden="true">
            <div class="fill p1" title="体力">
              <em id="p1-name">橙龙</em>
              <div class="bars">
                <div class="fill-track"><i id="hp1"></i></div>
                <div class="fill-track meter"><i id="mt1"></i></div>
              </div>
            </div>
            <span class="timer" id="timer">99</span>
            <div class="fill p2" title="对手体力">
              <div class="bars">
                <div class="fill-track"><i id="hp2"></i></div>
                <div class="fill-track meter"><i id="mt2"></i></div>
              </div>
              <em id="p2-name">白隼</em>
            </div>
          </div>
          <span class="pips" id="pips1" aria-label="己方局分"></span>
          <span class="pips pips-foe" id="pips2" aria-label="对手局分"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="拳道，一对一道馆对打，空格拳，下蹲蓄气，Shift 吼拳"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="跳">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-down" aria-label="蹲蓄">蓄</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-punch" aria-label="拳">拳</button>
        <button type="button" id="btn-kick" aria-label="踢">踢</button>
        <button type="button" id="btn-spec" aria-label="吼拳">气</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">AOF</p>
          <h1 id="ov-title">拳道</h1>
          <p class="lead" id="ov-lead">南镇道馆对打。空格拳，下蹲蓄气，Shift 吼拳。气满超吼，近身虎炮。先赢两局。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走跳 · 空格拳 · X 踢 · 下蹲蓄气 · Shift / Z 吼拳 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-duel">拳道</button>
            <button type="button" id="btn-chain">连打</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格拳 · X 踢 · 下蹲蓄气 · Shift 吼拳 · 气满超吼 · 近身虎炮 · 先赢两局</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
