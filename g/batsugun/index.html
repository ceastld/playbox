<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>战枪 · BATS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M16 4l4 10 8 2-8 4 2 8-6-5-6 5 2-8-8-4 8-2z' fill='%23f75a1c'/%3E%3Cpath d='M16 8l2.4 6.2 6.6 1.2-5.4 3.2 1.4 6.2L16 21l-5 3.8 1.4-6.2-5.4-3.2 6.6-1.2z' fill='%23ffe36b'/%3E%3Cpath d='M10 18l-4-10 6 4zM22 18l4-10-6 4z' fill='%23c8ff3a' opacity='.85'/%3E%3Crect x='14.6' y='18' width='2.8' height='9' fill='%23fff4e0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>战枪</b>
        <span>BATS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">突贯</span>
          <span id="pwr-label" class="pwr">枪 0</span>
          <div class="fill" id="pwr-wrap" title="火力">
            <em>枪</em>
            <div class="fill-track" aria-hidden="true"><i id="pwr-bar"></i></div>
          </div>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="战枪游戏区，纵向卷轴，空格射击，Shift 扔战枪爆"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BATS</p>
          <h1 id="ov-title">战枪</h1>
          <p class="lead" id="ov-lead">火力越打越宽。满级放出战枪扇刃。短关之后是机甲。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WSD 移动 · 空格射击 · Shift / Z 爆弹 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rush">突贯</button>
            <button type="button" id="btn-sea">弹海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · Shift 战枪爆 · 吃 枪 升火力 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
