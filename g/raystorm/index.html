<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#04141c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>光暴 · RSTM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304141c'/%3E%3Cpath d='M6 20l8-3 2 4-9 2z' fill='%230abeff' opacity='.85'/%3E%3Cpath d='M26 20l-8-3-2 4 9 2z' fill='%230abeff' opacity='.85'/%3E%3Cpath d='M16 6l4 10 8 2-8 2.5 2.2 8L16 24l-6.2 4.5L12 20.5 4 18l8-2z' fill='%230abeff'/%3E%3Cpath d='M16 9l2.2 5.6 6 .6-4.8 3.4 1.4 5.8L16 21.2l-4.8 3.2 1.4-5.8-4.8-3.4 6-.6z' fill='%233dffd0'/%3E%3Cpath d='M15 16h2v7h-2z' fill='%23ffe36b'/%3E%3Crect x='11' y='10' width='4' height='4' transform='rotate(45 13 12)' fill='none' stroke='%23ffe36b' stroke-width='.7'/%3E%3Crect x='19' y='7' width='3.4' height='3.4' transform='rotate(45 20.7 8.7)' fill='none' stroke='%23ff3db8' stroke-width='.6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>光暴</b>
        <span>RSTM</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">光暴</span>
          <span id="wpn-label" class="wpn">锁</span>
          <div class="fill" id="lock-wrap" title="锁定">
            <em>锁</em>
            <div class="fill-track" aria-hidden="true"><i id="lock-bar"></i></div>
          </div>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="光暴游戏区，纵向卷轴，空格连射并锁定缎带激光，Shift 爆弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RSTM</p>
          <h1 id="ov-title">光暴</h1>
          <p class="lead" id="ov-lead">同一层锁定，缎带激光缠上去。锁得越多越痛。短关之后是核芯。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 爆弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-storm">光暴</button>
            <button type="button" id="btn-nuke">核锁</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射锁定 · 缎带激光缠敌 · Shift 爆弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
