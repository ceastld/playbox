<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>窥门 · PEEK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 28V14a10 10 0 0 1 20 0v14' fill='%230a0618' stroke='%2300f0ff' stroke-width='1.6'/%3E%3Cpath d='M8.2 28V14.2a7.8 7.8 0 0 1 11.4-6.9' fill='%23140a22'/%3E%3Ccircle cx='19.2' cy='16.5' r='1.3' fill='%23ff3db8'/%3E%3Cpath d='M21.4 12.2c.5 1.4.8 2.8.8 4.2 0 2.2-.6 3.8-1.4 4.6' fill='none' stroke='%23ffe36b' stroke-width='1.4'/%3E%3Ccircle cx='22.6' cy='11.4' r='1.7' fill='none' stroke='%23ffe36b' stroke-width='1.3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>窥门</b>
        <span>PEEK</span>
      </div>
      <div class="status">
        <span id="stage-label">十关</span>
        <div class="row">
          <div class="fill" id="key-wrap" title="金钥">
            <em>钥</em>
            <div class="fill-track" aria-hidden="true"><i id="key-bar"></i></div>
            <b id="key-num">0/1</b>
          </div>
          <div class="fill time" id="time-wrap" title="窥时">
            <em>隙</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="窥门走廊"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PEEK</p>
          <h1 id="ov-title">窥门</h1>
          <p class="lead" id="ov-lead">门会闪开一条缝。记住金钥在哪一扇，缝合后再打开。</p>
          <p class="ops" id="ov-ops">← → 选门 · 空格打开 · 点按门 · 1–6 · M 静音</p>
          <button type="button" id="ov-btn">开窥</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">门闪一条缝 · 只取金色的钥</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
