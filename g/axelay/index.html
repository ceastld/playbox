<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#04141c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>轴射 · AXEL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304141c'/%3E%3Cpath d='M4 28 L16 10 L28 28' fill='none' stroke='%2300c4ff' stroke-width='1.1'/%3E%3Cpath d='M8 28 L16 14 L24 28' fill='none' stroke='%235ce8ff' stroke-width='.7'/%3E%3Cpath d='M16 16 l3 8 h-6z' fill='%2300d4ff'/%3E%3Cpath d='M14.6 20 h2.8' stroke='%23ff3db8' stroke-width='.8'/%3E%3Ccircle cx='10' cy='8' r='.7' fill='%23ff3db8'/%3E%3Ccircle cx='22' cy='7' r='.6' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>轴射</b>
        <span>AXEL</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">俯冲</span>
          <span id="wep-label" class="wep w0">环火</span>
          <div class="fill" id="hp-wrap" title="Boss 血量" hidden>
            <em>核</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-wep" title="Shift / Z" aria-label="换武器">换</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="轴射，透视地面俯冲，三把武器切换，撞上掉命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">AXEL</p>
          <h1 id="ov-title">轴射</h1>
          <p class="lead" id="ov-lead">透视地面扑面而来。三把武器随手换。撞上就掉命。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WSD 移动 · 空格射击 · Shift / Z 换武器 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-dive">俯冲</button>
            <button type="button" id="btn-dense">密弹</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再射</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格射击 · Shift/Z 换环火、直束、晨星 · A 自动 · 撞上掉命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
