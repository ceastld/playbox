<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140c06" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>枪纪 · GGAG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140c06'/%3E%3Cpath d='M16 4l8 8-8 16L8 12z' fill='%23e07020'/%3E%3Cpath d='M16 8l4.6 4.6L16 24l-4.6-11.4z' fill='%23ffb84a'/%3E%3Cpath d='M16 10l2.2 2.4L16 18l-2.2-5.6z' fill='%23fff0d8'/%3E%3Cpath d='M16 3l1.4 3.2H14.6z' fill='%233ad8ff'/%3E%3Crect x='15.2' y='16' width='1.6' height='10' fill='%23ff7a18'/%3E%3Cpath d='M10 12h12' stroke='%233ad8ff' stroke-width='1.1' opacity='.8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>枪纪</b>
        <span>GGAG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">枪纪</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <div class="fill" id="gage-wrap" title="纪条">
            <em>纪</em>
            <div class="fill-track" aria-hidden="true"><i id="gage-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="纪爆">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="枪纪游戏区，垂直卷轴，自动锁敌，空格射击，Shift 纪爆"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="纪爆">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GGAG</p>
          <h1 id="ov-title">枪纪</h1>
          <p class="lead" id="ov-lead">自动锁敌，打满纪条。空格连射，Shift 纪爆锁弹雨。短关之后是纪主。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 纪爆 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rush">枪纪</button>
            <button type="button" id="btn-sea">纪雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">自动锁敌 · 打满纪条 · Shift 纪爆锁弹雨</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
