<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>微箱 · CRATE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M8 14 L16 10 L24 14 L24 22 L16 26 L8 22 Z' fill='%23ff3db8'/%3E%3Cpath d='M8 14 L16 18 L24 14' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>微箱</b>
        <span>CRATE</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span class="pips" id="nudge-pips" aria-label="剩余轻推"></span>
          <span class="pips lives" id="life-pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-undo" title="Z">撤</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="微箱仓房"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CRATE</p>
          <h1 id="ov-title">微箱</h1>
          <p class="lead" id="ov-lead">走动免费，走进箱子才算一推。<br />三推以内，把箱子送到青色印记上。</p>
          <p class="ops" id="ov-ops">WASD / 方向键 · 点邻格或滑动 · Z 撤销 · M 静音</p>
          <button type="button" id="ov-btn">入仓</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走动不耗步 · 走进箱子才是推 · 三步以内压上印记</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
