<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>双门 · PORTS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='12' cy='16' r='6' fill='none' stroke='%23ff3db8' stroke-width='2'/%3E%3Ccircle cx='20' cy='16' r='6' fill='none' stroke='%2300f0ff' stroke-width='2'/%3E%3Ccircle cx='12' cy='16' r='2' fill='%23ff3db8'/%3E%3Ccircle cx='20' cy='16' r='2' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>双门</b>
        <span>PORTS</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="meters">
          <span class="pips" id="lives" aria-label="剩余齐射"></span>
          <span class="shots" id="shots" aria-label="子弹">
            <i id="pip-mag" class="shot mag"></i>
            <i id="pip-cyn" class="shot cyn"></i>
          </span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-fire" title="空格">开火</button>
        <button type="button" id="btn-mag" title="Q">粉送</button>
        <button type="button" id="btn-cyn" title="E">青送</button>
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="双门战场"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PORTS</p>
          <h1 id="ov-title">双门</h1>
          <p class="lead" id="ov-lead">两发子弹共享传送。<br />用一发冻成门，把另一发送过去，朝你此刻瞄准的方向飞出。</p>
          <p class="ops" id="ov-ops">指向或 A/D 瞄准 · 空格 / 点按开火 · Q 粉门送青 · E 青门送粉 · M 静音</p>
          <button type="button" id="ov-btn">开启双门</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">两发都打出 · 一门当坐标 · 一门当子弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
