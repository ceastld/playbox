<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0402" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>魂斗 · CONTRA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0402'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23140808' stroke='%23ff2e0a' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%233dff7a' stroke-width='1.2' opacity='.55'/%3E%3Ccircle cx='13' cy='14' r='3.6' fill='%23ffe36b'/%3E%3Crect x='10.6' y='17' width='5.2' height='6.4' rx='.8' fill='%23ff2e0a'/%3E%3Crect x='15.4' y='16.4' width='8' height='1.6' rx='.3' fill='%2300f0ff'/%3E%3Cpath d='M22 10l4 1-3 3z' fill='%23ff6a3a'/%3E%3Crect x='22' y='20' width='5' height='5' rx='.6' fill='%233dff7a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>魂斗</b>
        <span>CONTRA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">密林</span>
          <span id="tag-label">丛林</span>
          <span id="gun-label" class="gun">步枪</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-jungle" aria-pressed="true">丛林</button>
          <button type="button" id="mode-assault" aria-pressed="false">突击</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="魂斗，侧向跑跳，八向开火，捡枪打碉堡"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-duck" aria-label="蹲下">蹲</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CONTRA</p>
          <h1 id="ov-title">魂斗</h1>
          <p class="lead" id="ov-lead">侧向跑跳，八向开火。一打即死。<br />捡 M 机枪、S 散弹、L 激光、F 火焰。</p>
          <p class="ops" id="ov-ops">WASD / 方向键 走跳蹲 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-jungle">丛林</button>
            <button type="button" id="btn-assault">突击</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳蹲 · 空格八向开火 · 捡枪 · 一打即死</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
