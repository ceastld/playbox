<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#080614" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星尘 · SDST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080614'/%3E%3Ccircle cx='10' cy='9' r='1.4' fill='%23ffe36b'/%3E%3Ccircle cx='22' cy='7' r='1' fill='%235ce8ff'/%3E%3Ccircle cx='26' cy='14' r='1.2' fill='%23ff4ad8'/%3E%3Cpath d='M8 20l8-6 4 3-3 7-6 2z' fill='%23201840' stroke='%238a6cff' stroke-width='.8'/%3E%3Cpath d='M16 10l3.2 8h-6.4z' fill='%23e8fbff'/%3E%3Cpath d='M12.8 18h6.4l-1.4 4h-3.6z' fill='%238a6cff'/%3E%3Cpath d='M14.6 22h2.8l-.8 5h-1.2z' fill='%235ce8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星尘</b>
        <span>SDST</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">岩带</span>
          <span id="tag-label">星尘</span>
          <div class="fill" id="heat-wrap" title="尘热">
            <em>尘</em>
            <div class="fill-track" aria-hidden="true"><i id="heat-bar"></i></div>
          </div>
          <span id="wpn-label" class="wpn">尘</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="尘爆">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星尘游戏区，八向飞行，打岩成尘，吸尘加热，Shift 尘爆"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="尘爆">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SDST</p>
          <h1 id="ov-title">星尘</h1>
          <p class="lead" id="ov-lead">打岩成尘，吸尘加热火力。撞了扣命。短关之后是尘核。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格开火 · Shift / Z 尘爆 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-dust">星尘</button>
            <button type="button" id="btn-shard">碎光</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格开火 · Shift 尘爆 · 打岩吸尘</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
