<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>米皮 · MAPPY</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M4 26 H28' stroke='%23ff4e24' stroke-width='2'/%3E%3Cpath d='M4 18 H12 M16 18 H28' stroke='%23ff8a4a' stroke-width='1.8'/%3E%3Cpath d='M4 10 H14 M18 10 H28' stroke='%23ff4e24' stroke-width='1.8'/%3E%3Crect x='13.2' y='18' width='2.4' height='8' fill='%2300f0ff'/%3E%3Cellipse cx='10' cy='22.4' rx='2.6' ry='3.2' fill='%23ff7ad8'/%3E%3Ccircle cx='10.2' cy='18.4' r='2.2' fill='%23ff9ae0'/%3E%3Crect x='8.2' y='16.2' width='4.2' height='1.8' rx='.4' fill='%2300f0ff'/%3E%3Ccircle cx='22' cy='14.4' r='2.4' fill='%233dff88'/%3E%3Ccircle cx='22.3' cy='13.8' r='.45' fill='%2305030c'/%3E%3Crect x='20' y='10.2' width='1.4' height='5.2' rx='.4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>米皮</b>
        <span>MAPPY</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">搜家</span>
          <div class="fill loot" id="loot-wrap" title="赃物">
            <em>赃</em>
            <div class="fill-track" aria-hidden="true"><i id="loot-bar"></i></div>
            <b id="loot-num">0</b>
          </div>
          <div class="fill wave" id="wave-wrap" title="微波">
            <em>波</em>
            <div class="fill-track" aria-hidden="true"><i id="wave-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="米皮，多层宅里蹦床换层，甩门砸猫，搜刮赃物"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-down" aria-label="下落">下</button>
        <button type="button" id="btn-door" aria-label="甩门">门</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MAPPY</p>
          <h1 id="ov-title">米皮</h1>
          <p class="lead" id="ov-lead">蹦床换层，甩门砸晕猫，搜刮微波炉和电视。碰到猫丢一条命。</p>
          <p class="ops" id="ov-ops">方向键或 WASD 走 · ↓ 下落 · 空格甩门 · 触屏左 下 门 右 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-search">搜家</button>
            <button type="button" id="btn-swarm">群猫</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">蹦床换层 · 甩门砸猫 · 搜刮赃物 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
