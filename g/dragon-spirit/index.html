<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>龙魂 · DSPT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140804'/%3E%3Cellipse cx='16' cy='22' rx='8' ry='3.2' fill='%23ff5a22' opacity='.35'/%3E%3Cpath d='M16 5c2.4 3.2 3.6 7.2 3.2 11.2-.3 3.2-1.6 6-3.2 8.6-1.6-2.6-2.9-5.4-3.2-8.6C12.4 12.2 13.6 8.2 16 5z' fill='%23ff5a22'/%3E%3Cpath d='M16 8c1.4 2.2 2.1 5 1.9 7.8-.2 2.2-1 4.2-1.9 6-0.9-1.8-1.7-3.8-1.9-6C13.9 13 14.6 10.2 16 8z' fill='%23ffe36b'/%3E%3Cpath d='M12 9l-3 2 3 1M20 9l3 2-3 1' fill='%23ff8a40'/%3E%3Ccircle cx='14.6' cy='11' r='.9' fill='%23140804'/%3E%3Ccircle cx='17.4' cy='11' r='.9' fill='%23140804'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>龙魂</b>
        <span>DSPT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">龙息</span>
          <span id="wpn-label" class="wpn">一头</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="龙魂游戏区，八向飞龙，空格喷火，Shift 扔爆弹，撞体扣命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DSPT</p>
          <h1 id="ov-title">龙魂</h1>
          <p class="lead" id="ov-lead">化龙北上。喷火打空，爆弹砸地。吃卵长头，撞体扣命。三关之后是龙魂王。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格喷火 · Shift / Z 爆弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-breath">龙息</button>
            <button type="button" id="btn-sea">炎海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格喷火 · Shift 爆弹 · 吃卵长头</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
