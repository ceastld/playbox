<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>脉门 · PULSE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='5.2' fill='none' stroke='%23ff3db8' stroke-width='1.3'/%3E%3Ccircle cx='16' cy='5' r='2.2' fill='%23ffe36b'/%3E%3Cpath d='M6 16h4M22 16h4' stroke='%2300f0ff' stroke-width='1.4' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>脉门</b>
        <span>PULSE</span>
      </div>
      <div class="status">
        <span id="stage-label">十扇脉门</span>
        <div class="row">
          <span id="hit-label">开 —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="跟着脉搏敲门"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-knock" aria-label="敲门">敲</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PULSE</p>
          <h1 id="ov-title">脉门</h1>
          <p class="lead" id="ov-lead">脉搏沿着环脉走。<br />峰顶贴上门缝的瞬间，敲一下，虹膜就会开一瓣。</p>
          <p class="ops" id="ov-ops">空格 / J 敲门 · 点按画布 · M 静音</p>
          <button type="button" id="ov-btn">入脉</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">峰顶贴门缝再敲 · 品红虚脉放过</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
