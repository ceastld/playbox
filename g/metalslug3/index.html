<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>金弹3 · MSL3</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231a0c08' stroke='%23ff9418' stroke-width='1.4'/%3E%3Cpath d='M5 24 L11 12 L17 24 Z' fill='%23281810' stroke='%23ffc040' stroke-width='.6'/%3E%3Cpath d='M4 26h24' stroke='%23ff9418' stroke-width='1.4' opacity='.7'/%3E%3Crect x='16' y='16' width='12' height='7' rx='1' fill='%234a3820' stroke='%23ff9418' stroke-width='.5'/%3E%3Crect x='22' y='13' width='8' height='3' fill='%23c8943a'/%3E%3Ccircle cx='19' cy='24' r='2.2' fill='%231a140c'/%3E%3Ccircle cx='25' cy='24' r='2.2' fill='%231a140c'/%3E%3Ccircle cx='10' cy='16' r='2.4' fill='%23f4d6b0'/%3E%3Crect x='8.2' y='18' width='4' height='5' rx='.5' fill='%2324488c'/%3E%3Cpath d='M7 15h5' stroke='%23ff3db8' stroke-width='1.2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>金弹3</b>
        <span>MSL3</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">沙墓</span>
          <span id="tag-label">金弹3</span>
          <span id="route-label" class="route" hidden>沙道</span>
          <span id="nade-label" class="nades">雷 8</span>
          <span id="gun-label" class="gun">手枪</span>
          <span id="ride-label" class="ride" hidden>铁蛞</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-stage" aria-pressed="true">金弹3</button>
          <button type="button" id="mode-core" aria-pressed="false">弹核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="金弹3，侧向跑跳开火，分路，铁蛞手雷，撞上即死"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-duck" aria-label="蹲下">蹲</button>
        <button type="button" id="btn-nade" aria-label="手雷">雷</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MSL3</p>
          <h1 id="ov-title">金弹3</h1>
          <p class="lead" id="ov-lead">侧向跑跳开火。沙墓分沙道 / 陵道，沼岸分沼岸 / 潜道。<br />开铁蛞、丢雷，打到木星坦。撞上即死，载具撞毁丢命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走跳 · 空格开火 · Shift/Z 手雷 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-stage">金弹3</button>
            <button type="button" id="btn-core">弹核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳开火 · Shift/Z 手雷 · 分路 · 开铁蛞 · 撞上即死</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
