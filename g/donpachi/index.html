<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120e06" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>弹蜂 · DONP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120e06'/%3E%3Cpath d='M16 3l3 6.4 7 .6-5.2 4.6 1.6 6.8L16 18l-6.4 3.4 1.6-6.8L6 10l7-.6z' fill='%23f5c412'/%3E%3Cpath d='M16 8l1.6 3.4 3.6.3-2.7 2.4.8 3.5L16 16.2l-3.3 1.4.8-3.5-2.7-2.4 3.6-.3z' fill='%23ffe36b'/%3E%3Cpath d='M16 2l1.4 5H14.6z' fill='%2300e8ff'/%3E%3Cellipse cx='10' cy='14' rx='4' ry='2.2' fill='%23fff6d0' opacity='.55'/%3E%3Cellipse cx='22' cy='14' rx='4' ry='2.2' fill='%23fff6d0' opacity='.55'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>弹蜂</b>
        <span>DONP</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">扫巢</span>
          <span id="wpn-label" class="wpn">点</span>
          <div class="fill" id="chg-wrap" title="激束">
            <em>激</em>
            <div class="fill-track" aria-hidden="true"><i id="chg-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="弹蜂游戏区，八向移动，空格点射，按住激光，击破弹丸化星"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DONP</p>
          <h1 id="ov-title">弹蜂</h1>
          <p class="lead" id="ov-lead">点射扫群，按住激束。击破弹丸化作星屑。短关之后是巢后。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击（按住激光）· R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-sweep">扫巢</button>
            <button type="button" id="btn-sea">弹海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点射扫群 · 按住激光 · 击破化星</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
