<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>斩果 · SLASH</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='12' cy='18' r='8' fill='%23ff4d6d'/%3E%3Ccircle cx='22' cy='14' r='6.2' fill='%233ecf6a'/%3E%3Cpath d='M4 22 L28 8' stroke='%2300f0ff' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M4 22 L28 8' stroke='%23fff' stroke-width='.8' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>斩果</b>
        <span>SLASH</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连斩</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">经典</span>
          <span id="tag-label">SLASH</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="斩果，划过切开飞来的水果，避开炸弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SLASH</p>
          <h1 id="ov-title">斩果</h1>
          <p class="lead" id="ov-lead">一刀切开，果汁四溅。</p>
          <p class="ops" id="ov-ops">拖划切开 · 方向键弹斩 · 漏果或斩弹扣命 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-zen">禅</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">拖划切开 · 炸弹别碰 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
