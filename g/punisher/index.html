<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140404" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>制裁 · PUNI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140404'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23180808' stroke='%23ff3012' stroke-width='1.4'/%3E%3Cpath d='M4 25h24' stroke='%23ff3012' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%23e8b090'/%3E%3Crect x='9.2' y='10.4' width='5.6' height='2' rx='.6' fill='%231a1210'/%3E%3Crect x='9.4' y='15.2' width='5.4' height='7.4' rx='.8' fill='%23181416'/%3E%3Cellipse cx='12.1' cy='19.4' rx='2.4' ry='2.8' fill='%23f4f0e8'/%3E%3Ccircle cx='11.1' cy='18.6' r='.7' fill='%23140404'/%3E%3Ccircle cx='13.2' cy='18.6' r='.7' fill='%23140404'/%3E%3Cpath d='M17 14l10-1-7 4z' fill='%23ffb24a'/%3E%3Crect x='16.6' y='16.4' width='9' height='1.6' rx='.3' fill='%239aa4ae'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>制裁</b>
        <span>PUNI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">夜巷</span>
          <span id="tag-label">扫街</span>
          <span id="wep-label" class="wep fist">拳头</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill boss" id="boss-wrap" hidden title="头目">
            <em id="boss-name">裂脸</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-street" aria-pressed="true">扫街</button>
          <button type="button" id="mode-clash" aria-pressed="false">火并</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="制裁，侧向扫街，拳打枪打，跳过飞车"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-atk" aria-label="拳打或开枪">打</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PUNI</p>
          <h1 id="ov-title">制裁</h1>
          <p class="lead" id="ov-lead">往右清街。拳打、开枪，捡手枪和霰弹直到打空。暴徒、枪手、飞车，打到裂脸和金王。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 上跳 · 空格拳打或开枪 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-street">扫街</button>
            <button type="button" id="btn-clash">火并</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">往右清街 · 空格拳/射 · 捡枪会打空 · 跳过飞车</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
