<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0602" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>战斧 · AXE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0602'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23140804' stroke='%23ff7a14' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23ff7a14' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='12' cy='13' r='3.4' fill='%23ffe36b'/%3E%3Crect x='9.4' y='16.2' width='5.4' height='7' rx='.8' fill='%23c47a32'/%3E%3Cpath d='M16 12l10-2-6 6z' fill='%23c8d0d8'/%3E%3Crect x='21' y='20' width='7' height='4.2' rx='1' fill='%23c47a32'/%3E%3Ccircle cx='24' cy='18' r='1.6' fill='%23ff7a14'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>战斧</b>
        <span>AXE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">荒原</span>
          <span id="tag-label">远征</span>
          <span id="mount-label" class="mount">徒步</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span class="mpips" id="mpips" aria-label="魔法"></span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-quest" aria-pressed="true">远征</button>
          <button type="button" id="mode-arena" aria-pressed="false">角斗</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="战斧，皮带走位挥斧连击，C 魔法清屏，抢坐骑"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="往后">后</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-down" aria-label="往前">前</button>
        <button type="button" id="btn-magic" aria-label="魔法">魔</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-axe" aria-label="挥斧">斧</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">AXE</p>
          <h1 id="ov-title">战斧</h1>
          <p class="lead" id="ov-lead">马上挥斧，清一波再打头目。<br />魔法清屏，抢坐骑，摔下来会掉骑。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 空格跳 · Z 斧连击 · C 魔法 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-quest">远征</button>
            <button type="button" id="btn-arena">角斗</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳挥斧 · C 魔法清屏 · 抢坐骑 · 血空丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
