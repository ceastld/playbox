<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>压簧 · SPRING</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M10 26c0-2 2-3 6-3s6 1 6 3' fill='none' stroke='%23ff3db8' stroke-width='1.6'/%3E%3Cpath d='M9 22c2-2 5-2 7 0 2 2 5 2 7 0M9 18c2-2 5-2 7 0 2 2 5 2 7 0M10 14c2-1.6 4.4-1.6 6 0 1.6 1.6 4 1.6 6 0' fill='none' stroke='%2300f0ff' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='9' r='3.1' fill='%23ffe36b'/%3E%3Crect x='20' y='7' width='8' height='2.2' rx='1' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>压簧</b>
        <span>SPRING</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="压深">
          <em>压</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
            <s id="fill-mark"></s>
            <u id="fill-band"></u>
          </div>
          <b id="fill-num">0%</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 台</span>
          <span id="power-label">压到光带</span>
          <span class="pips" id="pips" aria-label="剩余芯"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="压簧弹芯上平台"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SPRING</p>
          <h1 id="ov-title">压簧</h1>
          <p class="lead" id="ov-lead">把弹簧压到光带高度，松手把芯弹上平台。<br />压浅够不着，压过会过头。</p>
          <p class="ops" id="ov-ops">按住下滑或空格压簧 · 松手弹出 · ↑↓ 微调 · M 静音</p>
          <button type="button" id="ov-btn">开压</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">压到光带 · 松手弹上平台</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
