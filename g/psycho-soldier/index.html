<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0412" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>超女 · PSYC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0412'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23140818' stroke='%23ff4ad8' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23ff4ad8' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='12' cy='11' r='3.2' fill='%23e8b0a0'/%3E%3Cpath d='M8.6 10.2c1.2-3.2 6.4-3.4 7.2.4' fill='%23ff4ad8'/%3E%3Crect x='9.2' y='14.6' width='5.6' height='6.4' rx='.8' fill='%23f0e8f4'/%3E%3Cpath d='M9.2 20.6h5.6l1.2 3.2H8z' fill='%23ff4ad8'/%3E%3Ccircle cx='20' cy='15' r='2.4' fill='%2300f0ff' opacity='.7'/%3E%3Ccircle cx='23.4' cy='14' r='1.4' fill='%23ffe36b'/%3E%3Crect x='18' y='20' width='8' height='5' rx='1' fill='%23603070'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>超女</b>
        <span>PSYC</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score hp" id="hp-box">
            <em>生命</em>
            <b id="hp">5</b>
            <span class="hp-track" aria-hidden="true"><i id="hp-fill"></i></span>
          </div>
          <div class="score charge" id="charge-box">
            <em>念</em>
            <b id="charge">蓄</b>
            <span class="hp-track" aria-hidden="true"><i id="charge-fill"></i></span>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">霓城</span>
          <span id="tag-label">念击</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-cut" aria-pressed="true">念击</button>
          <button type="button" id="mode-tide" aria-pressed="false">超能</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="超女，侧向走跳，空格念击，Shift 蓄力放大招"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="念击">放</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-charge" aria-label="蓄力">蓄</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PSYC</p>
          <h1 id="ov-title">超女</h1>
          <p class="lead" id="ov-lead">往右念击。空格放念弹，按住 Shift / Z 蓄力放大招。<br />短关后机甲现身。生命打空丢一条命。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · ↑ 跳 · 空格放 · Shift/Z 蓄 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-cut-start">念击</button>
            <button type="button" id="btn-tide-start">超能</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳过崖 · 空格念弹 · Shift 蓄力放大招 · 生命打空丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
