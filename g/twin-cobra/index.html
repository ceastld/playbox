<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#061410" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>双蛇 · COBRA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23061410'/%3E%3Cpath d='M6 22c4-8 6-14 10-14s6 6 10 14' fill='none' stroke='%2312e88a' stroke-width='2'/%3E%3Ccircle cx='10' cy='20' r='2' fill='%23ffe36b'/%3E%3Ccircle cx='22' cy='20' r='2' fill='%23ffe36b'/%3E%3Cellipse cx='16' cy='24' rx='7' ry='2.2' fill='%2312e88a' opacity='.5'/%3E%3Cpath d='M16 10l2.2 7h-4.4z' fill='%23e8fff4'/%3E%3Crect x='14.4' y='16' width='3.2' height='7' fill='%2312e88a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>双蛇</b>
        <span>COBRA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">扫射</span>
          <span id="wpn-label" class="wpn">赤</span>
          <span id="bomb-label" class="bombs">弹 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="丢弹">弹</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="双蛇游戏区，底部直升机纵卷，空格打空中，Shift 丢弹打地面"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="丢弹">弹</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">COBRA</p>
          <h1 id="ov-title">双蛇</h1>
          <p class="lead" id="ov-lead">纵卷武装直升机。空格机枪打空中，Shift 丢弹打地面。捡色荚切赤散、青穿、绿蛇。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格开火 · Shift / Z 丢弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-sweep">扫射</button>
            <button type="button" id="btn-dense">密弹</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格打空中 · Shift 丢弹打坦克炮台 · 捡 赤/青/绿</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
