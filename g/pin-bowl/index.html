<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>投针 · PINS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M4 9h24' stroke='%2300f0ff' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M16 9v6' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Ccircle cx='16' cy='16.2' r='2.1' fill='%23ff3db8'/%3E%3Cpath d='M16 18.2 L16 22.4' stroke='%23c8f6ff' stroke-width='1.15' stroke-linecap='round'/%3E%3Cpath d='M16 22.4 L14.7 24.6 L17.3 24.6 Z' fill='%23e8ffff'/%3E%3Cpath d='M8 24c0-3.2 3.2-6.2 8-9 4.8 2.8 8 5.8 8 9a8 8 0 1 1-16 0z' fill='%23100818' stroke='%2300f0ff' stroke-width='1.45'/%3E%3Cellipse cx='16' cy='24.2' rx='5.2' ry='2' fill='none' stroke='%23ffe36b' stroke-width='1.1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>投针</b>
        <span>PINS</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="已进碗的针">
          <em>针</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0/1</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 匣</span>
          <span id="tag-label">初落</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="投针落碗"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PINS</p>
          <h1 id="ov-title">投针</h1>
          <p class="lead" id="ov-lead">针落下，要正好进移动的碗。<br />擦到碗沿会弹飞。</p>
          <p class="ops" id="ov-ops">← → / A D 瞄准 · 空格或点击落下 · M 静音</p>
          <button type="button" id="ov-btn">开投</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">瞄准落下 · 针要进碗</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
