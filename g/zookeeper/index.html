<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#04140a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>园守 · ZOO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304140a'/%3E%3Crect x='4' y='4' width='24' height='20' fill='%231a3a24' stroke='%2322e060' stroke-width='1.1'/%3E%3Cpath d='M6 8h4v3H6zm5 0h4v3h-4zm5 0h4v3h-4zm5 0h4v3h-4zM6 12h4v3H6zm5 0h4v3h-4zm5 0h4v3h-4zm5 0h4v3h-4zM6 16h4v3H6zm5 0h4v3h-4zm5 0h4v3h-4zm5 0h4v3h-4z' fill='%231ee85a' opacity='.85'/%3E%3Ccircle cx='10' cy='13' r='2.1' fill='%23ffe36b'/%3E%3Ccircle cx='18' cy='10' r='1.7' fill='%23ff3db8'/%3E%3Ccircle cx='24' cy='15' r='2.3' fill='%2300f0c8'/%3E%3Crect x='13' y='24' width='6' height='4' rx='.6' fill='%235cff8a'/%3E%3Crect x='15' y='22' width='2' height='4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>园守</b>
        <span>ZOO</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">守园</span>
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">晨笼</span>
          <div class="fill" id="power-wrap" title="强网">
            <em>网</em>
            <div class="fill-track" aria-hidden="true"><i id="power-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="园守，底部园丁左右移动向上射击，把攀墙动物打回下一格"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-fire" aria-label="射击">射</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ZOO</p>
          <h1 id="ov-title">园守</h1>
          <p class="lead" id="ov-lead">三色动物往砖墙顶爬。打中往下砸一格，砸穿砖能让它们掉下去。爬到顶就跑路，扣一命。</p>
          <p class="ops" id="ov-ops">← → / WASD 移动 · 空格射击 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-guard">守园</button>
            <button type="button" id="btn-rush">狂奔</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">打回攀墙的动物 · 砸砖会掉下去 · 金鸟掉强网 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
