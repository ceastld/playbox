<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>剪引 · FUSE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M8 6c2 8 2 12 0 20' fill='none' stroke='%23ff3db8' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M16 6c-1.6 8-1.6 12 0 20' fill='none' stroke='%23666a88' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M24 6c-2 8-2 12 0 20' fill='none' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='14' r='1.6' fill='%23ffe36b'/%3E%3Ccircle cx='24' cy='18' r='1.6' fill='%23ffe36b'/%3E%3Cpath d='M11 16l5 3 5-3' fill='none' stroke='%23ffe36b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>剪引</b>
        <span>FUSE</span>
      </div>
      <div class="status">
        <span id="stage-label">十关</span>
        <div class="row">
          <span id="time-label">时 —</span>
          <span id="tell-label">看火花</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-cut" title="空格" aria-label="剪断">剪</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="剪引线"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FUSE</p>
          <h1 id="ov-title">剪引</h1>
          <p class="lead" id="ov-lead">三根引线里有一根是假的。<br />看着火花，剪掉假的那根。</p>
          <p class="ops" id="ov-ops">拖过引线剪断 · 1 2 3 选线 · 空格剪 · M 静音</p>
          <button type="button" id="ov-btn">开剪</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">没有火花的是假线 · 剪它</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
