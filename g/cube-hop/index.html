<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>立体跳 · QBERT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M16 6l6 3.5v7L16 20l-6-3.5v-7z' fill='%23ffb14a'/%3E%3Cpath d='M10 9.5L16 13l6-3.5L16 6z' fill='%23ffe36b'/%3E%3Cpath d='M10 9.5v7L16 20v-7z' fill='%23c86820'/%3E%3Ccircle cx='16' cy='11.2' r='2.6' fill='%23ff8a28'/%3E%3Ccircle cx='23' cy='22' r='2.4' fill='%23c45cff'/%3E%3Ccircle cx='9' cy='23.2' r='1.8' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>立体跳</b>
        <span>QBERT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>轮</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连跳</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">闯关</span>
          <div class="fill tiles" id="tile-wrap" title="翻色">
            <em>翻</em>
            <div class="fill-track" aria-hidden="true"><i id="tile-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="立体跳，等距金字塔，跳到相邻方块翻色，躲开科伊"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-ul" aria-label="左上">Q</button>
        <button type="button" id="btn-ur" aria-label="右上">W</button>
        <button type="button" id="btn-dl" aria-label="左下">S</button>
        <button type="button" id="btn-dr" aria-label="右下">E</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">QBERT</p>
          <h1 id="ov-title">立体跳</h1>
          <p class="lead" id="ov-lead">跳上相邻方块翻色。科伊来追，飞碟能送回顶。跳下去会掉命。</p>
          <p class="ops" id="ov-ops">点相邻块 · Q W E S / 方向键等距跳 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-classic">闯关</button>
            <button type="button" id="btn-chase">追逃</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点相邻块翻色 · 科伊会追 · 飞碟回顶 · A 自动 · 跳下塔掉命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
