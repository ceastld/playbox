<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>轨拍 · ORBIT TAP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='12' cy='16' r='8' fill='none' stroke='%23ff3db8' stroke-width='1.8'/%3E%3Ccircle cx='20' cy='16' r='8' fill='none' stroke='%2300f0ff' stroke-width='1.8'/%3E%3Ccircle cx='16' cy='9.2' r='2.2' fill='%23ffe36b'/%3E%3Ccircle cx='9' cy='16' r='1.8' fill='%23ff3db8'/%3E%3Ccircle cx='23' cy='16' r='1.8' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>轨拍</b>
        <span>ORBIT TAP</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="hit-label">锁 —</span>
          <span class="pips" id="pips" aria-label="剩余相位"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="轨道交点点射"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-fire" aria-label="点射">点射</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ORBIT TAP</p>
          <h1 id="ov-title">轨拍</h1>
          <p class="lead" id="ov-lead">两颗光珠在交叉轨道上疾走。<br />它们叠在交点的瞬间，点射锁定。</p>
          <p class="ops" id="ov-ops">空格 / J 点射 · 点按画布 · M 静音</p>
          <button type="button" id="ov-btn">入轨</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">两珠叠上交点时点射 · 空格 / 点击</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
