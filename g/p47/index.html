<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#021820" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>雷击 · P47A</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23021820'/%3E%3Cellipse cx='16' cy='18' rx='12' ry='4.2' fill='%231ad4ff'/%3E%3Cellipse cx='16' cy='17' rx='3.2' ry='10' fill='%237ee8ff'/%3E%3Ccircle cx='16' cy='8' r='3.2' fill='%23ffe36b'/%3E%3Cpath d='M10 26h12' stroke='%231ad4ff' stroke-width='1.6'/%3E%3Crect x='15.2' y='12' width='1.6' height='8' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>雷击</b>
        <span>P47A</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">雷击</span>
          <span id="wpn-label" class="wpn">八机</span>
          <span id="bomb-label" class="bombs">弹 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="投弹">弹</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="雷击游戏区，垂直卷轴，空格八机枪，Shift 投弹炸碉堡"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-bomb" aria-label="投弹">弹</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">P47A</p>
          <h1 id="ov-title">雷击</h1>
          <p class="lead" id="ov-lead">肥肚雷公。空格八机枪扫空，Shift 投弹砸地堡。诺曼底上岸，阿登炸列车，莱茵端要塞。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格射击 · Shift / Z 投弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">雷击</button>
            <button type="button" id="btn-swarm">机海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格打机群 · Shift 投弹砸地堡 · 吃 P 加宽 吃 B 补弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
