<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#100804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>功夫2 · KFU2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100804'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23160c06' stroke='%23ff7a14' stroke-width='1.4'/%3E%3Crect x='20' y='6' width='8' height='18' fill='%231a1020' stroke='%2300f0ff' stroke-width='.6'/%3E%3Crect x='21.4' y='8' width='1.6' height='1.6' fill='%23ffe36b'/%3E%3Crect x='24.2' y='8' width='1.6' height='1.6' fill='%23ff3db8'/%3E%3Crect x='21.4' y='11' width='1.6' height='1.6' fill='%2300f0ff'/%3E%3Crect x='24.2' y='11' width='1.6' height='1.6' fill='%23ffe36b'/%3E%3Cpath d='M4 26h24' stroke='%23ff7a14' stroke-width='1.2' opacity='.55'/%3E%3Ccircle cx='12' cy='12' r='3.1' fill='%23e8b090'/%3E%3Crect x='9.6' y='15' width='5.2' height='7.4' rx='.7' fill='%231a2848'/%3E%3Crect x='9.4' y='19.4' width='5.6' height='1.4' fill='%23ff7a14'/%3E%3Cpath d='M15 17l8-.8-4.2 2.8z' fill='%2300f0ff'/%3E%3Crect x='9.8' y='22.4' width='1.9' height='3.2' fill='%231a2848'/%3E%3Crect x='12.6' y='22.4' width='1.9' height='3.2' fill='%231a2848'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>功夫2</b>
        <span>KFU2</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="floor-label">一层</span>
          <span id="mode-label">功夫2</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-kfu" aria-pressed="true">功夫2</button>
          <button type="button" id="mode-core" aria-pressed="false">功核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="功夫2，霓虹塔楼一撞丢命，空格拳，Shift踢，四层后打塔尊"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-punch" aria-label="出拳">拳</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
        <button type="button" id="btn-kick" aria-label="踢腿">踢</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">KFU2</p>
          <h1 id="ov-title">功夫2</h1>
          <p class="lead" id="ov-lead">霓虹塔楼，一撞丢命。空格出拳，Shift 踢腿。<br />四层回廊打穿，塔顶塔尊等你。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳 · 空格拳 · Shift/Z 踢 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-kfu">功夫2</button>
            <button type="button" id="btn-core">功核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">一撞丢命 · 空格拳 · Shift/Z 踢 · 上键跳 · 挡暗器有顿帧</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
