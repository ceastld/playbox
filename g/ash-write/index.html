<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>灰书 · ASH</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='5' y='5' width='22' height='22' rx='3' fill='%23120818' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Cpath d='M8 16 H24' stroke='%23c8bdd8' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M18 14.5 l6-4 M21 16.5 l7-2' stroke='%2300f0ff' stroke-width='1.1' stroke-linecap='round' opacity='.85'/%3E%3Ccircle cx='11' cy='16' r='1.6' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>灰书</b>
        <span>ASH</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="成字">
          <em>成</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0</b>
        </div>
        <div class="row">
          <span id="stage-label">十页</span>
          <span id="ash-label">灰 —</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" aria-label="在石板上用灰写字"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ASH</p>
          <h1 id="ov-title">灰书</h1>
          <p class="lead" id="ov-lead">用灰写字，风会吹散。沿淡影落灰，写满一笔就会定着。</p>
          <p class="ops" id="ov-ops">按住拖动画灰 · WASD 移笔 · 空格落灰 · M 静音</p>
          <button type="button" id="ov-btn">落灰</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">沿淡影落灰 · 写满定着 · 风来会散</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
