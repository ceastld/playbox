<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0e0804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>枪星 · GUNS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0804'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23140c06' stroke='%23ff8a14' stroke-width='1.4'/%3E%3Ccircle cx='12' cy='12' r='3.4' fill='%23ffe36b'/%3E%3Cpath d='M9 10l3-4 3 4' fill='%23ffe36b'/%3E%3Crect x='9.4' y='15.2' width='5.4' height='7.6' rx='.8' fill='%23ff5a18'/%3E%3Crect x='15.2' y='16.4' width='9' height='1.6' rx='.3' fill='%2300f0ff'/%3E%3Ccircle cx='23' cy='11' r='1.4' fill='%23ff3db8'/%3E%3Ccircle cx='26' cy='14' r='1.1' fill='%2300f0ff'/%3E%3Cpath d='M4 25h24' stroke='%23ff8a14' stroke-width='1.2' opacity='.5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>枪星</b>
        <span>GUNS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">晶原</span>
          <span id="tag-label">突袭</span>
          <span id="gun-label" class="gun spread">散弹</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill boss" id="boss-wrap" hidden title="弱点">
            <em id="boss-name">晶甲</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-raid" aria-pressed="true">突袭</button>
          <button type="button" id="mode-spray" aria-pressed="false">乱射</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="枪星，侧向跑跳，八向开火，换枪近斩，打关底弱点"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-melee" aria-label="近斩">斩</button>
        <button type="button" id="btn-swap" aria-label="换枪">换</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GUNS</p>
          <h1 id="ov-title">枪星</h1>
          <p class="lead" id="ov-lead">八向开火，换散弹 / 激光 / 火焰。近身斩击。<br />打空弱点击碎关底巨物。</p>
          <p class="ops" id="ov-ops">WASD / 方向键 走跳 · 空格开火 · Shift/Z 斩 · Q 换枪 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">突袭</button>
            <button type="button" id="btn-spray">乱射</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">八向开火 · Q 换枪 · Shift 近斩 · 打弱点</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
