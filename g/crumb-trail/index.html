<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>屑径 · CRUMB</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 22c4-8 8-10 14-8' fill='none' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='8' cy='24' r='1.6' fill='%23ffe36b'/%3E%3Ccircle cx='13' cy='20' r='1.4' fill='%23ffe36b'/%3E%3Ccircle cx='18' cy='17' r='1.3' fill='%23ffe36b'/%3E%3Ccircle cx='24' cy='12' r='4.2' fill='none' stroke='%23ff3db8' stroke-width='1.6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>屑径</b>
        <span>CRUMB</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="余屑">
          <em>屑</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0/0</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 径</span>
          <span id="left-label">余 0s</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="撒屑引鸟出迷宫"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CRUMB</p>
          <h1 id="ov-title">屑径</h1>
          <p class="lead" id="ov-lead">撒一把屑，鸟会去最近的一粒。<br />把它引到金巢，别喂错。</p>
          <p class="ops" id="ov-ops">点地撒屑 · WASD 移准星 · 空格投屑 · M 静音</p>
          <button type="button" id="ov-btn">撒屑</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点地撒屑 · 鸟会去最近的一粒</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
