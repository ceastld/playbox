<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041208" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>千足 · MILL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041208'/%3E%3Ccircle cx='8' cy='11' r='2.3' fill='%232ae03a'/%3E%3Ccircle cx='13' cy='9' r='2.1' fill='%2314c44a'/%3E%3Ccircle cx='18' cy='11' r='2.1' fill='%2314c44a'/%3E%3Ccircle cx='23' cy='10' r='2.3' fill='%237aff6b'/%3E%3Crect x='6' y='17' width='3' height='3' rx='1' fill='%232ae03a'/%3E%3Crect x='14' y='16' width='3' height='3' rx='1' fill='%232ae03a'/%3E%3Crect x='22' y='18' width='3' height='3' rx='1' fill='%23ffe14a'/%3E%3Cpath d='M13 25h6v2h-6zm-2 2h10v2H11z' fill='%2300f0c8'/%3E%3Ccircle cx='24' cy='24' r='2' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>千足</b>
        <span>MILL</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">菌林</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="千足游戏区，底部移动射击，千足虫穿蘑菇，打节即断"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MILL</p>
          <h1 id="ov-title">千足</h1>
          <p class="lead" id="ov-lead">千足虫穿菌林。打节即断。DDT 炸开一片。蜘蛛扎底栏。</p>
          <p class="ops" id="ov-ops">← → ↑ ↓ / WASD 移动 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-grove">菌林</button>
            <button type="button" id="btn-tide">虫潮</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向键移动 · 空格开火 · 打节即断 · DDT 炸半径</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
