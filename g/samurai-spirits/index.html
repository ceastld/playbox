<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#160802" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>侍魂 · SSPR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23160802'/%3E%3Ccircle cx='24' cy='8' r='5' fill='%23ff7a32' opacity='.9'/%3E%3Cpath d='M4 24h24' stroke='%23ff4a14' stroke-width='1.2' opacity='.55'/%3E%3Cpath d='M6 22l20-11' stroke='%23ffd24a' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M8 21c3-6 7-4 10-10' fill='none' stroke='%23ff8ab0' stroke-width='1.1'/%3E%3Cellipse cx='11' cy='12' rx='4' ry='1.4' fill='%23e8c878'/%3E%3Ccircle cx='11' cy='25' r='2' fill='%23ff4a14'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>侍魂</b>
        <span>SSPR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连斩</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">侍魂</span>
          <span id="tag-label">樱巫</span>
          <span id="round-label">第1局</span>
          <div class="hp-duo" aria-hidden="true">
            <div class="fill p1" title="体力">
              <em id="p1-name">魂丸</em>
              <div class="bars">
                <div class="fill-track"><i id="hp1"></i></div>
                <div class="fill-track meter"><i id="mt1"></i></div>
              </div>
            </div>
            <span class="timer" id="timer">99</span>
            <div class="fill p2" title="对手体力">
              <div class="bars">
                <div class="fill-track"><i id="hp2"></i></div>
                <div class="fill-track meter"><i id="mt2"></i></div>
              </div>
              <em id="p2-name">樱巫</em>
            </div>
          </div>
          <span class="pips" id="pips1" aria-label="己方局分"></span>
          <span class="pips pips-foe" id="pips2" aria-label="对手局分"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="侍魂，落日一对一对刀，空格斩，上跳，Shift 弧月斩，怒满旋风"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="跳">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-down" aria-label="蹲">蹲</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-slash" aria-label="斩">斩</button>
        <button type="button" id="btn-spec" aria-label="怒气">气</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SSPR</p>
          <h1 id="ov-title">侍魂</h1>
          <p class="lead" id="ov-lead">落日对刀。空格斩，上跳，Shift 弧月。怒气满了旋风。先赢两局。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走跳 · 空格斩 · Shift / Z 特技 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-duel">侍魂</button>
            <button type="button" id="btn-chain">连斩</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格斩 · 上跳 · 下扫 · Shift 弧月 · 怒满旋风 · 先赢两局</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
