<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#180c04" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>铁坦 · ITNK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23180c04'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231c0e06' stroke='%23ff8614' stroke-width='1.4'/%3E%3Crect x='8' y='12' width='16' height='12' rx='1.6' fill='%23ff8614'/%3E%3Crect x='10' y='14' width='12' height='5' rx='.6' fill='%23ffe36b'/%3E%3Crect x='14.2' y='6.5' width='3.6' height='8' fill='%2300e8ff'/%3E%3Crect x='6' y='13' width='3' height='10' rx='.4' fill='%23402818'/%3E%3Crect x='23' y='13' width='3' height='10' rx='.4' fill='%23402818'/%3E%3Ccircle cx='24' cy='10' r='1.8' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>铁坦</b>
        <span>ITNK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">战壕</span>
          <span id="tag-label">铁坦</span>
          <span id="gun-label" class="gun">榴弹</span>
          <span id="shell-label" class="shell">弹 5</span>
          <span id="crate-label" class="crate">箱 0</span>
          <div class="fill" id="boss-wrap" hidden title="关底">
            <em id="boss-name">壕甲</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-raid" aria-pressed="true">铁坦</button>
          <button type="button" id="mode-dense" aria-pressed="false">坦林</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="铁坦，开坦克往上突，空格射击，Shift 开炮，碾步兵，撞坦克丢命"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-shell" aria-label="开炮">炮</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ITNK</p>
          <h1 id="ov-title">铁坦</h1>
          <p class="lead" id="ov-lead">开铁坦往上突。机枪跟炮口，榴弹直线砸甲。碾步兵，撞坦克丢命。炸补给箱补弹升炮。短关之后是关底。</p>
          <p class="ops" id="ov-ops">方向 / WASD 开 · 空格射击 · Shift / Z 开炮 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">铁坦</button>
            <button type="button" id="btn-dense">坦林</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">开铁坦碾兵 · 炸箱补弹 · 撞甲丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
