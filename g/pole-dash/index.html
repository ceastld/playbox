<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0308" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>杆位 · POLE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0308'/%3E%3Cpath d='M4 28 L14 14 L18 14 L28 28' fill='%231a0a12' stroke='%23ff2d5a' stroke-width='1.2'/%3E%3Cpath d='M14 14 L16 8 L18 14' fill='%23ff2d5a'/%3E%3Crect x='13.2' y='16' width='5.6' height='3.2' rx='.6' fill='%23ffe36b'/%3E%3Crect x='12' y='20' width='8' height='2.2' rx='.4' fill='%2300f0ff'/%3E%3Cpath d='M10 26h12' stroke='%23ff2d5a' stroke-width='1.4' opacity='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>杆位</b>
        <span>POLE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">0.0</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连超</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">排位</span>
          <span id="lap-label">圈 0/1</span>
          <span id="spd-label">0</span>
          <div class="fill" id="time-wrap" title="剩余时间">
            <em>时</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="杆位，后视公路超车，别撞栏，赶检查点"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">POLE</p>
          <h1 id="ov-title">杆位</h1>
          <p class="lead" id="ov-lead">后视公路，超车别撞栏。检查点前赶到。</p>
          <p class="ops" id="ov-ops">← → 转向 · ↑ 油门 · ↓ 刹车 · 拖指驾驶 · R 重开</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-qual">排位</button>
            <button type="button" id="btn-endure">耐力</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再赛</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 油门 · ↓ 刹车 · 赶检查点 · R 重开 · M 静音</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
