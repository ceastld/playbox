<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#100a06" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>雷交 · TCRO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100a06'/%3E%3Cpath d='M16 4l3 8h8l-6.4 5 2.6 8L16 20.2 8.8 25l2.6-8L5 12h8z' fill='%23ffe14a'/%3E%3Ccircle cx='8' cy='16' r='2.2' fill='%235cefff'/%3E%3Ccircle cx='24' cy='16' r='2.2' fill='%235cefff'/%3E%3Ccircle cx='16' cy='7' r='2' fill='%235cefff'/%3E%3Ccircle cx='16' cy='25' r='2' fill='%235cefff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>雷交</b>
        <span>TCRO</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">雷交</span>
          <span id="wpn-label" class="wpn">火</span>
          <span id="claw-label" class="claws">爪 ×0</span>
          <span id="bomb-label" class="bombs">弹 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="交弹">弹</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="雷交游戏区，八向移动开火，交爪张开成十字，Shift 扔交弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-bomb" aria-label="交弹">弹</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TCRO</p>
          <h1 id="ov-title">雷交</h1>
          <p class="lead" id="ov-lead">交爪张开成十字。捡 O 加爪、S 加速、V 速射、B 回旋、L 前后激光。Shift 扔交弹。每关中核与关底核。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格开火 · Shift / Z 交弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">雷交</button>
            <button type="button" id="btn-core">交核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">平移张开交爪 · 空格开火 · Shift 交弹 · 捡 O/S/V/B/L</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
