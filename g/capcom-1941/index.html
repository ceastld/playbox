<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#021820" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>反击 · 1941</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23021820'/%3E%3Cpath d='M6 22h20' stroke='%231a6a88' stroke-width='2'/%3E%3Cpath d='M16 7l2 5 6 .6-4.8 3.4 1.6 5.6L16 19l-4.8 2.6 1.6-5.6L8 12.6 14 12z' fill='none' stroke='%231ad4ff' stroke-width='.8' opacity='.4'/%3E%3Cpath d='M10 12v10 M22 12v10' stroke='%231ad4ff' stroke-width='1.6'/%3E%3Cpath d='M8 12h16' stroke='%231ad4ff' stroke-width='1.4'/%3E%3Cpath d='M16 8v8' stroke='%23ffe36b' stroke-width='1.4'/%3E%3Cpath d='M9 22h4 M19 22h4' stroke='%231ad4ff' stroke-width='1.6'/%3E%3Cpath d='M16 6l1 6 4 .4' stroke='%23fff8c8' stroke-width='.7' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>反击</b>
        <span>1941</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">反击</span>
          <span id="wpn-label" class="wpn">雷</span>
          <div class="fill" id="chg-wrap" title="蓄雷">
            <em>蓄</em>
            <div class="fill-track" aria-hidden="true"><i id="chg-bar"></i></div>
          </div>
          <span id="loop-label" class="loops">环 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-loop" title="Shift / Z" aria-label="翻环落雷">环</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="反击游戏区，垂直卷轴，空格蓄雷射击，Shift 翻环落雷炸舰"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-loop" aria-label="翻环落雷">环</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">1941</p>
          <h1 id="ov-title">反击</h1>
          <p class="lead" id="ov-lead">双尾闪电。空格蓄雷贯射，Shift 翻环落雷炸舰。先扫北大西洋再打欧陆港口。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格射击蓄雷 · Shift / Z 翻环落雷 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">反击</button>
            <button type="button" id="btn-guns">舰炮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格打空打地 · 蓄满放雷贯射 · Shift 翻环落雷炸舰</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
