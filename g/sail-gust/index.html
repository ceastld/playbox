<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>抢风 · SAIL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M8 24 L16 6 L18 24 Z' fill='%2300f0ff'/%3E%3Cpath d='M6 25 H26' stroke='%23ff3db8' stroke-width='2'/%3E%3Cpath d='M16 8 L24 16 L16 16 Z' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>抢风</b>
        <span>SAIL</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="wind-label">无风</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余船体"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="抢风航道"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左转">左</button>
        <button type="button" id="btn-right" aria-label="右转">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SAIL</p>
          <h1 id="ov-title">抢风</h1>
          <p class="lead" id="ov-lead">帆船只会直行。钻进青色阵风，才能转向。<br />别撞礁，驶进灯塔。</p>
          <p class="ops" id="ov-ops">A / D 或 ← → 转向（仅阵风中）· 点住船的左或右侧 · M 静音</p>
          <button type="button" id="ov-btn">启航</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">借阵风转向 · 无风不会转 · 别撞礁</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
