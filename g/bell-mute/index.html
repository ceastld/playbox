<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>止铃 · MUTE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M10 7h12' stroke='%2300f0ff' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M16 7v4' stroke='%23ffe36b' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M11.2 12.2c-.8 4.2-2.4 6.8-2.4 9.2 0 2.6 3.2 4.4 7.2 4.4s7.2-1.8 7.2-4.4c0-2.4-1.6-5-2.4-9.2z' fill='%23140a22' stroke='%23ff3db8' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='18.2' r='1.5' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='11.2' r='3.4' fill='none' stroke='%23ffe36b' stroke-width='1.1' opacity='.8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>止铃</b>
        <span>MUTE</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="已止">
          <em>止</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0/0</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 檐</span>
          <span id="noise-label">噪 —</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="按掉乱响的铃，留下同拍的那只"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MUTE</p>
          <h1 id="ov-title">止铃</h1>
          <p class="lead" id="ov-lead">檐下铃一起响。按掉乱拍的，只留跟金拍同闪的那一只。</p>
          <p class="ops" id="ov-ops">点按止铃 · ←→ 选择 · 空格 / 1–8 · M 静音</p>
          <button type="button" id="ov-btn">入檐</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">乱响按掉 · 同拍留下</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
