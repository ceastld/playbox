<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>冰面 · SLIDE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M16 4 L28 16 L16 28 L4 16 Z' fill='none' stroke='%2300f0ff' stroke-width='2'/%3E%3Cpath d='M16 10 L22 16 L16 22 L10 16 Z' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>冰面</b>
        <span>SLIDE</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
          <span id="gem-label"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="冰面滑行"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左轻点">左</button>
        <button type="button" id="btn-up" aria-label="向上轻点">上</button>
        <button type="button" id="btn-down" aria-label="向下轻点">下</button>
        <button type="button" id="btn-right" aria-label="向右轻点">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SLIDE</p>
          <h1 id="ov-title">冰面</h1>
          <p class="lead" id="ov-lead">没有刹车。轻点加速，反向轻点减速。<br />撞墙改向。滑进青色门，躲开品红裂口。</p>
          <p class="ops" id="ov-ops">WASD / 方向键轻点 · 点向目标方向 · M 静音</p>
          <button type="button" id="ov-btn">上冰</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">没有刹车 · 轻点加速 · 反向轻点减速 · 撞墙改向</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
