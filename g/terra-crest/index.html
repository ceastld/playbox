<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>征陆 · TCRS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140804'/%3E%3Cpath d='M16 6l4 7 8 1.2-6.2 5 2.2 7.8L16 23l-8 4 2.2-7.8L4 14.2 12 13z' fill='%23ff8a32' opacity='.35'/%3E%3Cpath d='M16 8l2.8 6.2h7.2l-5.8 4.2 2.2 7-6.4-4.4-6.4 4.4 2.2-7-5.8-4.2h7.2z' fill='%23ffc44a'/%3E%3Cpath d='M10 22h12l-2 4H12z' fill='%23ff6a28'/%3E%3Crect x='15.1' y='12' width='1.8' height='10' fill='%23ffe36b'/%3E%3Cpath d='M8 14h16' stroke='%23ff9a3a' stroke-width='1.2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>征陆</b>
        <span>TCRS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">征陆</span>
          <span id="form-label" class="form">编 1</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-form" title="Shift / Z" aria-label="编队">阵</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="征陆游戏区，纵向卷轴，打六角仓对接僚机，Shift 合散化凰"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="编队">阵</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TCRS</p>
          <h1 id="ov-title">征陆</h1>
          <p class="lead" id="ov-lead">向上打。炸六角仓放出僚机对接。Shift 合散编队，五机齐则化凰。先扫地面堡垒再打关底。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击 · Shift / Z 编队 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-land">征陆</button>
            <button type="button" id="btn-fort">堡海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格射击 · Shift 合散 · 五机化凰 · 打仓对接</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
