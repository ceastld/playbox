<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0d0c03" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>忍四 · SHN4</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d0c03'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23161004' stroke='%23ffd014' stroke-width='1.4'/%3E%3Ccircle cx='24' cy='8' r='4.4' fill='%23ffe86b'/%3E%3Ccircle cx='26' cy='7' r='2.4' fill='%23161004'/%3E%3Cpath d='M4 24h24' stroke='%23ffd014' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='13' cy='13' r='3.4' fill='%23161004'/%3E%3Crect x='10.4' y='16' width='5.4' height='7' rx='.8' fill='%23ffd014'/%3E%3Crect x='10.2' y='18.4' width='5.8' height='1.3' fill='%23ffe86b'/%3E%3Cpath d='M16 15l10-2-8 4z' fill='%2300f0ff'/%3E%3Cpath d='M20 12c4-1 7 2 9 0' fill='none' stroke='%23ffe86b' stroke-width='1.2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>忍四</b>
        <span>SHN4</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">霓港</span>
          <span id="tag-label">忍四</span>
          <span id="star-label" class="stars">冲</span>
          <span id="ninj-label" class="ninj">月 3</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-raid" aria-pressed="true">忍四</button>
          <button type="button" id="mode-core" aria-pressed="false">忍核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="忍四，侧向走跳冲刺，近斩，空斩反跳，Shift 放出月华回刃，关底金主"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-dash" aria-label="冲刺">冲</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-slash" aria-label="斩">斩</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-ninj" aria-label="月华忍术">月</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SHN4</p>
          <h1 id="ov-title">忍四</h1>
          <p class="lead" id="ov-lead">侧跳斩杀，空斩反跳。<br />闯过三关，金主现身。Shift 放出月华回刃。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳 · 空格斩 · 双击冲 · Shift / Z 月华 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">忍四</button>
            <button type="button" id="btn-core">忍核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳冲 · 空格斩 · Shift 月华 · 闯关见金主 · 挨打丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
