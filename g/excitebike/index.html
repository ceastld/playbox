<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0406" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>越野 · BIKE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0406'/%3E%3Cpath d='M2 22 L8 16 L16 18 L24 12 L30 14 V30 H2Z' fill='%231a080c'/%3E%3Cpath d='M2 22 L10 15 L18 17 L30 11' fill='none' stroke='%23ff4a18' stroke-width='1.4'/%3E%3Ccircle cx='11' cy='22' r='3.2' fill='%23141018' stroke='%23ffe36b' stroke-width='.8'/%3E%3Ccircle cx='22' cy='21' r='3.2' fill='%23141018' stroke='%2300f0ff' stroke-width='.8'/%3E%3Cpath d='M12 20 L16 14 L21 19' fill='none' stroke='%23ff7a3a' stroke-width='1.3'/%3E%3Ccircle cx='16.2' cy='12.6' r='1.8' fill='%23fff2e8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>越野</b>
        <span>BIKE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">48.0</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>时速</em>
            <b id="spd">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">越野</span>
          <span id="place-label">名次 1/5</span>
          <div class="fill heat" id="heat-wrap" title="引擎温度">
            <em>热</em>
            <div class="fill-track" aria-hidden="true"><i id="heat-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连落</span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="越野摩托，侧视冲坡，空中摆车落地"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-brake" aria-label="刹车">刹</button>
          <button type="button" class="pad" id="pad-up" aria-label="抬头">抬</button>
          <button type="button" class="pad" id="pad-down" aria-label="压头">压</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad gas" id="pad-gas" aria-label="油门">油</button>
          <button type="button" class="pad turbo" id="pad-turbo" aria-label="涡轮">涡</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BIKE</p>
          <h1 id="ov-title">越野</h1>
          <p class="lead" id="ov-lead">冲坡起飞，空中摆车落地。涡轮别过热，摔了就晚了。跟 CPU 抢终点。</p>
          <p class="ops" id="ov-ops">→ D 油门 · ← 刹车 · ↑↓ 空中摆车 · 空格涡轮 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-track">越野</button>
            <button type="button" id="btn-fever">发烧</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再冲</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">→ 油门 · 空格涡轮 · 空中 ↑↓ 摆平落地 · 别过热 · A 自动 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
