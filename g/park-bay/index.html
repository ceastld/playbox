<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>入位 · PARK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='4' width='10' height='8' rx='2' fill='none' stroke='%23ff3db8' stroke-width='1.6'/%3E%3Crect x='19' y='4' width='10' height='8' rx='2' fill='none' stroke='%2300f0ff' stroke-width='1.6'/%3E%3Cpath d='M10 22 L16 14 L22 22 L19 26 L13 26 Z' fill='%23ff3db8'/%3E%3Cpath d='M14 22 L16 18 L18 22 Z' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>入位</b>
        <span>PARK</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="gear-label">空挡</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余船体"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="靠镜像倒车入坞"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左舵">左</button>
        <button type="button" id="btn-rev" aria-label="倒车">倒</button>
        <button type="button" id="btn-fwd" aria-label="前进">进</button>
        <button type="button" id="btn-right" aria-label="右舵">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PARK</p>
          <h1 id="ov-title">入位</h1>
          <p class="lead" id="ov-lead">没有倒车雷达。坞在船尾后面，只看左右镜像。<br />镜像左右是反的。把船尾倒进青色坞位，停稳。</p>
          <p class="ops" id="ov-ops">WASD / 方向键 · 点按拖动油门与舵 · M 静音</p>
          <button type="button" id="ov-btn">启航</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">没有雷达 · 看上面两面镜子 · 左右是反的</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
