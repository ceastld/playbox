<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>狂廊 · BZERK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%2312080c' stroke='%23ff3a4a' stroke-width='1.4'/%3E%3Cpath d='M3 14h5M24 14h5M14 3v5M14 24v5' stroke='%2300f0ff' stroke-width='2'/%3E%3Cpath d='M10 10h5v2H10zm7 4h6v2h-6zM8 18h4v2H8z' fill='%23ff3a4a'/%3E%3Ccircle cx='12' cy='20' r='2.1' fill='%2300f0ff'/%3E%3Crect x='19' y='11' width='3.2' height='5.2' rx='.4' fill='%23ffe36b'/%3E%3Ccircle cx='22.5' cy='21.5' r='2.6' fill='%23ffe36b'/%3E%3Crect x='21.4' y='20.6' width='.7' height='1' fill='%2305030c'/%3E%3Crect x='23' y='20.6' width='.7' height='1' fill='%2305030c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>狂廊</b>
        <span>BZERK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">闯关</span>
          <span id="tag-label">Otto —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-camp" aria-pressed="true">闯关</button>
          <button type="button" id="mode-end" aria-pressed="false">无尽</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="狂廊迷宫，八向跑动射击机器人，别被围住，Otto 会来"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BZERK</p>
          <h1 id="ov-title">狂廊</h1>
          <p class="lead" id="ov-lead">迷宫里八向跑、瞄准开火。<br />打掉机器人，别被围住。停太久，Otto 会弹进来。</p>
          <p class="ops" id="ov-ops">WASD / 方向键走 · 空格或点按开火 · 出门进下一廊 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-campaign">闯关</button>
            <button type="button" id="btn-endless">无尽</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">WASD 八向走 · 空格开火 · 出门进下一廊 · 别被围住</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
