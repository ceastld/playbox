<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120e04" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>辛普 · SIMP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120e04'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231a1408' stroke='%23ffcc22' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='13' r='5.4' fill='%23ffd24a'/%3E%3Cpath d='M13.2 8.2c.6-1.6 1.4-2.4 2.8-2.6' stroke='%23ffd24a' stroke-width='1.2' fill='none'/%3E%3Cellipse cx='16' cy='22' rx='6.2' ry='5' fill='%23fff4e0'/%3E%3Crect x='12' y='20' width='8' height='6' rx='.6' fill='%233d6ad6'/%3E%3Ccircle cx='14.2' cy='12.6' r='.7' fill='%23141008'/%3E%3Ccircle cx='18.2' cy='12.6' r='.7' fill='%23141008'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>辛普</b>
        <span>SIMP</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">春田街</span>
          <span id="tag-label">扫街</span>
          <span id="fam-label" class="fam homer">霍默</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-street" aria-pressed="true">扫街</button>
          <button type="button" id="mode-riot" aria-pressed="false">暴动</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="辛普森，侧向扫街，选家人拳吸滑号清场"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-atk" aria-label="攻击">打</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SIMP</p>
          <h1 id="ov-title">辛普</h1>
          <p class="lead" id="ov-lead">侧向扫街。选一位家人，拳吸滑号清场。瓶子要跳过，门口会冒匪。打到史密与伯恩斯。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 上跳 · 空格打 · R 重开 · M 静音</p>
          <div class="fams" id="fam-row" role="radiogroup" aria-label="选家人">
            <button type="button" id="f-homer" data-id="homer" aria-pressed="true">霍默</button>
            <button type="button" id="f-marge" data-id="marge" aria-pressed="false">玛芝</button>
            <button type="button" id="f-bart" data-id="bart" aria-pressed="false">巴特</button>
            <button type="button" id="f-lisa" data-id="lisa" aria-pressed="false">莉萨</button>
          </div>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-street">扫街</button>
            <button type="button" id="btn-riot">暴动</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳打 · 门口冒匪 · 跳过瓶子 · 四人不同射程</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
