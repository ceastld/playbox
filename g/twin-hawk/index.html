<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#04140c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>双鹰 · HAWK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304140c'/%3E%3Cpath d='M6 14h20' stroke='%2320e96a' stroke-width='1.6'/%3E%3Cpath d='M8 18h16' stroke='%2320e96a' stroke-width='1.2'/%3E%3Cpath d='M16 8l1.4 5 4 .4-3.2 2.4 1.2 4.2L16 17.6l-3.4 2.4 1.2-4.2-3.2-2.4 4-.4z' fill='%23ffe36b' opacity='.35'/%3E%3Cpath d='M16 9v11' stroke='%23ffe36b' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='10' r='2.2' fill='none' stroke='%23e8fff4' stroke-width='.9'/%3E%3Cpath d='M10 22h12' stroke='%237cffb0' stroke-width='1.2'/%3E%3Crect x='12' y='24' width='8' height='4' rx='.6' fill='%23ff6b4a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>双鹰</b>
        <span>HAWK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">俯冲</span>
          <span id="wpn-label" class="wpn">弹</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="投弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="双鹰游戏区，空格扫空，Shift 投弹炸地，勿炸友军坦克"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-bomb" aria-label="投弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">HAWK</p>
          <h1 id="ov-title">双鹰</h1>
          <p class="lead" id="ov-lead">双翼俯冲。空格扫空，Shift 投弹炸坦克军舰。友军坦克在地上并肩打，别误炸。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格射击 · Shift / Z 投弹 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-dive">俯冲</button>
            <button type="button" id="btn-dense">密弹</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格打飞机 · Shift 投弹炸坦克 · 友军坦克别误炸 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
