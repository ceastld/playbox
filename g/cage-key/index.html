<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>笼钥 · CAGE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cellipse cx='16' cy='26' rx='9' ry='2.2' fill='%2300f0ff' opacity='.25'/%3E%3Cpath d='M16 4.2c1.4 0 2.4 1 2.4 2.3v1.6h-4.8V6.5c0-1.3 1-2.3 2.4-2.3z' fill='none' stroke='%23ff3db8' stroke-width='1.4'/%3E%3Cpath d='M8.2 10.6c0-1.4 3.5-2.6 7.8-2.6s7.8 1.2 7.8 2.6v12.4c0 1.5-3.5 2.8-7.8 2.8s-7.8-1.3-7.8-2.8z' fill='%23120818' stroke='%2300f0ff' stroke-width='1.35'/%3E%3Cpath d='M10 11.4v11.6M13.2 10.8v12.4M16 10.6v12.6M18.8 10.8v12.4M22 11.4v11.6' stroke='%23ff3db8' stroke-width='1.05' opacity='.85'/%3E%3Crect x='13.1' y='15.2' width='5.8' height='7.4' rx='1' fill='%23140a1c' stroke='%23ffe36b' stroke-width='1.1'/%3E%3Ccircle cx='16' cy='17.4' r='1.05' fill='none' stroke='%2300f0ff' stroke-width='.9'/%3E%3Cpath d='M16 18.4v3.1' stroke='%2300f0ff' stroke-width='.9'/%3E%3Cpath d='M24.2 18.2h5.2v2.1h-1.6v5.2h-2v-5.2h-1.6z' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>笼钥</b>
        <span>CAGE</span>
      </div>
      <div class="status">
        <span id="stage-label">十笼</span>
        <div class="row">
          <div class="fill" id="align-wrap" title="钥口朝向">
            <em>口</em>
            <div class="fill-track" aria-hidden="true"><i id="align-bar"></i></div>
          </div>
          <div class="fill time" id="time-wrap" title="时限">
            <em>时</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-in" title="空格" aria-label="插入">插</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="转笼插钥"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-ccw" aria-label="左转笼子">◀</button>
        <button type="button" id="btn-pad-in" aria-label="插入">插</button>
        <button type="button" id="btn-cw" aria-label="右转笼子">▶</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CAGE</p>
          <h1 id="ov-title">笼钥</h1>
          <p class="lead" id="ov-lead">先把笼子转到锁朝你，钥口会亮金。<br />再选齿口吻合的钥匙插进去。</p>
          <p class="ops" id="ov-ops">拖笼子 / Q E 转 · 点钥或 1–5 选 · 空格插入 · M 静音</p>
          <button type="button" id="ov-btn">开笼</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">先转笼子 · 锁朝你再插对的钥匙</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
