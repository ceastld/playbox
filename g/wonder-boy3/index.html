<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#06100a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>仙童3 · WB3</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2306100a'/%3E%3Cpath d='M2 24 Q10 18 16 22 Q24 28 30 20 L30 32 L2 32 Z' fill='%230a1810'/%3E%3Cpath d='M2 24 Q10 18 16 22 Q24 28 30 20' fill='none' stroke='%23c6ff2a' stroke-width='1.3'/%3E%3Ccircle cx='11' cy='14.6' r='3.1' fill='%23ffe0b0'/%3E%3Cellipse cx='11' cy='11.8' rx='3.6' ry='2.2' fill='%23e8ff6a'/%3E%3Crect x='8.6' y='17.2' width='5' height='6.2' rx='.7' fill='%2300f0ff'/%3E%3Cellipse cx='11' cy='25' rx='6.4' ry='1.7' fill='%23ff3db8'/%3E%3Ccircle cx='6.6' cy='25.6' r='1.2' fill='%23c6ff2a'/%3E%3Ccircle cx='15.4' cy='25.6' r='1.2' fill='%23c6ff2a'/%3E%3Ccircle cx='20' cy='16' r='2.2' fill='%23ff6a32'/%3E%3Cpath d='M17.4 16h8' stroke='%23ff9a4a' stroke-width='1.4'/%3E%3Ccircle cx='24' cy='10' r='2.4' fill='%2390a0c8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>仙童3</b>
        <span>WB3</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">洞窟</span>
          <span id="tag-label">仙童3</span>
          <div class="fill" id="vit-wrap" title="体力">
            <em>力</em>
            <div class="fill-track" aria-hidden="true"><i id="vit-bar"></i></div>
          </div>
          <span id="gun-label" class="gun">单炎</span>
          <span id="gear-label" class="gear hidden">护焰</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-isle" aria-pressed="true">仙童3</button>
          <button type="button" id="mode-core" aria-pressed="false">童核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="仙童3，滑板跑跳射击，空格或 Z 射炎弹，Shift 跳，关底打头目"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="射击">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">WB3</p>
          <h1 id="ov-title">仙童3</h1>
          <p class="lead" id="ov-lead">滑板冲进魔巢。空格射炎弹，Shift 起跳。镜头一直往右推，撞敌、坠崖、饿倒、被卷走都丢命。摘果续力，捡火晶升炎。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · Shift 跳 · 空格 / Z 射 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-isle">仙童3</button>
            <button type="button" id="btn-core">童核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">滑板射 · 空格炎弹 · Shift 跳 · 火晶升炎 · 水果续命 · 撞敌丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
