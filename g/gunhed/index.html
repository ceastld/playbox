<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041618" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>钢魂 · GHED</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041618'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23081e22' stroke='%2300f0d4' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%2300f0d4' stroke-width='1.2' opacity='.5'/%3E%3Crect x='8' y='13' width='12' height='9' rx='1.2' fill='%2300f0d4'/%3E%3Crect x='10' y='15' width='5' height='3' fill='%23c8fff8'/%3E%3Crect x='8.4' y='22' width='3.2' height='3.2' fill='%2300c8b0'/%3E%3Crect x='14.2' y='22' width='3.2' height='3.2' fill='%2300c8b0'/%3E%3Crect x='19' y='16' width='9' height='2.4' rx='.4' fill='%23ffe36b'/%3E%3Crect x='7' y='11' width='3' height='3' fill='%2300e8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>钢魂</b>
        <span>GHED</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">废岛</span>
          <span id="tag-label">钢魂</span>
          <span id="dash-label" class="dash">冲</span>
          <div class="fill" id="heat-wrap" title="钢轨">
            <em>轨</em>
            <div class="fill-track" aria-hidden="true"><i id="heat-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-raid" aria-pressed="true">钢魂</button>
          <button type="button" id="mode-alley" aria-pressed="false">巷战</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="钢魂，驾驶重机甲向右推进，射击跳跃冲刺，撞击丢命"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-dash" aria-label="冲刺">冲</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GHED</p>
          <h1 id="ov-title">钢魂</h1>
          <p class="lead" id="ov-lead">驾驶重机甲向右推进。空格连射，打热了打出钢轨。Shift 冲刺可碾碎小机。撞上、中弹、坠井丢一条命。短关之后是关底。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走跳 · 空格射击 · Shift / Z 冲刺 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">钢魂</button>
            <button type="button" id="btn-alley">巷战</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳射击 · 冲刺碾压 · 打热出钢轨 · 撞击丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
