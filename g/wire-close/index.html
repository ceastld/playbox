<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>通电 · WIRE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='8' cy='10' r='3' fill='none' stroke='%23ff3db8' stroke-width='2'/%3E%3Ccircle cx='24' cy='22' r='3' fill='none' stroke='%2300f0ff' stroke-width='2'/%3E%3Cpath d='M11 10h4c4 0 4 12 8 12h1' fill='none' stroke='%23ffe36b' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>通电</b>
        <span>WIRE</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余保险丝"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-undo" title="Z">撤销</button>
        <button type="button" id="btn-drop" title="X">放下</button>
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="通电电路板"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">WIRE</p>
          <h1 id="ov-title">通电</h1>
          <p class="lead" id="ov-lead">从左岸拖出火线，接到同色右岸。<br />线交叉就会短路。绕开瓷柱，走边路。</p>
          <p class="ops" id="ov-ops">点端子拖到同色 · WASD 移探针 · 空格接驳 · Z 撤销 · M 静音</p>
          <button type="button" id="ov-btn">通电</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">从左岸拖到同色右岸 · 交叉即短路</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
