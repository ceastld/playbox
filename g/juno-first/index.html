<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#030814" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>朱诺 · JUNO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030814'/%3E%3Cpath d='M4 28 L16 10 L28 28' fill='none' stroke='%234d8cff' stroke-width='.7' opacity='.7'/%3E%3Cpath d='M8 28 L16 14 L24 28' fill='none' stroke='%234d8cff' stroke-width='.5' opacity='.45'/%3E%3Cpath d='M16 22l3 7h-6z' fill='%2379b4ff'/%3E%3Cpath d='M13 27h6l-1.4 2H14.4z' fill='%23ffe36b'/%3E%3Ccircle cx='11' cy='12' r='1.3' fill='%23ff3db8'/%3E%3Ccircle cx='21' cy='11' r='1.1' fill='%2300f0ff'/%3E%3Ccircle cx='16' cy='8' r='1.5' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>朱诺</b>
        <span>JUNO</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">突进</span>
          <div class="fill" id="fuel-wrap" title="燃料">
            <em>燃</em>
            <div class="fill-track" aria-hidden="true"><i id="fuel-bar"></i></div>
            <b id="fuel-num">99</b>
          </div>
          <span id="warp-label" class="warp">跃迁 ●●●</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="朱诺游戏区，透视网格，底部飞船移动开火，按住上跃迁跳过空域"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">JUNO</p>
          <h1 id="ov-title">朱诺</h1>
          <p class="lead" id="ov-lead">透视网格。编队从深处压来。按住上跃迁跳过空域。母舰与燃料。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格开火 · 按住上跃迁 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-camp">突进</button>
            <button type="button" id="btn-end">乱舞</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格开火 · 按住上跃迁跳过空域</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
