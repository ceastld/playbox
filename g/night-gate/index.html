<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>夜门 · GATE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 28V12l10-7 10 7v16' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Cpath d='M16 28V8' stroke='%23ff3db8' stroke-width='1.2'/%3E%3Ccircle cx='11' cy='16' r='1.6' fill='%2300f0ff'/%3E%3Ccircle cx='21' cy='16' r='1.6' fill='%23ff3db8'/%3E%3Ccircle cx='16' cy='12' r='1.7' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>夜门</b>
        <span>GATE</span>
      </div>
      <div class="status">
        <span id="stage-label">十扇夜门</span>
        <div class="row">
          <div class="fill" id="rune-wrap" title="门纹">
            <em>纹</em>
            <div class="fill-track" aria-hidden="true"><i id="rune-bar"></i></div>
            <b id="rune-num">—</b>
          </div>
          <div class="fill time" id="time-wrap" title="时限">
            <em>时</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="夜门庭院"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GATE</p>
          <h1 id="ov-title">夜门</h1>
          <p class="lead" id="ov-lead">门楣先把主题色唱一遍。<br />到庭里按同样次序踩灯，纹对上，夜门才开。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 点格子 · M 静音</p>
          <button type="button" id="ov-btn">入夜</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">门上亮什么色，就去踩什么灯</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
