<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#14060c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星吞 · SINI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314060c'/%3E%3Cpath d='M16 4 L20 8 L24 7 L23 12 L28 16 L23 18 L24 24 L18 22 L16 28 L14 22 L8 24 L9 18 L4 16 L9 12 L8 7 L12 8 Z' fill='none' stroke='%23ff3d6e' stroke-width='1.2'/%3E%3Ccircle cx='12.5' cy='14' r='1.6' fill='%23ffe36b'/%3E%3Ccircle cx='19.5' cy='14' r='1.6' fill='%23ffe36b'/%3E%3Cpath d='M12 20 L16 18 L20 20' fill='none' stroke='%23ff8aa0' stroke-width='1'/%3E%3Cpolygon points='16,26 18.4,30 13.6,30' fill='none' stroke='%2300f0ff' stroke-width='1.2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星吞</b>
        <span>SINI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">星吞</span>
          <span id="tag-label">SINI</span>
          <span id="bomb-label">弹 0</span>
          <span id="sini-label">脸 0/6</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星吞游戏区，惯性飞船凿矿取晶，向拼装中的星吞发射星弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-ccw" aria-label="左转">↺</button>
          <button type="button" class="pad thrust" id="pad-thrust" aria-label="推进">▲</button>
          <button type="button" class="pad" id="pad-cw" aria-label="右转">↻</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad bomb" id="pad-bomb" aria-label="星弹">弹</button>
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">火</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SINI</p>
          <h1 id="ov-title">星吞</h1>
          <p class="lead" id="ov-lead">凿矿取晶，炼成星弹。工人在拼那张脸。拼完它会追着吞你。</p>
          <p class="ops" id="ov-ops">← → / A D 转向 · W / ↑ 推进 · 空格开火 · C 星弹 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-camp">采矿</button>
            <button type="button" id="btn-frenzy">狂暴</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 推进 · 空格开火 · C 星弹 · 雷达盯那张脸</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
