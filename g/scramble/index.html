<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#03140a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>攀升 · SCRM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303140a'/%3E%3Cpath d='M0 7c6 3 10-2 16 1 5 2 9-1 16 2v4c-6-2-11 2-16-1-6-3-10 1-16-2z' fill='%230a2818'/%3E%3Cpath d='M0 7c6 3 10-2 16 1 5 2 9-1 16 2' fill='none' stroke='%232eff88' stroke-width='1.1'/%3E%3Cpath d='M0 24c7-3 11 2 17-1 5-2 8 1 15-2v11H0z' fill='%230a2818'/%3E%3Cpath d='M0 24c7-3 11 2 17-1 5-2 8 1 15-2' fill='none' stroke='%232eff88' stroke-width='1.1'/%3E%3Cpath d='M6 16l11-3.2v6.4z' fill='%232eff88'/%3E%3Crect x='13' y='14' width='7' height='4' rx='.6' fill='%2300f0ff'/%3E%3Crect x='21' y='22' width='5' height='6' fill='%23ffe36b'/%3E%3Cpath d='M24 22l1.4-4 1.4 4z' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>攀升</b>
        <span>SCRM</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">攀升</span>
          <span id="sec-label">荒岭</span>
          <div class="fill" id="fuel-wrap" title="燃油">
            <em>油</em>
            <div class="fill-track" aria-hidden="true"><i id="fuel-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="攀升游戏区，横穿洞穴，空格射击，Shift 投弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-shot" aria-label="射击">射</button>
        <button type="button" id="btn-bomb" aria-label="投弹">炸</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SCRM</p>
          <h1 id="ov-title">攀升</h1>
          <p class="lead" id="ov-lead">横穿洞穴，开火打前，投弹砸地，打油桶续航。撞壁、中弹、油尽都扣命。六段之后打核。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 飞 · 空格射击 · Shift / Z 投弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-climb">攀升</button>
            <button type="button" id="btn-dense">洞核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格射击 · Shift / Z 投弹 · 打油桶续航 · 撞壁即坠</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
