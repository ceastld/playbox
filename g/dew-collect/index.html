<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>采露 · DEW</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cellipse cx='16' cy='18' rx='11.5' ry='9.2' fill='%230a1420' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Cpath d='M16 27v3' stroke='%23ff3db8' stroke-width='1.3' stroke-linecap='round'/%3E%3Ccircle cx='12.2' cy='17' r='3.1' fill='%2300f0ff'/%3E%3Ccircle cx='18.6' cy='19.2' r='4.2' fill='%23ff3db8'/%3E%3Ccircle cx='11.4' cy='16.1' r='0.9' fill='%23fff'/%3E%3Ccircle cx='17.4' cy='18' r='1.1' fill='%23fff' opacity='.85'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>采露</b>
        <span>DEW</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="最大露珠">
          <em>合</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0%</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 叶</span>
          <span id="left-label">珠 —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="采露滚珠"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DEW</p>
          <h1 id="ov-title">采露</h1>
          <p class="lead" id="ov-lead">倾斜叶片，把发亮的低处挪到露珠中间。<br />碰上就会合成一颗。别滚出叶面。</p>
          <p class="ops" id="ov-ops">WASD / 方向键倾斜 · 按住拖到低处 · M 静音</p>
          <button type="button" id="ov-btn">开滚</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">把低处挪到珠中间 · 碰上就合成</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
