<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>寻隙 · SPOT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='10' cy='16' r='8' fill='none' stroke='%23ff3db8' stroke-width='1.6'/%3E%3Ccircle cx='22' cy='16' r='8' fill='none' stroke='%2300f0ff' stroke-width='1.6'/%3E%3Ccircle cx='10' cy='13' r='1.4' fill='%2300f0ff'/%3E%3Ccircle cx='22' cy='13' r='1.4' fill='%2300f0ff'/%3E%3Ccircle cx='13' cy='18' r='1.1' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="view" aria-label="两幅星图，找出那一处不同"></canvas>
  <div class="scan" aria-hidden="true"></div>

  <div id="hud" class="hud hidden">
    <header class="hud-top">
      <div class="brand">
        <strong>寻隙</strong>
        <span>SPOT</span>
      </div>
      <div class="readouts">
        <div class="read">
          <em>星图</em>
          <b id="round">1/6</b>
        </div>
        <div class="read">
          <em>命</em>
          <span class="pips" id="pips" aria-label="剩余命"><i></i><i></i><i></i></span>
        </div>
        <div class="read">
          <em>时</em>
          <b id="time">18.0</b>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mark" title="空格">标记</button>
        <button type="button" id="btn-mute" title="静音（M）">声开</button>
        <button type="button" id="btn-retry" title="重开（R）">重开</button>
      </div>
    </header>
    <p id="hint" class="hint">左右对照 · 点出那一处不同</p>
  </div>

  <div id="panel" class="panel" role="dialog" aria-labelledby="panel-title">
    <div class="card" id="card">
      <p class="kicker" id="panel-kicker">SPOT</p>
      <h1 id="panel-title">寻隙</h1>
      <p class="lead" id="panel-lead">两幅星图有一处不同，快指出来。</p>
      <p class="meta" id="panel-meta">六幅星图。准星左右同步，对照后点在那一处隙上。标错三次或时尽即负。</p>
      <button type="button" id="btn-main">开寻</button>
      <p class="foot" id="panel-foot">WASD / 方向键移准星 · 空格或点按标记 · 拖动对照 · M 静音</p>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
