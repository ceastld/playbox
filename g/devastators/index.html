<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#180806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>毁灭 · DVST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23180806'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231c0a06' stroke='%23ff6414' stroke-width='1.4'/%3E%3Cpath d='M6 4 L16 2 L26 4 L24 28 L8 28 Z' fill='%23241810' opacity='.9'/%3E%3Cpath d='M12 28 L16 6 L20 28' fill='%233a2214'/%3E%3Crect x='10' y='8' width='3' height='3' fill='%23ff3db8'/%3E%3Crect x='19' y='10' width='3' height='3' fill='%2300e8ff'/%3E%3Ccircle cx='16' cy='22' r='3.2' fill='%23ffe36b'/%3E%3Crect x='14.2' y='24.2' width='3.6' height='5' rx='.4' fill='%23ff6414'/%3E%3Crect x='15.2' y='16.6' width='1.6' height='6' fill='%2300e8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>毁灭</b>
        <span>DVST</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">夜街</span>
          <span id="tag-label">毁灭</span>
          <span id="gun-label" class="gun">机枪</span>
          <span id="nade-label" class="nade">雷 5</span>
          <span id="rock-label" class="rock">炮 1</span>
          <div class="fill" id="boss-wrap" hidden title="关底">
            <em id="boss-name">夜甲</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-raid" aria-pressed="true">毁灭</button>
          <button type="button" id="mode-dense" aria-pressed="false">城核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="毁灭，从背后冲进城核，空格射击，Shift 手雷，蹲进掩体，撞甲丢命"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-nade" aria-label="手雷">雷</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DVST</p>
          <h1 id="ov-title">毁灭</h1>
          <p class="lead" id="ov-lead">从背后冲进城核。按住上加速推进，下蹲进掩体。机枪朝街心打，手雷越车，锁定甲车开炮。撞甲丢命。短关之后是关底。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 空格射击 · Shift / Z 手雷 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">毁灭</button>
            <button type="button" id="btn-dense">城核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">按住上推进 · 蹲进掩体 · 锁定开炮</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
