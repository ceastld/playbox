<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>凿冰 · CARVE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='6' y='8' width='20' height='16' rx='2' fill='%230a1830' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Cpath d='M10 12l4 8 3-5 3 7' fill='none' stroke='%23ff3db8' stroke-width='1.2'/%3E%3Ccircle cx='22' cy='16' r='2.4' fill='%2300f0ff'/%3E%3Cpath d='M7 22l4-10 2 4' fill='none' stroke='%23ffe36b' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>凿冰</b>
        <span>CARVE</span>
      </div>
      <div class="status">
        <span id="stage-label">十关</span>
        <div class="row">
          <span id="time-label">时 —</span>
          <span id="stress-label">裂 —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-carve" title="空格" aria-label="凿冰">凿</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="凿冰"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CARVE</p>
          <h1 id="ov-title">凿冰</h1>
          <p class="lead" id="ov-lead">在冰块裂开前凿出通路。<br />连通右侧冰种。凿得越多、越慢，冰裂得越快。</p>
          <p class="ops" id="ov-ops">点按 / 拖凿冰块 · 方向键移动 · 空格凿 · M 静音</p>
          <button type="button" id="ov-btn">开凿</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点冰块凿开 · 连通冰种 · 粉纹裂隙别凿</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
