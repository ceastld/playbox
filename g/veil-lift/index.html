<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>揭纱 · VEIL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cellipse cx='16' cy='18' rx='11' ry='9' fill='%23ff3db8' opacity='.35'/%3E%3Cellipse cx='14' cy='16' rx='9' ry='8' fill='%2300f0ff' opacity='.32'/%3E%3Cellipse cx='18' cy='15' rx='8' ry='7' fill='%23ffe36b' opacity='.28'/%3E%3Crect x='14.2' y='8' width='3.6' height='7' rx='1' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='8.4' r='2.1' fill='none' stroke='%2300f0ff' stroke-width='1.2'/%3E%3Ccircle cx='23' cy='11' r='2.2' fill='none' stroke='%23ff3db8' stroke-width='1.4'/%3E%3Cpath d='M23 13.2v4' stroke='%23ff3db8' stroke-width='1.1' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>揭纱</b>
        <span>VEIL</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="纱">
          <em>纱</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">—</b>
        </div>
        <div class="row">
          <span id="stage-label">十层</span>
          <span id="feel-label">按序揭</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-lift" title="空格" aria-label="揭纱">揭</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="按顺序揭开纱层"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">VEIL</p>
          <h1 id="ov-title">揭纱</h1>
          <p class="lead" id="ov-lead">灯被层层纱盖住。抓住穗子，按叠压顺序揭开。<br />压在底下的硬揭，纱会撕。</p>
          <p class="ops" id="ov-ops">拖穗子顺着纹路揭 · ←→ 选纱 · 空格揭 · M 静音</p>
          <button type="button" id="ov-btn">开揭</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">先揭最上面那层 · 交叉处完整的边在上 · 撕了就输</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
