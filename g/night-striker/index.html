<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0614" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>夜袭 · NSTR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0614'/%3E%3Cpath d='M4 22 L16 10 L28 22 V28 H4Z' fill='%23140828'/%3E%3Cpath d='M8 22 L16 13 L24 22 V26 H8Z' fill='%2300f0ff' opacity='.35'/%3E%3Cpath d='M12 24 L16 16 L20 24Z' fill='%23c46aff'/%3E%3Crect x='14.2' y='18' width='3.6' height='6' rx='.5' fill='%23e8c8ff'/%3E%3Cpath d='M10 26h12l-2 3H12z' fill='%23ff4ad2' opacity='.7'/%3E%3Ccircle cx='11' cy='20' r='1.3' fill='%23ffe36b'/%3E%3Ccircle cx='21' cy='20' r='1.3' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>夜袭</b>
        <span>NSTR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">夜巷</span>
          <span id="tag-label">夜袭</span>
          <div class="fill" id="prog-wrap" title="关卡进度">
            <em>程</em>
            <div class="fill-track" aria-hidden="true"><i id="prog-bar"></i></div>
          </div>
          <span id="wpn-label" class="wpn">双管</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="夜袭，冲进画面，开火扫车灯，撞了扣命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">NSTR</p>
          <h1 id="ov-title">夜袭</h1>
          <p class="lead" id="ov-lead">冲进夜巷。开火扫车灯，撞了扣命。短关之后是头目。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-plain">夜袭</button>
            <button type="button" id="btn-dense">夜核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再冲</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">←↑↓→ / WASD 移动 · 空格开火 · 飞高越过矮障 · 撞了扣命 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
