<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041614" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>雷突 · TF02</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041614'/%3E%3Cpath d='M16 4l6 10-6 14-6-14z' fill='%232ef0c4'/%3E%3Crect x='13' y='12' width='6' height='8' rx='.7' fill='%23e4fff8'/%3E%3Ccircle cx='8' cy='22' r='2.2' fill='%23ffe36b'/%3E%3Ccircle cx='24' cy='22' r='2.2' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>雷突</b>
        <span>TF02</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">星云</span>
          <span id="tag-label">雷突</span>
          <span id="view-label" class="view over">俯冲</span>
          <span id="wep-label" class="wep w0">双射</span>
          <span id="raid-label" class="raid">核 4</span>
          <span id="bomb-label" class="bombs">崩 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-wep" title="Q / E" aria-label="切武器">切</button>
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="崩弹">崩</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="雷突游戏区，俯冲加横贯，空格射击，Q E 切武器，Shift 崩弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-wep" aria-label="切武器">切</button>
        <button type="button" id="btn-pad-bomb" aria-label="崩弹">崩</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TF02</p>
          <h1 id="ov-title">雷突</h1>
          <p class="lead" id="ov-lead">横空混飞。星云俯冲打核，裂谷横贯，核城再俯冲打雷核。双射、回射、波刃、新星。崩弹清圈。撞机、中弹、擦地都掉命。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Q / E 切武器 · Shift / Z 崩弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-force">雷突</button>
            <button type="button" id="btn-core">雷核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · Q/E 切双射、回射、波刃、新星 · Shift 崩弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
