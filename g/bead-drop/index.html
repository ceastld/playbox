<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>落珠 · BEADS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M3 18 L29 14' stroke='%2300f0ff' stroke-width='3.2' stroke-linecap='round'/%3E%3Cpath d='M3 20.2 L29 16.2' stroke='%23ff3db8' stroke-width='1.2' stroke-linecap='round' opacity='.7'/%3E%3Crect x='17.2' y='13.2' width='5.4' height='3.4' transform='rotate(-8 20 15)' fill='%2305030c'/%3E%3Ccircle cx='11' cy='14.2' r='3.1' fill='%23ffe36b'/%3E%3Ccircle cx='10.2' cy='13.3' r='1' fill='%23fff' opacity='.85'/%3E%3Cellipse cx='16' cy='26' rx='7' ry='2.2' fill='none' stroke='%23ffe36b' stroke-width='1.3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>落珠</b>
        <span>BEADS</span>
      </div>
      <div class="status">
        <div class="fill" id="tilt-wrap" title="倾角">
          <em>倾</em>
          <div class="fill-track" aria-hidden="true">
            <i id="tilt-bar"></i>
            <s id="tilt-mark"></s>
          </div>
          <b id="tilt-num">0°</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 板</span>
          <span id="bead-label">0/1</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="落珠倾斜木板"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BEADS</p>
          <h1 id="ov-title">落珠</h1>
          <p class="lead" id="ov-lead">倾斜木板，让珠子滚进金洞。<br />太快会跳过，掉出台面就碎。</p>
          <p class="ops" id="ov-ops">← → / A D 倾斜 · 拖动画布左右倾 · M 静音</p>
          <button type="button" id="ov-btn">开倾</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">倾斜木板 · 珠子进金洞</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
