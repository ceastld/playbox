<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#031614" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>沙罗 · SALA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23031614'/%3E%3Cpath d='M0 5c8 4 10-2 18 2 6 3 8-1 14 3v4c-6-3-9 1-14-2-7-3-10 2-18-2z' fill='%237a2848'/%3E%3Cpath d='M0 23c8-3 11 2 18-1 6-3 9 1 14-2v4c-6 2-9-2-14 1-7 3-10-1-18 2z' fill='%237a2848'/%3E%3Cpath d='M0 8c8 3 10-1 18 2 6 2 8 0 14 2' fill='none' stroke='%2300f5d4' stroke-width='1'/%3E%3Cpath d='M5 16l9-3.1V19z' fill='%2300f5d4'/%3E%3Crect x='11' y='14.2' width='7' height='3.6' rx='.7' fill='%23e6fff8'/%3E%3Ccircle cx='22' cy='16' r='2.6' fill='%23ffe36b'/%3E%3Ccircle cx='22' cy='16' r='1' fill='%23ff3d88'/%3E%3Ccircle cx='27' cy='16' r='1.8' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>沙罗</b>
        <span>SALA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 腔</span>
          <span id="tag-label">血腔</span>
          <span id="wpn-label" class="wpn pulse">脉</span>
          <span id="mis-label" class="mis" hidden>导</span>
          <span id="orb-label" class="orb" hidden>球</span>
          <div class="fill" id="hp-wrap" title="巨蛇" hidden>
            <em>蛇</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="沙罗游戏区，横向穿行活体洞窟，空格射击，撞壁掉命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SALA</p>
          <h1 id="ov-title">沙罗</h1>
          <p class="lead" id="ov-lead">横向穿行活体洞窟。吃器官立刻武装。光球抄射。撞壁、撞体、中弹都掉命。最后打巨蛇。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WSD 移动 · 空格射击 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">血腔</button>
            <button type="button" id="btn-cell">细胞</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再穿</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">吃器官立刻武装 · 光球抄射 · A 自动 · 撞壁掉命 · 最后打巨蛇</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
