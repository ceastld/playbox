<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>炸巷 · BOMB</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%2312080a' stroke='%23ff7a1c' stroke-width='1.3'/%3E%3Crect x='6' y='6' width='5' height='5' rx='.8' fill='%23201828'/%3E%3Crect x='21' y='6' width='5' height='5' rx='.8' fill='%23201828'/%3E%3Crect x='6' y='21' width='5' height='5' rx='.8' fill='%23201828'/%3E%3Crect x='13.5' y='13.5' width='5' height='5' rx='.8' fill='%23c46a22'/%3E%3Ccircle cx='11' cy='20' r='3.1' fill='%2300f0ff'/%3E%3Ccircle cx='22' cy='16' r='3.4' fill='%23141018' stroke='%23ff7a1c' stroke-width='1.1'/%3E%3Cpath d='M22 12.2v2.2' stroke='%23ffe36b' stroke-width='1.1' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='11.4' r='.9' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>炸巷</b>
        <span>BOMB</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连环</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">闯关</span>
          <span id="tag-label">火 1 · 弹 1</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-camp" aria-pressed="true">闯关</button>
          <button type="button" id="mode-end" aria-pressed="false">无尽</button>
        </div>
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="炸巷迷宫，放炸弹炸软墙，躲开火和步行怪"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-bomb" aria-label="放弹">炸</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BOMB</p>
          <h1 id="ov-title">炸巷</h1>
          <p class="lead" id="ov-lead">放炸弹，炸软墙，躲开自己的火和巷里的怪。<br />炸弹互炸会连环，越炸越爽。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 空格或点击放弹 · 拖动也能走 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-campaign">闯关</button>
            <button type="button" id="btn-endless">无尽</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向键走 · 空格或点击放弹 · A 自动 · 清怪后门开 · 硬墙炸不穿</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
