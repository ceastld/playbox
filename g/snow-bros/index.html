<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>雪兄 · SNOW</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='26' width='26' height='4' rx='1' fill='%231eb8ff'/%3E%3Crect x='5' y='16' width='10' height='3' rx='1' fill='%231eb8ff'/%3E%3Crect x='17' y='10' width='10' height='3' rx='1' fill='%231eb8ff'/%3E%3Ccircle cx='11' cy='21' r='4.4' fill='%23eaf6ff'/%3E%3Ccircle cx='11' cy='17.4' r='3.1' fill='%23eaf6ff'/%3E%3Ccircle cx='12.2' cy='16.6' r='.7' fill='%2305030c'/%3E%3Crect x='9.2' y='19.4' width='4.2' height='1.1' rx='.5' fill='%23ff3db8'/%3E%3Ccircle cx='22' cy='18' r='5.4' fill='%23e8f4ff'/%3E%3Ccircle cx='20.6' cy='16.8' r='.8' fill='%2305030c'/%3E%3Ccircle cx='23.2' cy='16.8' r='.8' fill='%2305030c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>雪兄</b>
        <span>SNOW</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>房</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连碾</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">滚雪</span>
          <span id="tag-label">SNOW</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="雪兄，扔雪把怪裹成球再踢出去碾碎"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-throw" aria-label="扔雪">抛</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SNOW</p>
          <h1 id="ov-title">雪兄</h1>
          <p class="lead" id="ov-lead">跳上平台扔雪，把怪一层层裹成雪球，再踢出去碾碎一路。碰到没裹住的怪会丢命。</p>
          <p class="ops" id="ov-ops">← → / A D 走 · 上 / W 跳 · 空格扔雪 · 触屏左 跳 抛 右 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rooms">滚雪</button>
            <button type="button" id="btn-avalanche">雪崩</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">扔雪裹怪 · 踢雪球碾过去 · 可踩在雪球上 · 碰到没裹住的怪丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
