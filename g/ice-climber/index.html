<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>冰锤 · ICE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='22' width='8' height='5' rx='1' fill='%231ec8ff'/%3E%3Crect x='12' y='22' width='8' height='5' rx='1' fill='%237af6ff'/%3E%3Crect x='20' y='22' width='8' height='5' rx='1' fill='%231ec8ff'/%3E%3Crect x='8' y='14' width='8' height='5' rx='1' fill='%231ec8ff'/%3E%3Crect x='14' y='6' width='3' height='10' fill='%23ffe36b'/%3E%3Crect x='11' y='4' width='9' height='4' rx='1' fill='%2300f0ff'/%3E%3Ccircle cx='26' cy='8' r='2.4' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>冰锤</b>
        <span>ICE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>山</em>
            <b id="mtn">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连锤</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">登山</span>
          <div class="fill bear" id="bear-wrap" title="北极熊">
            <em>熊</em>
            <div class="fill-track" aria-hidden="true"><i id="bear-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="冰锤，跳起砸头顶冰砖往上爬"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ICE</p>
          <h1 id="ov-title">冰锤</h1>
          <p class="lead" id="ov-lead">跳起来用锤砸头顶的冰，开路往上爬。托皮会偷砖，顶上神鹰带奖励。掉下去或没命就结束。</p>
          <p class="ops" id="ov-ops">方向键或 WASD 走 · 空格 / 上 跳进冰里砸 · 触屏左跳右 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-climb">登山</button>
            <button type="button" id="btn-thin">薄冰</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">跳进头顶的冰砖把它砸开 · 从洞钻上去 · 别让托皮把脚底下的砖偷走</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
