<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>滴满 · DRIP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 7h20' stroke='%2300f0ff' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M16 7v5' stroke='%2300f0ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='14.5' r='2.1' fill='%23ff3db8'/%3E%3Cpath d='M10 20c0-3 2.4-5.4 6-8 3.6 2.6 6 5 6 8a6 6 0 1 1-12 0z' fill='none' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Cpath d='M11.2 22.2h9.6' stroke='%23ff3db8' stroke-width='1.3' stroke-linecap='round'/%3E%3Cpath d='M12 24.6c1.2 1.4 2.4 2 4 2s2.8-.6 4-2' fill='%2300f0ff' opacity='.85'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>滴满</b>
        <span>DRIP</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="水量">
          <em>水</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
            <s id="fill-mark"></s>
          </div>
          <b id="fill-num">0/3</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 管</span>
          <span id="left-label">余滴 5</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="滴满接水"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DRIP</p>
          <h1 id="ov-title">滴满</h1>
          <p class="lead" id="ov-lead">按节拍把水接到刻度。<br />满到线就躲开，溢了就输。</p>
          <p class="ops" id="ov-ops">← → / A D 挪杯 · 拖动杯子 · M 静音</p>
          <button type="button" id="ov-btn">开接</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">对准水滴 · 满线躲开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
