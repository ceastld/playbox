<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>火鸟 · PHOX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M4 10l6 2 6-6 6 6 6-2-4 8H8z' fill='%23ff5a1f'/%3E%3Cpath d='M10 18l6 4 6-4-2 6H12z' fill='%23ffe36b'/%3E%3Cpath d='M13 26h6v2h-6zm-2 2h10v2H11z' fill='%23ffb14a'/%3E%3Crect x='15' y='23' width='2' height='4' fill='%23fff3ea'/%3E%3Cpath d='M8 24c4-6 12-6 16 0' fill='none' stroke='%2300f0ff' stroke-width='1.2' opacity='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>火鸟</b>
        <span>PHOX</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">火海</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-shield" title="Shift" aria-label="护盾">盾</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="火鸟游戏区，底部飞船左右移动开火，按住护盾挡弹，火鸟俯冲，母舰卵核为弱点"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PHOX</p>
          <h1 id="ov-title">火鸟</h1>
          <p class="lead" id="ov-lead">底部开火，按住 Shift 举盾挡弹。火鸟编队俯冲，大鸟要打掉翅膀。第五关母舰里有会动的卵核。</p>
          <p class="ops" id="ov-ops">← → / WASD 移动 · 空格开火 · Shift 护盾 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-camp">火海</button>
            <button type="button" id="btn-end">无尽</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 移动 · 空格开火 · Shift 护盾挡弹 · 打母舰卵核</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
