<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>虹岛 · RAIN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M4 22 Q10 8 16 8 Q22 8 28 22' fill='none' stroke='%23ff4d6d' stroke-width='1.4'/%3E%3Cpath d='M6 22 Q11 11 16 11 Q21 11 26 22' fill='none' stroke='%23ffe36b' stroke-width='1.3'/%3E%3Cpath d='M8 22 Q12 14 16 14 Q20 14 24 22' fill='none' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Crect x='13.4' y='17' width='5.2' height='7' rx='.7' fill='%2300f0ff'/%3E%3Crect x='12.6' y='16' width='6.8' height='1.8' rx='.4' fill='%23ffe36b'/%3E%3Cpath d='M2 26 Q16 22 30 27 L30 32 L2 32 Z' fill='%231ec8ff' opacity='.85'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>虹岛</b>
        <span>RAIN</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">岛升</span>
          <span id="isle-label">虫岛</span>
          <div class="fill tide" id="tide-wrap" title="潮水">
            <em>潮</em>
            <div class="fill-track" aria-hidden="true"><i id="tide-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="虹岛，射出彩虹当台阶往上爬"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-fire" aria-label="射虹">虹</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RAIN</p>
          <h1 id="ov-title">虹岛</h1>
          <p class="lead" id="ov-lead">射出彩虹当台阶，踩上去再跳，虹会砸下去压怪。摘果子，潮水从底下涨，顶上有岛主。</p>
          <p class="ops" id="ov-ops">方向键或 WASD 走跳 · 空格射虹 · 触屏左 跳 虹 右 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-isle">岛升</button>
            <button type="button" id="btn-tide">涨潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格射虹当台阶 · 踩虹再跳会砸下去 · 潮水会追</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
