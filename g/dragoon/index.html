<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#160404" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>龙骑 · DRGN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23160404'/%3E%3Cpath d='M16 6c2.6 2.8 3.8 7 3.2 11.2-.4 3-1.8 5.8-3.6 8.2-1.8-2.4-3.2-5.2-3.6-8.2C12.2 13 13.4 8.8 16 6z' fill='%23ff3a1a'/%3E%3Cpath d='M16 9c1.5 2 2.2 4.8 1.8 7.4-.3 2-1.1 4-1.8 5.8-.7-1.8-1.5-3.8-1.8-5.8C13.8 13.8 14.5 11 16 9z' fill='%23ffe36b'/%3E%3Cpath d='M12 14l-4-1 3 3M20 14l4-1-3 3' fill='%23ff6a32'/%3E%3Crect x='14.6' y='12' width='2.8' height='4.4' rx='.8' fill='%23fff0e8'/%3E%3Cpath d='M16 8l1.2-4 1.6 3.2' fill='%23ffe36b'/%3E%3Ccircle cx='14.8' cy='11.2' r='.8' fill='%23160404'/%3E%3Ccircle cx='17.2' cy='11.2' r='.8' fill='%23160404'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>龙骑</b>
        <span>DRGN</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">龙骑</span>
          <span id="wpn-label" class="wpn">一道</span>
          <span id="bomb-label" class="bombs">斩 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="龙骑斩">斩</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="龙骑游戏区，八向飞龙，空格喷月牙刃，Shift 龙骑斩，撞体扣命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="龙骑斩">斩</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DRGN</p>
          <h1 id="ov-title">龙骑</h1>
          <p class="lead" id="ov-lead">骑龙北上。喷月牙刃打空，龙骑斩清场。吃刃加道，撞体扣命。三关之后是岩核王。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格喷刃 · Shift / Z 龙骑斩 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-ride">龙骑</button>
            <button type="button" id="btn-sea">炎海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格喷刃 · Shift 龙骑斩 · 吃刃加道</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
