<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a061c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>戈夫 · GORF</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a061c'/%3E%3Ccircle cx='16' cy='11' r='5' fill='none' stroke='%237c5cff' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='11' r='2' fill='%23ffe36b'/%3E%3Cpath d='M8 8h2v2H8zm14 0h2v2h-2zM10 10h12v2H10z' fill='%23ff3db8'/%3E%3Cpath d='M13 24h6v2h-6zm-2 2h10v2H11z' fill='%2300f0ff'/%3E%3Crect x='15' y='21' width='2' height='4' fill='%23f0ecff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>戈夫</b>
        <span>GORF</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">远征</span>
          <span id="tag-label">星战</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="戈夫游戏区，底部飞船左右移动开火，五关远征，打穿旗舰核心通关"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GORF</p>
          <h1 id="ov-title">戈夫</h1>
          <p class="lead" id="ov-lead">五关远征：星战、激光、俯冲、星门、旗舰。打穿旗舰发光核心通关。中弹扣命。</p>
          <p class="ops" id="ov-ops">← → / WASD 移动 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-camp">远征</button>
            <button type="button" id="btn-end">旗舰</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 移动 · 空格开火 · 五关循环 · 打核通关</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
