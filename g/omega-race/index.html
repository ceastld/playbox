<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#021410" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>环赛 · OMEGA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23021410'/%3E%3Crect x='3' y='6' width='26' height='20' rx='1.4' fill='none' stroke='%2300f5d4' stroke-width='1.3'/%3E%3Crect x='11.2' y='12.2' width='9.6' height='7.6' rx='.6' fill='%23041c18' stroke='%235cffd8' stroke-width='1.1'/%3E%3Cpolygon points='7,21 11,18.2 7.4,24' fill='none' stroke='%23e8fff8' stroke-width='1.15'/%3E%3Cpath d='M16 10.4 L15.2 8 L16.8 8 Z' fill='%2300f5d4'/%3E%3Ccircle cx='22.4' cy='10.8' r='1.05' fill='%23ffe36b'/%3E%3Ccircle cx='24.6' cy='19.4' r='.85' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>环赛</b>
        <span>OMEGA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">环赛</span>
          <span id="tag-label">OMEGA</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="环赛游戏区，封闭矩形环道，船和弹撞墙反弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-ccw" aria-label="左转">↺</button>
          <button type="button" class="pad thrust" id="pad-thrust" aria-label="推进">▲</button>
          <button type="button" class="pad" id="pad-cw" aria-label="右转">↻</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">火</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">OMEGA</p>
          <h1 id="ov-title">环赛</h1>
          <p class="lead" id="ov-lead">封闭环道，船和弹都会撞墙弹回。打掉机兵。别撞太狠，也别吃弹。下一波更快。</p>
          <p class="ops" id="ov-ops">A D / ← → 转向 · W / ↑ 推进 · 空格开火</p>
          <div class="ov-actions">
            <button type="button" id="btn-track">环道</button>
            <button type="button" id="btn-rain">弹雨</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 推进 · 空格开火 · 撞墙会弹，撞太狠会炸</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
