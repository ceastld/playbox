<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>地狱火 · HELL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M2 26c4-6 8-4 14 0 4-4 8-8 14-2v6H2z' fill='%23601808'/%3E%3Cpath d='M6 16l16-4v10z' fill='%23ff4a14'/%3E%3Crect x='16' y='13.4' width='8' height='5.2' rx='.6' fill='%23fff0e0'/%3E%3Ccircle cx='10' cy='16' r='2.4' fill='%232ee8ff'/%3E%3Ccircle cx='22' cy='10' r='1.6' fill='%23ffe36b'/%3E%3Ccircle cx='22' cy='22' r='1.6' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>地狱火</b>
        <span>HELL</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">熔岸</span>
          <span id="tag-label">地狱火</span>
          <span id="dir-label" class="dir-badge front">前</span>
          <span id="opt-label" class="opt-badge off">无子</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-opt" title="Shift / Z" aria-label="切向">向</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="地狱火游戏区，横向卷轴，空格射击，Shift 切换四向火"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="切向">向</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">HELL</p>
          <h1 id="ov-title">地狱火</h1>
          <p class="lead" id="ov-lead">左飞右打。空格连射，Shift 切前/后/竖/斜四向火。捡子机一起打。撞机掉命。熔岸烧完出关底王。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 切向 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-hell">地狱火</button>
            <button type="button" id="btn-sea">核海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再烧</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · Shift 切前/后/竖/斜 · 捡子机</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
