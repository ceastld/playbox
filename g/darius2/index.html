<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#061018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>大流2 · DAR2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23061018'/%3E%3Cpath d='M2 8h9M21 8h9M2 24h9M21 24h9' stroke='%233ec8ff' stroke-width='1.1' opacity='.7'/%3E%3Cellipse cx='23' cy='16' rx='7' ry='4.2' fill='%231a5878'/%3E%3Ccircle cx='20' cy='15.2' r='1.2' fill='%23ffe36b'/%3E%3Cpath d='M4 16l8-3V19z' fill='%23e8fbff'/%3E%3Cpath d='M10 14.2h7v3.6h-7z' fill='%233ec8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>大流2</b>
        <span>DAR2</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">日冕</span>
          <span id="tag-label">大流2</span>
          <span id="wpn-label" class="wpn">火</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="大流2游戏区，三屏横卷，空格射击，Shift 爆弹，撞机即失一命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DAR2</p>
          <h1 id="ov-title">大流2</h1>
          <p class="lead" id="ov-lead">三屏横卷。银鹰七向齐射，打巨鱼舰发光弱点。短关之后出鱼舰。撞机或中弹即失一命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格开火 · Shift / Z 爆弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">大流2</button>
            <button type="button" id="btn-core">流核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格开火 · Shift 爆弹 · 打鱼舰弱点 · 满火七向含后射</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
