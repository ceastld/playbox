<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>影钟 · SHADOW</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='16' cy='18' r='10' fill='none' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Cpath d='M16 18 L22.5 11.2' stroke='%238a5230' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M16 18 L10.4 26.2' stroke='%2308060f' stroke-width='3.4' stroke-linecap='round' opacity='.85'/%3E%3Ccircle cx='22.8' cy='8.6' r='2.4' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='18' r='2' fill='%23c9a36a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>影钟</b>
        <span>SHADOW</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="fit-label">影 —</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="转木棍让影子扫过刻度"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-ccw" aria-label="逆时针转棍">◀</button>
        <button type="button" id="btn-cw" aria-label="顺时针转棍">▶</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SHADOW</p>
          <h1 id="ov-title">影钟</h1>
          <p class="lead" id="ov-lead">转木棍，让影子扫过刻度。<br />灯在哪，影就在对面。青要扫，粉要躲。</p>
          <p class="ops" id="ov-ops">A/D 转棍 · 拖钟面 · M 静音</p>
          <button type="button" id="ov-btn">拨影</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">转木棍 · 影子扫过青刻</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
