<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>电梯 · LIFT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='6' y='3' width='20' height='26' rx='1.2' fill='%23120810' stroke='%23ffb020' stroke-width='1.2'/%3E%3Crect x='14' y='5' width='4.4' height='22' fill='%23080a14'/%3E%3Crect x='14.3' y='14' width='3.8' height='5.2' fill='%2300f0ff'/%3E%3Crect x='8' y='8' width='4' height='5' fill='%23ff3a4a'/%3E%3Crect x='20.4' y='18' width='4' height='5' fill='%233a4868'/%3E%3Crect x='8.6' y='22' width='3' height='5.4' fill='%23ffe36b'/%3E%3Crect x='21' y='10' width='3' height='5.4' fill='%23ff3db8'/%3E%3Ccircle cx='16.2' cy='12.2' r='1.1' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>电梯</b>
        <span>LIFT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">潜入</span>
          <span id="floor-label">—F</span>
          <div class="fill" id="doc-wrap" title="密件">
            <em>密</em>
            <div class="fill-track" aria-hidden="true"><i id="doc-bar"></i></div>
            <b id="doc-lab">0/5</b>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="电梯，侧视大楼，坐电梯射击特工，踹红门夺密件，坐上车撤离"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-up" aria-label="上 / 进门">上</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-shot" aria-label="射击">射</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">LIFT</p>
          <h1 id="ov-title">电梯</h1>
          <p class="lead" id="ov-lead">侧视大楼。坐电梯、踹红门夺密件、打特工。带上文件跑到地面座驾。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 上 进门/电梯 · 跳 · 空格射击 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-infil">潜入</button>
            <button type="button" id="btn-extract">撤离</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">踹红门夺密件 · 坐电梯下楼 · 空格开枪 · 打灯泡会熄灯 · 带文件上车</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
