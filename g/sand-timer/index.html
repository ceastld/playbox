<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>倒沙 · SAND</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M10 5h12v3l-5 7 5 7v3H10v-3l5-7-5-7z' fill='none' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Cpath d='M12.2 7.4h7.6L16 13.2z' fill='%23ffe36b'/%3E%3Cpath d='M13.2 22.6h5.6L16 18.2z' fill='%23ff3db8' opacity='.9'/%3E%3Ccircle cx='16' cy='16' r='1.4' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>倒沙</b>
        <span>SAND</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="标漏余沙">
          <em>标</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">—</b>
        </div>
        <div class="row">
          <span id="stage-label">十漏</span>
          <span id="left-label">标漏压轴</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="翻沙漏"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SAND</p>
          <h1 id="ov-title">倒沙</h1>
          <p class="lead" id="ov-lead">翻沙漏，让金圈那只最后走完。<br />沙沉两端才能翻；灰漏翻不动。</p>
          <p class="ops" id="ov-ops">1–5 翻对应漏 · ← → 选 · 空格翻 · 点按 · M 静音</p>
          <button type="button" id="ov-btn">开翻</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">金圈是标漏 · 让它最后空</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
