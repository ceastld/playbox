<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#160806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>大王 · DAIO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23160806'/%3E%3Cpath d='M6 10h20l-3 6H9z' fill='%23ff3a1c'/%3E%3Cpath d='M8 16h16l-2 8H10z' fill='%23ffd020'/%3E%3Cpath d='M16 4l3 6h-6z' fill='%23ffe8a0'/%3E%3Ccircle cx='16' cy='18' r='3' fill='%23ff3a1c'/%3E%3Cpath d='M14 26h4l2 4h-8z' fill='%23ff5a28'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>大王</b>
        <span>DAIO</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">大王</span>
          <span id="pwr-label" class="pwr">散 0</span>
          <div class="fill" id="pwr-wrap" title="王核">
            <em>核</em>
            <div class="fill-track" aria-hidden="true"><i id="pwr-bar"></i></div>
          </div>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="王爆">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="大王游戏区，纵向卷轴，空格射击蓄王核，Shift 扔王爆"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="王爆">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DAIO</p>
          <h1 id="ov-title">大王</h1>
          <p class="lead" id="ov-lead">吃核切换五武。蓄满王核放出寻敌王炮。短关之后是巨大的大王。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 王爆 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-king">大王</button>
            <button type="button" id="btn-rain">核雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射蓄王核 · Shift 王爆 · 吃核换武</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
