<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>剪影 · SILHOUETTE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 8h8v4h4v12H6z' fill='%23ff3db8'/%3E%3Cpath d='M20 10h6v4h-2v8h-4z' fill='%2300f0ff' opacity='.85'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="view" aria-label="剪影吻合"></canvas>
  <div class="scan" aria-hidden="true"></div>

  <div id="hud" class="hud hidden">
    <header class="hud-top">
      <div class="brand">
        <strong>剪影</strong>
        <span>SILHOUETTE</span>
      </div>
      <div class="readouts">
        <div class="read">
          <em>关卡</em>
          <b id="round">1/9</b>
        </div>
        <div class="read">
          <em>吻合</em>
          <b id="fit">0%</b>
        </div>
        <div class="read">
          <em>剩余</em>
          <b id="time">56.0</b>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" aria-label="静音" title="M">音</button>
        <button type="button" id="btn-lock" aria-label="锁定" title="空格">锁定</button>
        <button type="button" id="btn-retry" aria-label="重开" title="R">重开</button>
      </div>
    </header>
    <p id="hint" class="hint">拖动旋转 · 影子填进缺口</p>
  </div>

  <div id="panel" class="panel" role="dialog" aria-labelledby="panel-title">
    <div class="card" id="card">
      <p class="kicker" id="panel-kicker">SILHOUETTE</p>
      <h1 id="panel-title">剪影</h1>
      <p class="lead" id="panel-lead">旋转物块，让影子吻上远处的缺口。</p>
      <p class="meta" id="panel-meta">九道剪影。对齐后锁定，灯灭前全部锁入。</p>
      <button type="button" id="btn-main">点灯</button>
      <p class="foot" id="panel-foot">拖动 / WASD 旋转 · 空格锁定 · M 静音</p>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
