<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140c06" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>蜂狂 · DDON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140c06'/%3E%3Cpath d='M16 3l5 8.5 9.5.8-7.1 6.2 2.2 9.2L16 22.2 6.4 27.7l2.2-9.2L1.5 12.3 11 11.5z' fill='%23ff9a1a'/%3E%3Cpath d='M16 7l2.8 4.8 5.2.4-3.9 3.4 1.2 5.1L16 17.8l-5.3 2.9 1.2-5.1-3.9-3.4 5.2-.4z' fill='%23ffc84a'/%3E%3Cpath d='M16 12l8-18' stroke='%2300f0ff' stroke-width='1.6'/%3E%3Cellipse cx='10' cy='14' rx='4.2' ry='2' fill='%23fff6e8' opacity='.5'/%3E%3Cellipse cx='22' cy='14' rx='4.2' ry='2' fill='%23fff6e8' opacity='.5'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>蜂狂</b>
        <span>DDON</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">蜂狂</span>
          <span id="wpn-label" class="wpn">点</span>
          <span id="hit-label" class="hits" hidden>HIT 0</span>
          <div class="fill" id="hive-wrap" title="蜂核">
            <em>蜂</em>
            <div class="fill-track" aria-hidden="true"><i id="hive-bar"></i></div>
          </div>
          <span class="bombs" id="bombs" aria-label="蜂爆"></span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="蜂爆">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="蜂狂游戏区，纵向卷轴，空格射击，按住锁束，Shift 蜂爆"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="蜂爆">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DDON</p>
          <h1 id="ov-title">蜂狂</h1>
          <p class="lead" id="ov-lead">点射扫群，按住锁束，蜂爆清核。短关之后是大巢。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击（按住锁束）· Shift / Z 蜂爆 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-mania">蜂狂</button>
            <button type="button" id="btn-core">蜂核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点射扫群 · 按住锁束 · Shift 蜂爆</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
