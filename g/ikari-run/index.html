<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#050806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>怒火 · IKARI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050806'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%230a160c' stroke='%23ff4a1a' stroke-width='1.4'/%3E%3Cpath d='M4 6c4 3 6-1 10 2 4 2 7-2 12 1 3 2 4 0 6 1' fill='none' stroke='%233dff7a' stroke-width='1.2' opacity='.7'/%3E%3Ccircle cx='11' cy='21' r='3' fill='%23ffe36b'/%3E%3Crect x='13.2' y='19.6' width='7' height='1.6' rx='.3' fill='%23ff4a1a'/%3E%3Crect x='20' y='12' width='8' height='6' rx='1.2' fill='%233dff7a'/%3E%3Crect x='22' y='13.4' width='7' height='1.3' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>怒火</b>
        <span>IKARI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">密林</span>
          <span id="tag-label">丛林</span>
          <span id="nade-label" class="nades">弹 4</span>
          <div class="fill tank" id="tank-wrap" hidden title="装甲">
            <em>甲</em>
            <div class="fill-track" aria-hidden="true"><i id="tank-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-jungle" aria-pressed="true">丛林</button>
          <button type="button" id="mode-assault" aria-pressed="false">强攻</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="怒火丛林，八向跑动旋转瞄准开火，可跳进坦克"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-nade" aria-label="手雷">弹</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">IKARI</p>
          <h1 id="ov-title">怒火</h1>
          <p class="lead" id="ov-lead">密林里八向冲、旋转瞄准开火。<br />跳进坦克扛打，炸掉碉堡，打穿要塞。</p>
          <p class="ops" id="ov-ops">WASD / 方向键走 · 指针瞄准 · 空格开火 · G 手雷 · 上车 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-jungle">丛林</button>
            <button type="button" id="btn-assault">强攻</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">WASD 八向走 · 指针或转向瞄准 · 空格开火 · 走进坦克</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
