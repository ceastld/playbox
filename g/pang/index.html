<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#030b0e" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>穿球 · PANG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030b0e'/%3E%3Crect x='3' y='26' width='26' height='3.2' rx='1' fill='%2300e8ff'/%3E%3Ccircle cx='22' cy='11' r='6.2' fill='%23ff3db8'/%3E%3Ccircle cx='20.2' cy='9.2' r='1.8' fill='%23ffe6f4' opacity='.85'/%3E%3Ccircle cx='11' cy='16' r='3.6' fill='%23ffe36b'/%3E%3Ccircle cx='10' cy='15' r='1' fill='%23fff8d8' opacity='.8'/%3E%3Crect x='8.4' y='8' width='1.4' height='18' rx='.6' fill='%2300e8ff'/%3E%3Cpath d='M7.2 8 L9.1 4.2 L11 8 Z' fill='%23ffe36b'/%3E%3Crect x='6.2' y='22' width='5.6' height='5' rx='1' fill='%2314f0d0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>穿球</b>
        <span>PANG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em id="stage-em">房</em>
            <b id="stage-num">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连爆</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">穿球</span>
          <span id="tag-label">PANG</span>
          <div class="fill" id="time-wrap" title="时限">
            <em>时</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="穿球，左右走动向上射叉，气球碰到就裂成两只更小的"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-fire" aria-label="射叉">射</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PANG</p>
          <h1 id="ov-title">穿球</h1>
          <p class="lead" id="ov-lead">地上左右走，空格向上射叉。气球落地就弹，叉中裂成两只更小的，最小的才爆掉。身子碰到球就丢命，清完一房过关。</p>
          <p class="ops" id="ov-ops">← → / D 走 · 空格射叉 · A 自动 · 触屏左 射 右 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rooms">穿球</button>
            <button type="button" id="btn-chain">连爆</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">向上射叉裂气球 · 最小才爆 · 别让球撞到人 · 平台挡叉 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
