<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#080c03" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>仙童 · WBOY</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080c03'/%3E%3Cpath d='M2 24 Q10 18 16 22 Q24 28 30 20 L30 32 L2 32 Z' fill='%23101806'/%3E%3Cpath d='M2 24 Q10 18 16 22 Q24 28 30 20' fill='none' stroke='%23c4ff1a' stroke-width='1.3'/%3E%3Ccircle cx='12' cy='15' r='3.1' fill='%23ffe8b0'/%3E%3Cellipse cx='12' cy='12.2' rx='3.6' ry='2.2' fill='%23c4ff1a'/%3E%3Crect x='9.6' y='17.6' width='5' height='6.2' rx='.7' fill='%23ff3db8'/%3E%3Cellipse cx='12' cy='25.2' rx='6.4' ry='1.7' fill='%2300f0ff'/%3E%3Ccircle cx='7.6' cy='25.8' r='1.2' fill='%23e8ff6a'/%3E%3Ccircle cx='16.4' cy='25.8' r='1.2' fill='%23e8ff6a'/%3E%3Cpath d='M18 16l7-2-3 4z' fill='%23c4ff1a'/%3E%3Ccircle cx='23' cy='21' r='2' fill='%23ff6a3d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>仙童</b>
        <span>WBOY</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">林道</span>
          <span id="tag-label">仙童</span>
          <div class="fill" id="vit-wrap" title="体力">
            <em>力</em>
            <div class="fill-track" aria-hidden="true"><i id="vit-bar"></i></div>
          </div>
          <span id="coin-label">币 0</span>
          <span id="gear-label" class="gear hidden">石锤</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-boy" aria-pressed="true">仙童</button>
          <button type="button" id="mode-core" aria-pressed="false">仙核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="仙童，侧向滑板砸击，空格砸，上或 Z 跳，店里买装备"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-smash" aria-label="砸击">砸</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">WBOY</p>
          <h1 id="ov-title">仙童</h1>
          <p class="lead" id="ov-lead">滑板砸穿林道。空格近砸，店里买石锤远砸、护符挡一次、仙命续命。<br />体力会饿，摘果就回。撞敌、坠崖、饿倒都丢命。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 上 / Z 跳 · 空格砸 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-boy">仙童</button>
            <button type="button" id="btn-core">仙核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">滑板砸 · 空格近砸 · 店里买装备 · 水果续命 · 撞敌丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
