<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>岩旋 · ROCKS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpolygon points='7,12 13,8 18,11 16,18 9,17' fill='none' stroke='%23ff7a1f' stroke-width='1.4'/%3E%3Cpolygon points='20,16 26,14 28,20 23,24 19,21' fill='none' stroke='%23ffe36b' stroke-width='1.2'/%3E%3Cpolygon points='16,20 20,28 12,27' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Ccircle cx='16.6' cy='16.2' r='1' fill='%23e8ffff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>岩旋</b>
        <span>ROCKS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">岩旋</span>
          <span id="tag-label">ROCKS</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="P" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="岩旋游戏区，拧船喷火打岩石"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-ccw" aria-label="左转">↺</button>
          <button type="button" class="pad thrust" id="pad-thrust" aria-label="推进">▲</button>
          <button type="button" class="pad" id="pad-cw" aria-label="右转">↻</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad hyper" id="pad-hyper" aria-label="跃迁">跃</button>
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">火</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ROCKS</p>
          <h1 id="ov-title">岩旋</h1>
          <p class="lead" id="ov-lead">拧着打，碎成小块。</p>
          <p class="ops" id="ov-ops">A D / ← → 转向 · W / ↑ 推进 · 空格开火 · Shift 跃迁</p>
          <div class="ov-actions">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-storm">碎雨</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">A D 转向 · W 推进 · 空格开火 · Shift 跃迁 · 出边会绕回</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
