<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0614" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>柳巫 · WILL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0614'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23120a1c' stroke='%23c44dff' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23c44dff' stroke-width='1.2' opacity='.5'/%3E%3Cpath d='M12 8l4-5 4 5z' fill='%23c44dff'/%3E%3Ccircle cx='16' cy='12' r='3' fill='%23ffe36b'/%3E%3Crect x='12.6' y='15' width='6.8' height='7' rx='.8' fill='%23c44dff'/%3E%3Cpath d='M19.4 18h8' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Crect x='13' y='22' width='2' height='3' fill='%238a5ab8'/%3E%3Crect x='17' y='22' width='2' height='3' fill='%238a5ab8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>柳巫</b>
        <span>WILL</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score hp" id="hp-box">
            <em>生命</em>
            <b id="hp">8</b>
            <span class="hp-track" aria-hidden="true"><i id="hp-fill"></i></span>
          </div>
          <div class="score mana" id="mana-box">
            <em>法力</em>
            <b id="mana">8</b>
            <span class="mana-track" aria-hidden="true"><i id="mana-fill"></i></span>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">柳沼</span>
          <span id="tag-label">魔林</span>
          <span id="spell-label" class="spell">火花</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-wood" aria-pressed="true">魔林</button>
          <button type="button" id="mode-tide" aria-pressed="false">怪潮</button>
        </div>
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="柳巫，侧向走跳，近处挥剑，远处放魔法"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-slash" aria-label="挥剑">斩</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-mag" aria-label="魔法">法</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">WILL</p>
          <h1 id="ov-title">柳巫</h1>
          <p class="lead" id="ov-lead">近处挥剑，远处放魔法。越过断崖，生命打空丢命。<br />短关过后关底有守护者。</p>
          <p class="ops" id="ov-ops">方向键 / D 走 · ↑ / W 跳 · 空格斩 · Shift / Z 魔法 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-wood-start">魔林</button>
            <button type="button" id="btn-tide-start">怪潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳过崖 · 空格近斩 · Shift/Z 放魔法 · A 自动 · 生命打空丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
