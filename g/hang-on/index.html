<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0508" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>摩托 · HANGON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0508'/%3E%3Cpath d='M4 28 L14 16 L18 16 L28 28' fill='%231a0a10'/%3E%3Cpath d='M12 28 L15 18 L17 18 L20 28' fill='%23ff5a20' opacity='.55'/%3E%3Ccircle cx='16' cy='22' r='3.2' fill='%23141018'/%3E%3Cpath d='M13 18 L16 11 L19 18' fill='%23ff3a32'/%3E%3Ccircle cx='16' cy='10' r='2.1' fill='%23fff4ea'/%3E%3Crect x='14.2' y='19' width='3.6' height='2.2' rx='.4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>摩托</b>
        <span>HANGON</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">50.0</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>时速</em>
            <b id="spd">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">旷原</span>
          <span id="tag-label">赛道</span>
          <div class="fill clock" id="time-wrap" title="剩余时间">
            <em>限</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连超</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="摩托，后视公路，左右压弯，油门冲过终点"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">HANGON</p>
          <h1 id="ov-title">摩托</h1>
          <p class="lead" id="ov-lead">后视摩托，压弯过弯。别摔，赶检查点加时冲线。</p>
          <p class="ops" id="ov-ops">← → 压弯 · ↑ 油门 ↓ 刹车 · 点按加速 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-course">赛道</button>
            <button type="button" id="btn-rain">雨夜</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再冲</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 压弯 · ↑ 油门 · 别摔 · 检查点加时 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
