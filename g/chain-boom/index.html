<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>连环 · CHAIN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='3' width='26' height='26' rx='5' fill='%230c0614' stroke='%23b46cff' stroke-width='1.3'/%3E%3Crect x='6' y='6' width='6' height='6' rx='1.4' fill='%23ff3db8'/%3E%3Crect x='13' y='6' width='6' height='6' rx='1.4' fill='%23ff3db8'/%3E%3Crect x='20' y='6' width='6' height='6' rx='1.4' fill='%2300f0ff'/%3E%3Crect x='6' y='13' width='6' height='6' rx='1.4' fill='%23ffe36b'/%3E%3Crect x='13' y='13' width='6' height='6' rx='1.4' fill='%23b46cff'/%3E%3Crect x='20' y='20' width='6' height='6' rx='1.4' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="mode-clear">
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>连环</b>
        <span>CHAIN</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连环</em>
            <b id="combo">×1</b>
          </div>
          <div class="score time" id="time-box" hidden>
            <em>剩余</em>
            <b id="time">60</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">清盘</span>
          <span id="tag-label">CHAIN</span>
          <span id="left-label">余 80</span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-clear" aria-pressed="true" title="清光整盘">清盘</button>
          <button type="button" id="mode-timed" aria-pressed="false" title="六十秒冲分">限时</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="连环，点同色两块以上炸掉，重力下落，连环加分"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CHAIN</p>
          <h1 id="ov-title">连环</h1>
          <p class="lead" id="ov-lead">点一簇同色，炸开，往下砸。块越多分越炸，连环接着窜。</p>
          <p class="ops" id="ov-ops">点两块以上同色 · 方向键选格 · 空格炸掉 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="ov-clear">清盘</button>
            <button type="button" id="ov-timed">限时 60s</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点同色两块以上炸掉 · 越大越炸 · 连环加分</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
