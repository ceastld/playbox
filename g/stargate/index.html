<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#020e1a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星门 · SGTW</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23020e1a'/%3E%3Cellipse cx='16' cy='14' rx='6' ry='10' fill='none' stroke='%23a78bff' stroke-width='1.2'/%3E%3Cellipse cx='16' cy='14' rx='3.2' ry='6' fill='none' stroke='%2300d8ff' stroke-width='.7'/%3E%3Cpath d='M4 26 L9 21 L14 24 L18 17 L23 22 L28 16 L30 21 L30 30 L4 30Z' fill='%23071a28' stroke='%235cc8ff' stroke-width='.7'/%3E%3Cpath d='M7 15l8-1.4v2.8z' fill='%2300d8ff'/%3E%3Crect x='21' y='22' width='1.1' height='3' fill='%23ffe36b'/%3E%3Ccircle cx='21.55' cy='21.4' r='.65' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星门</b>
        <span>SGTW</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">星门</span>
          <span id="phase-label">巡空</span>
          <span id="human-label">人 10</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星门游戏区，左右环绕飞行，空格开火，Shift 翻头，钻星门跃迁救人"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="stick" id="stick" aria-label="飞行摇杆">
          <i class="knob" id="knob"></i>
        </div>
        <button type="button" class="pad rev" id="pad-rev" aria-label="翻头">翻</button>
        <button type="button" class="pad fire" id="pad-fire" aria-label="开火">火</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SGTW</p>
          <h1 id="ov-title">星门</h1>
          <p class="lead" id="ov-lead">左右环绕飞，钻进星门跃迁救人。清完一波会涌门鱼潮。撞机扣命。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格开火 · Shift / Z 翻头 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-gate">星门</button>
            <button type="button" id="btn-core">门核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再穿</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">←↑↓→ 飞 · 空格开火 · Shift 翻头 · 钻星门跃迁救人</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
