<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>撕图 · TEAR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 7h20v18H6z' fill='%231a1024' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Cpath d='M16 8c-1 4-3 7 0 10s3 6 0 8' fill='none' stroke='%23ffe36b' stroke-width='1.4' stroke-dasharray='2 2'/%3E%3Cpath d='M16 8c-3 5-1 9 2 12 2 3-1 6-2 6' fill='%230a0614'/%3E%3Cpath d='M16 8c-3 5-1 9 2 12 2 3-1 6-2 6' fill='none' stroke='%23ff3db8' stroke-width='1'/%3E%3Ccircle cx='16' cy='8' r='1.6' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='24' r='1.8' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>撕图</b>
        <span>TEAR</span>
      </div>
      <div class="status">
        <span id="stage-label">十关</span>
        <div class="row">
          <span id="time-label">时 —</span>
          <span id="tear-label">撕 —</span>
          <span class="pips" id="pips" aria-label="剩余纸命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-tear" title="空格" aria-label="撕开">撕</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="撕图藏路"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TEAR</p>
          <h1 id="ov-title">撕图</h1>
          <p class="lead" id="ov-lead">沿线撕开藏路。<br />捏住金页签，贴着针脚撕到青灯。</p>
          <p class="ops" id="ov-ops">拖金签沿线撕 · WASD 移指 · 空格撕 · M 静音</p>
          <button type="button" id="ov-btn">开撕</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">捏金签，沿线撕开 · 底下藏着路</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
