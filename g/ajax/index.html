<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>阿贾 · AJAX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M16 4l8 18-3.2-1 1.6 6.2L16 24l-6.4 3.2 1.6-6.2L8 22z' fill='%23ff7a29'/%3E%3Cpath d='M16 8l4.8 12H11.2z' fill='%23ffb14a'/%3E%3Crect x='15.1' y='10' width='1.8' height='10' rx='.4' fill='%2300f0ff'/%3E%3Cpath d='M12 22h8l1.6 4H10.4z' fill='%23ff3db8' opacity='.85'/%3E%3Ccircle cx='12.2' cy='21' r='1.2' fill='%23ffe36b'/%3E%3Ccircle cx='19.8' cy='21' r='1.2' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>阿贾</b>
        <span>AJAX</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">云峡</span>
          <span id="tag-label">阿贾</span>
          <span id="view-label" class="view">纵</span>
          <span id="pwr-label" class="pwr">火</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-view" title="V / X" aria-label="切换视角">视</button>
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="阿贾游戏区，纵视冲视可切，空格射击，Shift 爆弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-view" aria-label="切换视角">视</button>
        <button type="button" id="btn-pad-bomb" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">AJAX</p>
          <h1 id="ov-title">阿贾</h1>
          <p class="lead" id="ov-lead">开三角战机打穿云峡。空格连射，Shift 爆弹清场。V 纵视切冲视。撞机扣命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击 · Shift / Z 爆弹 · V / X 切视 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-ajax">阿贾</button>
            <button type="button" id="btn-core">贾核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格射击 · Shift 爆弹 · V 切视 · 撞机扣命 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
