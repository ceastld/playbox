<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0514" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>冥界 · NETH</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0514'/%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%23140820' stroke='%23c44dff' stroke-width='1.3'/%3E%3Cellipse cx='12' cy='18' rx='4.2' ry='5' fill='%23c86cff'/%3E%3Cellipse cx='12' cy='12.2' rx='7' ry='2.2' fill='none' stroke='%2300f0ff' stroke-width='1.1'/%3E%3Ccircle cx='10.6' cy='17' r='.8' fill='%23ffe36b'/%3E%3Cpath d='M16 16l7-1' stroke='%23ff7a28' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='14.6' r='1.6' fill='%23ffb030'/%3E%3Crect x='20' y='20' width='6' height='6' rx='.6' fill='%236a4a78'/%3E%3Ccircle cx='22' cy='22.2' r='.7' fill='%23ffe36b'/%3E%3Ccircle cx='24.4' cy='22.2' r='.7' fill='%23ffe36b'/%3E%3Ccircle cx='7' cy='8' r='1.3' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>冥界</b>
        <span>NETH</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="room-label">第 1 间</span>
          <span id="mode-label">采石</span>
          <span id="gem-label">晶 0/0</span>
          <div class="fill" id="time-wrap" title="剩余时间">
            <em>时</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <span id="combo-label" class="combo-tag" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="冥界洞窟，八向飞魔，吐火砸石像收宝石，收够飞进出口"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-spit" aria-label="吐火">吐</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">NETH</p>
          <h1 id="ov-title">冥界</h1>
          <p class="lead" id="ov-lead">飞魔吐火，砸石像收宝石。收够出口开，飞进去进下一间。时间耗尽或撞敌扣命。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WSD 飞 · 空格吐火 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-quarry">采石</button>
            <button type="button" id="btn-tide">魔潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">吐火砸石像 · 宝石收够出口开 · A 自动 · R 重开 · M 静音</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
