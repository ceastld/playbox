<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0e0703" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>忍二 · SHN2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0703'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23180e06' stroke='%23ff9a18' stroke-width='1.4'/%3E%3Ccircle cx='24' cy='8' r='4.2' fill='%23ffe36b'/%3E%3Cpath d='M4 24h24' stroke='%23ff9a18' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='13' cy='13' r='3.4' fill='%23180e06'/%3E%3Crect x='10.4' y='16' width='5.4' height='7' rx='.8' fill='%23ff9a18'/%3E%3Crect x='10.2' y='18.4' width='5.8' height='1.3' fill='%23ffe36b'/%3E%3Cpath d='M16 15l9-2-6 4z' fill='%2300f0ff'/%3E%3Cpath d='M20 20c4-1 7 1 9-1' fill='none' stroke='%23ff6a18' stroke-width='1.3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>忍二</b>
        <span>SHN2</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">暮城</span>
          <span id="tag-label">忍二</span>
          <span id="star-label" class="stars">剑 40</span>
          <span id="ninj-label" class="ninj">龙 3</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-raid" aria-pressed="true">忍二</button>
          <button type="button" id="mode-core" aria-pressed="false">忍核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="忍二，侧向走跳，近斩远镖，Shift 放出火龙，关底族主"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-slash" aria-label="斩或手里剑">斩</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-ninj" aria-label="火龙忍术">龙</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SHN2</p>
          <h1 id="ov-title">忍二</h1>
          <p class="lead" id="ov-lead">侧跳斩杀，手里剑远打。<br />闯过三关，族主现身。Shift 放出火龙。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳 · 空格近斩远镖 · Shift / Z 火龙 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">忍二</button>
            <button type="button" id="btn-core">忍核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · 空格近斩远镖 · Shift 火龙 · 闯关见族主 · 挨打丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
