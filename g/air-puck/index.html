<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>气球 · HOCKEY</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='8' y='3.5' width='16' height='25' rx='3.2' fill='%23071018' stroke='%2300f5e0' stroke-width='1.3'/%3E%3Cpath d='M8.6 16h14.8' stroke='%2300f5e0' stroke-width='.7' stroke-dasharray='1.5 1.5' opacity='.55'/%3E%3Crect x='12.2' y='3.5' width='7.6' height='2.1' fill='%2300f5e0' opacity='.7'/%3E%3Crect x='12.2' y='26.4' width='7.6' height='2.1' fill='%23ff3db8' opacity='.7'/%3E%3Ccircle cx='16' cy='22.2' r='2.6' fill='%2300f5e0'/%3E%3Ccircle cx='16' cy='9.4' r='2.6' fill='%23ff3db8'/%3E%3Ccircle cx='16' cy='16' r='1.45' fill='%23e8ffff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>气球</b>
        <span>HOCKEY</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score you" id="score-b-box">
            <em id="lab-b">你</em>
            <b id="score-b">0</b>
          </div>
          <div class="score them" id="score-t-box">
            <em id="lab-t">对方</em>
            <b id="score-t">0</b>
          </div>
          <div class="score best">
            <em>胜</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">气球</span>
          <span id="tag-label">HOCKEY</span>
          <span id="combo-label" class="combo" hidden>×1</span>
        </div>
      </div>
      <div class="tools">
        <div class="diff" id="diff" role="radiogroup" aria-label="难度">
          <button type="button" data-diff="0" aria-pressed="false" title="简单">简</button>
          <button type="button" data-diff="1" aria-pressed="true" title="中等">中</button>
          <button type="button" data-diff="2" aria-pressed="false" title="困难">难</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="气球球台，拖动击球进门"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">HOCKEY</p>
          <h1 id="ov-title">气球</h1>
          <p class="lead" id="ov-lead">一磕就飞，对打进门。</p>
          <p class="ops" id="ov-ops">拖动底侧击球 · WASD 或方向键 · 先到七分</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-ai">对机</button>
            <button type="button" id="btn-two">双人同机</button>
          </div>
          <div class="ov-diff" id="ov-diff" role="radiogroup" aria-label="对战难度">
            <button type="button" data-diff="0" aria-pressed="false">简</button>
            <button type="button" data-diff="1" aria-pressed="true">中</button>
            <button type="button" data-diff="2" aria-pressed="false">难</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="btn-again">再来</button>
            <button type="button" id="btn-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">拖动击球 · WASD 或方向键 · 先到七分 · R 重开 · M 静音</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
