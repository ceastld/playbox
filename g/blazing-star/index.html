<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>烈星 · BLAZE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120806'/%3E%3Cpath d='M16 3l2.4 7.4H26l-6.2 4.6 2.4 7.4L16 18.6 9.8 22.4l2.4-7.4L6 10.4h7.6z' fill='%23ff4d14'/%3E%3Cpath d='M16 8l1.4 4.2H22l-3.6 2.6 1.4 4.2L16 16.4l-3.8 2.6 1.4-4.2-3.6-2.6h4.6z' fill='%23ffe36b'/%3E%3Cpath d='M6 16l8-3V19z' fill='%2300e8ff'/%3E%3Crect x='10' y='14.4' width='7' height='3.2' rx='.5' fill='%23fff3e8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>烈星</b>
        <span>BLAZE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">烈焰</span>
          <span id="pwr-label" class="pwr">火 0</span>
          <span id="spd-label" class="spd">速 0</span>
          <div class="fill" id="chg-wrap" title="蓄力">
            <em>蓄</em>
            <div class="fill-track" aria-hidden="true"><i id="chg-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="烈星游戏区，横向卷轴，点射连发，按住蓄力放宽幅烈星"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BLAZE</p>
          <h1 id="ov-title">烈星</h1>
          <p class="lead" id="ov-lead">横向卷轴。点射连发，按住蓄力放宽幅烈星。吃 P 加火力、S 加速。每关中 Boss 与关底 Boss。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击（按住蓄力）· A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">烈焰</button>
            <button type="button" id="btn-storm">弹幕</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点射连发 · 按住蓄满放烈星 · 吃 P / S · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
