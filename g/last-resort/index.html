<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>末堡 · LRES</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M0 22h4v10H0zM5 18h5v14H5zM11 20h4v12h-4zM16 16h6v16h-6zM23 19h4v13h-4zM28 21h4v11h-4z' fill='%231c0c08'/%3E%3Cpath d='M0 22h32' stroke='%23ff7a28' stroke-width='1'/%3E%3Cpath d='M5 16l9-3.4V19z' fill='%23fff4e8'/%3E%3Crect x='10' y='14.2' width='8' height='3.6' rx='.5' fill='%23ffc14a'/%3E%3Ccircle cx='22' cy='16' r='3.2' fill='none' stroke='%23ff7a28' stroke-width='1.2'/%3E%3Ccircle cx='22' cy='16' r='1.2' fill='%23ffc14a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>末堡</b>
        <span>LRES</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">夜城</span>
          <span id="tag-label">末城</span>
          <span id="sat-label" class="sat">环绕</span>
          <span id="pow-label" class="pow">火 1</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-sat" title="Shift / Z" aria-label="卫星出击">卫</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="末堡游戏区，横向卷轴，卫星环绕，空格射击，Shift 射出卫星"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="卫星出击">卫</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">LRES</p>
          <h1 id="ov-title">末堡</h1>
          <p class="lead" id="ov-lead">卫星环绕机体。Shift 射出当撞锤，飞过去接住，或再按收回。吃六角荚加卫星。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 卫星 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-city">末城</button>
            <button type="button" id="btn-rail">轨道</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">卫星环绕 · Shift 射出 / 收回 · 飞过去也能接住</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
