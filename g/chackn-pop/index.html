<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>企鹅 · CHACK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%23081014' stroke='%231ee6a8' stroke-width='1.3'/%3E%3Crect x='6' y='20' width='20' height='4' rx='.6' fill='%237a4a22'/%3E%3Crect x='10' y='14' width='4.2' height='4.2' rx='.5' fill='%23120818' stroke='%23ff3db8' stroke-width='.7'/%3E%3Cpath d='M12.1 15.4l1 1.4 1-1.4z' fill='%23ff5aa8'/%3E%3Ccircle cx='20.4' cy='18.2' r='3.1' fill='%23c8ffe8'/%3E%3Cellipse cx='20.4' cy='18.7' rx='1.7' ry='1.8' fill='%231ee6a8'/%3E%3Ccircle cx='19.7' cy='17.5' r='.4' fill='%2305030c'/%3E%3Ccircle cx='21.1' cy='17.5' r='.4' fill='%2305030c'/%3E%3Cpath d='M20.4 18.3l1.2.55-1.2.4z' fill='%23ffb020'/%3E%3Ccircle cx='8.2' cy='10.2' r='1.6' fill='%23ff6ad4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>企鹅</b>
        <span>CHACK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连救</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">救人</span>
          <span id="tag-label">心 0</span>
          <span id="letters" class="letters" aria-label="EXTEND">EXTEND</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-save" aria-pressed="true">救人</button>
          <button type="button" id="mode-chase" aria-pressed="false">追击</button>
        </div>
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="企鹅救人，走跳丢弹炸开土柱，救出笼心里的心"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">连爆 ×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-jump" aria-label="跳">跳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-bomb" aria-label="丢弹">弹</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CHACK</p>
          <h1 id="ov-title">企鹅</h1>
          <p class="lead" id="ov-lead">丢炸弹砸开土柱，救出笼子里的心。<br />别挨怪，也别被自己的烟呛到。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳 · 空格丢弹 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-save">救人</button>
            <button type="button" id="btn-chase">追击</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · 空格丢弹炸开一列 · 心弹出再接住 · A 自动 · 字母凑齐 EXTEND</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
