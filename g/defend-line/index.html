<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#030a05" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>防线 · DEFEND</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030a05'/%3E%3Crect x='2' y='3' width='28' height='5' rx='.6' fill='%23071a10' stroke='%231cff3a' stroke-width='.6'/%3E%3Ccircle cx='8' cy='5.5' r='.8' fill='%2300f0ff'/%3E%3Ccircle cx='16' cy='5.5' r='.7' fill='%23ff3db8'/%3E%3Ccircle cx='22' cy='5.5' r='.7' fill='%23ffe36b'/%3E%3Cpath d='M2 26 L6 20 L11 24 L16 17 L21 22 L26 16 L30 23 L30 30 L2 30Z' fill='%23071a10' stroke='%231cff3a' stroke-width='.8'/%3E%3Cpath d='M18 14l8 2-8 2-2-2z' fill='%2300f0ff'/%3E%3Crect x='12' y='22' width='1.4' height='3.2' fill='%237aff88'/%3E%3Ccircle cx='12.7' cy='21.4' r='.8' fill='%237aff88'/%3E%3Cpath d='M7 11h5v1.4H9.6V16H7z' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>防线</b>
        <span>DEFEND</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">巡航</span>
          <span id="bomb-label">炸 3</span>
          <span id="human-label">人 10</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="防线游戏区，左右环绕飞行，开火打绑架者，接住往下掉的人"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad" aria-hidden="true">
        <button type="button" id="btn-bomb" title="Shift" aria-label="智慧弹">炸</button>
        <button type="button" id="btn-hyper" title="H" aria-label="超空间">跃</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DEFEND</p>
          <h1 id="ov-title">防线</h1>
          <p class="lead" id="ov-lead">飞过去救人。打掉绑架者，接住往下掉的人。全员被带走就成荒星。</p>
          <p class="ops" id="ov-ops">← → 推力 · ↑ ↓ 升降 · 空格开火 · Shift 智慧弹 · H 超空间 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-classic">巡航</button>
            <button type="button" id="btn-night">夜袭</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 飞 · 空格开火 · Shift 智慧弹 · 打掉绑架者再接住人</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
