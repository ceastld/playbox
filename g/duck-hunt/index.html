<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>猎鸭 · DUCK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='22' cy='8' r='4' fill='%23ffa04a'/%3E%3Cellipse cx='16' cy='16' rx='8' ry='5' fill='%23ff6a22'/%3E%3Ccircle cx='22' cy='14' r='4.2' fill='%23ff8a3a'/%3E%3Cpath d='M26 14 L31 15 L26 16Z' fill='%23ffe36b'/%3E%3Cpath d='M4 26 L10 20 L16 26 L22 19 L28 26' fill='%23142818'/%3E%3Ccircle cx='12' cy='12' r='5' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Ccircle cx='12' cy='12' r='1.4' fill='%23e8ffff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>猎鸭</b>
        <span>DUCK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连中</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">猎鸭</span>
          <span id="tag-label">DUCK</span>
          <span id="ammo-label">弹 3</span>
          <span id="quota-label">达标 0/6</span>
          <span class="pips" id="pips" aria-label="本局命中"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="猎鸭，瞄准点击射击飞鸭或飞碟"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DUCK</p>
          <h1 id="ov-title">猎鸭</h1>
          <p class="lead" id="ov-lead">点按瞄准，三发打中飞鸭。</p>
          <p class="ops" id="ov-ops">点按开火 · 三发一轮 · 打空狗会笑 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-duck">飞鸭</button>
            <button type="button" id="btn-clay">飞碟</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点按开火 · 三发一轮 · R 重开 · M 静音</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
