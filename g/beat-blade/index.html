<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>节拍刃 · BEAT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M16 3l2 14h-4z' fill='%2300f0ff'/%3E%3Cpath d='M14 17h4l1 3h-6z' fill='%23ff3db8'/%3E%3Ccircle cx='16' cy='22' r='2.2' fill='none' stroke='%23ffe36b' stroke-width='1.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="scan" aria-hidden="true"></div>
  <canvas id="view" aria-label="节拍刃"></canvas>

  <div id="hud" class="hud hidden">
    <header class="hud-top">
      <div class="brand">
        <strong>节拍刃</strong>
        <span>BEAT</span>
      </div>
      <div class="readouts">
        <div class="read"><em>乐段</em><b id="phrase">起式</b></div>
        <div class="read"><em>连击</em><b id="combo">0</b></div>
        <div class="read"><em>拍</em><b id="beat">0/48</b></div>
      </div>
      <div class="right">
        <div class="blades" id="blades" title="刃" aria-label="剩余刃">
          <i></i><i></i><i></i>
        </div>
        <div class="tools">
          <button type="button" id="btn-mute" title="静音（M）">声开</button>
          <button type="button" id="btn-retry" title="重开（R）">重开</button>
        </div>
      </div>
    </header>
    <p id="hint" class="hint">粉点出刀 · 空圈收刃</p>
  </div>

  <div id="panel" class="panel" role="dialog" aria-labelledby="panel-title">
    <div class="card" id="card">
      <p class="kicker" id="panel-kicker">BEAT BLADE</p>
      <h1 id="panel-title">节拍刃</h1>
      <p class="lead" id="panel-lead">只在拍点出刀。<br />空拍会折刃。</p>
      <p class="meta" id="panel-meta">粉菱必须砍，青色空圈必须收。刃裂三次则负。</p>
      <div class="legend" aria-hidden="true">
        <span class="lg-hit">◆ 出刀</span>
        <span class="lg-rest">○ 收刃</span>
      </div>
      <button type="button" id="btn-main">拔刀</button>
      <p class="foot" id="panel-foot">空格 / 点击出刀 · M 静音</p>
    </div>
  </div>

  <script src="js/game.js"></script>
</body>
</html>
