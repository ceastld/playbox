<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>三消 · MATCH</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M16 4l8 6v12l-8 6-8-6V10z' fill='%23ffe36b'/%3E%3Cpath d='M16 4l8 6-8 6-8-6z' fill='%23fff4c4'/%3E%3Cpath d='M24 10v12l-8 6V16z' fill='%23ffb020'/%3E%3Ccircle cx='16' cy='14' r='2.2' fill='%23fff' opacity='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>三消</b>
        <span>MATCH</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连消</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">限步</span>
          <span id="res-label">30 步</span>
          <span id="tag-label">MATCH</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="三消棋盘，拖相邻宝石对换，三个一样就消"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MATCH</p>
          <h1 id="ov-title">三消</h1>
          <p class="lead" id="ov-lead">相邻对换，三个一样就消。落下还能连消。</p>
          <p class="ops" id="ov-ops">拖或点相邻宝石对换 · 四个成划爆 · 五个成彩爆 · 方向键选格空格交换 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-moves">限步 30</button>
            <button type="button" id="btn-time">限时 60</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">拖相邻对换 · 三个一样就消 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
