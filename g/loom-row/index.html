<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>织行 · LOOM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M8 4v24M12 4v24M16 4v24M20 4v24M24 4v24' stroke='%23ff3db8' stroke-width='1.2' opacity='.85'/%3E%3Cpath d='M6 10h20' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Cpath d='M6 22h20' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Cellipse cx='16' cy='16' rx='9' ry='3.2' fill='none' stroke='%23ffe36b' stroke-width='1.5'/%3E%3Crect x='4' y='14.2' width='8' height='3.6' rx='1.8' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>织行</b>
        <span>LOOM</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="纬线">
          <em>纬</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0/0</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 幅</span>
          <span id="shed-label">闭合</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="开口时放梭织行"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-fire" aria-label="放梭">放梭</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">LOOM</p>
          <h1 id="ov-title">织行</h1>
          <p class="lead" id="ov-lead">梭只在开口时穿过。<br />经线分开、开口发亮再放梭，合上会绞线。</p>
          <p class="ops" id="ov-ops">空格 / J 放梭 · 点按画布 · M 静音</p>
          <button type="button" id="ov-btn">开织</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">开口亮了再放梭 · 梭只在开口时穿过</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
