<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#061018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>扎克 · ZAXX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23061018'/%3E%3Cpath d='M4 24l8-5 8 5-8 5z' fill='%230a2038'/%3E%3Cpath d='M12 19l8-5 8 5-8 5z' fill='%23103868'/%3E%3Cpath d='M12 11h8v8l-8 5z' fill='%231858a8'/%3E%3Cpath d='M12 11l8-5 8 5-8 5z' fill='%234ec8ff'/%3E%3Cpath d='M20 6l3 2-3 2-3-2z' fill='%23ffe36b'/%3E%3Cellipse cx='20' cy='22' rx='4' ry='1.4' fill='%23000000' opacity='.5'/%3E%3Crect x='19.2' y='10' width='1.6' height='12' fill='%234ec8ff' opacity='.55'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>扎克</b>
        <span>ZAXX</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">外城</span>
          <span id="tag-label">要塞</span>
          <div class="fill fuel" id="fuel-wrap" title="燃油">
            <em>油</em>
            <div class="fill-track" aria-hidden="true"><i id="fuel-bar"></i></div>
          </div>
          <span id="alt-label" class="alt">高 40</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="扎克，等距飞，改高度，打墙打油打炮，穿要塞再打机甲"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ZAXX</p>
          <h1 id="ov-title">扎克</h1>
          <p class="lead" id="ov-lead">等距飞。高度要对，影子贴地就撞。打墙打油打炮，穿两座要塞，再打机甲。</p>
          <p class="ops" id="ov-ops">← → 平移 · ↑ ↓ 升降 · 空格开火 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-fort">要塞</button>
            <button type="button" id="btn-dense">密火</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 平移 · ↑ ↓ 升降 · 空格开火 · 影子看高度 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
