<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070512" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>银河 · GLXY</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070512'/%3E%3Cpath d='M4 28L16 6l12 22' fill='none' stroke='%238060ff' stroke-width='.7' opacity='.45'/%3E%3Crect x='10' y='18' width='3' height='6' fill='%23120828' stroke='%238060ff' stroke-width='.4'/%3E%3Crect x='19' y='20' width='3.2' height='5' fill='%23120828' stroke='%238060ff' stroke-width='.4'/%3E%3Cpath d='M16 11l3 9h-2l-1 3-1-3h-2z' fill='%23c8b4ff'/%3E%3Cpath d='M13.6 20h4.8l-.8 2.4h-3.2z' fill='%238060ff'/%3E%3Crect x='14' y='14' width='8' height='8' fill='none' stroke='%23ffe36b' stroke-width='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>银河</b>
        <span>GLXY</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">霓港</span>
          <span id="tag-label">银河</span>
          <div class="fill" id="lock-wrap" title="锁定">
            <em>锁</em>
            <div class="fill-track" aria-hidden="true"><i id="lock-bar"></i></div>
          </div>
          <span id="wpn-label" class="wpn">炮</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="银河游戏区，八向飞行，空格连射并释放锁定激光，Shift 爆弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GLXY</p>
          <h1 id="ov-title">银河</h1>
          <p class="lead" id="ov-lead">飞在上层打空中，锁定下层连锁激光。撞了扣命。短关之后是星核。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格开火 · Shift / Z 爆弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-galaxy">银河</button>
            <button type="button" id="btn-rain">核雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格开火 · Shift 爆弹 · 锁定下层连锁</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
