<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041610" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>阿莱 · ALST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041610'/%3E%3Cpath d='M16 4l3.2 9.2H26l-7.4 5.4L21 26l-5-3.8L11 26l2.4-7.4L6 13.2h6.8z' fill='%2312e8a4'/%3E%3Cpath d='M16 10l1.8 5.2H24l-5.2 3.8 1.6 5.4L16 21l-4.4 3.4 1.6-5.4-5.2-3.8h6.2z' fill='%23e8fff6'/%3E%3Crect x='14.6' y='18' width='2.8' height='8' fill='%23ffe36b'/%3E%3Ccircle cx='10' cy='20' r='2.2' fill='%2312e8a4' opacity='.7'/%3E%3Ccircle cx='22' cy='20' r='2.2' fill='%2312e8a4' opacity='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>阿莱</b>
        <span>ALST</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">空袭</span>
          <span id="wpn-label" class="wpn">直</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="阿莱游戏区，八向移动，空格射击，Shift 扔爆弹，捡芯片切武装"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ALST</p>
          <h1 id="ov-title">阿莱</h1>
          <p class="lead" id="ov-lead">纵向卷轴。捡芯片切直射、波刃、扇弹、穿束。卫星跟射。短关之后是机甲。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格开火 · Shift / Z 爆弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">空袭</button>
            <button type="button" id="btn-storm">密弹</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向移动 · 空格开火 · Shift 爆弹 · 捡 波/扇/穿</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
