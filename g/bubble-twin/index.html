<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>泡龙 · BUB</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='26' width='26' height='4' rx='1' fill='%23ffc44a'/%3E%3Crect x='5' y='16' width='10' height='3' rx='1' fill='%23ffc44a'/%3E%3Crect x='17' y='10' width='10' height='3' rx='1' fill='%23ffc44a'/%3E%3Ccircle cx='11' cy='21' r='4.2' fill='%237dff4a'/%3E%3Ccircle cx='12.4' cy='20.2' r='1.1' fill='%2305030c'/%3E%3Ccircle cx='22' cy='18' r='5.2' fill='%2300f0ff' opacity='.85'/%3E%3Ccircle cx='20.2' cy='16.4' r='1.4' fill='%23fff' opacity='.7'/%3E%3Ccircle cx='22' cy='18' r='2.2' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>泡龙</b>
        <span>BUB</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连爆</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">洞府</span>
          <span id="tag-label">BUB</span>
          <div class="fill power" id="power-wrap" hidden title="特殊泡">
            <em id="power-lab">术</em>
            <div class="fill-track" aria-hidden="true"><i id="power-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="泡龙洞府，吹泡困住怪物再跳上去踩爆"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-blow" aria-label="吹泡">吹</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BUB</p>
          <h1 id="ov-title">泡龙</h1>
          <p class="lead" id="ov-lead">吹泡把怪装进去，再跳上去踩爆成水果。碰到没困住的怪会丢命。</p>
          <p class="ops" id="ov-ops">← → / A D 走 · 上 / W 跳 · 空格吹泡 · 触屏左 跳 吹 右 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-dungeon">洞府</button>
            <button type="button" id="btn-endless">无尽</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">吹泡困怪 · 跳上去踩爆 · 水果要捡 · 火 / 水 / 雷泡能清场</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
