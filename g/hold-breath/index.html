<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>闭气 · BREATH</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M2 10 Q8 7 16 10 Q24 13 30 10' fill='none' stroke='%2300f0ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='20' r='5' fill='none' stroke='%23ff3db8' stroke-width='1.7'/%3E%3Ccircle cx='16' cy='20' r='2' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>闭气</b>
        <span>BREATH</span>
      </div>
      <div class="status">
        <div class="o2" id="o2-wrap" title="氧气">
          <em>气</em>
          <div class="o2-track" aria-hidden="true"><i id="o2-fill"></i></div>
          <b id="o2-num">100</b>
        </div>
        <div class="row">
          <span id="loot-label">夜珠 0/6</span>
          <span class="pips" id="pips" aria-label="已拾夜珠"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="闭气潜湾"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BREATH</p>
          <h1 id="ov-title">闭气</h1>
          <p class="lead" id="ov-lead">一口空气潜下去捡夜珠。<br />气越少，黑潮涨得越高，深处就去不了。</p>
          <p class="ops" id="ov-ops">WASD / 方向键游动 · 按住屏幕游向手指 · M 静音</p>
          <button type="button" id="ov-btn">闭气下潜</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">先潜最深 · 气少黑潮会涨 · 捡齐再浮出</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
