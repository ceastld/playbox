<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="dark" />
  <title>叠跳 · ECHO JUMP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 24h8M16 16h8M4 28h24' stroke='%23ff3db8' stroke-width='2' fill='none'/%3E%3Ccircle cx='20' cy='12' r='3' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>叠跳</b>
        <span>ECHO JUMP</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <span class="pips" id="pips" aria-label="剩余性命"></span>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="叠跳关卡"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay">
        <div class="panel">
          <p class="kicker" id="ov-kicker">ECHO JUMP</p>
          <h1 id="ov-title">叠跳</h1>
          <p class="lead" id="ov-lead">平台只存在于你上一次跳跃过的地方。摔下去，脚印才会凝固。用几条命叠到出口。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 移动 · 上 / W / 空格跳跃 · 触屏用左跳右 · M 静音</p>
          <button type="button" id="ov-btn">开始</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">跳跃留下残影 · 坠落后凝固成平台 · 叠到青色出口</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
