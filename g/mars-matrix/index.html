<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>火阵 · MARS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Cpath d='M16 4l8 4.6v9.2L16 22.4 8 17.8V8.6z' fill='%23ff6b3d'/%3E%3Cpath d='M16 4l8 4.6L16 13.2 8 8.6z' fill='%23ffc45a'/%3E%3Cpath d='M16 13.2l8-4.6v9.2L16 22.4z' fill='%23c43a18'/%3E%3Ccircle cx='16' cy='13' r='2.4' fill='%2300e8ff'/%3E%3Cpath d='M16 22.4l3.4 6h-6.8z' fill='%23ff9a3c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>火阵</b>
        <span>MARS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">火核</span>
          <span id="wpn-label" class="wpn">点</span>
          <div class="fill" id="mos-wrap" title="吸取">
            <em>吸</em>
            <div class="fill-track" aria-hidden="true"><i id="mos-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="火阵游戏区，八向移动，空格点射，按住吸取敌弹再松开反打"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-abs" aria-label="吸取">吸</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MARS</p>
          <h1 id="ov-title">火阵</h1>
          <p class="lead" id="ov-lead">点射扫阵，按住吸弹反打。同色方块连链。短关之后是火核。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击（按住吸取）· R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-core">火核</button>
            <button type="button" id="btn-dense">密阵</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点射扫阵 · 按住吸弹 · 松开反打 · 同色连链</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
