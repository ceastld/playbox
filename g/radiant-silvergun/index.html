<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#061018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>银枪 · RSG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23061018'/%3E%3Cpath d='M16 3l6 10-2 13-4 4-4-4-2-13z' fill='%23d4e4f4'/%3E%3Cpath d='M16 6l3.6 7-1.2 8L16 23l-2.4-2-1.2-8z' fill='%233d9eff'/%3E%3Cpath d='M10 18l-5 3 5 2zM22 18l5 3-5 2z' fill='%23ffe36b'/%3E%3Ccircle cx='12' cy='12' r='1.6' fill='%23ff4a5a'/%3E%3Ccircle cx='20' cy='12' r='1.6' fill='%233d9eff'/%3E%3Ccircle cx='16' cy='9' r='1.6' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>银枪</b>
        <span>RSG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">银枪</span>
          <span id="chain-label" class="chain" aria-label="三色连锁">
            <i id="ch0" class="c"></i>
            <i id="ch1" class="c"></i>
            <i id="ch2" class="c"></i>
            <b id="lock-label">锁</b>
          </span>
          <div class="fill" id="swd-wrap" title="银斩">
            <em>斩</em>
            <div class="fill-track" aria-hidden="true"><i id="swd-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-sword" title="Shift / Z" aria-label="银斩">斩</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="银枪游戏区，纵向卷轴，空格三色齐射，同色三杀连锁，Shift 银斩"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="银斩">斩</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RSG</p>
          <h1 id="ov-title">银枪</h1>
          <p class="lead" id="ov-lead">三色连锁。空格赤金蓝齐射，同色三杀上锁，Shift 银斩冲刺。撞机扣一命。短关之后是银核。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · Shift / Z 银斩 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-gun">银枪</button>
            <button type="button" id="btn-core">银核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">同色三杀上锁 · 空格三色齐射 · Shift 银斩</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
