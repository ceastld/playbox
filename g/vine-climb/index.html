<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>藤上 · VINE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M8 28c2-8 4-10 7-16 2-4 1-8 1-8' fill='none' stroke='%23ff3db8' stroke-width='1.6' stroke-linecap='round'/%3E%3Cpath d='M16 12c4 2 7 1 10-3' fill='none' stroke='%2300f0ff' stroke-width='1.4' stroke-linecap='round'/%3E%3Ccircle cx='24' cy='7' r='2.4' fill='%23ffe36b'/%3E%3Crect x='6' y='24' width='8' height='5' rx='1' fill='none' stroke='%2300f0ff' stroke-width='1.2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>藤上</b>
        <span>VINE</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="余藤">
          <em>藤</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">—</b>
        </div>
        <div class="row">
          <span id="stage-label">十台</span>
          <span id="dist-label">距花</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="藤朝光长"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">VINE</p>
          <h1 id="ov-title">藤上</h1>
          <p class="lead" id="ov-lead">藤只朝光长。把灯摆到花边，<br />嫩芽会跟着爬上去。</p>
          <p class="ops" id="ov-ops">WASD / 方向键移灯 · 按住拖动 · M 静音</p>
          <button type="button" id="ov-btn">摆灯</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">灯在芽前，藤朝光长 · 送到月花</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
