<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#031612" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>生金 · BMET</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23031612'/%3E%3Cpath d='M4 16 L18 12 L26 16 L18 20 Z' fill='%2300e8c0'/%3E%3Cpath d='M8 16 L18 13.6 L22 16 L18 18.4 Z' fill='%23ffe36b'/%3E%3Ccircle cx='12' cy='10' r='2.1' fill='%233dffc8'/%3E%3Ccircle cx='20' cy='9' r='1.7' fill='%23ff3db8'/%3E%3Ccircle cx='12' cy='22' r='2.1' fill='%233dffc8'/%3E%3Ccircle cx='20' cy='23' r='1.7' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>生金</b>
        <span>BMET</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">生海</span>
          <span id="tag-label">生金</span>
          <span id="form-label" class="form f0">针</span>
          <div class="fill" id="hp-wrap" title="Boss 血量" hidden>
            <em>核</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-morph" title="Shift / Z" aria-label="变形">变</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="生金游戏区，横向卷轴，空格射击，Shift 变形针环翼，撞上掉命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="变形">变</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BMET</p>
          <h1 id="ov-title">生金</h1>
          <p class="lead" id="ov-lead">横向卷轴。活金三态：针穿甲、环盾吞弹、翼散清群。撞上掉命。先打生海再打核巢。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 变形 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-bio">生金</button>
            <button type="button" id="btn-tide">核潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格射击 · Shift/Z 变形针、环、翼 · 环盾吞弹 · 撞上掉命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
