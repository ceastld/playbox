<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0614" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>引力 · GRAV</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0614'/%3E%3Ccircle cx='16' cy='16' r='4.2' fill='none' stroke='%23ffe36b' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='16' r='9.5' fill='none' stroke='%23b48cff' stroke-width='.7' opacity='.7'/%3E%3Ccircle cx='25' cy='11' r='2.4' fill='none' stroke='%23ff3db8' stroke-width='1'/%3E%3Cpolygon points='16,6 19.2,14 16,12 12.8,14' fill='none' stroke='%23e8f0ff' stroke-width='1.2'/%3E%3Cpath d='M16 12 L16 16' stroke='%2300e8ff' stroke-width='1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>引力</b>
        <span>GRAV</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">星系</span>
          <span id="tag-label">巡星</span>
          <div class="fill" id="fuel-wrap" title="燃料">
            <em>燃料</em>
            <div class="fill-track" aria-hidden="true"><i id="fuel-bar"></i></div>
            <b id="fuel-num">0</b>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="引力游戏区，先在星系降落行星，再潜入井底炸掉反应堆并逃出"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-ccw" aria-label="左转">↺</button>
          <button type="button" class="pad thrust" id="pad-thrust" aria-label="推进">▲</button>
          <button type="button" class="pad" id="pad-cw" aria-label="右转">↻</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">火</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GRAV</p>
          <h1 id="ov-title">引力</h1>
          <p class="lead" id="ov-lead">先在星系减速降落行星，再潜入井底炸掉碉堡与反应堆，趁爆炸逃出。燃料有限，中弹或撞山扣命。</p>
          <p class="ops" id="ov-ops">A D / ← → 转向 · W / ↑ 推进 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-patrol">巡星</button>
            <button type="button" id="btn-well">深井</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 推进 · 空格开火 · 降落行星 · 炸掉反应堆</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
