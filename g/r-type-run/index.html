<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0410" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>武装 · RTYPE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0410'/%3E%3Cpath d='M0 0h32v7H0zM0 25h32v7H0z' fill='%231a0816'/%3E%3Cpath d='M0 7h32M0 25h32' stroke='%23ff3db8' stroke-width='1.1'/%3E%3Cpath d='M6 16l8-3.2V19z' fill='%2300f0ff'/%3E%3Crect x='10' y='14.2' width='7' height='3.6' rx='.6' fill='%23ffe36b'/%3E%3Ccircle cx='22' cy='16' r='3.4' fill='%23ffb84a'/%3E%3Ccircle cx='22' cy='16' r='1.3' fill='%23ff3db8'/%3E%3Cpath d='M26 10c4 3 4 9 0 12' stroke='%23c45a78' stroke-width='1.4' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>武装</b>
        <span>RTYPE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 腔</span>
          <span id="tag-label">远征</span>
          <span id="force-label" class="form front">前装</span>
          <div class="fill" id="chg-wrap" title="蓄力">
            <em>蓄</em>
            <div class="fill-track" aria-hidden="true"><i id="chg-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="武装游戏区，横向卷轴，力爪对接格挡出击，空格蓄力开炮"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-force" aria-label="力爪">力</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RTYPE</p>
          <h1 id="ov-title">武装</h1>
          <p class="lead" id="ov-lead">力爪对接、格挡、出击。空格按住蓄力开炮。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击（按住蓄力）· C 力爪 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">远征</button>
            <button type="button" id="btn-storm">强袭</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">力爪挡弹 · 撞机体才掉命 · 空格蓄力 · C 发射 / 收回</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
