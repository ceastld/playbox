<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120814" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>超光 · ESPR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120814'/%3E%3Cpath d='M16 3l8 13-8 13L8 16z' fill='%23c44dff'/%3E%3Cpath d='M16 7l5 9-5 9-5-9z' fill='%23ff3db8'/%3E%3Cpath d='M16 11l2.8 5-2.8 5-2.8-5z' fill='%23ffe8ff'/%3E%3Cpath d='M6 16l5-3v6zM26 16l-5-3v6z' fill='%236ef0ff' opacity='.85'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>超光</b>
        <span>ESPR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">超能</span>
          <span id="graze-label" class="graze">擦 0</span>
          <div class="fill" id="esp-wrap" title="超能">
            <em>超</em>
            <div class="fill-track" aria-hidden="true"><i id="esp-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-burst" title="Shift / Z" aria-label="超能爆发">超</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="超光游戏区，纵向卷轴，空格射击，擦弹积超能，Shift 爆发"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="超能爆发">超</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ESPR</p>
          <h1 id="ov-title">超光</h1>
          <p class="lead" id="ov-lead">擦弹积超能，空格点射，爆发清环。短关之后是光核。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · Shift / Z 爆发 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-esp">超能</button>
            <button type="button" id="btn-sea">光海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">擦弹积超能 · 空格点射 · Shift 爆发</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
