<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>管旋 · TEMPEST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpolygon points='16,4 27,10 27,22 16,28 5,22 5,10' fill='none' stroke='%23b44cff' stroke-width='1.2'/%3E%3Cpolygon points='16,11 21,14 21,18 16,21 11,18 11,14' fill='none' stroke='%23b44cff' stroke-width='0.9' opacity='.7'/%3E%3Cpath d='M16 4 L16 11 M27 10 L21 14 M27 22 L21 18 M16 28 L16 21 M5 22 L11 18 M5 10 L11 14' stroke='%239b5cff' stroke-width='0.7' opacity='.85'/%3E%3Cpath d='M13.2 25.2 L16 22.4 L18.8 25.2' fill='none' stroke='%23ffe36b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M14.2 16.2 L16 14.4 L17.8 16.2' fill='none' stroke='%23ff3db8' stroke-width='1.2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='12.2' r='1.1' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>管旋</b>
        <span>TEMPEST</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">管旋</span>
          <span id="tag-label">TEMPEST</span>
          <span id="zap-label" class="zap" hidden>超闪</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-zap" title="Z" aria-label="超闪" disabled>闪</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="管旋游戏区，沿管壁绕圈开火，别让敌人爬上来"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TEMPEST</p>
          <h1 id="ov-title">管旋</h1>
          <p class="lead" id="ov-lead">沿着管壁开火，别让它们爬上来。</p>
          <p class="ops" id="ov-ops">← → 绕圈 · 空格开火 · Z 超闪 · 指针滑动 · A 自动 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-spike">尖管</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="btn-again">再来</button>
            <button type="button" id="btn-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 绕圈 · 空格开火 · Z 超闪一次 · 别被爬上来</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
