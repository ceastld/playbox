<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140c06" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>忘界 · FORG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140c06'/%3E%3Cpath d='M4 24h24v4H4z' fill='%23201810'/%3E%3Cpath d='M6 24l4-6 3 3 5-8 4 5 4-4 3 10z' fill='%23302818'/%3E%3Ccircle cx='12' cy='13' r='3.2' fill='%23d6a07a'/%3E%3Cpath d='M9.6 16.2h4.8v5.2H9.6z' fill='%23ff8a28'/%3E%3Cpath d='M10.2 21.4h3.6v3.2h-3.6z' fill='%23c06020'/%3E%3Cpath d='M7.4 17.2h2.4v3.2H7.4z' fill='%23ffe36b'/%3E%3Ccircle cx='22' cy='12' r='3.4' fill='none' stroke='%2300e8ff' stroke-width='1.2'/%3E%3Ccircle cx='22' cy='12' r='1.2' fill='%2300e8ff'/%3E%3Cpath d='M14.4 15.2l8-1.6' stroke='%23ffe36b' stroke-width='1.3'/%3E%3Ccircle cx='8' cy='9' r='1.4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>忘界</b>
        <span>FORG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score gold">
            <em>金币</em>
            <b id="gold">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">扫荡</span>
          <span id="wpn-label" class="wpn">炮 单</span>
          <span id="sat-label" class="sat">卫 0</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="忘界游戏区，飞甲武士左舷飞行，360度转炮打空打地，拾金币进店"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FORG</p>
          <h1 id="ov-title">忘界</h1>
          <p class="lead" id="ov-lead">飞甲武士停在左舷。360° 转炮，空中地面都能打。拾金币进店买散射、卫星。撞机扣一命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 鼠标或 IJKL 瞄准 · 空格射击 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">扫荡</button>
            <button type="button" id="btn-storm">弹幕</button>
          </div>
          <div class="ov-actions gone" id="ov-shop">
            <button type="button" id="btn-spread">散射</button>
            <button type="button" id="btn-sat">卫星</button>
            <button type="button" id="btn-go">出发</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">WASD 飞 · 鼠标 / IJKL 转炮 · 空格射击 · 拾金进店</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
