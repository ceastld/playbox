<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#031012" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>狂扫 · ROBO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23031012'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23061a1c' stroke='%2300fff5' stroke-width='1.4'/%3E%3Ccircle cx='10' cy='22' r='2.1' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='16' r='2.4' fill='%237afff0'/%3E%3Crect x='17.4' y='15.3' width='7' height='1.4' rx='.3' fill='%23e8ffff'/%3E%3Crect x='22' y='8' width='4.2' height='6' rx='.6' fill='%23ff4a6a'/%3E%3Crect x='6' y='7' width='6.4' height='7.2' rx='.8' fill='%237cff4a'/%3E%3Ccircle cx='24' cy='22' r='2.6' fill='%23ff5ad6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>狂扫</b>
        <span>ROBO</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">扫荡</span>
          <span id="tag-label">敌 —</span>
          <span id="rescue-label" class="rescue">救 ×1</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-sweep" aria-pressed="true">扫荡</button>
          <button type="button" id="mode-guard" aria-pressed="false">护人</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="狂扫场地，双摇杆边走边射，救出人类，清波"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="vpad-l" class="vpad left" aria-label="移动摇杆">
        <div class="vpad-base"><div class="vpad-knob" id="knob-l"></div></div>
      </div>
      <div id="vpad-r" class="vpad right" aria-label="射击摇杆">
        <div class="vpad-base fire"><div class="vpad-knob" id="knob-r"></div></div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ROBO</p>
          <h1 id="ov-title">狂扫</h1>
          <p class="lead" id="ov-lead">双摇杆边走边射，救出人类叠倍率。<br />清光一波再进下一波。碰到机兵就掉命。</p>
          <p class="ops" id="ov-ops">WASD / 方向键走 · 鼠标瞄准点射或 IJKL 射 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-sweep">扫荡</button>
            <button type="button" id="btn-guard">护人</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">WASD 走 · 鼠标或 IJKL 射 · 救人叠倍率 · 清波</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
