<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>月巡 · MOON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cellipse cx='24' cy='7' rx='4.2' ry='4.2' fill='%23ffe36b' opacity='.85'/%3E%3Cpath d='M2 22 Q8 18 16 22 Q24 26 30 20 L30 30 L2 30 Z' fill='%23142848'/%3E%3Cpath d='M2 22 Q8 18 16 22 Q24 26 30 20' fill='none' stroke='%233db8ff' stroke-width='1.4'/%3E%3Cpath d='M10 22 Q13 19 16 22' fill='none' stroke='%2305030c' stroke-width='2.4'/%3E%3Crect x='7' y='16.2' width='11' height='5' rx='1.2' fill='%2300f0ff'/%3E%3Ccircle cx='9.2' cy='21.4' r='1.6' fill='%23c9e8ff'/%3E%3Ccircle cx='16' cy='21.4' r='1.6' fill='%23c9e8ff'/%3E%3Crect x='14.4' y='14.2' width='3.2' height='2.4' rx='.4' fill='%23ff3db8'/%3E%3Cellipse cx='22' cy='11' rx='3.2' ry='1.4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>月巡</b>
        <span>MOON</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="dist-box">
            <em>距离</em>
            <b id="dist">0</b>
          </div>
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">经典</span>
          <span id="sec-label">路段 A</span>
          <div class="fill" id="course-wrap" title="路段">
            <em>程</em>
            <div class="fill-track" aria-hidden="true"><i id="course-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="月巡，月面车巡航，跳过陨坑并射击飞碟"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-shot" aria-label="射击">射</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MOON</p>
          <h1 id="ov-title">月巡</h1>
          <p class="lead" id="ov-lead">月面车自己往前开。空格跳过陨坑，Z 同时打天上和地上。栽进坑里就炸。</p>
          <p class="ops" id="ov-ops">空格 / 上 跳 · Z / 点按 双炮 · 触屏 跳/射 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-dash">疾驰</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">跳过陨坑 · 双炮打飞碟和石头 · 炸弹会炸出新坑</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
