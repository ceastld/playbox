<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120704" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>钉枪 · GNAI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120704'/%3E%3Cpath d='M16 3l2.2 7.2 6.2-1.6-4.2 5.4 5.8 3.2-7 .4 1.2 6.8-4.2-5.4-4.2 5.4 1.2-6.8-7-.4 5.8-3.2-4.2-5.4 6.2 1.6z' fill='%23ff4a14'/%3E%3Cpath d='M16 6l1.4 4.6 4.2-1-2.8 3.6 4 2.2-4.6.2.8 4.6-3-3.6-3 3.6.8-4.6-4.6-.2 4-2.2-2.8-3.6 4.2 1z' fill='%23ffd45a'/%3E%3Crect x='14.7' y='16' width='2.6' height='12' rx='.6' fill='%238ec8e0'/%3E%3Crect x='13.4' y='26.4' width='5.2' height='2.2' rx='.4' fill='%23ffe8c8'/%3E%3Ccircle cx='8' cy='22' r='2.4' fill='%23ff4a14'/%3E%3Ccircle cx='24' cy='22' r='2.4' fill='%23ff4a14'/%3E%3Ccircle cx='8' cy='22' r='.9' fill='%238ec8e0'/%3E%3Ccircle cx='24' cy='22' r='.9' fill='%238ec8e0'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>钉枪</b>
        <span>GNAI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">钉射</span>
          <span id="jia-label" class="jia">甲 ×4</span>
          <div class="fill" id="jia-wrap" title="多重甲">
            <em>甲</em>
            <div class="fill-track" aria-hidden="true"><i id="jia-bar"></i></div>
          </div>
          <span id="wpn-label" class="wpn">直钉</span>
          <span id="bomb-label" class="bombs">雨 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="钢雨">雨</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="钉枪游戏区，纵向卷轴，空格钉射，Shift 钢雨"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="钢雨">雨</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GNAI</p>
          <h1 id="ov-title">钉枪</h1>
          <p class="lead" id="ov-lead">多重甲。甲越少倍率越高。双钉不散。先砧甲，再钉核。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · Shift / Z 钢雨 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-nail">钉射</button>
            <button type="button" id="btn-rain">钢雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格钉射 · Shift 钢雨 · 甲少分高 · 双钉不散</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
