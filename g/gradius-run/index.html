<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#04121c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>秘武 · GRADIUS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304121c'/%3E%3Cpath d='M4 6h24v3H4zM4 23h24v3H4z' fill='%23081c28'/%3E%3Cpath d='M4 9h24M4 23h24' stroke='%231ad0ff' stroke-width='1.1'/%3E%3Cpath d='M6 16l10-3.4V19.4z' fill='%231ad0ff'/%3E%3Crect x='11' y='14.1' width='8' height='3.8' rx='.6' fill='%23e8f6ff'/%3E%3Ccircle cx='23' cy='16' r='2.6' fill='%23ffb84a'/%3E%3Ccircle cx='23' cy='16' r='1.1' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>秘武</b>
        <span>GRADIUS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">远征</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
        <div class="pwr" id="pwr" role="group" aria-label="武装槽">
          <span class="slot" data-id="speed">速</span>
          <span class="slot" data-id="missile">导</span>
          <span class="slot" data-id="double">双</span>
          <span class="slot" data-id="laser">激</span>
          <span class="slot" data-id="option">分</span>
          <span class="slot shield" data-id="shield">盾</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-pow" title="C" aria-label="点选武装">选</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="秘武游戏区，横向卷轴，空格射击，C 点选武装槽"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="点选武装">选</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GRADIUS</p>
          <h1 id="ov-title">秘武</h1>
          <p class="lead" id="ov-lead">吃胶囊推进武装槽，按 C 点选。分身跟着你打。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · C 点选 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">远征</button>
            <button type="button" id="btn-bare">无护</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">吃胶囊推进武装槽 · C 点选 · 分身抄你的弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
