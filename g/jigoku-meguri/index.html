<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140604" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>狱巡 · JGMG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140604'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ff2e14' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23ffd24a' stroke-width='1.1'/%3E%3Cpath d='M16 6l3.2 8.2H24l-6.4 4.6 2.4 8-6-4.4-6 4.4 2.4-8L8 14.2h4.8z' fill='%23ff7a22'/%3E%3Ccircle cx='16' cy='15' r='2.1' fill='%232ee8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>狱巡</b>
        <span>JGMG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">血池</span>
          <span id="tag-label">狱巡</span>
          <span id="bomb-label" class="bomb-badge">轮 ×3</span>
          <div class="fill" id="bead-wrap" title="魂珠">
            <em>魂</em>
            <div class="fill-track" aria-hidden="true"><i id="bead-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="狱轮">轮</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="狱巡游戏区，八向飞行，空格射击，Shift 放狱轮"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="狱轮">轮</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">JGMG</p>
          <h1 id="ov-title">狱巡</h1>
          <p class="lead" id="ov-lead">纵飞三层狱。空格连射，Shift 放狱轮吸弹。击破留狱印，轮碾印会连环炸。短关之后是阎罗。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 狱轮 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-tour">狱巡</button>
            <button type="button" id="btn-core">狱核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再巡</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · Shift 狱轮吸弹 · 碾印连环</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
