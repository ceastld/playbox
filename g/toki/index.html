<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0e0803" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>猿人 · TOKI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230e0803'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23160e06' stroke='%23ff7a14' stroke-width='1.4'/%3E%3Ccircle cx='24' cy='9' r='3.6' fill='%23ffb056' opacity='.8'/%3E%3Cpath d='M4 24h24' stroke='%233dff7a' stroke-width='1.1' opacity='.4'/%3E%3Cellipse cx='12' cy='14' rx='4.2' ry='3.8' fill='%23c87838'/%3E%3Cellipse cx='13.2' cy='15.2' rx='2.4' ry='1.6' fill='%23e8b888'/%3E%3Crect x='9.4' y='17.2' width='5.6' height='6.4' rx='1.2' fill='%23a05828'/%3E%3Cpath d='M16.4 16.4l7-1 1.6 2.4-6.2 1.2z' fill='%23ff7a14'/%3E%3Ccircle cx='22' cy='16' r='1.8' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>猿人</b>
        <span>TOKI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">密林</span>
          <span id="tag-label">救美</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span id="flame-label" class="flame hidden">烈火</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-save" aria-pressed="true">救美</button>
          <button type="button" id="mode-tide" aria-pressed="false">兽潮</button>
        </div>
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="猿人，侧向跑跳，空格吐火球，水里游，尽头救美"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-spit" aria-label="吐火">喷</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TOKI</p>
          <h1 id="ov-title">猿人</h1>
          <p class="lead" id="ov-lead">被咒成猿，吐火开路。水潭里游，坑要跳过。<br />挨打掉体，体空丢命。尽头把人救出来。</p>
          <p class="ops" id="ov-ops">方向键 / D 走跳 · 空格吐火 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-save">救美</button>
            <button type="button" id="btn-tide">兽潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · 空格吐火 · 水里游 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
