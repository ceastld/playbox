<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>炸跳 · JACK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='26' width='26' height='3' rx='1' fill='%23ffd21a'/%3E%3Crect x='5' y='16' width='8' height='2' fill='%23ffe56a'/%3E%3Crect x='19' y='11' width='8' height='2' fill='%23ffe56a'/%3E%3Ccircle cx='10' cy='22' r='2.2' fill='%23ff4a5c'/%3E%3Ccircle cx='22' cy='8' r='2.2' fill='%23ff9a28'/%3E%3Cpath d='M16 20c2-3 3-6 2-9' stroke='%23ffd21a' stroke-width='1.6' fill='none'/%3E%3Ccircle cx='17' cy='10' r='2.4' fill='%23ffe56a'/%3E%3Cpath d='M15 12c-3 2-4 5-3 7' stroke='%23ff3db8' stroke-width='1.2' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>炸跳</b>
        <span>JACK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连收</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">排弹</span>
          <div class="fill power" id="power-wrap" title="能力">
            <em id="power-lab">能</em>
            <div class="fill-track" aria-hidden="true"><i id="power-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="炸跳，高跳收弹，亮的连收"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-down" aria-label="快落">下</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">JACK</p>
          <h1 id="ov-title">炸跳</h1>
          <p class="lead" id="ov-lead">跳得老高，按亮的炸弹收。连着收才有奖励。鸟和木乃伊会追，碰到就丢命。</p>
          <p class="ops" id="ov-ops">← → / D 走 · 空格 / W 跳，空中再按悬停 · S 快落 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-stage">排弹</button>
            <button type="button" id="btn-rush">连收</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">收亮的弹 · 空格跳，空中再按悬停 · 能力币：冻结或再跳</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
