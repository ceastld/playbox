<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>涟步 · RIPPLE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M2 26h28' stroke='%23ff3db8' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M2 6h28' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='18' r='9' fill='none' stroke='%2300f0ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='18' r='5' fill='none' stroke='%23ff3db8' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='12' r='2.2' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>涟步</b>
        <span>RIPPLE</span>
      </div>
      <div class="status">
        <span id="stage-label">十岸</span>
        <div class="row">
          <span id="left-label">踏环过河</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="涟步过河"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RIPPLE</p>
          <h1 id="ov-title">涟步</h1>
          <p class="lead" id="ov-lead">只踩在扩散的涟漪环上过河。<br />空水会吞人，岸与石头能站。</p>
          <p class="ops" id="ov-ops">WASD / 方向键移动 · 按住拖向落点 · M 静音</p>
          <button type="button" id="ov-btn">踏浪</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">环会往外推你 · 浪到岸边再踩</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
