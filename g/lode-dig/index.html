<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>矿掘 · DIG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%230c0804' stroke='%23ffe36b' stroke-width='1.3'/%3E%3Crect x='7' y='14' width='18' height='11' fill='%23a86a18'/%3E%3Crect x='7' y='18' width='18' height='7' fill='%23784810'/%3E%3Cpath d='M15 8h2v6h-2z' fill='%2300f0ff'/%3E%3Ccircle cx='16' cy='8.2' r='2.1' fill='%23ffe36b'/%3E%3Ccircle cx='11' cy='21' r='2.3' fill='%23ff3db8'/%3E%3Ccircle cx='22' cy='22' r='2' fill='%233dff88'/%3E%3Crect x='19' y='12' width='4.2' height='3.4' rx='.8' fill='%238a96b8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>矿掘</b>
        <span>DIG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em id="round-em">关</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box" hidden>
            <em>连爆</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">闯关</span>
          <div class="fill" id="pump-wrap" hidden title="泵压">
            <em>泵</em>
            <div class="fill-track" aria-hidden="true"><i id="pump-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <div class="board" id="board">
          <canvas id="c" tabindex="0" role="application" aria-label="矿掘，挖掘土层，对准怪物按住空格泵到爆"></canvas>
        </div>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-pump" aria-label="泵">泵</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DIG</p>
          <h1 id="ov-title">矿掘</h1>
          <p class="lead" id="ov-lead">挖开土层，把地下怪物泵到爆。泵才是爽点。</p>
          <p class="ops" id="ov-ops">方向键或 WASD 挖 · 空格按住泵 · 触屏滑向 + 泵 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rooms">闯关</button>
            <button type="button" id="btn-endless">无尽</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">挖隧道 · 空格按住把怪泵爆 · 掏空岩石脚下会砸下来</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
