<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>魂斗2 · CTR2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120804'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231a0c06' stroke='%23ff4a12' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23ffe36b' stroke-width='1.2' opacity='.5'/%3E%3Crect x='20' y='8' width='8' height='16' rx='1' fill='%23201810' stroke='%23ff4a12' stroke-width='.7'/%3E%3Crect x='18' y='18' width='12' height='3' fill='%2300f0ff'/%3E%3Ccircle cx='12' cy='14' r='3.4' fill='%23ffe36b'/%3E%3Crect x='9.6' y='17' width='5' height='6.2' rx='.8' fill='%23ff4a12'/%3E%3Crect x='14.2' y='16.2' width='8' height='1.5' rx='.3' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>魂斗2</b>
        <span>CTR2</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">钢巷</span>
          <span id="tag-label">魂斗2</span>
          <span id="gun-label" class="gun">步枪</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-stage" aria-pressed="true">魂斗2</button>
          <button type="button" id="mode-core" aria-pressed="false">魂核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="魂斗2，侧向跑跳开火，捡散弹激光，躲坠物打核门"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-duck" aria-label="蹲下">蹲</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CTR2</p>
          <h1 id="ov-title">魂斗2</h1>
          <p class="lead" id="ov-lead">侧向跑跳开火。捡散弹 / 激光。<br />中弹即死，坠物砸中丢命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走蹲瞄 · Shift/Z 跳 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-stage">魂斗2</button>
            <button type="button" id="btn-core">魂核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走蹲瞄 · Shift/Z 跳 · 空格开火 · 捡 S/L · 坠物砸中丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
