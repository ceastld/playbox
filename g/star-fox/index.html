<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140c08" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星狐 · SFOX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140c08'/%3E%3Cpath d='M4 22 L16 10 L28 22 V28 H4Z' fill='%23241810'/%3E%3Cpath d='M16 8l5 10h-10z' fill='%23ffe8d0'/%3E%3Cpath d='M8 18 L16 12 L24 18 L20 20 H12Z' fill='%23ff6b22'/%3E%3Cpath d='M12 20h8l-2 3h-4z' fill='%235cff9a'/%3E%3Crect x='14.2' y='20' width='3.6' height='6' rx='.5' fill='%23fff4ea'/%3E%3Cpath d='M14.4 26l1.6 4 1.6-4' fill='%23ff6b22'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星狐</b>
        <span>SFOX</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">草星</span>
          <span id="tag-label">星核</span>
          <div class="fill" id="prog-wrap" title="关卡进度">
            <em>程</em>
            <div class="fill-track" aria-hidden="true"><i id="prog-bar"></i></div>
          </div>
          <div class="fill boost" id="boost-wrap" title="推进">
            <em>冲</em>
            <div class="fill-track" aria-hidden="true"><i id="boost-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-boost" title="Z / Shift" aria-label="推进">冲</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星狐，沿轨飞，躲弹开火，推进冲关，短关之后是头目"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SFOX</p>
          <h1 id="ov-title">星狐</h1>
          <p class="lead" id="ov-lead">沿轨飞。躲弹开火，撞了扣命。短关之后是头目。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格开火 · Shift / Z 推进 · 连点左右 桶滚 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-core">星核</button>
            <button type="button" id="btn-chaos">乱轨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格开火 · Shift 推进 · 连点左右桶滚 · 撞了扣命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
