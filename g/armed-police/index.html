<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140a06" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>武警 · BATR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140a06'/%3E%3Cellipse cx='16' cy='8' rx='3.2' ry='4.4' fill='%23ffb428'/%3E%3Crect x='13.4' y='10' width='5.2' height='12' rx='1.4' fill='%23ffe36b'/%3E%3Cellipse cx='16' cy='24' rx='3.6' ry='4.8' fill='%23ff8a22'/%3E%3Ccircle cx='16' cy='13' r='2.2' fill='%23fff4e4'/%3E%3Cpath d='M10 18l-3 6 5-2zM22 18l3 6-5-2z' fill='%233ad8ff'/%3E%3Crect x='15.2' y='6' width='1.6' height='4' fill='%23fff4e4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>武警</b>
        <span>BATR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">巡空</span>
          <span id="pwr-label" class="pwr">翼 0</span>
          <div class="fill" id="pwr-wrap" title="翼力">
            <em>翼</em>
            <div class="fill-track" aria-hidden="true"><i id="pwr-bar"></i></div>
          </div>
          <span id="bomb-label" class="bombs">警 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="警笛爆">警</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="武警游戏区，纵向卷轴摩托，空格射击，Shift 扔警笛爆"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="警笛爆">警</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BATR</p>
          <h1 id="ov-title">武警</h1>
          <p class="lead" id="ov-lead">夜城骑摩托巡空。吃 翼 出边车，捡 徽 连击。短关之后是匪王摩托。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · Shift / Z 警笛爆 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-patrol">巡空</button>
            <button type="button" id="btn-dense">密弹</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · Shift 警笛爆 · 吃 翼 出边车 · 徽 续链</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
