<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120810" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>超燃2 · AB2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120810'/%3E%3Cpath d='M2 20 L16 12 L30 20 V28 H2Z' fill='%2318182c'/%3E%3Cpath d='M16 7l6 11h-12z' fill='%23ffe8d0'/%3E%3Cpath d='M7 17 L16 11 L25 17 L21 21 H11Z' fill='%23ff4a14'/%3E%3Crect x='11' y='19' width='3.2' height='5' rx='.4' fill='%23ff9a3c'/%3E%3Crect x='17.8' y='19' width='3.2' height='5' rx='.4' fill='%23ff9a3c'/%3E%3Cpath d='M12 24l4 6 4-6' fill='%23ff7a2a'/%3E%3Crect x='14' y='15' width='4' height='3' rx='.4' fill='%235ce8ff'/%3E%3Crect x='10' y='10' width='12' height='12' fill='none' stroke='%23ffe36b' stroke-width='1.1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>超燃2</b>
        <span>AB2</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">洋脊</span>
          <span id="tag-label">超燃2</span>
          <div class="fill" id="prog-wrap" title="关卡进度">
            <em>程</em>
            <div class="fill-track" aria-hidden="true"><i id="prog-bar"></i></div>
          </div>
          <span id="msl-label" class="msl" title="导弹">弹 14</span>
          <span id="lock-label" class="lock" hidden>锁</span>
          <span id="roll-label" class="roll" hidden>滚</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-msl" title="Shift" aria-label="导弹">弹</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="超燃2，侧滚锁定，机炮扫射，锁定后打导弹，撞机扣命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">AB2</p>
          <h1 id="ov-title">超燃2</h1>
          <p class="lead" id="ov-lead">侧滚锁定。机炮扫射，锁定后打导弹。撞机扣命。短关之后是头目波。</p>
          <p class="ops" id="ov-ops">方向 / WASD 侧滚 · 空格 / Z 机炮 · Shift 导弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-core">超燃2</button>
            <button type="button" id="btn-dense">燃核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向侧滚 · 空格机炮 · Shift 锁定导弹 · 撞了扣命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
