<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c1408" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>茨 · IBAR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c1408'/%3E%3Cpath d='M16 4l4 8-4 14-4-14z' fill='%238ce830'/%3E%3Cpath d='M16 8l2.4 6-2.4 8-2.4-8z' fill='%23e8ffd0'/%3E%3Ccircle cx='9' cy='18' r='3.1' fill='%23ff3d6e'/%3E%3Ccircle cx='23' cy='18' r='3.1' fill='%23ff3d6e'/%3E%3Cpath d='M16 16l2.2 3.2-2.2 4.2-2.2-4.2z' fill='%23ff3d6e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>茨</b>
        <span>IBAR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">荆城</span>
          <span id="medal-label" class="medal">玫 0</span>
          <div class="fill" id="thorn-wrap" title="茨芯">
            <em>茨</em>
            <div class="fill-track" aria-hidden="true"><i id="thorn-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="茨游戏区，纵向卷轴，空格射击，选项跟射，击破收玫"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">IBAR</p>
          <h1 id="ov-title">茨</h1>
          <p class="lead" id="ov-lead">空格点射，选项跟射。击破落玫，连收叠倍。荆城短关之后是茨王。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-city">荆城</button>
            <button type="button" id="btn-sea">弹海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格点射 · 选项跟射 · 击破收玫</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
