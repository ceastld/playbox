<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0903" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>仙境 · ALEX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0903'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23140e06' stroke='%23ffb01a' stroke-width='1.4'/%3E%3Crect x='20' y='8' width='8' height='8' rx='1' fill='%23ffe36b'/%3E%3Ctext x='24' y='15' text-anchor='middle' font-size='7' font-weight='700' fill='%23140e06'%3E%3F%3C/text%3E%3Ccircle cx='12' cy='12' r='3.2' fill='%23e8b090'/%3E%3Cpath d='M9 10l-2-3M15 10l2-3' stroke='%23e8b090' stroke-width='1.2'/%3E%3Crect x='9.4' y='15' width='5.4' height='7.2' rx='.8' fill='%23ff4a3a'/%3E%3Crect x='9.2' y='19' width='5.8' height='1.3' fill='%23ffe36b'/%3E%3Cpath d='M15 17l8 1-3 3z' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>仙境</b>
        <span>ALEX</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">奇村</span>
          <span id="tag-label">奇岛</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span id="coin-label">币 0</span>
          <span id="gear-label" class="gear hidden">力环</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-isle" aria-pressed="true">奇岛</button>
          <button type="button" id="mode-rush" aria-pressed="false">拳赛</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="仙境，侧向跑跳，Z 出拳砸块，踩头弹起，店里买装备"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-punch" aria-label="出拳">拳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ALEX</p>
          <h1 id="ov-title">仙境</h1>
          <p class="lead" id="ov-lead">出拳砸块，踩头弹起。店里买命、力环、摩托。<br />问号里有时藏蝎。尽头拳赛。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳 · Z 出拳 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-isle">奇岛</button>
            <button type="button" id="btn-rush">拳赛</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · Z 出拳砸块 · 踩头 · 店里买装备 · 挨打掉体</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
