<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#07100c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>阿历 · ALEX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307100c'/%3E%3Cpath d='M2 24 Q12 18 18 22 Q26 28 30 20 L30 32 L2 32 Z' fill='%230c1c14'/%3E%3Ccircle cx='13' cy='13' r='4.2' fill='%23ffe0b8'/%3E%3Cellipse cx='10.2' cy='13.2' rx='2.1' ry='2.6' fill='%23ffe0b8'/%3E%3Cellipse cx='15.8' cy='13.2' rx='2.1' ry='2.6' fill='%23ffe0b8'/%3E%3Cellipse cx='13' cy='10.2' rx='4.4' ry='2.2' fill='%23c4ff1a'/%3E%3Crect x='10.2' y='16.8' width='5.6' height='6.4' rx='.8' fill='%23ff3db8'/%3E%3Crect x='10' y='20.2' width='6' height='1.4' fill='%23e8ff6a'/%3E%3Cpath d='M16 18l9-1-2 5z' fill='%2300f0ff'/%3E%3Crect x='22' y='8' width='7' height='7' rx='1' fill='%23e8ff6a'/%3E%3Cpath d='M25.5 9.4l.7 1.5 1.6.2-1.2 1.1.3 1.6-1.4-.8-1.4.8.3-1.6-1.2-1.1 1.6-.2z' fill='%2307100c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>阿历</b>
        <span>ALEX</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">圣山</span>
          <span id="tag-label">阿历</span>
          <div class="fill" id="star-wrap" title="星拳">
            <em>星</em>
            <div class="fill-track" aria-hidden="true"><i id="star-bar"></i></div>
          </div>
          <span id="gold-label">金 0</span>
          <span id="gear-label" class="gear hidden">星拳</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-isle" aria-pressed="true">阿历</button>
          <button type="button" id="mode-core" aria-pressed="false">历核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="阿历，侧向跑跳出拳，空格出拳砸砖，上或 Z 跳，尽头猜拳对打"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-punch" aria-label="出拳">拳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ALEX</p>
          <h1 id="ov-title">阿历</h1>
          <p class="lead" id="ov-lead">出拳砸砖，尽头猜拳对打。空格出拳，上或 Z 跳。<br />撞敌、坠崖都丢命。星砖里有金袋、饭团、星拳，也有灵。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 上 / Z 跳 · 空格出拳 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-isle">阿历</button>
            <button type="button" id="btn-core">历核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">出拳砸砖 · 空格近拳 · 尽头猜拳 · 撞敌丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
