<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120604" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>魔铠 · GNG2</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120604'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23180804' stroke='%23ff5e14' stroke-width='1.4'/%3E%3Ccircle cx='24' cy='8' r='4' fill='%23ff8c3a' opacity='.75'/%3E%3Cpath d='M4 25h24' stroke='%236a2810' stroke-width='1.4' opacity='.7'/%3E%3Cpath d='M7 25 L9 10 h3 L14 25' fill='%231a0c06' stroke='%23ff5e14' stroke-width='.6'/%3E%3Ccircle cx='13' cy='13' r='3.1' fill='%23c8d0dc'/%3E%3Crect x='11.2' y='15.8' width='3.8' height='6.2' rx='.6' fill='%23c8d0dc'/%3E%3Crect x='11.4' y='19.6' width='3.4' height='2.2' fill='%23ff3a2a'/%3E%3Cpath d='M16 16 l4-4 4 4-4 4z' fill='none' stroke='%2300f0ff' stroke-width='1.3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>魔铠</b>
        <span>GNG2</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">坟岗</span>
          <span id="tag-label">魔铠</span>
          <span id="armor-label" class="armor">铠甲</span>
          <span id="gun-label" class="gun">长枪</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-run" aria-pressed="true">魔铠</button>
          <button type="button" id="mode-tide" aria-pressed="false">铠核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="魔铠，侧向走跳，空格丢枪，空中锁跳，铠甲碎了还能打"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="丢枪">投</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-duck" aria-label="蹲下">蹲</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GNG2</p>
          <h1 id="ov-title">魔铠</h1>
          <p class="lead" id="ov-lead">铠甲一打即碎，内裤再挨一击丢命。<br />空中锁跳，丢长枪、十字、火把，捡王冠过关。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · ↑/Z 跳 · 空格丢枪 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-run">魔铠</button>
            <button type="button" id="btn-tide">铠核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空中锁跳 · 空格丢枪 · 十字会折返 · 铠甲碎了还能打</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
