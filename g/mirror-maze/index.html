<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>镜廊 · MAZE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='6' y='4' width='20' height='24' rx='2' fill='none' stroke='%2300f0ff' stroke-width='2'/%3E%3Cpath d='M10 22 L16 10 L22 22' fill='none' stroke='%23ff3db8' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M8 8 L24 24' stroke='%2300f0ff' stroke-width='1.2' opacity='0.55'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>镜廊</b>
        <span>MAZE</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <div class="mem" id="time-wrap" title="时限">
            <em>时限</em>
            <div class="mem-track" aria-hidden="true"><i id="time-fill"></i></div>
          </div>
          <span id="axis-label">左右对折</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="镜廊迷宫"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad" aria-hidden="true">
        <span class="pad-cap">真身</span>
        <button type="button" id="btn-up" aria-label="真身上">上</button>
        <button type="button" id="btn-left" aria-label="真身左">左</button>
        <button type="button" id="btn-down" aria-label="真身下">下</button>
        <button type="button" id="btn-right" aria-label="真身右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MAZE</p>
          <h1 id="ov-title">镜廊</h1>
          <p class="lead" id="ov-lead">你看见的是镜像。方向驱动真身，镜子里的人走相反。<br />走进金色拱门。品红裂晶会把你撕碎。</p>
          <p class="ops" id="ov-ops">WASD / 方向键逐格 · 点镜面或滑动 · M 静音</p>
          <button type="button" id="ov-btn">进廊</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">看见的是镜像 · 实际走相反</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
