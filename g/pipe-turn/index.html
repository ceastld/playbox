<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>转管 · PIPES</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M4 16h8a4 4 0 0 1 4 4v6' fill='none' stroke='%23ff3db8' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M16 6v6a4 4 0 0 0 4 4h8' fill='none' stroke='%2300f0ff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>转管</b>
        <span>PIPES</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-flow" title="F">放水</button>
        <button type="button" id="btn-undo" title="Z">撤销</button>
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="转管棋盘"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PIPES</p>
          <h1 id="ov-title">转管</h1>
          <p class="lead" id="ov-lead">旋转管子，让品红的水接到青色出口。<br />水阀会开。湿管不能再转。</p>
          <p class="ops" id="ov-ops">点管旋转 · WASD 选格 · 空格旋转 · F 放水 · Z 撤销 · M 静音</p>
          <button type="button" id="ov-btn">开阀</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点管子顺时针转 90° · 接通后放水 · 湿管锁定</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
