<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#021018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>海空 · 1943</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23021018'/%3E%3Cpath d='M0 18c4 2 8-1 12 1 4 2 8-1 12 1 3 1 6 0 8 1v11H0z' fill='%23042838'/%3E%3Cpath d='M16 5l2 6h6l-4.8 3.6L21 21l-5-3.4L11 21l1.8-6.4L8 11h6z' fill='%2300b8ff'/%3E%3Crect x='6' y='22' width='20' height='3' rx='.4' fill='%2314e0c8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>海空</b>
        <span>1943</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">护航</span>
          <span id="weap-label" class="weap">弹0 散0 自0</span>
          <span id="roll-label" class="rolls">横滚</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
        <div class="energy" id="energy-box" aria-label="能量">
          <em>能量</em>
          <div class="energy-track"><i id="energy-fill"></i></div>
          <b id="energy-num">100</b>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-roll" title="C" aria-label="横滚">横滚</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="海空游戏区，八向飞，空格开火，C 横滚无敌，吃 POW 升火力或回能"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">1943</p>
          <h1 id="ov-title">海空</h1>
          <p class="lead" id="ov-lead">垂直卷轴。空格开火，C 横滚躲弹。能量耗尽或空能中弹会坠海。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格开火 · C 横滚 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-escort">护航</button>
            <button type="button" id="btn-chaos">乱战</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格开火 · C 横滚无敌 · 吃 POW 升火力或回能</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
