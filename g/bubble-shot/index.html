<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>泡弹 · BUBBLE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='11' cy='10' r='5' fill='%23ff3db8'/%3E%3Ccircle cx='20.2' cy='10' r='5' fill='%2300f0ff'/%3E%3Ccircle cx='15.6' cy='18' r='5' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='26.2' r='3.2' fill='%23b46cff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="mode-campaign">
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>泡弹</b>
        <span>BUBBLE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
          <div class="score time" id="time-box" hidden>
            <em>剩余</em>
            <b id="time">90</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">闯关</span>
          <span id="tag-label">BUBBLE</span>
          <span class="pips" id="pips" aria-label="距压顶剩余发射"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-campaign" aria-pressed="true" title="闯关清盘">闯关</button>
          <button type="button" id="mode-timed" aria-pressed="false" title="九十秒冲分">限时</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="泡弹，瞄准同色连成三颗以上炸掉，悬空的会掉下来"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BUBBLE</p>
          <h1 id="ov-title">泡弹</h1>
          <p class="lead" id="ov-lead">对上颜色就爆串。三颗同色炸掉，悬空的整串砸下来。</p>
          <p class="ops" id="ov-ops">瞄准点按或空格发射 · 方向键微调 · 天花板会往下压</p>
          <div class="ov-actions">
            <button type="button" id="ov-campaign">闯关</button>
            <button type="button" id="ov-timed">限时 90s</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">瞄准同色 · 三颗起爆 · 悬空坠落加分 · 还剩 3 发会警告压顶</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
