<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041410" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>泽泽 · XEXE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041410'/%3E%3Cpath d='M3 10c7 5 12-3 18 2 4 3 7 1 9-1' fill='none' stroke='%232ee8c0' stroke-width='1.2' opacity='.7'/%3E%3Cpath d='M3 22c8-4 13 4 21 0' fill='none' stroke='%237dffc8' stroke-width='1' opacity='.5'/%3E%3Cpath d='M4 16l11-4.2v8.4z' fill='%23e8fff8'/%3E%3Crect x='12' y='13.6' width='8' height='4.8' rx='.7' fill='%232ee8c0'/%3E%3Ccircle cx='24' cy='16' r='3.4' fill='%23ffe36b'/%3E%3Cpath d='M26 13c4-2 6 1 7 4M26 19c4 2 6-1 7-4' fill='none' stroke='%23ff4ea8' stroke-width='1.1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>泽泽</b>
        <span>XEXE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">潮庭</span>
          <span id="tag-label">泽泽</span>
          <span id="grab-label" class="grab">触</span>
          <span id="pow-label" class="pow">火 1</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-grab" title="Shift / Z" aria-label="抓触核">抓</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="泽泽游戏区，横向卷轴，空格射击，Shift 抓放触核"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="抓触核">抓</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">XEXE</p>
          <h1 id="ov-title">泽泽</h1>
          <p class="lead" id="ov-lead">横版活体卷轴。空格连射，Shift 把触核甩出去抓敌。接回时触手会扫弹。撞机、中弹、擦壁都掉命。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 抓 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-xexex">泽泽</button>
            <button type="button" id="btn-core">触核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · Shift 甩触核抓敌 · 接回扫弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
