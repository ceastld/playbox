<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>时航 · PILOT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='16' cy='16' r='13' fill='none' stroke='%239b5cff' stroke-width='1.2' opacity='.7'/%3E%3Cpath d='M16 6l3.2 8.2 8.8.4-7.2 5.2 2.8 8.2L16 23.2 8.4 28l2.8-8.2L4 14.6l8.8-.4z' fill='%2300f0ff'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>时航</b>
        <span>PILOT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">1910</span>
          <span id="tag-label">编年</span>
          <div class="fill quota" id="quota-wrap" title="击坠进度">
            <em id="quota-em">击坠</em>
            <div class="fill-track" aria-hidden="true"><i id="quota-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="时航游戏区，飞机始终向前飞，左右转向，空格开火，打编队和旗舰跃迁纪元"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PILOT</p>
          <h1 id="ov-title">时航</h1>
          <p class="lead" id="ov-lead">机头永远向前。转向开火，打掉编队再击坠旗舰，跃迁下一纪元。</p>
          <p class="ops" id="ov-ops">← → / A D 转向 · 空格开火 · 点按瞄准 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-era">编年</button>
            <button type="button" id="btn-chaos">乱世</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · 空格开火 · 天幕四面环绕 · 打满再轰旗舰即可跃迁</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
