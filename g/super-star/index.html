<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#03141c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>超武 · SSOL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303141c'/%3E%3Cpath d='M16 3l2.8 8.2H27l-6.6 4.8 2.5 8-6.9-5-6.9 5 2.5-8L5 11.2h8.2z' fill='%230ac2ff'/%3E%3Cpath d='M16 8l1.6 4.8H23l-4.4 3.2 1.6 5.2L16 18.4l-4.2 2.8 1.6-5.2-4.4-3.2h5.4z' fill='%23e8fbff'/%3E%3Crect x='14.7' y='17' width='2.6' height='8' fill='%23ffe36b'/%3E%3Cpath d='M8 20l3 2-3 2zM24 20l-3 2 3 2z' fill='%235ce8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>超武</b>
        <span>SSOL</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">超武</span>
          <span id="wpn-label" class="wpn">五</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="星爆">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="超武游戏区，八向飞行，空格射击，Shift 星爆，捡星核切武装"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="星爆">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SSOL</p>
          <h1 id="ov-title">超武</h1>
          <p class="lead" id="ov-lead">纵向卷轴。五向星弹是招牌。捡星核切五向、星束、追星。翼炮随火力张开。中型星卫后是关底。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格开火 · Shift / Z 星爆 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">超武</button>
            <button type="button" id="btn-storm">星核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格开火 · Shift 星爆 · 捡 五/束/追</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
