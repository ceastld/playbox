<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#100c06" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>剑锋 · RAPR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100c06'/%3E%3Cpath d='M16 2l1.4 18h-2.8z' fill='%23ffe36b'/%3E%3Cpath d='M16 2l.7 18h-1.4z' fill='%23fff6d0'/%3E%3Crect x='13.2' y='19' width='5.6' height='2.2' rx='.4' fill='%23ff9a1a'/%3E%3Cpath d='M16 22l6 8h-4l-2-3.2-2 3.2h-4z' fill='%23f5c412'/%3E%3Cpath d='M16 23.2l2.8 4.4h-5.6z' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>剑锋</b>
        <span>RAPR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">锋廊</span>
          <span id="tag-label">剑锋</span>
          <div class="fill" id="pierce-wrap" title="贯穿">
            <em>刺</em>
            <div class="fill-track" aria-hidden="true"><i id="pierce-bar"></i></div>
          </div>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="剑锋游戏区，八向飞行，空格贯穿刺束，Shift 爆弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RAPR</p>
          <h1 id="ov-title">剑锋</h1>
          <p class="lead" id="ov-lead">把剑锋对准编队，一刺穿过去。撞机掉命。短关之后是锋核。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格贯穿刺束 · Shift / Z 爆弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rapier">剑锋</button>
            <button type="button" id="btn-core">锋核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">对准编队 · 空格一刺穿过去 · Shift 爆弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
