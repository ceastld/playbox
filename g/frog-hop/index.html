<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>蛙路 · FROG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%230a160e' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Cellipse cx='16' cy='18' rx='7.2' ry='6' fill='%233dff88'/%3E%3Ccircle cx='13.2' cy='14.2' r='2.1' fill='%233dff88'/%3E%3Ccircle cx='18.8' cy='14.2' r='2.1' fill='%233dff88'/%3E%3Ccircle cx='13.4' cy='14' r='0.85' fill='%2305030c'/%3E%3Ccircle cx='19' cy='14' r='0.85' fill='%2305030c'/%3E%3Crect x='6' y='22' width='6' height='2.2' rx='1' fill='%23ff3db8'/%3E%3Crect x='20' y='9' width='7' height='2' rx='1' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>蛙路</b>
        <span>FROG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>轮</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连跳</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">经典</span>
          <div class="fill time" id="time-wrap" title="时限">
            <em>时</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="蛙路棋盘，过马路过河，填满五个家"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FROG</p>
          <h1 id="ov-title">蛙路</h1>
          <p class="lead" id="ov-lead">过马路过河，别被撞。填满五个家。</p>
          <p class="ops" id="ov-ops">方向键或滑动起跳 · 点一下向前 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-night">夜路</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向键或滑动 · 车撞即死 · 水要踩木 · 龟会沉</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
