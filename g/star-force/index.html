<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#030a14" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星力 · FORCE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23030a14'/%3E%3Crect x='0' y='18' width='32' height='14' fill='%23071420'/%3E%3Cpath d='M4 22h6v6H4zm10-3h8v9h-8zm12 4h5v5h-5z' fill='%230c2438'/%3E%3Crect x='14' y='24' width='4' height='3' fill='%23ffe36b' opacity='.85'/%3E%3Cpath d='M16 6l3 8h6l-5 4 2 7-6-4-6 4 2-7-5-4h6z' fill='%233aa0ff'/%3E%3Crect x='14.6' y='4' width='2.8' height='6' rx='.4' fill='%236ad4ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星力</b>
        <span>FORCE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">推进</span>
          <span id="sol-label" class="sol">SOL ···</span>
          <span id="lane-label" class="lane" hidden>加速</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星力游戏区，垂直卷轴，空格同时打空中和地面，重叠射击点亮隐藏板块"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FORCE</p>
          <h1 id="ov-title">星力</h1>
          <p class="lead" id="ov-lead">垂直卷轴。空格同时打空中和地面。重叠射击点亮隐藏板块。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-push">推进</button>
            <button type="button" id="btn-rush">急袭</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格打空+地 · 重叠射击点亮隐藏板块</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
