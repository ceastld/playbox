<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>斟茶 · POUR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cellipse cx='11' cy='13' rx='6.2' ry='5.4' fill='none' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Cpath d='M16.4 11.2c3.2-1 7.2.4 8.4 2.6' fill='none' stroke='%2300f0ff' stroke-width='1.4' stroke-linecap='round'/%3E%3Cpath d='M5.4 12c-2.2 1.4-2.4 4.6.2 5.8' fill='none' stroke='%23ff3db8' stroke-width='1.4'/%3E%3Cpath d='M22 16.4c.4 2.2 1.2 5.6 1.6 8' stroke='%23ffe36b' stroke-width='1.3' stroke-linecap='round'/%3E%3Cpath d='M12 23.2h14.5l-1.6 6.2H14z' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Cpath d='M13.2 27.2h10.2' stroke='%23ff3db8' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>斟茶</b>
        <span>POUR</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="茶面">
          <em>茶</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
            <span class="zone" id="fill-zone"></span>
            <s id="fill-mark"></s>
          </div>
          <b id="fill-num">0</b>
        </div>
        <div class="row">
          <span id="stage-label">十盏</span>
          <span id="left-label">到线松</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="斟茶倒水"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">POUR</p>
          <h1 id="ov-title">斟茶</h1>
          <p class="lead" id="ov-lead">按住把茶倒到水位线。<br />洒出杯口，这一盏作废。</p>
          <p class="ops" id="ov-ops">按住空格倒茶 · 点按画面 · M 静音</p>
          <button type="button" id="ov-btn">开斟</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">按住倒茶 · 到线松手</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
