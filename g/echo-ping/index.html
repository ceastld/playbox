<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>回声 · PING</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2300f0ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>回声</b>
        <span>PING</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <span class="pips" id="pips" aria-label="剩余声波"></span>
      </div>
      <div class="tools">
        <button type="button" id="btn-ping" title="空格">声波</button>
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry">重开</button>
      </div>
    </header>
    <div class="stage" id="stage">
      <canvas id="c"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay">
        <div class="panel">
          <p class="kicker" id="ov-kicker">PING</p>
          <h1 id="ov-title">回声</h1>
          <p class="lead" id="ov-lead">世界是黑的。发出声波，墙与危险亮起一瞬，随即没入暗处。在有限的回声里，走过十二段黑暗。</p>
          <p class="ops" id="ov-ops">WASD / 方向键移动 · 空格或点按发声波 · 拖拽也可移动 · M 静音</p>
          <button type="button" id="ov-btn">开始</button>
        </div>
      </div>
    </div>
    <footer class="hint" id="hint">WASD 移动 · 空格发声波 · 拖拽移动 · M 静音</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
