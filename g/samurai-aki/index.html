<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140404" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>侍秋 · SAKI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140404'/%3E%3Ccircle cx='22' cy='9' r='5' fill='%23ff3a1a' opacity='.85'/%3E%3Cpath d='M6 24c5-8 8-6 11-12 2 5 5 3 9 10' fill='none' stroke='%23ffe36b' stroke-width='1.4'/%3E%3Cpath d='M8 22l16-9' stroke='%23ff6a3a' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='26' r='2.2' fill='%23ff6a2a'/%3E%3Ccircle cx='16' cy='27' r='1.6' fill='%23ff3a1a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>侍秋</b>
        <span>SAKI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连斩</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 局</span>
          <span id="tag-label">秋叶</span>
          <div class="fill" id="hp-wrap" title="己方体力">
            <em>己</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill foe" id="foe-wrap" title="对手体力">
            <em id="foe-name">叶侍</em>
            <div class="fill-track" aria-hidden="true"><i id="foe-bar"></i></div>
          </div>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="侍秋，一对一拔刀，空格斩，Shift 格挡，双点方向闪步"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-slash" aria-label="斩">斩</button>
        <button type="button" id="btn-parry" aria-label="格挡">挡</button>
        <button type="button" id="btn-step" aria-label="闪步">闪</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SAKI</p>
          <h1 id="ov-title">侍秋</h1>
          <p class="lead" id="ov-lead">对面只有一个剑士。空格斩，Shift 格挡，双点闪步。过三局再打秋王。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 空格斩 · Shift / Z 格挡 · 双点闪步 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-aki">秋叶</button>
            <button type="button" id="btn-blood">血月</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格斩 · Shift 挡 · 双点方向闪步 · 体力打空本局结束</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
