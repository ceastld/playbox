<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0504" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星火 · FIRE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0504'/%3E%3Cpath d='M4 8 L8 6 H24 L28 8 L28 22 L16 26 L4 22Z' fill='none' stroke='%23ff5a20' stroke-width='1.1'/%3E%3Cpath d='M4 8 L16 16 L28 8 M4 22 L16 16 L28 22' fill='none' stroke='%23ffe36b' stroke-width='.7'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='none' stroke='%2300f0ff' stroke-width='.9'/%3E%3Cpath d='M8 12 L10 16 L8 20 M24 12 L22 16 L24 20' fill='none' stroke='%23ff5a20' stroke-width='.8'/%3E%3Ccircle cx='8' cy='26' r='3' fill='none' stroke='%23ff5a20' stroke-width='.7'/%3E%3Ccircle cx='8' cy='26' r='.7' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星火</b>
        <span>FIRE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 波</span>
          <span id="tag-label">巡航</span>
          <div class="fill" id="shield-wrap" title="护盾">
            <em>盾</em>
            <div class="fill-track" aria-hidden="true"><i id="shield-bar"></i></div>
          </div>
          <div class="fill heat" id="heat-wrap" title="过热">
            <em>热</em>
            <div class="fill-track" aria-hidden="true"><i id="heat-bar"></i></div>
          </div>
          <span id="msl-label" class="msl" title="导弹">弹 6</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-msl" title="Shift / Z" aria-label="导弹">弹</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星火，第一人称座舱。方向瞄准，空格激光，Shift 锁定导弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FIRE</p>
          <h1 id="ov-title">星火</h1>
          <p class="lead" id="ov-lead">座舱里开火。激光打战机，锁定后导弹追击。雷达找敌，护盾打空再扣命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 瞄准 · 空格激光 · Shift 导弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-cruise">巡航</button>
            <button type="button" id="btn-net">火网</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向瞄准 · 空格激光 · Shift 锁定导弹 · 雷达找敌</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
