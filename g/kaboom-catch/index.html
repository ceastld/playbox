<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>接弹 · KABOOM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='16' cy='12' r='6.2' fill='%23201824'/%3E%3Ccircle cx='16' cy='12' r='6.2' fill='none' stroke='%23ff4a2e' stroke-width='1.4'/%3E%3Cpath d='M16 6.2 L18.4 2.2' stroke='%23ffe36b' stroke-width='1.3' stroke-linecap='round'/%3E%3Ccircle cx='18.6' cy='1.8' r='1.2' fill='%23ff4a2e'/%3E%3Cpath d='M8 24 L11 18 H21 L24 24 Z' fill='%2300f0ff' opacity='.9'/%3E%3Cpath d='M9.4 24 L11.6 20.2 H20.4 L22.6 24 Z' fill='%23081420'/%3E%3Cpath d='M10.6 24 L12.2 21.4 H19.8 L21.4 24 Z' fill='%2300f0ff' opacity='.45'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>接弹</b>
        <span>KABOOM</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>得分</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">接弹</span>
          <span id="tag-label">KABOOM</span>
          <span id="wave-label">—</span>
          <span class="pips" id="pips" aria-label="剩余水桶"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="接弹，用堆叠水桶接住下落的炸弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">KABOOM</p>
          <h1 id="ov-title">接弹</h1>
          <p class="lead" id="ov-lead">炸弹往下落，水桶往上接。<br />接得越稳越快，漏一发少一桶。</p>
          <p class="ops" id="ov-ops">指针 / ← → 移动 · 漏接少一桶 · 暴雨列更多 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-storm">暴雨</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">指针移动 · 接住炸弹 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
