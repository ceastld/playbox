<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0302" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>功夫 · KUNG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0302'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23140808' stroke='%23ff4a1a' stroke-width='1.4'/%3E%3Cpath d='M5 25h22' stroke='%23ff4a1a' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='13' cy='11' r='3.2' fill='%23e8b090'/%3E%3Crect x='10.4' y='14' width='5.4' height='8' rx='.8' fill='%23f4f0e8'/%3E%3Crect x='10.2' y='19' width='5.8' height='1.4' fill='%23ff4a1a'/%3E%3Cpath d='M16 16l8-1-4 3z' fill='%2300f0ff'/%3E%3Crect x='10.6' y='22' width='2' height='3.4' fill='%23f4f0e8'/%3E%3Crect x='13.6' y='22' width='2' height='3.4' fill='%23f4f0e8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>功夫</b>
        <span>KUNG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="floor-label">一层</span>
          <span id="mode-label">五层</span>
          <div class="energy" id="energy" title="体力" aria-label="体力"></div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-five" aria-pressed="true">五层</button>
          <button type="button" id="mode-night" aria-pressed="false">夜袭</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="功夫，五层回廊一击必杀，拳踢跳，擒拿连打挣脱"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-punch" aria-label="出拳">拳</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
        <button type="button" id="btn-kick" aria-label="踢腿">踢</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">KUNG</p>
          <h1 id="ov-title">功夫</h1>
          <p class="lead" id="ov-lead">五层回廊，一击必杀。拳短踢长，跳踢打翻滚。<br />擒拿手要连打挣脱，顶层赤尊等你。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳 · Z 拳 · X 踢 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-five">五层</button>
            <button type="button" id="btn-night">夜袭</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">一击必杀 · 拳 Z · 踢 X · 擒拿连打挣脱 · 体力空丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
