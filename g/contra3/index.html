<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#160804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>魂斗3 · CTR3</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23160804'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231c0a06' stroke='%23ff5c12' stroke-width='1.4'/%3E%3Cpath d='M5 26h22' stroke='%23ffe36b' stroke-width='1.1' opacity='.4'/%3E%3Crect x='4' y='8' width='9' height='12' rx='1' fill='%2320140c' stroke='%23ff5c12' stroke-width='.6'/%3E%3Crect x='19' y='6' width='8' height='16' rx='1' fill='%231a100c' stroke='%2300f0ff' stroke-width='.6'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23ffe36b'/%3E%3Crect x='14.2' y='18.6' width='3.6' height='5' rx='.6' fill='%23ff5c12'/%3E%3Crect x='17.4' y='16.4' width='6' height='1.3' rx='.3' fill='%2300f0ff'/%3E%3Ccircle cx='24' cy='24' r='3.4' fill='%23ff5c12' opacity='.85'/%3E%3Ccircle cx='24' cy='24' r='1.4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>魂斗3</b>
        <span>CTR3</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">废路</span>
          <span id="tag-label">魂斗3</span>
          <span id="view-label" class="view">俯视</span>
          <span id="gun-label" class="gun">机枪</span>
          <span id="bomb-label" class="bomb">弹 3</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-stage" aria-pressed="true">魂斗3</button>
          <button type="button" id="mode-core" aria-pressed="false">魂核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="魂斗3，先俯视废路再侧向残城，空格开火，Shift 炸弹，撞车甲丢命"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-bomb" aria-label="炸弹">弹</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CTR3</p>
          <h1 id="ov-title">魂斗3</h1>
          <p class="lead" id="ov-lead">先俯冲废路，再侧向残城。机枪连射，炸弹清场。<br />撞上车甲立刻丢命，打穿三关拆基核。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 空格开火 · Shift/Z 炸弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-stage">魂斗3</button>
            <button type="button" id="btn-core">魂核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">俯视八向 · 侧向跳蹲 · 空格开火 · Shift/Z 炸弹 · 撞车甲丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
