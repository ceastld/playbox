<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>霜花 · FROST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='5' y='6' width='22' height='20' rx='2.4' fill='%23081220' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Cpath d='M16 9v14M9 16h14M11.2 11.2l9.6 9.6M20.8 11.2l-9.6 9.6' stroke='%237ad4ea' stroke-width='1.05' opacity='.55'/%3E%3Cpath d='M16 11.2v9.6M11.8 16h8.4M12.8 12.8l6.4 6.4M19.2 12.8l-6.4 6.4' stroke='%2300f0ff' stroke-width='1.15' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='2.1' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='16' r='0.8' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>霜花</b>
        <span>FROST</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="花纹覆盖">
          <em>霜</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0%</b>
        </div>
        <div class="row">
          <span id="stage-label">十窗</span>
          <span id="spill-label">溢 —</span>
          <span id="time-label">时 —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="引霜结成花纹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FROST</p>
          <h1 id="ov-title">霜花</h1>
          <p class="lead" id="ov-lead">窗玻璃上有淡青的花纹。把冷息挪到霜边，霜会跟着长。<br />沿花纹走，别让霜爬出淡影，也别碰到品红暖气。</p>
          <p class="ops" id="ov-ops">WASD / 方向键移冷息 · 点按或拖动画布 · M 静音</p>
          <button type="button" id="ov-btn">结霜</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">冷息引霜 · 沿淡青花纹长 · 别爬出窗外</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
