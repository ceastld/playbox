<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140c04" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>佣兵 · MRCS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140c04'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231c1006' stroke='%23ff9a14' stroke-width='1.4'/%3E%3Cpath d='M5 7v6M27 8v7M10 4v5M22 5v6' stroke='%232a5a18' stroke-width='1.5' opacity='.7'/%3E%3Crect x='8' y='11' width='10' height='5' rx='.8' fill='%236a4a24'/%3E%3Ccircle cx='16' cy='18' r='2.6' fill='%23ffe36b'/%3E%3Crect x='13.8' y='20.4' width='4.4' height='6' rx='.5' fill='%23ff9a14'/%3E%3Crect x='17.4' y='18.6' width='7' height='1.4' rx='.3' fill='%2300e8ff'/%3E%3Ccircle cx='24' cy='13' r='1.6' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>佣兵</b>
        <span>MRCS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">林道</span>
          <span id="tag-label">佣兵</span>
          <span id="gun-label" class="gun">步枪</span>
          <span id="nade-label" class="nade">雷 5</span>
          <div class="fill" id="boss-wrap" hidden title="关底">
            <em id="boss-name">铁甲</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-raid" aria-pressed="true">佣兵</button>
          <button type="button" id="mode-dense" aria-pressed="false">密林</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="佣兵，往上推进射击，手雷越过碉堡，撞上丢命"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-nade" aria-label="手雷">雷</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MRCS</p>
          <h1 id="ov-title">佣兵</h1>
          <p class="lead" id="ov-lead">往上推进、朝面向开火。碉堡挡住子弹，手雷越过沙袋砸开。救人补雷。撞上丢一条命。短关之后是关底。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 空格射击 · Shift / Z 手雷 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">佣兵</button>
            <button type="button" id="btn-dense">密林</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">八向走射 · 手雷越碉 · 救人补雷 · 撞上丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
