<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#02131c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>音爆 · SBOO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2302131c'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2300c8f5' stroke-width='1.1' opacity='.55'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%237edcff' stroke-width='.8' opacity='.7'/%3E%3Cpath d='M16 5l7 18-7-3.4L9 23z' fill='%2300c8f5'/%3E%3Cpath d='M16 11l3.2 9H12.8z' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>音爆</b>
        <span>SBOO</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">音爆</span>
          <span id="wpn-label" class="wpn">双针</span>
          <div class="fill" id="chg-wrap" title="音爆蓄力">
            <em>音</em>
            <div class="fill-track" aria-hidden="true"><i id="chg-bar"></i></div>
          </div>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="音爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="音爆游戏区，垂直卷轴，空格射击蓄音爆，Shift 音爆弹清弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-bomb" aria-label="音爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SBOO</p>
          <h1 id="ov-title">音爆</h1>
          <p class="lead" id="ov-lead">编队突波。空格连射并蓄音爆弧，弧过清弹。Shift 音爆弹扩环。潮湾穿浪，裂空钻峡，音壁破障。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击（蓄音爆）· Shift / Z 音爆弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-boom">音爆</button>
            <button type="button" id="btn-sea">云海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射蓄弧 · Shift 音爆弹清弹 · 吃 音 加编 吃 爆 补弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
