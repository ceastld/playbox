<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0904" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星战 · STAR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0904'/%3E%3Cpath d='M4 30 L13 10 H19 L28 30' fill='none' stroke='%23ffc44a' stroke-width='1.2'/%3E%3Cpath d='M9 30 L14 14 H18 L23 30' fill='none' stroke='%23ffe36b' stroke-width='.8'/%3E%3Crect x='14.2' y='7.6' width='3.6' height='2.8' fill='none' stroke='%235cffb0' stroke-width='.9'/%3E%3Cpath d='M16 18 L14.2 22 L17.8 22 Z' fill='%23ffc44a'/%3E%3Ccircle cx='8' cy='8' r='.7' fill='%23ff3d5c'/%3E%3Ccircle cx='24' cy='7' r='.6' fill='%23ff3d5c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星战</b>
        <span>STAR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">前哨</span>
          <span id="tag-label">星战</span>
          <div class="fill" id="prog-wrap" title="关卡进度">
            <em>程</em>
            <div class="fill-track" aria-hidden="true"><i id="prog-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星战，冲进星沟，打炮台，躲横梁，打进排热口"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">STAR</p>
          <h1 id="ov-title">星战</h1>
          <p class="lead" id="ov-lead">冲进星沟。打炮台，钻横梁缺口。撞壁扣命。几波之后打进排热口。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-core">星战</button>
            <button type="button" id="btn-dense">星核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格开火 · 躲梁打炮 · 撞了扣命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
