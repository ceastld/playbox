<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>双系 · TETHER</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='9' cy='16' r='4' fill='none' stroke='%23ff3db8' stroke-width='2'/%3E%3Ccircle cx='23' cy='16' r='4' fill='none' stroke='%2300f0ff' stroke-width='2'/%3E%3Cpath d='M13 16h6' stroke='%23ffe36b' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>双系</b>
        <span>TETHER</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="who-label">控 粉</span>
          <span id="time-label">—</span>
          <span class="meter" id="meter" aria-label="绳张力">
            <i id="meter-fill"></i>
          </span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-swap" title="Tab">切</button>
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="双系场地"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <div class="who">
          <button type="button" id="btn-mag" aria-label="控粉">粉</button>
          <button type="button" id="btn-cyn" aria-label="控青">青</button>
          <button type="button" id="btn-pad-swap" aria-label="切换角色">切</button>
        </div>
        <div class="dpad">
          <button type="button" id="btn-up" aria-label="上">上</button>
          <div class="mid">
            <button type="button" id="btn-left" aria-label="左">左</button>
            <button type="button" id="btn-right" aria-label="右">右</button>
          </div>
          <button type="button" id="btn-down" aria-label="下">下</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TETHER</p>
          <h1 id="ov-title">双系</h1>
          <p class="lead" id="ov-lead">两人被一根霓虹绳拴着。绳有极限，绷直就会把另一个人拽走。<br />粉站粉板，青站青板，同时亮起才算过关。</p>
          <p class="ops" id="ov-ops">WASD 粉 · 方向键 青 · Tab / 点角色切换 · 拖屏幕移动 · M 静音</p>
          <button type="button" id="ov-btn">系上</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">一次牵一个 · 绷直会拽人 · 两人上板</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
