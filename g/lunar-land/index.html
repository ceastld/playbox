<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>登月 · LAND</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0804'/%3E%3Ccircle cx='25' cy='7' r='3.2' fill='%2378c8ff'/%3E%3Cpath d='M2 22 Q8 16 14 20 Q20 26 30 18 L30 30 L2 30 Z' fill='%231a1208'/%3E%3Cpath d='M2 22 Q8 16 14 20 Q20 26 30 18' fill='none' stroke='%23ffb428' stroke-width='1.3'/%3E%3Crect x='18' y='22.2' width='8' height='1.6' fill='%23ffe36b'/%3E%3Cpath d='M15 12 L17.2 10.2 L19.4 12 L18.6 16.2 L15.8 16.2 Z' fill='none' stroke='%23ffe36b' stroke-width='1.2'/%3E%3Cpath d='M15.2 16.2 L13.4 19.2 M18.8 16.2 L20.6 19.2' stroke='%23ffb428' stroke-width='1.1'/%3E%3Cpath d='M16.4 16.6 L17.2 20 L18 16.6' fill='%23ff8c1a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>登月</b>
        <span>LAND</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">陨坑</span>
          <span id="tag-label">软着陆</span>
          <span id="alt-label">高度</span>
          <div class="fill" id="fuel-wrap" title="燃料">
            <em>燃料</em>
            <div class="fill-track" aria-hidden="true"><i id="fuel-bar"></i></div>
            <b id="fuel-num">0</b>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余登月舱"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="登月，侧视月坑，旋转喷火，轻轻落到平台上"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-ccw" aria-label="左转">↺</button>
          <button type="button" class="pad thrust" id="pad-thrust" aria-label="推进">▲</button>
          <button type="button" class="pad" id="pad-cw" aria-label="右转">↻</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad burst" id="pad-burst" aria-label="加力">爆</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">LAND</p>
          <h1 id="ov-title">登月</h1>
          <p class="lead" id="ov-lead">省着喷火，轻轻落到发光平台上。太快或太斜都会砸碎。平台越小倍率越高。</p>
          <p class="ops" id="ov-ops">A D / ← → 转向 · W / ↑ 推进 · 空格加力 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-soft">软着陆</button>
            <button type="button" id="btn-hard">绝境</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 推进 · 空格加力 · 轻轻落到平台上</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
