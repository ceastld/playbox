<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>泡连 · POP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='10' cy='10' r='5' fill='%23ff3db8'/%3E%3Ccircle cx='20' cy='10' r='5' fill='%2300f0ff'/%3E%3Ccircle cx='15' cy='18.5' r='5' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='26' r='3.2' fill='%23b46cff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="mode-puzzle">
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>泡连</b>
        <span>POP</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
          <div class="score wave" id="wave-box" hidden>
            <em>波次</em>
            <b id="wave">1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">清台</span>
          <span id="tag-label">POP</span>
          <span class="pips" id="pips" aria-label="距压顶剩余发射"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-puzzle" aria-pressed="true" title="清台过关">清台</button>
          <button type="button" id="mode-endless" aria-pressed="false" title="无尽压顶更快">无尽</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="泡连，瞄准同色连成三颗以上炸掉，悬空的会掉下来"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">POP</p>
          <h1 id="ov-title">泡连</h1>
          <p class="lead" id="ov-lead">瞄准同色打进去。三颗相连就爆，悬空的整串砸下来。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 瞄准 · 空格发射 · 天花板会往下压 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="ov-puzzle">清台</button>
            <button type="button" id="ov-endless">无尽</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">瞄准同色 · 三颗起爆 · 悬空坠落 · 天花板会压下来</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
