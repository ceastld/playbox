<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0803" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>冒险 · WONDER</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0803'/%3E%3Cpath d='M2 24 Q10 18 16 22 Q24 28 30 20 L30 32 L2 32 Z' fill='%231a1006'/%3E%3Cpath d='M2 24 Q10 18 16 22 Q24 28 30 20' fill='none' stroke='%23ffb01a' stroke-width='1.3'/%3E%3Ccircle cx='24' cy='8' r='4' fill='%23ffe36b' opacity='.85'/%3E%3Ccircle cx='11' cy='16' r='3.2' fill='%23ffe36b'/%3E%3Crect x='8.6' y='18.6' width='5.2' height='6.4' rx='.8' fill='%23ffb01a'/%3E%3Crect x='7.4' y='24.4' width='8' height='1.6' rx='.6' fill='%2300f0ff'/%3E%3Cpath d='M16 14l6-2-3 4z' fill='%23c88840'/%3E%3Ccircle cx='22' cy='20' r='2.2' fill='%23ff6a3d'/%3E%3Ccircle cx='26' cy='22' r='1.6' fill='%233dff7a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>冒险</b>
        <span>WONDER</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">椰岸</span>
          <span id="tag-label">岛屿</span>
          <div class="fill" id="vit-wrap" title="体力">
            <em>力</em>
            <div class="fill-track" aria-hidden="true"><i id="vit-bar"></i></div>
          </div>
          <span id="skate-label" class="skate hidden">滑板</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-isle" aria-pressed="true">岛屿</button>
          <button type="button" id="mode-dash" aria-pressed="false">疾走</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="冒险，侧向跑跳，空格掷石斧，水果续命，滑板加速"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-axe" aria-label="掷斧">斧</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">WONDER</p>
          <h1 id="ov-title">冒险</h1>
          <p class="lead" id="ov-lead">跑跳掷斧，水果续命。滑板加速，石斧开路。<br />体力会饿，摘果就回。撞敌掉命。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳 · 空格掷斧 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-isle">岛屿</button>
            <button type="button" id="btn-dash">疾走</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · 空格掷斧 · 水果续命 · 滑板加速 · 挨打丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
