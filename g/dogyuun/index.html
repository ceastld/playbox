<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140c06" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>土枪 · DOGY</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140c06'/%3E%3Cpath d='M16 4l3 6 7 2-5 3 2 7-7-4-7 4 2-7-5-3 7-2z' fill='%23ff8a1c'/%3E%3Cpath d='M16 8l1.8 3.8 4.2 1.1-3.2 2.2 1.1 4.2L16 17.2l-3.9 2.1 1.1-4.2-3.2-2.2 4.2-1.1z' fill='%23ffc04a'/%3E%3Cpath d='M10 20l-3-8 5 3zM22 20l3-8-5 3z' fill='%232ee8ff' opacity='.9'/%3E%3Crect x='14.6' y='18' width='2.8' height='8' fill='%23fff4e0'/%3E%3Cpath d='M13 26h6l-1.4 3h-3.2z' fill='%23ff8a1c'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>土枪</b>
        <span>DOGY</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">突贯</span>
          <span id="held-label" class="held">空</span>
          <div class="fill" id="jia-wrap" title="甲力">
            <em>甲</em>
            <div class="fill-track" aria-hidden="true"><i id="jia-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-grab" title="Shift / Z" aria-label="抓投">抓</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="土枪游戏区，纵向卷轴，空格射击，按住 Shift 抓小甲，松开甩砸"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="抓投">抓</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DOGY</p>
          <h1 id="ov-title">土枪</h1>
          <p class="lead" id="ov-lead">双钳抓小甲，松开甩出去砸阵。撞机掉命。短关之后是巨钳。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · Shift / Z 抓投 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rush">突贯</button>
            <button type="button" id="btn-dense">密甲</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · 按住 Shift 抓小甲 · 松开甩砸 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
