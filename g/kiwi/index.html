<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#080c04" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>奇异 · KIWI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080c04'/%3E%3Crect x='3' y='18' width='12' height='3' rx='.7' fill='%23b4e018'/%3E%3Crect x='17' y='14' width='10' height='3' rx='.7' fill='%23d4ff32'/%3E%3Cellipse cx='11' cy='13' rx='4.2' ry='3.4' fill='%2398c018'/%3E%3Cellipse cx='11' cy='13.4' rx='2.4' ry='2' fill='%23e8ff9a'/%3E%3Cpath d='M15 13 l5-.6-5 1.4z' fill='%23ffe36b'/%3E%3Ccircle cx='12.2' cy='12.2' r='.7' fill='%23080c04'/%3E%3Cellipse cx='22' cy='8' rx='2.4' ry='3.2' fill='%23ff3db8'/%3E%3Cpath d='M22 11.2 v3' stroke='%23c8e8ff' stroke-width='.6'/%3E%3Crect x='24' y='20' width='5' height='6' rx='.4' fill='none' stroke='%23ff3db8' stroke-width='.8'/%3E%3Ccircle cx='26.5' cy='22.6' r='1.2' fill='%23d4ff32'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>奇异</b>
        <span>KIWI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em id="lab-wave">关</em>
            <b id="wave">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">救人</span>
          <span id="tag-label">KIWI</span>
          <span id="save-label">笼 0/0</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="奇异鸟蹦跳射箭，骑气球救出笼中同伴"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-shot" aria-label="射箭">射</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">KIWI</p>
          <h1 id="ov-title">奇异</h1>
          <p class="lead" id="ov-lead">蹦跳射箭，骑上气球和飞艇，砸开笼子救出同伴。掉进坑或撞到敌人都会丢命。</p>
          <p class="ops" id="ov-ops">← → / A D 走 · ↑ / W 跳 · 空格射箭 · 触屏左 跳 射 右 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-save">救人</button>
            <button type="button" id="btn-chase">追赶</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">蹦跳射箭 · 骑气球飞艇 · 救出笼中奇异鸟</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
