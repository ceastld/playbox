<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#160806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>雷狐 · TFOX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23160806'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231c0a08' stroke='%23ff6214' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23ff6214' stroke-width='1.2' opacity='.5'/%3E%3Cpath d='M10 8l2.4 4.2H7.6z' fill='%23ff6214'/%3E%3Cpath d='M16.2 8l2.4 4.2h-4.8z' fill='%23ff8a3a'/%3E%3Ccircle cx='13' cy='14.2' r='3.2' fill='%23ffe36b'/%3E%3Crect x='10.4' y='16.6' width='5.4' height='6.4' rx='.7' fill='%23ff6214'/%3E%3Crect x='15.6' y='17.2' width='7.4' height='1.5' rx='.3' fill='%2300e8ff'/%3E%3Cpath d='M22 11l6 3-4 5' fill='none' stroke='%2300e8ff' stroke-width='1.2'/%3E%3Crect x='22' y='12' width='2' height='10' fill='%2388d8ff' opacity='.55'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>雷狐</b>
        <span>TFOX</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">雨镇</span>
          <span id="tag-label">雷狐</span>
          <span id="gun-label" class="gun">刃</span>
          <div class="fill" id="bolt-wrap" title="雷翻">
            <em>雷</em>
            <div class="fill-track" aria-hidden="true"><i id="bolt-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-raid" aria-pressed="true">雷狐</button>
          <button type="button" id="mode-alley" aria-pressed="false">狐巷</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="雷狐，向右跑跳射击，空翻碾敌，贴身会撞死"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-duck" aria-label="下蹲">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TFOX</p>
          <h1 id="ov-title">雷狐</h1>
          <p class="lead" id="ov-lead">向右跑、开火、空翻。空翻能碾兵碎玻璃，贴上去会撞死。短关之后是关底。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走瞄 · 空格射击 · Shift / Z 跳 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">雷狐</button>
            <button type="button" id="btn-alley">狐巷</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空翻碾敌 · 贴身撞死 · 碎玻璃</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
