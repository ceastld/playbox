<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>地平 · SCRAM</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M2 7 L30 5 L30 0 L2 0 Z' fill='%23140810'/%3E%3Cpath d='M2 7 Q10 10 18 6 Q24 3 30 5' fill='none' stroke='%23ff6a22' stroke-width='1.4'/%3E%3Cpath d='M2 24 Q8 20 16 24 Q24 28 30 22 L30 32 L2 32 Z' fill='%23140810'/%3E%3Cpath d='M2 24 Q8 20 16 24 Q24 28 30 22' fill='none' stroke='%23ff6a22' stroke-width='1.4'/%3E%3Crect x='6' y='14' width='11' height='5' rx='1' fill='%2300f0ff'/%3E%3Crect x='15' y='15.4' width='4' height='2.2' fill='%23ffe36b'/%3E%3Crect x='21' y='22' width='4' height='5' fill='%23ffb347'/%3E%3Crect x='22' y='19.4' width='2' height='3' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>地平</b>
        <span>SCRAM</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">洞穴</span>
          <span id="sec-label">都市</span>
          <div class="fill" id="fuel-wrap" title="燃油">
            <em>油</em>
            <div class="fill-track" aria-hidden="true"><i id="fuel-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="地平，洞穴里侧飞，开火打前头，丢炸弹砸地上"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-shot" aria-label="射击">射</button>
        <button type="button" id="btn-bomb" aria-label="投弹">炸</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SCRAM</p>
          <h1 id="ov-title">地平</h1>
          <p class="lead" id="ov-lead">洞穴自己往前开。开火打前头，丢炸弹砸地上，打油桶续航。撞壁即坠。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 慢移 · 空格开火 · 下+空格 / Z 投弹 · 拖动画布跟船 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-cave">洞穴</button>
            <button type="button" id="btn-night">夜袭</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格开火 · 下+空格 / Z 投弹 · 打油桶续航 · 撞壁即坠</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
