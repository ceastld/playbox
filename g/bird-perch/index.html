<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>栖枝 · PERCH</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M16 6v22' stroke='%23ff3db8' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M16 12c-8 1-11 6-12 11' fill='none' stroke='%2300f0ff' stroke-width='1.7' stroke-linecap='round'/%3E%3Cpath d='M16 16c8 1 11 5 12 10' fill='none' stroke='%23ff3db8' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M7 11c2-2 4.2-2.2 6-.4-1.4 1.8-3.2 2.4-6 1.6z' fill='%2300f0ff'/%3E%3Cpath d='M22 8c2.4-1.6 4.6-1.4 6.2.4-1.8 2-4 2.4-6.2 1.2z' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>栖枝</b>
        <span>PERCH</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="已栖">
          <em>栖</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0/2</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 夜</span>
          <span id="left-label">在线 0</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="按重量把鸟分到树枝"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PERCH</p>
          <h1 id="ov-title">栖枝</h1>
          <p class="lead" id="ov-lead">按重量把鸟分到树枝。<br />超重会折，满枝会锁。</p>
          <p class="ops" id="ov-ops">拖鸟上枝 · ← → 选鸟 · 1-5 落枝 · M 静音</p>
          <button type="button" id="ov-btn">开栖</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">轻鸟上细枝 · 重鸟上粗枝</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
