<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>割域 · QIX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%230a0618' stroke='%238b6cff' stroke-width='1.4'/%3E%3Cpath d='M3 22h8v7' fill='none' stroke='%238b6cff' stroke-width='2.4'/%3E%3Crect x='3' y='22' width='8' height='7' fill='%23181040' opacity='.85'/%3E%3Cpath d='M10 8 L22 24' stroke='%23ff3db8' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M22 8 L10 24' stroke='%23ff3db8' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M11 22 L18 12' fill='none' stroke='%2300f0ff' stroke-width='1.3' stroke-linecap='round'/%3E%3Cpath d='M16 14l2.2-2.2 2.2 2.2-2.2 2.2z' fill='%2300f0ff'/%3E%3Ccircle cx='24' cy='3' r='1.4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>割域</b>
        <span>QIX</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score pct" id="pct-box">
            <em>领域</em>
            <b id="pct">0%</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">割域</span>
          <span id="tag-label">QIX</span>
          <span id="combo-label" class="combo">×1</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-slow" title="Shift" aria-label="慢割" aria-pressed="false">慢</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="割域，沿边开割圈地，避开螺旋与火花"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">QIX</p>
          <h1 id="ov-title">割域</h1>
          <p class="lead" id="ov-lead">贴边游走，按住方向走进空域画出割线。<br />闭合回已占边，圈住螺旋对面的那一块。</p>
          <p class="ops" id="ov-ops">方向键／WSD 游走 · Shift 慢割加倍 · A 自动 · 触屏拖拽 · 别碰上螺旋与火花</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-helix">双螺旋</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="btn-again">再割</button>
            <button type="button" id="btn-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走进空域开割 · 闭合圈地 · Shift 慢割 · A 自动 · 避开螺旋</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
