<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#061422" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>加甲 · PALS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23061422'/%3E%3Cpath d='M4 16l12-5v10z' fill='%233a8ae8'/%3E%3Crect x='12' y='13.4' width='9' height='5.2' rx='.6' fill='%23e8f4ff'/%3E%3Ccircle cx='24' cy='10' r='3' fill='%234ec8ff'/%3E%3Ccircle cx='24' cy='22' r='3' fill='%234ec8ff'/%3E%3Ccircle cx='24' cy='10' r='1.1' fill='%23ffe36b'/%3E%3Ccircle cx='24' cy='22' r='1.1' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>加甲</b>
        <span>PALS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">林廊</span>
          <span id="tag-label">加甲</span>
          <span id="pod-label" class="pod-badge off">无甲</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="加甲游戏区，横向卷轴，空格射击，Shift 把甲核打出去猎杀"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pod" aria-label="甲核出击收回">甲</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PALS</p>
          <h1 id="ov-title">加甲</h1>
          <p class="lead" id="ov-lead">接住甲核。双甲自动锁敌。Shift 把甲核打出去猎杀，再按收回。撞机掉命。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 甲核 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-pals">加甲</button>
            <button type="button" id="btn-rail">核轨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">接住甲核 · 双甲自动锁敌 · Shift 打出去猎杀</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
