<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>涉水 · FORD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M2 7h28' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M2 25h28' stroke='%23ff3db8' stroke-width='2' stroke-linecap='round'/%3E%3Cellipse cx='10' cy='20' rx='4' ry='2.4' fill='%23101824' stroke='%2300f0ff' stroke-width='1.1'/%3E%3Cellipse cx='18' cy='14' rx='3.6' ry='2.1' fill='%23101824' stroke='%23ff3db8' stroke-width='1.1'/%3E%3Ccircle cx='10' cy='17.2' r='1.8' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>涉水</b>
        <span>FORD</span>
      </div>
      <div class="status">
        <span id="stage-label">十渡</span>
        <div class="row">
          <span id="left-label">踏石过河</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="踏石涉水过河"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FORD</p>
          <h1 id="ov-title">涉水</h1>
          <p class="lead" id="ov-lead">石头你离开后会沉。踏石过河，走到对岸金门。<br />走错一步，回头的路就没了。</p>
          <p class="ops" id="ov-ops">WASD / 方向键起跳 · 点选落石 · M 静音</p>
          <button type="button" id="ov-btn">涉河</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">跳上石头 · 离开后它会沉</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
