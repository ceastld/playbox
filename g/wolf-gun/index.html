<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>狼牙 · WOLF</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%2312080c' stroke='%23ffb01e' stroke-width='1.3'/%3E%3Cpath d='M4 22 L10 16 L16 22 L22 14 L28 22' fill='%23142818'/%3E%3Ccircle cx='16' cy='13' r='5.4' fill='none' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Ccircle cx='16' cy='13' r='1.3' fill='%23e8ffff'/%3E%3Cpath d='M16 8.2 V10.4 M16 15.6 V17.8 M11.2 13 H13.4 M18.6 13 H20.8' stroke='%2300f0ff' stroke-width='.9' stroke-linecap='round'/%3E%3Crect x='7' y='23' width='13' height='3.2' rx='.6' fill='%23ffb01e'/%3E%3Crect x='20' y='23.6' width='6' height='1.8' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>狼牙</b>
        <span>WOLF</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">突袭</span>
          <span id="tag-label">营地</span>
          <span id="ammo-label">弹 30</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="手雷"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="狼牙，沿线机枪突袭，瞄准连射，换弹，手雷，别打人质"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-nade" aria-label="手雷 C">雷</button>
        <button type="button" id="btn-reload" aria-label="换弹">装</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">WOLF</p>
          <h1 id="ov-title">狼牙</h1>
          <p class="lead" id="ov-lead">沿线突袭。按住机枪扫射，C 丢手雷，空仓点击或右键换弹。别打人质。</p>
          <p class="ops" id="ov-ops">按住开火 · 右键 / 空仓点击换弹 · C 手雷 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">突袭</button>
            <button type="button" id="btn-range">靶场</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">按住开火 · 右键换弹 · C 手雷 · 别打人质 · R 重开 · M 静音</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
