<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#040c07" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>异种 · XENO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23040c07'/%3E%3Crect x='2' y='2' width='28' height='28' rx='3' fill='%230a160e' stroke='%233dff4a' stroke-width='1.4'/%3E%3Cpath d='M4 24h24M4 14h24M4 6h24' stroke='%233dff4a' stroke-width='.8' opacity='.35'/%3E%3Crect x='5' y='16' width='4.2' height='8' rx='.6' fill='%23ffe36b'/%3E%3Crect x='5.4' y='14.6' width='3.4' height='2' rx='.5' fill='%2300f0ff'/%3E%3Crect x='9' y='18.2' width='5' height='1.4' rx='.3' fill='%2300f0ff'/%3E%3Cellipse cx='22' cy='23' rx='3.4' ry='2.4' fill='%237cff2a'/%3E%3Ccircle cx='23.2' cy='22.2' r='.7' fill='%23040c07'/%3E%3Cellipse cx='18' cy='8.2' rx='3.2' ry='2.2' fill='%23ff3db8'/%3E%3Cpath d='M16.4 10.2c.6 1.4 1.6 2.2 2.8 2.2' stroke='%23ff3db8' stroke-width='.8' fill='none'/%3E%3Ccircle cx='12' cy='22' r='1.4' fill='%23b44dff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>异种</b>
        <span>XENO</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">清舱</span>
          <span id="deck-label">上甲板</span>
          <span id="tag-label">残 —</span>
          <div class="fill" id="hp-wrap" title="生命">
            <em>命</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-sweep" aria-pressed="true">清舱</button>
          <button type="button" id="mode-swarm" aria-pressed="false">虫潮</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="异种，侧视舱室走跳射击，清光甲板坐电梯撤离"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下 / 电梯">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">XENO</p>
          <h1 id="ov-title">异种</h1>
          <p class="lead" id="ov-lead">侧视舱室。左右走、跳、开火。卵会孵，异虫会抓住你。<br />清光一层甲板，坐电梯换层，全舰撤离。</p>
          <p class="ops" id="ov-ops">WASD / 方向键走跳 · 空格射击 · 电梯里上下 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-sweep">清舱</button>
            <button type="button" id="btn-swarm">虫潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳射击 · 卵会孵 · 异虫会抓人 · 清甲板 · 坐电梯撤离</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
