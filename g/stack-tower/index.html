<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>叠塔 · STACK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='6' y='22' width='20' height='5' rx='1' fill='%2300f0ff'/%3E%3Crect x='8' y='16' width='16' height='5' rx='1' fill='%23ff3db8'/%3E%3Crect x='10' y='10' width='12' height='5' rx='1' fill='%2300f0ff'/%3E%3Crect x='12' y='5' width='8' height='4' rx='1' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>叠塔</b>
        <span>STACK</span>
      </div>
      <div class="status">
        <div class="bal" id="wide-wrap" title="宽">
          <em>宽</em>
          <div class="bal-track" aria-hidden="true"><i id="wide-fill"></i></div>
        </div>
        <div class="row">
          <span id="floor-label">层 —</span>
          <span id="qi-label">齐 0</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="叠塔吊臂"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-drop" aria-label="落块">落</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">STACK</p>
          <h1 id="ov-title">叠塔</h1>
          <p class="lead" id="ov-lead">吊臂来回荡，对齐再松手。<br />重叠留下，悬空的会碎。塔要直。</p>
          <p class="ops" id="ov-ops">空格 / 点击落块 · 叠满 12 层 · M 静音</p>
          <button type="button" id="ov-btn">起吊</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">看投影对齐再松手 · 荡得快，窗口更窄</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
