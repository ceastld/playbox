<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>长篱 · FENCE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 24 V10 M12 24 V8 M18 24 V10 M24 24 V9' stroke='%23ff3db8' stroke-width='2' stroke-linecap='round'/%3E%3Cpath d='M6 14 H24 M6 19 H24' stroke='%2300f0ff' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='22' cy='6' r='2.4' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>长篱</b>
        <span>FENCE</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="grow-label">—</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="长篱场地"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <button type="button" id="btn-gate" class="gate-btn hidden" aria-label="开门">开门</button>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-up" aria-label="向上">上</button>
        <button type="button" id="btn-down" aria-label="向下">下</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FENCE</p>
          <h1 id="ov-title">长篱</h1>
          <p class="lead" id="ov-lead">篱笆每秒长一格。把狐圈进栏门这边，再开门放它进去。</p>
          <p class="ops" id="ov-ops">WASD / 方向键转向 · 点格瞄准 · 空格开门 · M 静音</p>
          <button type="button" id="ov-btn">开篱</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">每秒长一格 · 圈住狐 · 空格开门</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
