<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>轻足 · STEALTH</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='20' width='24' height='7' rx='1.5' fill='%23ff3db8'/%3E%3Ccircle cx='16' cy='13' r='8' fill='none' stroke='%2300f0ff' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='13' r='4' fill='none' stroke='%2300f0ff' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='13' r='1.6' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>轻足</b>
        <span>STEALTH</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <div class="noise" id="noise-wrap" title="声纹">
            <em>声纹</em>
            <div class="noise-track" aria-hidden="true"><i id="noise-fill"></i></div>
            <b id="surface-label">绒</b>
          </div>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="轻足潜入"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">STEALTH</p>
          <h1 id="ov-title">轻足</h1>
          <p class="lead" id="ov-lead">石面会开出声纹，守卫循纹而来。<br />贴着地毯走，别让灯罩扫到你。</p>
          <p class="ops" id="ov-ops">WASD / 方向键移动 · 拖拽或按住朝向 · M 静音</p>
          <button type="button" id="ov-btn">潜入</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">地毯无声 · 石面留纹 · 躲开灯罩走到青色门</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
