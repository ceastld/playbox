<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140a04" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>高炮 · FLAK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140a04'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ff9a28' stroke-width='1.2' opacity='.55'/%3E%3Ccircle cx='16' cy='16' r='6.5' fill='none' stroke='%23ffe36b' stroke-width='.8'/%3E%3Cpath d='M16 6l3.2 8.4 8.2.6-6.6 4.8 2.4 7.6L16 23l-7.2 4.4 2.4-7.6-6.6-4.8 8.2-.6z' fill='%23ff9a28'/%3E%3Crect x='15.2' y='16' width='1.6' height='9' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>高炮</b>
        <span>FLAK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">高炮</span>
          <span id="wpn-label" class="wpn">炮</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="空炸">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="高炮游戏区，垂直卷轴，空格开火，Shift 空炸清弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-bomb" aria-label="空炸">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FLAK</p>
          <h1 id="ov-title">高炮</h1>
          <p class="lead" id="ov-lead">纵版战斗机。地面高炮打定时空爆，躲开破片再反击。空格连射，Shift 空炸清弹。沙原、峡谷、炮台。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击 · Shift / Z 空炸 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-flak">高炮</button>
            <button type="button" id="btn-core">炮核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格打空打地 · 躲开空爆圈 · Shift 空炸清弹 · 吃 炮 加宽 吃 爆 补弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
