<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0508" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>迷宫车 · RALLY</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0508'/%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%23120810' stroke='%23ff9a32' stroke-width='1.3'/%3E%3Cpath d='M7 10h6M19 10h6M7 22h18' stroke='%23ff9a32' stroke-width='1.1' stroke-linecap='round' opacity='.8'/%3E%3Crect x='10' y='13' width='5' height='3.2' rx='.7' fill='%23ffe36b'/%3E%3Crect x='19' y='18' width='5' height='3.2' rx='.7' fill='%23ff3a48'/%3E%3Cpath d='M8 7l2.2 3.4H5.8z' fill='%2300f0ff'/%3E%3Ccircle cx='24' cy='8' r='1.3' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>迷宫车</b>
        <span>RALLY</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="level">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box" hidden>
            <em>连旗</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">巡回</span>
          <span id="flag-label">旗 0/10</span>
          <div class="fill fuel" id="fuel-wrap" title="燃油">
            <em>油</em>
            <div class="fill-track" aria-hidden="true"><i id="fuel-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-smoke" title="空格" aria-label="烟幕">烟</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="迷宫车，开车上收旗，空格喷烟幕拖慢红车，别撞红车和岩石"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">连旗 ×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="烟幕">烟</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RALLY</p>
          <h1 id="ov-title">迷宫车</h1>
          <p class="lead" id="ov-lead">绕开红车去收旗。空格喷烟幕，拖慢追兵。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 开 · 空格烟幕 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-tour">巡回</button>
            <button type="button" id="btn-hunt">追击</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">收齐旗帜 · 烟幕耗油 · 雷达看旗 · 别撞红车和岩石</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
