<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120814" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星帮 · CGNG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120814'/%3E%3Ccircle cx='16' cy='13' r='8' fill='%23c8a0ff'/%3E%3Cellipse cx='13' cy='12.5' rx='2.6' ry='2.2' fill='%23fff'/%3E%3Cellipse cx='19' cy='12.5' rx='2.6' ry='2.2' fill='%23fff'/%3E%3Ccircle cx='13.2' cy='12.7' r='1.1' fill='%23120814'/%3E%3Ccircle cx='19.2' cy='12.7' r='1.1' fill='%23120814'/%3E%3Cpath d='M11 22c2 4 8 4 10 0' fill='%23ffe36b'/%3E%3Cpath d='M16 22l3 7-1.2-.4.6 2.4L16 29.4l-2.4 1.6.6-2.4L13 29z' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星帮</b>
        <span>CGNG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">星帮</span>
          <span id="wpn-label" class="wpn">拍</span>
          <span id="bomb-label" class="bombs">洞 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="黑洞">洞</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星帮游戏区，垂直卷轴，空格射帮众，Shift 放黑洞"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-bomb" aria-label="黑洞">洞</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CGNG</p>
          <h1 id="ov-title">星帮</h1>
          <p class="lead" id="ov-lead">超拍战机向上打。空格射帮众，整帮打光蹦「帮灭」。Shift 放黑洞吸敌清弹。霓虹巷穿货仓，堂主决战。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击 · Shift / Z 黑洞 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">星帮</button>
            <button type="button" id="btn-core">帮核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格射帮众 · 清一帮「帮灭」 · Shift 黑洞吸弹 · 吃 拍 加宽 吃 匣 定身</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
