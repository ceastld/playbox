<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140404" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>四四 · N144</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140404'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ff3012' stroke-width='1.2' opacity='.7'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%23ffe36b' stroke-width='.8' opacity='.85'/%3E%3Cpath d='M8 18c3-4 5-4 8-4s5 0 8 4' stroke='%23ff6e50' stroke-width='1.6' fill='none'/%3E%3Cpath d='M16 8v12' stroke='%23ffe36b' stroke-width='1.5'/%3E%3Cpath d='M10 14h12' stroke='%23ff6e50' stroke-width='1.4'/%3E%3Cellipse cx='16' cy='13' rx='2' ry='2.8' fill='%23f4ece8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>四四</b>
        <span>N144</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">四四</span>
          <span id="wpn-label" class="wpn">火</span>
          <div class="fill" id="chg-wrap" title="蓄环">
            <em>蓄</em>
            <div class="fill-track" aria-hidden="true"><i id="chg-bar"></i></div>
          </div>
          <span id="loop-label" class="loops">环 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-loop" title="Shift / Z" aria-label="蓄环环爆">环</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="四四游戏区，垂直卷轴，空格射击，按住 Shift 蓄环松开环爆"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-loop" aria-label="蓄环环爆">环</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">N144</p>
          <h1 id="ov-title">四四</h1>
          <p class="lead" id="ov-lead">环圣。空格连射扫空打舰，按住 Shift 蓄环，松开环爆清弹炸舰队。莱特、帛琉、冲绳联合舰队。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击 · Shift / Z 蓄环环爆 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">四四</button>
            <button type="button" id="btn-core">海核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格扫空打舰 · 按住 Shift 蓄环松开环爆 · 吃 火 加宽</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
