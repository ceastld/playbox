<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>嘉年 · FAIR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%2312080c' stroke='%23ff6a22' stroke-width='1.3'/%3E%3Cpath d='M4 8h24' stroke='%23ff3db8' stroke-width='1.4'/%3E%3Ccircle cx='8' cy='8' r='1.4' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='8' r='1.4' fill='%2300f0ff'/%3E%3Ccircle cx='24' cy='8' r='1.4' fill='%23ff6a22'/%3E%3Cellipse cx='10' cy='18' rx='4.2' ry='2.6' fill='%23ffe36b'/%3E%3Ccircle cx='13.2' cy='17' r='1.8' fill='%23ffb01e'/%3E%3Cpath d='M14.8 17 L18 17.6 L14.8 18.2Z' fill='%23ff6a22'/%3E%3Crect x='20' y='14' width='3.2' height='7' rx='1' fill='%2300f0ff'/%3E%3Crect x='24.2' y='12.5' width='3.2' height='8.5' rx='1' fill='%23ff3db8'/%3E%3Crect x='12' y='24' width='10' height='3.2' rx='.6' fill='%23ff6a22'/%3E%3Crect x='21' y='24.6' width='5' height='1.8' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>嘉年</b>
        <span>FAIR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连中</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">嘉年</span>
          <span id="tag-label">FAIR</span>
          <span id="ammo-label">弹 40</span>
          <span id="miss-label">空 0/8</span>
          <span class="pips" id="pips" aria-label="行清空"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="嘉年靶场，左右瞄准，空格射击鸭子兔子水管"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-fire" aria-label="射击">射</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FAIR</p>
          <h1 id="ov-title">嘉年</h1>
          <p class="lead" id="ov-lead">左右瞄准，空格开枪。打鸭子、兔子、水管。清一行补弹。别打空。</p>
          <p class="ops" id="ov-ops">← → / A D 瞄准 · 空格射击 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-gallery">靶场</button>
            <button type="button" id="btn-rapid">连射</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 瞄准 · 空格开枪 · 清行补弹 · 猫头鹰与转盘有奖 · R 重开 · M 静音</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
