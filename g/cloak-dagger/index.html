<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#070512" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>斗篷 · DAG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23070512'/%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23120818' stroke='%23b14dff' stroke-width='1.4'/%3E%3Cpath d='M8 8h6M8 8v6M19 8h5v5M8 19v5h5M19 19h5v5' stroke='%23b14dff' stroke-width='1.2' fill='none'/%3E%3Ccircle cx='12' cy='18' r='2.2' fill='%2300f0ff'/%3E%3Cpath d='M10.2 16.2c-2.2.6-3.4 2.2-3.6 4.2 1.6-.2 3.2-.2 4.8.4' fill='%237a3dff' opacity='.85'/%3E%3Cpath d='M13.6 17.6h7.2' stroke='%23ffe36b' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M20.4 16.4l3.4-1.1-1.2 3.2z' fill='%23ffe36b'/%3E%3Crect x='20.6' y='10.2' width='4.4' height='3.2' rx='.5' fill='%23ffe36b'/%3E%3Cpath d='M21.4 10.2v-1.4h2.8v1.4' fill='none' stroke='%23ffe36b' stroke-width='.9'/%3E%3Ccircle cx='22.4' cy='22.6' r='1.5' fill='%23ff3a7a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>斗篷</b>
        <span>DAG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">潜入</span>
          <span id="tag-label">箱 —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-camp" aria-pressed="true">潜入</button>
          <button type="button" id="mode-end" aria-pressed="false">追杀</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="斗篷迷宫，走格捡箱，空格丢匕首，避开守卫和炸弹"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="丢匕">匕</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DAG</p>
          <h1 id="ov-title">斗篷</h1>
          <p class="lead" id="ov-lead">迷宫里摸公文箱，空格丢出匕首。<br />匕会扎进墙，走过去捡回来。被守卫抓住掉命。</p>
          <p class="ops" id="ov-ops">WASD / 方向键走 · 空格丢匕 · 箱够了走出口 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-campaign">潜入</button>
            <button type="button" id="btn-endless">追杀</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">WASD 走 · 空格丢匕 · 捡箱出逃 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
