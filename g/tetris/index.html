<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>俄罗斯方块 · TETRIS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%23120814' stroke='%23ff3db8' stroke-width='1.3'/%3E%3Crect x='12' y='8' width='8' height='8' rx='1.4' fill='%23d14cff'/%3E%3Crect x='8' y='16' width='8' height='8' rx='1.4' fill='%23d14cff'/%3E%3Crect x='16' y='16' width='8' height='8' rx='1.4' fill='%23d14cff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>俄罗斯方块</b>
        <span>TETRIS</span>
      </div>
      <div class="scores" aria-live="polite">
        <div class="score" id="score-box">
          <em>分数</em>
          <b id="score">0</b>
          <span id="score-add" class="score-add" hidden>+0</span>
        </div>
        <div class="score">
          <em>行数</em>
          <b id="lines">0</b>
        </div>
        <div class="score">
          <em>等级</em>
          <b id="level">1</b>
        </div>
        <div class="score best">
          <em>最高</em>
          <b id="best">0</b>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="play" id="play">
        <div class="well-frame" id="well-frame">
          <canvas id="well" tabindex="0" role="application" aria-label="俄罗斯方块游戏区，十列二十行"></canvas>
        </div>
        <aside class="side">
          <div class="next-box">
            <em>下一个</em>
            <canvas id="next" width="120" height="120" aria-label="下一块"></canvas>
          </div>
        </aside>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ov-title" aria-hidden="true">
        <div class="panel lose" id="panel">
          <p class="kicker">TETRIS</p>
          <h1 id="ov-title">到顶了</h1>
          <p class="lead" id="ov-lead"></p>
          <div class="ov-actions">
            <button type="button" id="ov-retry">重开</button>
          </div>
        </div>
      </div>
    </div>

    <div class="pads" id="pads">
      <button type="button" id="pad-left" aria-label="左移">左</button>
      <button type="button" id="pad-rot" aria-label="旋转">转</button>
      <button type="button" id="pad-right" aria-label="右移">右</button>
      <button type="button" id="pad-drop" aria-label="硬降">降</button>
    </div>

    <footer class="hint">方向键移动，上键或 X 旋转，空格硬降。</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
