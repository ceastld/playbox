<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>贪吃蛇 · SNAKE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%230a140f' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Cpath d='M8 16h6c2 0 2-4 4-4h2c2 0 2 5 5 5' stroke='%233dff88' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23.4' cy='16.6' r='1.15' fill='%2305030c'/%3E%3Ccircle cx='20' cy='8' r='2.1' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>贪吃蛇</b>
        <span>SNAKE</span>
      </div>
      <div class="scores">
        <div class="score" id="score-box">
          <em>分数</em>
          <b id="score">0</b>
          <span id="score-add" class="score-add" hidden>+0</span>
        </div>
        <div class="score best">
          <em>最高</em>
          <b id="best">0</b>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <div class="board" id="board">
          <canvas id="c" tabindex="0" role="application" aria-label="贪吃蛇棋盘，撞墙即死"></canvas>
        </div>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ov-title" aria-hidden="true">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SNAKE</p>
          <h1 id="ov-title">撞上了</h1>
          <p class="lead" id="ov-lead"></p>
          <div class="ov-actions">
            <button type="button" id="ov-retry">重开</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint">方向键或滑动。撞墙或咬到自己就死。</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
