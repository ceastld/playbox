<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>空孩 · SKID</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041018'/%3E%3Cpath d='M2 24 Q10 20 16 23 Q24 27 30 22 V30 H2Z' fill='%230a2430'/%3E%3Cpath d='M2 24 Q10 20 16 23 Q24 27 30 22' fill='none' stroke='%231ec8ff' stroke-width='1.1'/%3E%3Crect x='22' y='12' width='1.2' height='11' fill='%23ffe36b'/%3E%3Cpath d='M23.2 12 l7 3.2 -7 1.4z' fill='%23ff3db8'/%3E%3Cpath d='M6 16 h10 M8 13 h6 M8 19 h6' stroke='%231ec8ff' stroke-width='1.5' stroke-linecap='round'/%3E%3Cellipse cx='11' cy='16' rx='5.2' ry='2.1' fill='%235ce0ff'/%3E%3Ccircle cx='15' cy='16' r='1.3' fill='%23e8f7ff'/%3E%3Cpath d='M16.4 16 l3.6 1.2 -1 .8 -3.2-.6z' fill='%231ec8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>空孩</b>
        <span>SKID</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score flags" id="flag-box">
            <em>旗</em>
            <b id="flags">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">草原</span>
          <span id="tag-label">空孩</span>
          <span id="loop-label" class="loop">翻</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-loop" title="Shift / Z" aria-label="翻跟头">翻</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="空孩游戏区，横版双翼机，空格开火，Shift 翻跟头夺旗"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-left" aria-label="左">◀</button>
          <div class="pad-stack">
            <button type="button" class="pad" id="pad-up" aria-label="升">▲</button>
            <button type="button" class="pad" id="pad-down" aria-label="降">▼</button>
          </div>
          <button type="button" class="pad" id="pad-right" aria-label="右">▶</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">射</button>
          <button type="button" class="pad loop" id="pad-loop" aria-label="翻跟头">翻</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SKID</p>
          <h1 id="ov-title">空孩</h1>
          <p class="lead" id="ov-lead">横版双翼机。向右飞、开枪、翻跟头夺旗。擦地坠毁。草原峡谷之后打云堡。不是时飞环飞，也不是纵版空霸。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格开火 · Shift / Z 翻跟头 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-kid">空孩</button>
            <button type="button" id="btn-core">云核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">向右飞 · 空格开火 · Shift 翻跟头 · 低空夺旗 · 擦地坠毁</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
