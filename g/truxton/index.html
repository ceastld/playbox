<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#10081c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>达鲁 · TRUX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2310081c'/%3E%3Cellipse cx='16' cy='11' rx='8' ry='7' fill='%23e8d8ff'/%3E%3Cellipse cx='13' cy='11' rx='2' ry='2.4' fill='%2310081c'/%3E%3Cellipse cx='19' cy='11' rx='2' ry='2.4' fill='%2310081c'/%3E%3Cpath d='M16 13.2l1.4 2.6h-2.8z' fill='%2310081c'/%3E%3Crect x='11' y='16.4' width='10' height='2.2' rx='.6' fill='%23e8d8ff'/%3E%3Cpath d='M16 20l4 6 4 1-4-2 1 5-5-4-5 4 1-5-4 2 4-1z' fill='%23b86bff'/%3E%3Cpath d='M16 22l2.2 4.4 3 .6-2.6-1.4.6 3.4-3.2-2.6-3.2 2.6.6-3.4-2.6 1.4 3-.6z' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>达鲁</b>
        <span>TRUX</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">降魔</span>
          <span id="wpn-label" class="wpn red">红</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="达鲁爆">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="达鲁游戏区，八向移动，空格射击，Shift 扔达鲁爆，捡红绿蓝切武装"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="达鲁爆">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TRUX</p>
          <h1 id="ov-title">达鲁</h1>
          <p class="lead" id="ov-lead">纵向达鲁战机。捡红绿蓝切武装：红散、绿穿、蓝雷。达鲁爆是骷髅雷。短关之后是魔。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格开火 · Shift / Z 达鲁爆 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-hunt">降魔</button>
            <button type="button" id="btn-dense">密弹</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向移动 · 空格开火 · Shift 达鲁爆 · 捡 红/绿/蓝</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
