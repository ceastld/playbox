<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#100604" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>怒三 · SOR3</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100604'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23180a08' stroke='%23ff4a18' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23ff4a18' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='11' cy='13' r='3.4' fill='%23ffe36b'/%3E%3Crect x='8.5' y='16.2' width='5.2' height='7' rx='.8' fill='%23ff4a18'/%3E%3Crect x='8.7' y='22.6' width='2' height='3.2' fill='%231a161c'/%3E%3Crect x='11.5' y='22.6' width='2' height='3.2' fill='%231a161c'/%3E%3Cpath d='M14.6 14.2l10-1.4-4.8 4z' fill='%2300e8ff'/%3E%3Crect x='22' y='18' width='5' height='6' rx='.6' fill='%239aa4b4'/%3E%3Crect x='23' y='19.2' width='3' height='1.6' fill='%2300e8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>怒三</b>
        <span>SOR3</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">船坞</span>
          <span id="tag-label">怒三</span>
          <span id="grab-label" class="wep">徒手</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill" id="sp-wrap" title="电旋能量">
            <em>电</em>
            <div class="fill-track sp" aria-hidden="true"><i id="sp-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-street" aria-pressed="true">怒三</button>
          <button type="button" id="mode-core" aria-pressed="false">怒核</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="怒三，沿街走位出拳，暴冲，抓住再甩，电旋清场"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-punch" aria-label="出拳">拳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-spec" aria-label="电旋">电</button>
        <button type="button" id="btn-blitz" aria-label="暴冲">冲</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SOR3</p>
          <h1 id="ov-title">怒三</h1>
          <p class="lead" id="ov-lead">沿街清场。出拳连击，贴近抓住再甩。双击方向暴冲，电旋耗能。打穿三关，最后是罪核。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 空格出拳 · Shift / Z 电旋 · 双击方向暴冲 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-street">怒三</button>
            <button type="button" id="btn-core">怒核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走出拳 · 暴冲穿场 · 抓住甩 · 电旋清场 · 血空丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
