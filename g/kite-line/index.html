<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>放鸢 · KITE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M4 28 L14 8 L18 28' fill='none' stroke='%2300f0ff' stroke-width='1.3' stroke-linecap='round'/%3E%3Cpath d='M16 7 L22 16 L16 21 L10 16 Z' fill='%2312081c' stroke='%23ff3db8' stroke-width='1.5'/%3E%3Cpath d='M16 7v14M10 16h12' stroke='%2300f0ff' stroke-width='1.05'/%3E%3Crect x='20' y='6' width='8' height='7' rx='1' fill='none' stroke='%23ffe36b' stroke-width='1.2'/%3E%3Cpath d='M21.4 8.2h5.2M21.4 10.4h5.2M24 6.8v5.4' stroke='%23ffe36b' stroke-width='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>放鸢</b>
        <span>KITE</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="入窗">
          <em>窗</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0%</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 窗</span>
          <span id="power-label">放线升高</span>
          <span class="pips" id="pips" aria-label="剩余线命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="放鸢入窗"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-in" aria-label="收线">收</button>
        <button type="button" id="btn-out" aria-label="放线">放</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">KITE</p>
          <h1 id="ov-title">放鸢</h1>
          <p class="lead" id="ov-lead">放线收线，把风筝停进窗格里。<br />窗亮了就稳住，阵风来了就收一线。</p>
          <p class="ops" id="ov-ops">↑ / W / 空格收线 · ↓ / S 放线 · 按住上下拖 · M 静音</p>
          <button type="button" id="ov-btn">放鸢</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">放线升高 · 收线拉低 · 停进金窗</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
