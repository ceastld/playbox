<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>拍点 · BEAT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M7 6 L4 26 H28 L25 6 Z' fill='%230a0614' stroke='%23ff3db8' stroke-width='1.2'/%3E%3Cpath d='M11.5 7 L10 25 M16 7 V25 M20.5 7 L22 25' stroke='%2300f0ff' stroke-width='.7' opacity='.55'/%3E%3Cpath d='M5.2 22 H26.8' stroke='%23ffe36b' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='10.4' cy='13' r='1.7' fill='%23ff3db8'/%3E%3Ccircle cx='16' cy='10.2' r='1.7' fill='%2300f0ff'/%3E%3Ccircle cx='21.4' cy='16' r='1.7' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>拍点</b>
        <span>BEAT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">一曲</span>
          <span id="tag-label">BEAT</span>
          <span id="bpm-label">128 BPM</span>
        </div>
        <div class="hp" id="hp" aria-label="血量">
          <span class="hp-lab">血</span>
          <div class="hp-track"><i id="hp-fill"></i></div>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="四轨拍点，音符落到判定线时按下 D F J K 或点按音轨"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div class="prog" id="prog" aria-hidden="true"><i id="prog-fill"></i></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" data-lane="0" aria-label="左一轨 D">D</button>
        <button type="button" data-lane="1" aria-label="左二轨 F">F</button>
        <button type="button" data-lane="2" aria-label="右二轨 J">J</button>
        <button type="button" data-lane="3" aria-label="右一轨 K">K</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BEAT</p>
          <h1 id="ov-title">拍点</h1>
          <p class="lead" id="ov-lead">音符砸在判定线上。<br />卡在点上，连击发烫。</p>
          <p class="ops" id="ov-ops">D F J K 拍道 · 点按音轨 · 完美回血 · 空血失败</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-song">一曲</button>
            <button type="button" id="btn-accel">加速</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="btn-again">再来</button>
            <button type="button" id="btn-menu">换曲</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">D F J K 或点按音轨 · 卡在判定线上</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
