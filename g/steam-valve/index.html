<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>汽阀 · VALVE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='16' cy='13' r='8.2' fill='none' stroke='%2300f0ff' stroke-width='1.7'/%3E%3Cpath d='M16 13l5-3' stroke='%23ff3db8' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='13' r='1.5' fill='%23ffe36b'/%3E%3Cpath d='M8 24h16' stroke='%2300f0ff' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='24' r='2.2' fill='none' stroke='%23ff3db8' stroke-width='1.3'/%3E%3Ccircle cx='22' cy='24' r='2.2' fill='none' stroke='%2300f0ff' stroke-width='1.3'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>汽阀</b>
        <span>VALVE</span>
      </div>
      <div class="status">
        <div class="fill" id="press-wrap" title="压力">
          <em>压</em>
          <div class="fill-track" aria-hidden="true">
            <i id="press-bar"></i>
            <s id="press-mark"></s>
          </div>
          <b id="press-num">0.0</b>
        </div>
        <div class="row">
          <span id="stage-label">十炉</span>
          <span id="next-label">按号开</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="汽阀锅炉"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">VALVE</p>
          <h1 id="ov-title">汽阀</h1>
          <p class="lead" id="ov-lead">按顺序拧开汽阀泄压。<br />指针进红区，锅炉就炸。</p>
          <p class="ops" id="ov-ops">点阀开 · 1–6 从左开 · ← → 空格 · M 静音</p>
          <button type="button" id="ov-btn">开阀</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">按顺序开阀 · 针到红区就炸</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
