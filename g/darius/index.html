<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0902" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>大流 · DARS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0902'/%3E%3Cpath d='M2 22c6-8 10-14 16-10 4 3 8 2 12 6' fill='none' stroke='%23ffe36b' stroke-width='1.2'/%3E%3Cellipse cx='22' cy='16' rx='8' ry='5' fill='%2314c8c0' opacity='.85'/%3E%3Ccircle cx='18' cy='15' r='1.4' fill='%23ffe36b'/%3E%3Cpath d='M4 16l8-3.2V19z' fill='%23e8fbff'/%3E%3Cpath d='M10 14.4h7v3.2h-7z' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>大流</b>
        <span>DARS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">区 A</span>
          <span id="tag-label">远征</span>
          <span id="wpn-label" class="wpn">鳞</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <div class="fill" id="hp-wrap" title="甲">
            <em>甲</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="大流游戏区，横向卷轴，银鹰打巨型鱼舰弱点，空格射击，Shift 爆弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DARS</p>
          <h1 id="ov-title">大流</h1>
          <p class="lead" id="ov-lead">横向卷轴。银鹰打巨型鱼舰，专打发光弱点。区末飞进上/下航门选路。甲空或撞击扣一命。</p>
          <p class="ops" id="ov-ops">方向 / WSD 移动 · 空格开火 · Shift / Z 爆弹 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">远征</button>
            <button type="button" id="btn-red">红海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向移动 · 空格开火 · Shift 爆弹 · A 自动 · 打鱼舰弱点 · 区末选航路</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
