<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>叠崩 · STACK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpolygon points='16,6 26,11 16,16 6,11' fill='%23ffe36b'/%3E%3Cpolygon points='6,11 16,16 16,22 6,17' fill='%23ff3db8'/%3E%3Cpolygon points='26,11 16,16 16,22 26,17' fill='%2300f0ff'/%3E%3Cpolygon points='18,18 28,22 18,26 10,22' fill='%23ffe36b' opacity='.85'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>叠崩</b>
        <span>STACK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>层</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+1</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连齐</em>
            <b id="combo">×0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">经典</span>
          <span id="tag-label">STACK</span>
          <div class="bal" id="wide-wrap" title="台面">
            <em>台</em>
            <div class="bal-track" aria-hidden="true"><i id="wide-fill"></i></div>
          </div>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="叠崩，板来回扫，点下落齐，悬空斩掉"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">STACK</p>
          <h1 id="ov-title">叠崩</h1>
          <p class="lead" id="ov-lead">板来回扫，点下落齐。悬空的咔一声削掉。<br />齐了会闪、会震、会连。太窄就崩。</p>
          <p class="ops" id="ov-ops">点击 / 空格落板 · A 自动 · M 静音 · R 重开</p>
          <div class="ov-actions">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-rush">加速</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">对齐就落 · 悬空会斩 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
