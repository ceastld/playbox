<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#080318" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星堡 · CAST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080318'/%3E%3Cpolygon points='16,3.5 27,9.5 27,21.5 16,27.5 5,21.5 5,9.5' fill='none' stroke='%2300f0ff' stroke-width='1.15'/%3E%3Cpolygon points='16,7.2 23.6,11.4 23.6,19.8 16,24 8.4,19.8 8.4,11.4' fill='none' stroke='%23ffe36b' stroke-width='1'/%3E%3Cpolygon points='16,11 20.6,13.6 20.6,18.6 16,21.2 11.4,18.6 11.4,13.6' fill='none' stroke='%23ff3db8' stroke-width='0.9'/%3E%3Ccircle cx='16' cy='16' r='2.1' fill='%23ffe36b'/%3E%3Cpath d='M16 28.4 L14.1 24.2 L16 25 L17.9 24.2 Z' fill='%23e8f4ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星堡</b>
        <span>CAST</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">星堡</span>
          <span id="tag-label">CAST</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星堡游戏区，绕三环要塞飞，弹会反弹，撕开缺口打核"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-ccw" aria-label="左转">↺</button>
          <button type="button" class="pad thrust" id="pad-thrust" aria-label="推进">▲</button>
          <button type="button" class="pad" id="pad-cw" aria-label="右转">↻</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad reverse" id="pad-rev" aria-label="后退">▼</button>
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">火</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CAST</p>
          <h1 id="ov-title">星堡</h1>
          <p class="lead" id="ov-lead">三环绕核，弹打在环上会弹回来。撕开缺口直击核心，别被弹回和炮台打中。</p>
          <p class="ops" id="ov-ops">← → / A D 转向 · W / ↑ 推进 · S / ↓ 后退 · 空格开火</p>
          <div class="ov-actions">
            <button type="button" id="btn-siege">围攻</button>
            <button type="button" id="btn-wild">乱弹</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 推进 · 空格开火 · 弹会反弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
