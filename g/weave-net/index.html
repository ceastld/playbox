<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="dark" />
  <title>织网 · WEAVE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23ff3db8'/%3E%3Ccircle cx='24' cy='8' r='3' fill='%23ff3db8'/%3E%3Ccircle cx='8' cy='24' r='3' fill='%2300f0ff'/%3E%3Ccircle cx='24' cy='24' r='3' fill='%2300f0ff'/%3E%3Cpath d='M8 8h16M8 24h16' stroke='%23ffe36b' stroke-width='1.4' fill='none'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>织网</b>
        <span>WEAVE</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <span class="pips" id="pips" aria-label="剩余断丝次数"></span>
      </div>
      <div class="tools">
        <button type="button" id="btn-undo" title="Z">撤销</button>
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="织网棋盘"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">WEAVE</p>
          <h1 id="ov-title">织网</h1>
          <p class="lead" id="ov-lead">同色点连成丝。丝线不可相交。走入光点牵丝，送到它的孪生。</p>
          <p class="ops" id="ov-ops">WASD / 方向键移动梭子 · 点光点拖到同色 · 空格放下 · Z 撤销 · M 静音</p>
          <button type="button" id="ov-btn">开始织网</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点光点牵丝 · 送到同色 · 丝线不能相交</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
