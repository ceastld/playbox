<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>烟枪 · SMOKE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140804'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231c0c06' stroke='%23ff7a1a' stroke-width='1.4'/%3E%3Cpath d='M6 24h20' stroke='%23c48a4a' stroke-width='1.2' opacity='.6'/%3E%3Cellipse cx='12' cy='22' rx='6' ry='3.2' fill='%236a3a18'/%3E%3Ccircle cx='12' cy='16' r='3.2' fill='%23ffe36b'/%3E%3Cpath d='M8.6 15.2h6.8v1.4H8.6z' fill='%23ff7a1a'/%3E%3Crect x='14.2' y='16.6' width='8' height='1.5' rx='.3' fill='%2300f0ff'/%3E%3Cpath d='M22 10l3 2-4 2z' fill='%23ffb24a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>烟枪</b>
        <span>SMOKE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">荒原</span>
          <span id="tag-label">清匪</span>
          <span id="gun-label" class="gun">单发</span>
          <span id="boot-label" class="boots" hidden>靴</span>
          <div class="fill boss" id="boss-wrap" hidden title="头目">
            <em id="boss-name">匪骑</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-clear" aria-pressed="true">清匪</button>
          <button type="button" id="mode-wild" aria-pressed="false">乱枪</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="烟枪，马上骑马自动北进，三向瞄准开火"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SMOKE</p>
          <h1 id="ov-title">烟枪</h1>
          <p class="lead" id="ov-lead">马上北进，三向瞄准。匪徒、马队、篷车迎面而来。</p>
          <p class="ops" id="ov-ops">WASD / 方向键 走 · 按住瞄准 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-clear">清匪</button>
            <button type="button" id="btn-wild">乱枪</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">马上北进 · 按住方向瞄准 · 空格开火 · 捡角/靴</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
