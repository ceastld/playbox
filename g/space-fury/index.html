<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#14030f" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>怒空 · FURY</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2314030f'/%3E%3Ccircle cx='16' cy='9' r='5.2' fill='none' stroke='%23ff3db8' stroke-width='1.2'/%3E%3Ccircle cx='16' cy='9' r='2.1' fill='%23ffe36b'/%3E%3Cpolygon points='16,16 21,28 16,24 11,28' fill='none' stroke='%23e8f4ff' stroke-width='1.35'/%3E%3Cpath d='M16 24 L14.6 29 L16 27 L17.4 29 Z' fill='%2300e8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>怒空</b>
        <span>FURY</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">怒空</span>
          <span id="tag-label">FURY</span>
          <span id="gun-label" class="gun">前火</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="怒空游戏区，转向推进开火，波间选炮，护盾挡一下"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="talk" class="talk hidden" aria-live="polite">
        <span class="eye" aria-hidden="true"></span>
        <p id="talk-text"></p>
      </div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-ccw" aria-label="左转">↺</button>
          <button type="button" class="pad thrust" id="pad-thrust" aria-label="推进">▲</button>
          <button type="button" class="pad" id="pad-cw" aria-label="右转">↻</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad reverse" id="pad-rev" aria-label="倒推">▼</button>
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">火</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FURY</p>
          <h1 id="ov-title">怒空</h1>
          <p class="lead" id="ov-lead">拧船推进开火。敌舰四片拼合，拼完会射，拼不齐会撞。波间换炮：前火、双火、散火。护盾能挡一下。</p>
          <p class="ops" id="ov-ops">← → / A D 转向 · W / ↑ 推进 · S / ↓ 倒推 · 空格开火</p>
          <div class="ov-actions" id="ov-modes">
            <button type="button" id="btn-fury">怒火</button>
            <button type="button" id="btn-hunt">围猎</button>
          </div>
          <div class="ov-actions hidden" id="ov-guns">
            <button type="button" id="btn-fwd">前火</button>
            <button type="button" id="btn-dual">双火</button>
            <button type="button" id="btn-wide">散火</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 推进 · 空格开火 · 波间选炮</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
