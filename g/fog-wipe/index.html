<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>擦雾 · WIPE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='5' width='24' height='22' rx='3' fill='%2312081c' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Cpath d='M6 24 Q12 10 18 14 T28 8 V26 H6 Z' fill='%23c8bdd8' opacity='.55'/%3E%3Cpath d='M7 25 Q11 16 16 17 T26 12' fill='none' stroke='%23ff3db8' stroke-width='1.6' stroke-linecap='round'/%3E%3Crect x='19' y='11' width='5' height='8' rx='1.2' fill='%2305030c' stroke='%2300f0ff' stroke-width='1.2'/%3E%3Cpath d='M21.5 13.2v3.8' stroke='%23ffe36b' stroke-width='.9'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>擦雾</b>
        <span>WIPE</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="布">
          <em>布</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">100</b>
        </div>
        <div class="row">
          <span id="stage-label">十面</span>
          <span id="see-label">刚够看见</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="擦雾找出口"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">WIPE</p>
          <h1 id="ov-title">擦雾</h1>
          <p class="lead" id="ov-lead">雾蒙住整面玻璃。擦出刚够看见出口的一块，走进去。</p>
          <p class="ops" id="ov-ops">WASD / 方向键走 · 按住拖动 · M 静音</p>
          <button type="button" id="ov-btn">开擦</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">朝那点青光擦 · 看见门再进去</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
