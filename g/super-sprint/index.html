<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#100806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>超赛 · SPRT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100806'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='8' fill='none' stroke='%23ff4820' stroke-width='3'/%3E%3Cellipse cx='16' cy='16' rx='7' ry='4.2' fill='%231a0c0a'/%3E%3Crect x='13' y='13.2' width='6' height='3.4' rx='.8' fill='%2300f0ff' transform='rotate(28 16 16)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>超赛</b>
        <span>SPRT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">0:00.00</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>时速</em>
            <b id="spd">0</b>
          </div>
        </div>
        <div class="row">
          <span id="place-label">—</span>
          <span id="stage-label">环湾</span>
          <span id="tag-label">大奖赛</span>
          <div class="fill lap" id="lap-wrap" title="本圈进度">
            <em>圈</em>
            <div class="fill-track" aria-hidden="true"><i id="lap-bar"></i></div>
            <b id="lap">1/4</b>
          </div>
          <span id="gear-label" class="gear">扳手 0</span>
          <span id="combo-label" class="combo" hidden>连漂</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="超赛，俯视赛道，加油转向漂移，四圈抢先"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左转">左</button>
        <button type="button" id="btn-gas" aria-label="油门">油</button>
        <button type="button" id="btn-brake" aria-label="刹车">刹</button>
        <button type="button" id="btn-right" aria-label="右转">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SPRT</p>
          <h1 id="ov-title">超赛</h1>
          <p class="lead" id="ov-lead">俯视漂移，四圈抢先。撞墙减速，机油打滑，扳手加速。</p>
          <p class="ops" id="ov-ops">← → / A D 转向 · ↑ W 油门 · 空格刹车 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-gp">大奖赛</button>
            <button type="button" id="btn-time">计时</button>
          </div>
          <div class="ov-actions gone" id="ov-pick">
            <button type="button" id="btn-t0">环湾</button>
            <button type="button" id="btn-t1">8字</button>
            <button type="button" id="btn-t2">夜城</button>
          </div>
          <div class="ov-actions gone" id="ov-next">
            <button type="button" id="ov-go">下一站</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再赛</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 油门 · 空格刹车 · 四圈 · 抢扳手 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
