<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>战国 · SNGK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120804'/%3E%3Cpath d='M16 4l2 6 6.5 1-5 4 1.5 6.5L16 18l-5 3.5 1.5-6.5-5-4 6.5-1z' fill='%23ffc44a'/%3E%3Cpath d='M8 22h16l-2 4H10z' fill='%23ff6a2a'/%3E%3Crect x='15' y='16' width='2' height='10' fill='%23ffe36b'/%3E%3Cpath d='M10 14h12' stroke='%23ff9a2a' stroke-width='1.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>战国</b>
        <span>SNGK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">空战</span>
          <span id="pwr-label" class="pwr">刃</span>
          <span id="bomb-label" class="bombs">斩 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="天斩">斩</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="战国游戏区，纵向卷轴，空格机炮，Shift 天斩爆弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="天斩">斩</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SNGK</p>
          <h1 id="ov-title">战国</h1>
          <p class="lead" id="ov-lead">开双翼机向上打。空格机炮，Shift 天斩。每关先中破再关底。撞机扣命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格机炮 · Shift / Z 天斩 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">空战</button>
            <button type="button" id="btn-chaos">乱世</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格机炮 · Shift 天斩 · 吃 刃/斩 · 撞机扣命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
