<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0610" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>疾驶 · OUTRUN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0610'/%3E%3Cpath d='M2 18h28v2H2z' fill='%23ff8a32'/%3E%3Cpath d='M4 20 L16 10 L28 20' fill='%231a0c18'/%3E%3Cpath d='M10 20 L16 12 L22 20' fill='%23ff5a3c'/%3E%3Crect x='12' y='21' width='8' height='4' rx='.8' fill='%23ff8a32'/%3E%3Crect x='13' y='22.2' width='2.4' height='1.6' rx='.3' fill='%2300f0ff'/%3E%3Crect x='16.6' y='22.2' width='2.4' height='1.6' rx='.3' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>疾驶</b>
        <span>OUTRUN</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">55.0</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>时速</em>
            <b id="spd">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">椰湾</span>
          <span id="tag-label">海岸</span>
          <div class="fill clock" id="time-wrap" title="剩余时间">
            <em>限</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连超</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="疾驶，后视公路，左右转向，油门冲过终点"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">OUTRUN</p>
          <h1 id="ov-title">疾驶</h1>
          <p class="lead" id="ov-lead">敞篷后视，分叉选路。赶在时间耗尽前冲过终点门。</p>
          <p class="ops" id="ov-ops">← → 转向 · ↑ 油门 ↓ 刹车 · 点按加速 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-coast">海岸</button>
            <button type="button" id="btn-night">夜奔</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再开</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↑ 油门 · 分叉靠左或靠右选下一段 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
