<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>桶山 · KONG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M4 26 L28 22' stroke='%23ff6a28' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M4 18 L28 21' stroke='%23ff6a28' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M4 13 L28 10' stroke='%23ff8a4a' stroke-width='2.2' stroke-linecap='round'/%3E%3Crect x='9' y='18' width='2' height='8' fill='%2300f0ff'/%3E%3Crect x='20' y='11' width='2' height='10' fill='%2300f0ff'/%3E%3Ccircle cx='8' cy='9' r='3.2' fill='%23c86828'/%3E%3Ccircle cx='16' cy='23.2' r='2.1' fill='%23ffe36b'/%3E%3Crect x='22' y='18.2' width='2.4' height='3.6' rx='.6' fill='%2300f0ff'/%3E%3Crect x='21.6' y='17.2' width='3.2' height='1.4' rx='.4' fill='%23ff6a28'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>桶山</b>
        <span>KONG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连跳</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">经典</span>
          <div class="fill hammer" id="hammer-wrap" title="锤子">
            <em>锤</em>
            <div class="fill-track" aria-hidden="true"><i id="hammer-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="桶山，攀钢梁跳过木桶登顶"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-down" aria-label="下梯">下</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">KONG</p>
          <h1 id="ov-title">桶山</h1>
          <p class="lead" id="ov-lead">四层钢梁，桶从顶上滚下来。跳过去最爽，拿锤砸更爽。爬到顶上救人。</p>
          <p class="ops" id="ov-ops">方向键或 WASD · 空格 / 上 跳 · 触屏左 下 跳 右 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-rain">雨桶</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">跳过木桶 · 爬梯上楼 · 锤子能砸 · 掉下去或撞桶丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
