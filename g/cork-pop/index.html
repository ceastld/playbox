<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>启塞 · CORK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M11 28c0-2.2 2.2-3.4 5-3.4s5 1.2 5 3.4' fill='none' stroke='%23ff3db8' stroke-width='1.5'/%3E%3Cpath d='M10 18.2c.4 4.2.8 7.2 1.4 8.8h9.2c.6-1.6 1-4.6 1.4-8.8C21 15.4 18.6 14 16 14s-5 1.4-6 4.2z' fill='none' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Cpath d='M13.4 14.2V9.4h5.2v4.8' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Crect x='12.4' y='4.2' width='7.2' height='6.2' rx='1.6' fill='%23d4a574'/%3E%3Crect x='13.2' y='3.2' width='5.6' height='2.4' rx='1.1' fill='%23ffe36b'/%3E%3Cpath d='M22 7c3-1 6 .6 7 2' fill='none' stroke='%23ff3db8' stroke-width='1.3' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>启塞</b>
        <span>CORK</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="塞子">
          <em>塞</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0%</b>
        </div>
        <div class="row">
          <span id="stage-label">十瓶</span>
          <span id="combo-label">连 0</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="启塞拧瓶"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CORK</p>
          <h1 id="ov-title">启塞</h1>
          <p class="lead" id="ov-lead">在节拍上拧开塞子。<br />拍点顺着箭头转，空拍停手。</p>
          <p class="ops" id="ov-ops">右 / 空格顺时针 · 左逆时针 · 绕塞转圈或点瓶左右 · M 静音</p>
          <button type="button" id="ov-btn">启塞</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">拍点拧转 · 空拍别动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
