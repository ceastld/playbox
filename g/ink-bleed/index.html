<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>洇墨 · INK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='14' cy='18' r='9' fill='%23ff3db8' opacity='.9'/%3E%3Ccircle cx='20' cy='14' r='6' fill='%2300f0ff' opacity='.55'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>洇墨</b>
        <span>INK</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="fill-label">成 —</span>
          <span id="leak-label">洇 —</span>
          <span id="blank-label">空白 —</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" aria-label="宣纸上的洇墨"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">INK</p>
          <h1 id="ov-title">洇墨</h1>
          <p class="lead" id="ov-lead">墨会扩散。用空白堵住它，让它洇成字。</p>
          <p class="ops" id="ov-ops">拖动画空白 · WASD 移笔 · 空格落空白 · M 静音</p>
          <button type="button" id="ov-btn">落墨</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">沿淡影围空白，把墨堵在字里</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
