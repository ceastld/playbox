<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140814" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星闪 · TWIN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140814'/%3E%3Cpath d='M16 4l2.4 6.2 6.6.4-5.1 4.2 1.6 6.4L16 17.4 10.5 21.2l1.6-6.4L7 10.6l6.6-.4z' fill='%23ff3db8'/%3E%3Cpath d='M16 8l1.4 3.6 3.8.2-2.9 2.4.9 3.6L16 16l-3.2 1.8.9-3.6-2.9-2.4 3.8-.2z' fill='%23ffe8f8'/%3E%3Ccircle cx='16' cy='24' r='3.2' fill='%2300e8ff'/%3E%3Ccircle cx='8' cy='12' r='1.3' fill='%23ffe36b'/%3E%3Ccircle cx='25' cy='11' r='1.1' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星闪</b>
        <span>TWIN</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">星闪</span>
          <span id="tag-label">对飞</span>
          <span id="round-label">局 0-0</span>
          <span id="bomb-label" class="bombs">闪 ×2</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="局点"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="星闪弹">闪</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星闪游戏区，对飞射击，把核弹打回去，相撞丢一局"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="星闪弹">闪</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TWIN</p>
          <h1 id="ov-title">星闪</h1>
          <p class="lead" id="ov-lead">对飞一架，把核弹打回去。相撞丢一局。短决斗之后是星核。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 星闪 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-duel">星闪</button>
            <button type="button" id="btn-chaos">乱核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格射击 · 打回核弹 · Shift 星闪 · 相撞丢局</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
