<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>绕线 · YARN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='%2312081c' stroke='%23ff3db8' stroke-width='1.6'/%3E%3Cpath d='M16 7.2c4.8 1.2 7.2 4 7.2 8.8' fill='none' stroke='%2300f0ff' stroke-width='1.5' stroke-linecap='round'/%3E%3Cpath d='M8.6 18.5c1.2 4.4 4 6.6 7.8 7' fill='none' stroke='%23ffe36b' stroke-width='1.3' stroke-linecap='round'/%3E%3Ccircle cx='24.5' cy='10.2' r='2.1' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>绕线</b>
        <span>YARN</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="成团">
          <em>团</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0%</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 团</span>
          <span id="hook-label">钉 —</span>
          <span id="len-label">线 —</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-undo" title="Z">撤</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="绕线成团"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">YARN</p>
          <h1 id="ov-title">绕线</h1>
          <p class="lead" id="ov-lead">绕着球走，线不要交叉。<br />扫过金钉，绕满就收成一团。</p>
          <p class="ops" id="ov-ops">拖拽绕线 · WASD / 方向键移动 · Z 回抽 · M 静音</p>
          <button type="button" id="ov-btn">上手</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">绕着球走 · 线不要交叉 · 绕满就成团</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
