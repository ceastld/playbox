<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#04140c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>旋空 · GYRO</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304140c'/%3E%3Ccircle cx='16' cy='14' r='9' fill='none' stroke='%2320e96a' stroke-width='1.1' stroke-dasharray='3 2'/%3E%3Ccircle cx='16' cy='14' r='5.2' fill='none' stroke='%237cffb0' stroke-width='.7'/%3E%3Cellipse cx='16' cy='14' rx='3.2' ry='5' fill='%2320e96a'/%3E%3Cpath d='M16 19 v6' stroke='%23ffe36b' stroke-width='1.4'/%3E%3Cpath d='M13 24 h6' stroke='%237cffb0' stroke-width='1.1'/%3E%3Cpath d='M6 14 h4 M22 14 h4' stroke='%2320e96a' stroke-width='1.2'/%3E%3Crect x='8' y='25' width='6' height='4' rx='.5' fill='%23402820' stroke='%23ffe36b' stroke-width='.6'/%3E%3Crect x='18' y='25' width='6' height='4' rx='.5' fill='%23402820' stroke='%23ff3db8' stroke-width='.6'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>旋空</b>
        <span>GYRO</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">旋空</span>
          <span id="wpn-label" class="wpn">旋</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="投弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="旋空游戏区，直升机爬升，空格旋弹，Shift 投弹炸碉"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-bomb" aria-label="投弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GYRO</p>
          <h1 id="ov-title">旋空</h1>
          <p class="lead" id="ov-lead">旋翼直升机沿谷爬升。机枪旋弹打空，投弹炸碉堡。旋环护体，谷雨更密。别当成空牙、打击或战国——这是旋空，不是双人牙缝、不是喷气、不是妖刀。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击 · Shift / Z 投弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-gyro">旋空</button>
            <button type="button" id="btn-rain">谷雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格旋弹打空 · Shift 投弹炸碉 · 撞机扣命 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
