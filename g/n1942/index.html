<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#021c26" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>四二 · N194</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23021c26'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2300d4ea' stroke-width='1.1' opacity='.45'/%3E%3Cpath d='M10 12v12 M22 12v12' stroke='%2300d4ea' stroke-width='1.7'/%3E%3Cpath d='M8 12h16' stroke='%2300d4ea' stroke-width='1.5'/%3E%3Cpath d='M16 7l1.4 6 4 .4' stroke='%23fff8e0' stroke-width='.8' fill='none'/%3E%3Cpath d='M16 8v10' stroke='%23ffe36b' stroke-width='1.4'/%3E%3Cpath d='M8 24h5 M19 24h5' stroke='%2300d4ea' stroke-width='1.6'/%3E%3Cellipse cx='16' cy='14' rx='2.2' ry='3' fill='%23e6fcff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>四二</b>
        <span>N194</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">四二</span>
          <span id="wpn-label" class="wpn">力</span>
          <span id="loop-label" class="loops">环 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-loop" title="Shift / Z" aria-label="翻环擦弹">环</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="四二游戏区，垂直卷轴，空格射击，Shift 翻环擦弹穿阵"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-loop" aria-label="翻环擦弹">环</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">N194</p>
          <h1 id="ov-title">四二</h1>
          <p class="lead" id="ov-lead">超级王牌。空格连射扫空，Shift 翻环擦弹穿阵。中途、威克、拉包尔。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击 · Shift / Z 翻环 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-raid">四二</button>
            <button type="button" id="btn-core">云核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格扫空打地 · Shift 翻环擦弹穿阵 · 吃 力 加宽</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
