<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120a04" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>圆桌 · TABLE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120a04'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23180e06' stroke='%23ffb400' stroke-width='1.4'/%3E%3Cpath d='M4 25h24' stroke='%23ffb400' stroke-width='1.2' opacity='.5'/%3E%3Cellipse cx='20' cy='22' rx='7' ry='3.2' fill='%23e8dcc8'/%3E%3Cellipse cx='22' cy='19.4' rx='5.4' ry='2.6' fill='%23f4ead8'/%3E%3Ccircle cx='26.2' cy='17.6' r='1.8' fill='%23f4ead8'/%3E%3Crect x='10' y='12' width='6' height='10' rx='.8' fill='%23ffb400'/%3E%3Ccircle cx='13' cy='10' r='2.6' fill='%23e8c090'/%3E%3Crect x='11.2' y='8.4' width='3.6' height='1.6' rx='.4' fill='%23ffb400'/%3E%3Cpath d='M16 14l10-1.4-7 3.2z' fill='%23ffe36b'/%3E%3Crect x='16.2' y='16.4' width='8' height='1.3' rx='.3' fill='%23c8b070'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>圆桌</b>
        <span>TABLE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">村道</span>
          <span id="tag-label">征途</span>
          <span id="wep-label" class="wep short">短剑</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill horse" id="horse-wrap" title="坐骑">
            <em>骑</em>
            <div class="fill-track" aria-hidden="true"><i id="horse-bar"></i></div>
          </div>
          <div class="fill boss" id="boss-wrap" hidden title="头目">
            <em id="boss-name">黑骑</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-quest" aria-pressed="true">征途</button>
          <button type="button" id="mode-melee" aria-pressed="false">乱战</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="圆桌，侧向骑马砍杀，先把骑手打下马再近身"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-atk" aria-label="挥剑">斩</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TABLE</p>
          <h1 id="ov-title">圆桌</h1>
          <p class="lead" id="ov-lead">往右骑马挥剑。先把骑手打下马，再下马近身。匪徒、骑士、头目。捡剑升级，体力打空扣一命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 上跳 · 空格挥剑 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-quest">征途</button>
            <button type="button" id="btn-melee">乱战</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">往右骑马砍 · 先打下马再近身 · 捡剑升级 · 上键跳</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
