<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>折径 · FOLD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 8h12l8 8v8H6z' fill='%231a1028' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Cpath d='M18 8v8h8' fill='none' stroke='%23ff3db8' stroke-width='1.4'/%3E%3Cpath d='M8 22h6l4-6 4 2' fill='none' stroke='%23ff3db8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='22' r='1.6' fill='%23ff3db8'/%3E%3Ccircle cx='22' cy='18' r='1.6' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>折径</b>
        <span>FOLD</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="fold-label">—</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余纸命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-undo" title="Z">撤销</button>
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="折纸棋盘"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">FOLD</p>
          <h1 id="ov-title">折径</h1>
          <p class="lead" id="ov-lead">沿虚线折叠纸面，让品红墨迹接到青色出口。<br />折页叠上，路径会合。</p>
          <p class="ops" id="ov-ops">点虚线折叠 · 方向键选折痕 · 空格折 · Z 撤销 · M 静音</p>
          <button type="button" id="ov-btn">开折</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点虚线把纸页折上 · 墨迹接到出口即通</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
