<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#061018" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>苍穹 · SKYG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23061018'/%3E%3Cpath d='M6 28L16 8l10 20' fill='none' stroke='%233db4ff' stroke-width='.6' opacity='.4'/%3E%3Cpath d='M10 26L16 14l6 12' fill='none' stroke='%237ad0ff' stroke-width='.45' opacity='.35'/%3E%3Cpath d='M16 10l3.2 8h-2.2l-1 3-1-3H13.8z' fill='%23e8f4ff'/%3E%3Cpath d='M13.4 18h5.2l-.8 2.4h-3.6z' fill='%23ff3d88'/%3E%3Crect x='11' y='12' width='6' height='6' fill='none' stroke='%23ffe36b' stroke-width='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>苍穹</b>
        <span>SKYG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">苍湾</span>
          <span id="tag-label">苍穹</span>
          <span id="form-label" class="form">扇</span>
          <div class="fill" id="lock-wrap" title="索敌">
            <em>锁</em>
            <div class="fill-track" aria-hidden="true"><i id="lock-bar"></i></div>
          </div>
          <span id="wpn-label" class="wpn">炮</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-form" title="C / X" aria-label="换阵">阵</button>
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="苍穹游戏区，垂直卷轴，按住空格张开索敌网松开齐射，C 换扇锥阵，Shift 爆弹"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-form" aria-label="换阵">阵</button>
        <button type="button" id="btn-pad-bomb" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SKYG</p>
          <h1 id="ov-title">苍穹</h1>
          <p class="lead" id="ov-lead">按住空格张开三维索敌网，松开齐射追踪激光。C 切换扇 / 锥阵。撞了扣命。短关之后是红莲核。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格射击（按住索敌） · C 换阵 · Shift / Z 爆弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-sky">苍穹</button>
            <button type="button" id="btn-rain">穹雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">按住空格张开索敌网 · C 换扇/锥 · Shift 爆弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
