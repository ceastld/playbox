<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#03060c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>光环 · TRON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2303060c'/%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23040c14' stroke='%2300e8ff' stroke-width='1.4'/%3E%3Cpath d='M6 10h20M6 16h20M6 22h20M10 6v20M16 6v20M22 6v20' stroke='%2300e8ff' stroke-width='.35' opacity='.35'/%3E%3Cpath d='M6 20h8l2-4 3 1' stroke='%2300e8ff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M26 11h-7l-2 3-3-.5' stroke='%23ffe14a' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Cpath d='M19 7v5' stroke='%23ff3db8' stroke-width='1.8' stroke-linecap='round'/%3E%3Ccircle cx='19' cy='16.6' r='1.5' fill='%23e8ffff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>光环</b>
        <span>TRON</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score round" id="round-box">
            <em>环次</em>
            <b id="round">1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">竞技场</span>
          <span id="tag-label">TRON</span>
          <span id="combo-label" class="combo">×1</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mode" title="切换模式并重开" aria-label="模式 竞技场">竞技场</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="光环，霓虹光车在网格上转弯，墙迹即死"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TRON</p>
          <h1 id="ov-title">光环</h1>
          <p class="lead" id="ov-lead">霓虹光车永远在跑。九十度急转，身后留下实心墙迹。<br>撞墙、撞迹、撞车即死。最后一辆活着的车赢下这一局。</p>
          <p class="ops" id="ov-ops">方向键／WASD 转弯 · 滑动或点格 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-arena" title="四边实墙">竞技场</button>
            <button type="button" id="btn-wrap" title="对侧穿出">无界</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="btn-again">再开</button>
            <button type="button" id="btn-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">永远前进 · 90° 急转 · 墙迹即死 · 最后一台赢</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
