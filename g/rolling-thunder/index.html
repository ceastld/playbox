<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120606" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>滚雷 · ROLL</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120606'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23161010' stroke='%23ff3a18' stroke-width='1.4'/%3E%3Crect x='4' y='6' width='10' height='14' rx='1' fill='%23081a1e' stroke='%2300f0ff' stroke-width='1'/%3E%3Crect x='5.2' y='7.2' width='3.4' height='12' fill='%231a0c0c'/%3E%3Ccircle cx='20' cy='13' r='3' fill='%23e8d2b0'/%3E%3Cellipse cx='20' cy='11.4' rx='3.4' ry='1.3' fill='%23181010'/%3E%3Crect x='17.4' y='16' width='5.2' height='8' rx='.8' fill='%23e8dcc4'/%3E%3Crect x='19' y='16.4' width='1.4' height='4' fill='%23ff3a18'/%3E%3Crect x='22.2' y='18' width='6' height='1.4' rx='.3' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>滚雷</b>
        <span>ROLL</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">货仓</span>
          <span id="tag-label">潜入</span>
          <span id="gun-label" class="gun">手枪</span>
          <div class="fill ammo" id="ammo-wrap" title="弹药">
            <em>弹</em>
            <span id="ammo-n">50</span>
            <div class="fill-track" aria-hidden="true"><i id="ammo-bar"></i></div>
          </div>
          <div class="fill" id="hp-wrap" title="体力">
            <em>血</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill boss" id="boss-wrap" hidden title="头目">
            <em id="boss-name">面具</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-infil" aria-pressed="true">潜入</button>
          <button type="button" id="mode-hail" aria-pressed="false">乱枪</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="滚雷，侧向潜入货仓，钻门躲弹装填，有限弹药"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-door" aria-label="钻门">门</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ROLL</p>
          <h1 id="ov-title">滚雷</h1>
          <p class="lead" id="ov-lead">侧向潜入货仓。钻门躲弹、装填。弹有限，打空就钻。货仓、廊道，顶层见面具。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 上跳 · 下钻门 · 空格开枪 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-infil">潜入</button>
            <button type="button" id="btn-hail">乱枪</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · 空格开枪 · 下钻门装填 · 打空钻门</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
