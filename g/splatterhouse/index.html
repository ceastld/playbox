<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#100404" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>血屋 · SPLAT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100404'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23180808' stroke='%23ff2030' stroke-width='1.4'/%3E%3Cpath d='M4 25h24' stroke='%23ff2030' stroke-width='1.2' opacity='.5'/%3E%3Cellipse cx='12' cy='12.2' rx='3.6' ry='4.2' fill='%23f4f0e8'/%3E%3Cellipse cx='10.8' cy='11.6' rx='.9' ry='1.1' fill='%23100404'/%3E%3Cellipse cx='13.2' cy='11.6' rx='.9' ry='1.1' fill='%23100404'/%3E%3Cpath d='M10.4 14.4h3.2' stroke='%23ff2030' stroke-width='1'/%3E%3Crect x='9.4' y='16.2' width='5.4' height='6.6' rx='.7' fill='%23c42828'/%3E%3Cpath d='M16.2 17.2l10.6-2.4-8.2 5.2z' fill='%23c8d0dc'/%3E%3Cpath d='M16.4 19.6h10' stroke='%23ff2030' stroke-width='1.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>血屋</b>
        <span>SPLAT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">西馆</span>
          <span id="tag-label">血屋</span>
          <span id="wep-label" class="wep">斩斧</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill boss" id="boss-wrap" hidden title="头目">
            <em id="boss-name">怨灵</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-run" aria-pressed="true">血屋</button>
          <button type="button" id="mode-tide" aria-pressed="false">尸潮</button>
        </div>
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="血屋，戴面具挥斩斧，第一刀打趴再补刀，坑和空血丢命"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-slash" aria-label="挥斩">斩</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SPLAT</p>
          <h1 id="ov-title">血屋</h1>
          <p class="lead" id="ov-lead">戴面具，挥斩斧。第一刀打趴，再补一刀。<br />坑和空血丢命。西馆、地窟、祭堂，尽头头目。</p>
          <p class="ops" id="ov-ops">方向 / D 走 · ↑ 跳 · 空格挥斩 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-run">血屋</button>
            <button type="button" id="btn-tide">尸潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">往右走 · 空格挥斩 · 第一刀打趴再补刀 · 跳过深坑 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
