<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#050a1c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>星轨 · NAST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050a1c'/%3E%3Cpath d='M2 10c8 4 12-4 20 0 4 2 6 1 8-1' fill='none' stroke='%235ee8ff' stroke-width='1.2' opacity='.7'/%3E%3Cpath d='M2 22c8-3 14 4 22 0 3-1.5 5-1 8 1' fill='none' stroke='%234a6ef5' stroke-width='1.1' opacity='.65'/%3E%3Cpath d='M4 16l12-4.4v8.8z' fill='%23e6f0ff'/%3E%3Crect x='12' y='13.4' width='9' height='5.2' rx='.6' fill='%234a6ef5'/%3E%3Cpath d='M16 16c6-4 10 3 16 0' fill='none' stroke='%23ffe36b' stroke-width='1.4'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>星轨</b>
        <span>NAST</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">织带</span>
          <span id="tag-label">星轨</span>
          <span id="beam-label" class="beam">束</span>
          <span id="pow-label" class="pow">火 1</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-beam" title="Shift / Z" aria-label="蓄轨束">束</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="星轨游戏区，横向卷轴，空格射击，Shift 蓄轨束咬轨切开"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="蓄轨束">束</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">NAST</p>
          <h1 id="ov-title">星轨</h1>
          <p class="lead" id="ov-lead">沿星轨突袭。空格连射，Shift 蓄轨束。满蓄咬轨切开核心。撞机、中弹、擦壁都掉命。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · Shift / Z 轨束 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-track">星轨</button>
            <button type="button" id="btn-rail">核轨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · Shift 蓄轨束咬轨切开 · 满蓄贯穿</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
