<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#08060a" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>电梯 · LIFT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2308060a'/%3E%3Crect x='6' y='2' width='20' height='26' fill='%23141018' stroke='%23ffb018' stroke-width='1.2'/%3E%3Cpath d='M8 8h16M8 14h16M8 20h16M8 26h16' stroke='%23ffc94a' stroke-width='1' opacity='.55'/%3E%3Crect x='14' y='8' width='4' height='18' fill='%2300f0ff' opacity='.85'/%3E%3Crect x='14.4' y='16' width='3.2' height='5.2' rx='.4' fill='%23ffe36b'/%3E%3Crect x='11' y='18' width='2.4' height='5' fill='%2300f0ff'/%3E%3Crect x='20' y='12' width='2.2' height='5' fill='%23ff3db8'/%3E%3Crect x='7' y='27.2' width='7' height='2.6' rx='.6' fill='%23ff3a3a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>电梯</b>
        <span>LIFT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>楼</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">潜入</span>
          <div class="fill" id="docs-wrap" title="机密档案">
            <em>档</em>
            <span id="docs-n">0/0</span>
            <div class="fill-track" aria-hidden="true"><i id="docs-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="电梯行动，走楼层坐电梯开枪抢档案，下楼逃上车"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-fire" aria-label="开枪">射</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">LIFT</p>
          <h1 id="ov-title">电梯</h1>
          <p class="lead" id="ov-lead">楼里坐电梯，开门对射。红档案全收齐，下楼钻进红车就撤。</p>
          <p class="ops" id="ov-ops">方向键或 WASD 走 · 上/下坐电梯 · 空格开枪 · Z/X 跳 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-stealth">潜入</button>
            <button type="button" id="btn-brawl">乱战</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走楼层 · 坐电梯 · 空格开枪 · 收红档案 · 下楼逃上车</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
