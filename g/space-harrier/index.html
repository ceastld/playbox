<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120814" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>幻域 · HARR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120814'/%3E%3Cpath d='M4 20 L16 12 L28 20 V28 H4Z' fill='%23200a28'/%3E%3Cpath d='M8 20 L16 14 L24 20 V26 H8Z' fill='%23c46aff' opacity='.4'/%3E%3Ccircle cx='16' cy='9' r='2.2' fill='%23ffe36b'/%3E%3Cpath d='M14 12h4l-1 3h-2z' fill='%23ff4ad2'/%3E%3Crect x='14.4' y='15' width='3.2' height='5' rx='.4' fill='%23e8c8ff'/%3E%3Cpath d='M10 26 L14 18 L18 18 L22 26' fill='%238a3cff' opacity='.55'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>幻域</b>
        <span>HARR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">花原</span>
          <span id="tag-label">冲原</span>
          <div class="fill" id="prog-wrap" title="关卡进度">
            <em>程</em>
            <div class="fill-track" aria-hidden="true"><i id="prog-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="幻域，冲进画面，扫射树蘑龙，短关之后是头目"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">HARR</p>
          <h1 id="ov-title">幻域</h1>
          <p class="lead" id="ov-lead">冲进画面。扫射树蘑龙，撞了扣命。短关之后是头目。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-plain">冲原</button>
            <button type="button" id="btn-dense">密林</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再冲</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向移动 · 空格开火 · 树蘑都能打 · 撞了扣命 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
