<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>梳齿 · COMB</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='6' y='7' width='20' height='4.2' rx='1.4' fill='%2300f0ff'/%3E%3Cpath d='M9 11.2v12.5M13 11.2v14M17 11.2v11M21 11.2v13.2' stroke='%23ff3db8' stroke-width='1.7' stroke-linecap='round'/%3E%3Cpath d='M7 16c4 3 8-3 12 1 3 3 6 0 8-1' fill='none' stroke='%23ffe36b' stroke-width='1.4' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>梳齿</b>
        <span>COMB</span>
      </div>
      <div class="status">
        <div class="fill" id="fill-wrap" title="已梳">
          <em>丝</em>
          <div class="fill-track" aria-hidden="true">
            <i id="fill-bar"></i>
          </div>
          <b id="fill-num">0/0</b>
        </div>
        <div class="row">
          <span id="stage-label">第 1 梳</span>
          <span id="silk-label">丝 —</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-undo" title="Z" aria-label="撤销">撤</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="滑动梳齿解开缠线"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">COMB</p>
          <h1 id="ov-title">梳齿</h1>
          <p class="lead" id="ov-lead">滑动梳齿，让同色缠线圈成一条横线。<br />齐了就会滑脱。邻齿不要拉太开。</p>
          <p class="ops" id="ov-ops">拖动梳齿 · ←→ 选齿 · ↑↓ 滑动 · Z 撤销 · M 静音</p>
          <button type="button" id="ov-btn">开梳</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">同色缠线要齐平 · 齐了就滑脱 · 邻齿不要拉太开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
