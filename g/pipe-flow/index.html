<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>通管 · PIPE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M4 12h8a4 4 0 0 1 4 4v8' fill='none' stroke='%2300ffcc' stroke-width='2.4' stroke-linecap='round'/%3E%3Cpath d='M16 24h8a4 4 0 0 0 4-4V8' fill='none' stroke='%2314e0b0' stroke-width='2.4' stroke-linecap='round'/%3E%3Ccircle cx='4' cy='12' r='2.2' fill='%23ffe36b'/%3E%3Ccircle cx='28' cy='8' r='2.2' fill='%2300f0ff'/%3E%3Ccircle cx='16' cy='16' r='1.6' fill='%2300ffcc'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>通管</b>
        <span>PIPE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">通管</span>
          <span id="tag-label">PIPE</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="通管棋盘，点格铺管让水流到出口"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PIPE</p>
          <h1 id="ov-title">通管</h1>
          <p class="lead" id="ov-lead">点格铺管，让水从源头流到出口。<br />绕路越长越爽，漏了就输。</p>
          <p class="ops" id="ov-ops">点格放下一段 · 覆盖扣分 · 方向键选格 · 空格放置 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-campaign">闯关</button>
            <button type="button" id="btn-endless">无尽</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点格铺管 · 水会自己流 · 漏了就输 · 绕路加分</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
