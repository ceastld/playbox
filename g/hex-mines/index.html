<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>蜂雷 · HEX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpolygon points='16,3.2 27.2,9.6 27.2,22.4 16,28.8 4.8,22.4 4.8,9.6' fill='%23142028' stroke='%2300d5ff' stroke-width='1.4'/%3E%3Ctext x='16' y='20.2' text-anchor='middle' font-size='11' font-family='sans-serif' font-weight='800' fill='%234db8ff'%3E2%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>蜂雷</b>
        <span>HEX</span>
      </div>
      <div class="meters" aria-live="polite">
        <div class="meter mines" title="剩余地雷">
          <em>雷</em>
          <b id="mine-count">12</b>
        </div>
        <div class="meter time" title="用时">
          <em>时</em>
          <b id="timer">0</b>
        </div>
        <div class="meter best" title="最佳用时">
          <em>最佳</em>
          <b id="best">—</b>
        </div>
      </div>
      <div class="tools">
        <div class="diff" role="radiogroup" aria-label="难度">
          <button type="button" id="diff-5" aria-pressed="true" title="5 圈 · 12 雷">小</button>
          <button type="button" id="diff-7" aria-pressed="false" title="7 圈 · 30 雷">中</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="board" tabindex="0" role="application" aria-label="六边形雷区"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker">HEX</p>
          <h1 id="ov-title">扫清了</h1>
          <p class="lead" id="ov-lead"></p>
          <button type="button" id="ov-retry">重开</button>
        </div>
      </div>
    </div>

    <footer class="dock">
      <div class="mode" id="mode" hidden>
        <button type="button" id="mode-open" aria-pressed="true">翻开</button>
        <button type="button" id="mode-flag" aria-pressed="false">插旗</button>
      </div>
      <p class="hint">点开空格，右键或长按插旗。数字是周围六格的雷。</p>
    </footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
