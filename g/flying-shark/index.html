<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#021410" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>飞鲨 · SHARK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23021410'/%3E%3Cellipse cx='16' cy='16' rx='10' ry='3' fill='none' stroke='%2300f0c8' stroke-width='1.1'/%3E%3Cpath d='M16 6l2 7 7 1-6 4 2 7-5-4-5 4 2-7-6-4 7-1z' fill='%2300f0c8' opacity='.35'/%3E%3Cpath d='M16 8l1.6 6h6.2l-5 3.6 1.9 6.2L16 20.4l-4.7 3.4 1.9-6.2-5-3.6h6.2z' fill='%2300f0c8'/%3E%3Crect x='15.2' y='14' width='1.6' height='10' fill='%23ffe36b'/%3E%3Cpath d='M10 24h12' stroke='%235cffd0' stroke-width='1.2'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>飞鲨</b>
        <span>SHARK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">清海</span>
          <span id="wpn-label" class="wpn">宽</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="飞鲨游戏区，八向移动开火，空对空空对地，吃 P 加宽火力"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SHARK</p>
          <h1 id="ov-title">飞鲨</h1>
          <p class="lead" id="ov-lead">纵向武装直升机。空对空、空对地两层打。吃 P 加宽弹幕。先扫海面再上岸打坦克碉堡。</p>
          <p class="ops" id="ov-ops">方向 / WASD 移动 · 空格开火 · R 重开 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-sea">清海</button>
            <button type="button" id="btn-flak">火网</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向移动 · 空格开火 · 空打飞机 地对坦克炮艇 · 吃 P 加宽</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
