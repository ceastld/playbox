<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#040a12" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>气斗 · BALLOON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23040a12'/%3E%3Cpath d='M2 24 Q8 21 16 24 Q24 27 30 23 L30 30 L2 30 Z' fill='%230a4a88'/%3E%3Cpath d='M2 24 Q8 21 16 24 Q24 27 30 23' fill='none' stroke='%2300f0ff' stroke-width='1.2'/%3E%3Cellipse cx='11' cy='8' rx='3.2' ry='4' fill='%23ff3db8'/%3E%3Cellipse cx='16.4' cy='7.6' rx='3.2' ry='4' fill='%231ea8ff'/%3E%3Cpath d='M11 12 v3 M16.4 11.6 v3.4' stroke='%23c8e8ff' stroke-width='.7'/%3E%3Ccircle cx='14' cy='17.4' r='2.4' fill='%23ffe36b'/%3E%3Cpath d='M12 20 h4 l1 4 h-6 z' fill='%231ea8ff'/%3E%3Cellipse cx='24' cy='13' rx='2.6' ry='3.4' fill='%23ffe36b'/%3E%3Ccircle cx='24' cy='18.2' r='1.8' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>气斗</b>
        <span>BALLOON</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em id="lab-wave">关</em>
            <b id="wave">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连爆</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">对空</span>
          <span id="tag-label">BALLOON</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="气斗海空，扇翅飞行，从上方顶爆气球"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-flap" aria-label="扇翅">扇</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BALLOON</p>
          <h1 id="ov-title">气斗</h1>
          <p class="lead" id="ov-lead">扇翅飞上海空。从上方顶爆对方气球，落地的人撑伞，再撞进水里。落水即死，低空会招大鱼。</p>
          <p class="ops" id="ov-ops">← → / A D 移动 · 空格 / ↑ / W 扇翅 · 触屏左 扇 右 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-sky">对空</button>
            <button type="button" id="btn-trip">漂流</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">从上方顶爆气球 · 伞兵再撞进水 · 落水即死 · 低空招鱼</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
