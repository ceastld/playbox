<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /><title>probe</title></head>
<body>
<iframe id="g" src="./index.html" style="width:480px;height:720px;border:0"></iframe>
<pre id="out">wait</pre>
<script>
  var g = document.getElementById('g');
  var out = document.getElementById('out');
  function snap(d) {
    var fuel = d.getElementById('fuel-bar');
    return {
      score: d.getElementById('score').textContent,
      best: d.getElementById('best').textContent,
      stage: d.getElementById('stage-label').textContent,
      tag: d.getElementById('tag-label').textContent,
      auto: d.getElementById('btn-auto').textContent,
      pressed: d.getElementById('btn-auto').getAttribute('aria-pressed'),
      speed: d.getElementById('speed').value,
      speedLab: d.getElementById('speed-lab').textContent,
      overlay: d.getElementById('overlay').className,
      title: d.getElementById('ov-title').textContent,
      fuel: fuel ? fuel.style.transform : '',
      hint: d.getElementById('hint').textContent
    };
  }
  g.addEventListener('load', function () {
    var d = g.contentDocument;
    var speed = d.getElementById('speed');
    speed.value = '4';
    speed.dispatchEvent(new Event('input', { bubbles: true }));
    d.getElementById('btn-auto').click();
    setTimeout(function () {
      out.textContent = JSON.stringify(snap(d));
      document.title = 'PROBE ' + out.textContent;
    }, 14000);
  });
</script>
</body>
</html>
