<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#04120c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>超魂 · SCTR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304120c'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23081810' stroke='%2314ff7a' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%2300f0ff' stroke-width='1.2' opacity='.5'/%3E%3Crect x='20' y='10' width='8' height='14' rx='1' fill='%23142820' stroke='%2314ff7a' stroke-width='.8'/%3E%3Crect x='18' y='14' width='10' height='2.2' fill='%23ffe36b'/%3E%3Ccircle cx='12' cy='14' r='3.4' fill='%237dffb0'/%3E%3Crect x='9.6' y='17' width='5' height='6.2' rx='.8' fill='%2314ff7a'/%3E%3Crect x='14.2' y='16.2' width='8' height='1.5' rx='.3' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>超魂</b>
        <span>SCTR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">坞廊</span>
          <span id="tag-label">突进</span>
          <span id="gun-label" class="gun">步枪</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill boss" id="boss-wrap" hidden title="连装炮">
            <em id="boss-name">连装炮</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-rush" aria-pressed="true">突进</button>
          <button type="button" id="mode-barrage" aria-pressed="false">弹幕</button>
        </div>
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="超魂，侧向跑跳，八向开火，捡散弹激光，躲压机打连装炮"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-duck" aria-label="蹲下">蹲</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SCTR</p>
          <h1 id="ov-title">超魂</h1>
          <p class="lead" id="ov-lead">侧向跑跳，八向开火。捡散弹 / 激光。<br />中弹扣体，撞压机、刺带或坠井即死。</p>
          <p class="ops" id="ov-ops">← → / D 走跳 · 空格开火 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rush">突进</button>
            <button type="button" id="btn-barrage">弹幕</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · 空格八向开火 · 捡 S/L · A 自动 · 压机即死</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
