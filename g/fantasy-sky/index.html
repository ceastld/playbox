<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#10081c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>幻想 · ZONE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2310081c'/%3E%3Cellipse cx='16' cy='18' rx='8' ry='7' fill='%23ffe36b'/%3E%3Cellipse cx='8' cy='17' rx='5' ry='2.6' fill='%2300f0ff' opacity='.8'/%3E%3Cellipse cx='24' cy='17' rx='5' ry='2.6' fill='%2300f0ff' opacity='.8'/%3E%3Ccircle cx='13.4' cy='16.4' r='1.3' fill='%2310081c'/%3E%3Ccircle cx='18.6' cy='16.4' r='1.3' fill='%2310081c'/%3E%3Ccircle cx='26' cy='8' r='3.2' fill='%23c46bff'/%3E%3Ccircle cx='26' cy='8' r='1.4' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>幻想</b>
        <span>ZONE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score coin" id="coin-box">
            <em>金币</em>
            <b id="coins">0</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 星</span>
          <span id="tag-label">巡游</span>
          <div class="fill" id="time-wrap" title="时限">
            <em>时</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
            <span id="time-num">0:55</span>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
        <div class="pwr" id="pwr" role="group" aria-label="武装">
          <span class="slot" data-id="twin">双</span>
          <span class="slot" data-id="wide">宽</span>
          <span class="slot" data-id="laser">光</span>
          <span class="slot" data-id="speed">速</span>
          <span class="slot bomb" data-id="bomb">弹</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="C" aria-label="智爆">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="幻想游戏区，横向卷轴，空格射击，C 智爆，打怪攒金币进店换武装"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="智爆">爆</button>
      </div>
      <div id="shop" class="shop hidden" aria-hidden="true">
        <div class="shop-panel" id="shop-panel">
          <p class="shop-kicker">SHOP</p>
          <h2>杂货铺</h2>
          <p class="shop-lead">金币换武装。数字键选购，离开继续飞。</p>
          <p class="shop-coins">金币 <b id="shop-coins">0</b></p>
          <div class="shop-grid" id="shop-grid">
            <button type="button" class="shop-item" data-id="twin" data-key="1">
              <em>1</em>
              <b>双弹</b>
              <span>双管齐射</span>
              <i id="p-twin">800</i>
            </button>
            <button type="button" class="shop-item" data-id="wide" data-key="2">
              <em>2</em>
              <b>宽射</b>
              <span>三向散射</span>
              <i id="p-wide">1800</i>
            </button>
            <button type="button" class="shop-item" data-id="laser" data-key="3">
              <em>3</em>
              <b>激光</b>
              <span>贯穿光束</span>
              <i id="p-laser">3200</i>
            </button>
            <button type="button" class="shop-item" data-id="speed" data-key="4">
              <em>4</em>
              <b>加速</b>
              <span>移速 +1</span>
              <i id="p-speed">400</i>
            </button>
            <button type="button" class="shop-item" data-id="life" data-key="5">
              <em>5</em>
              <b>续命</b>
              <span>多一条命</span>
              <i id="p-life">2000</i>
            </button>
            <button type="button" class="shop-item" data-id="bomb" data-key="6">
              <em>6</em>
              <b>智爆</b>
              <span>智爆 +1</span>
              <i id="p-bomb">800</i>
            </button>
          </div>
          <button type="button" id="shop-leave">离开</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ZONE</p>
          <h1 id="ov-title">幻想</h1>
          <p class="lead" id="ov-lead">打怪掉金币，进店换武装。空格射击，C 智爆。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击 · C 智爆 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-tour">巡游</button>
            <button type="button" id="btn-rush">急行</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">打怪掉金币 · 进店换武装 · 空格射击 · C 智爆</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
