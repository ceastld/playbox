<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#050c14" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>巨翼 · GIGA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23050c14'/%3E%3Ccircle cx='16' cy='18' r='9' fill='none' stroke='%231ab0ff' stroke-width='1.4'/%3E%3Cpath d='M16 6l4 8 10 2-10 3 2 9-6-5-6 5 2-9-10-3 10-2z' fill='%231ab0ff'/%3E%3Cpath d='M16 9l2.2 4.6 5 .5-4 3.2 1.2 4.8L16 19.4l-4.4 2.7 1.2-4.8-4-3.2 5-.5z' fill='%23ffe36b'/%3E%3Ccircle cx='8' cy='10' r='1.4' fill='%23ff3db8'/%3E%3Ccircle cx='25' cy='12' r='1.2' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>巨翼</b>
        <span>GIGA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">反射</span>
          <span id="wpn-label" class="wpn">射</span>
          <div class="fill" id="frc-wrap" title="反射力场">
            <em>力</em>
            <div class="fill-track" aria-hidden="true"><i id="frc-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>反射</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-ref" title="Shift / Z" aria-label="反射">反</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="巨翼游戏区，纵向卷轴，空格射击，Shift 张开反射力场把敌弹弹回去换成分"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="反射">反</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GIGA</p>
          <h1 id="ov-title">巨翼</h1>
          <p class="lead" id="ov-lead">张开反射力场，把敌弹弹回去换成分。短关之后是天核。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射击 · Shift / Z 反射 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-reflect">反射</button>
            <button type="button" id="btn-wall">弹墙</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · Shift 反射力场 · 弹回去换成分</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
