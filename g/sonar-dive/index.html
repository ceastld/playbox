<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>潜航 · DIVE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ff3db8' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='none' stroke='%2300f0ff' stroke-width='1.5'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>潜航</b>
        <span>DIVE</span>
      </div>
      <div class="status">
        <div class="o2" id="o2-wrap" title="氧气">
          <em>氧气</em>
          <div class="o2-track" aria-hidden="true"><i id="o2-fill"></i></div>
          <b id="o2-num">100</b>
        </div>
        <div class="row">
          <span id="stage-label">航道 —</span>
          <span id="dist-label">距舱 —</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="潜航海沟"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DIVE</p>
          <h1 id="ov-title">潜航</h1>
          <p class="lead" id="ov-lead">上浮下潜，从声呐环的盲区穿过。<br />十段航道，氧气在掉，驶向青色回收舱。</p>
          <p class="ops" id="ov-ops">W / ↑ 上浮 · S / ↓ 下潜 · 拖屏幕控深度 · M 静音</p>
          <button type="button" id="ov-btn">下潜</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">上浮下潜 · 钻进发亮的缺口 · 十段航道靠舱</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
