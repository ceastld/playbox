<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#041318" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>巴拉 · BARA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23041318'/%3E%3Cpath d='M0 6c4 8 3 14 0 26h8c2-10 1-18-2-26z' fill='%230a2a32'/%3E%3Cpath d='M32 4c-5 9-4 16 0 28h-8c-2-11-1-20 3-28z' fill='%230a2a32'/%3E%3Crect x='8' y='22' width='16' height='4' rx='1' fill='%23124858'/%3E%3Cellipse cx='16' cy='16' rx='5.4' ry='5.8' fill='%231ee0ff'/%3E%3Crect x='12.2' y='14.6' width='7.6' height='2.2' rx='1' fill='%23ffe36b'/%3E%3Cpath d='M13 21h6v3h-6z' fill='%2314c4e0'/%3E%3Ccircle cx='7' cy='20' r='2.2' fill='%23ff3db8'/%3E%3Cellipse cx='24' cy='21' rx='2.4' ry='3' fill='%2300e8ff'/%3E%3Ccircle cx='24.4' cy='20.4' r='.7' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>巴拉</b>
        <span>BARA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score cargo" id="cargo-box">
            <em>舱</em>
            <b id="cargo">0/8</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">浅层</span>
          <span id="tag-label">救舱</span>
          <span id="save-label">救 0</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="巴拉，地底机甲走飞，打舱救人，撞敌扣命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pads" class="pads" aria-hidden="true">
        <div class="pad-cluster left">
          <button type="button" class="pad" id="pad-left" aria-label="左">◀</button>
          <div class="pad-stack">
            <button type="button" class="pad" id="pad-up" aria-label="飞">▲</button>
            <button type="button" class="pad" id="pad-down" aria-label="落">▼</button>
          </div>
          <button type="button" class="pad" id="pad-right" aria-label="右">▶</button>
        </div>
        <div class="pad-cluster right">
          <button type="button" class="pad fire" id="pad-fire" aria-label="开火">射</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BARA</p>
          <h1 id="ov-title">巴拉</h1>
          <p class="lead" id="ov-lead">机甲走飞地底，打爆舱救出异形。撞敌扣命。短层过后是蛸王。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WSD 走飞 · 空格开火 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-save">救舱</button>
            <button type="button" id="btn-den">密穴</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走飞机甲 · 打舱救人 · 撞敌扣命 · 短层后蛸王 · A 自动</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
