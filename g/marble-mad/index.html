<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#04140e" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>弹轨 · MARBLE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304140e'/%3E%3Cpath d='M4 20l8-4 8 4-8 4z' fill='%230a3a2c'/%3E%3Cpath d='M12 16l8-4 8 4-8 4z' fill='%231a5a44'/%3E%3Cpath d='M12 10h8v6l-8 4z' fill='%230a8a62'/%3E%3Cpath d='M12 10l8-4 8 4-8 4z' fill='%233dffa8'/%3E%3Ccircle cx='20' cy='11' r='3.4' fill='%23e8fff8'/%3E%3Ccircle cx='19.2' cy='10.2' r='1.2' fill='%23fff'/%3E%3Crect x='22' y='6' width='1.2' height='8' fill='%23ffe36b'/%3E%3Cpath d='M23.2 6h5l-1 3h-4z' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>弹轨</b>
        <span>MARBLE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">50.0</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>时速</em>
            <b id="spd">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">缓坡</span>
          <span id="tag-label">练习</span>
          <div class="fill clock" id="time-wrap" title="剩余时间">
            <em>限</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连稳 ×1</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="弹轨，等距赛道，方向键倾斜弹珠，滚到旗下，掉下去会扣时间重生"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MARBLE</p>
          <h1 id="ov-title">弹轨</h1>
          <p class="lead" id="ov-lead">倾斜赛道，把弹珠滚到旗下。掉下或酸池会扣时间并重生。</p>
          <p class="ops" id="ov-ops">← → ↑ ↓ / WASD 倾斜 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-practice">练习</button>
            <button type="button" id="btn-race">竞速</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向键倾斜 · 躲开锤子和吸尘器 · 掉下去扣时间 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
