<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>末光 · EMBER</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M15 28h2.2c.8 0 1.4-.7 1.4-1.5V14.5h-5V26.5c0 .8.6 1.5 1.4 1.5z' fill='%236b4a2a'/%3E%3Cpath d='M16.1 15c-2.6-3.6.8-6.2 0-9.2 3.2 1.6 5.6 4.8 2.6 8.4' fill='%23ffe36b'/%3E%3Cpath d='M16.1 15c-1.3-2 .3-3.6 0-5.2 1.8.9 3 2.7 1.5 4.7' fill='%23ff3db8'/%3E%3Ccircle cx='16.2' cy='6.6' r='1.2' fill='%23fff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>末光</b>
        <span>EMBER</span>
      </div>
      <div class="status">
        <div class="ember" id="ember-wrap" title="火把">
          <em>火</em>
          <div class="ember-track" aria-hidden="true"><i id="ember-fill"></i></div>
          <b id="ember-num">100</b>
        </div>
        <div class="row">
          <span id="dist-label">距门 —</span>
          <span id="wind-label"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="末光废殿"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">EMBER</p>
          <h1 id="ov-title">末光</h1>
          <p class="lead" id="ov-lead">火把越来越短，在熄灭前摸到门。<br />亮时看路，暗时凭记忆。穿堂风会吞火。</p>
          <p class="ops" id="ov-ops">WASD / 方向键走动 · 按住屏幕朝向走 · M 静音</p>
          <button type="button" id="ov-btn">举火</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">火把在灭 · 别进风里久站 · 摸到那扇门</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
