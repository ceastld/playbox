<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>丛林 · JUNGLE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 4c2 6 3 8 4 14' fill='none' stroke='%239dff3a' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M16 3c1 7 2 9 3 15' fill='none' stroke='%239dff3a' stroke-width='1.8' stroke-linecap='round'/%3E%3Cpath d='M26 5c-1 6-1 9-2 14' fill='none' stroke='%23c8ff6a' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='10' cy='18' r='2.2' fill='%2300f0ff'/%3E%3Crect x='4' y='24' width='24' height='5' rx='1' fill='%23081a28'/%3E%3Cpath d='M4 24c4 2 8-1 12 1 4 2 8-1 12 1' fill='none' stroke='%2300f0ff' stroke-width='1.1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>丛林</b>
        <span>JUNGLE</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="round">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">营救</span>
          <span id="scene-label">荡藤</span>
          <div class="fill" id="time-wrap" title="剩余时间">
            <em>时</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <div class="fill air" id="air-wrap" title="氧气" hidden>
            <em>气</em>
            <div class="fill-track" aria-hidden="true"><i id="air-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="丛林营救，荡藤潜泳躲石救人"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-down" aria-label="向下 / 蹲">下</button>
        <button type="button" id="btn-up" aria-label="向上">上</button>
        <button type="button" id="btn-jump" aria-label="跳跃 / 抓藤 / 挥刀">跳</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">JUNGLE</p>
          <h1 id="ov-title">丛林</h1>
          <p class="lead" id="ov-lead">荡藤要抓准时机，水下留气斩鳄，爬山躲滚石，跃过守卫救出同伴。</p>
          <p class="ops" id="ov-ops">方向键或 WASD 移动 · 空格 跳跃 / 抓藤 / 挥刀 · 触屏底栏 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rescue">营救</button>
            <button type="button" id="btn-rush">急流</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格抓下一根藤 · 水下留气挥刀 · 滚石跳或蹲 · 跃过守卫救人 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
