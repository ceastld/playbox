<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>拍回 · CLAP</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Cpath d='M16 6v4M26 16h-4M16 26v-4M6 16h4' stroke='%23ff3db8' stroke-width='1.6' stroke-linecap='round'/%3E%3Ccircle cx='16' cy='16' r='5.2' fill='none' stroke='%23ffe36b' stroke-width='1.3'/%3E%3Cellipse cx='13.2' cy='16' rx='2.1' ry='2.6' fill='%23ff3db8'/%3E%3Cellipse cx='18.8' cy='16' rx='2.1' ry='2.6' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>拍回</b>
        <span>CLAP</span>
      </div>
      <div class="status">
        <span id="stage-label">十室回声</span>
        <div class="row">
          <span id="hit-label">拍回 —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="把房间回声拍回去"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-clap" aria-label="拍手">拍</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CLAP</p>
          <h1 id="ov-title">拍回</h1>
          <p class="lead" id="ov-lead">四面墙把回声浪推到掌心。<br />浪贴上内环的瞬间，拍手把它拍回去。</p>
          <p class="ops" id="ov-ops">空格 / J 拍手 · 点按画布 · M 静音</p>
          <button type="button" id="ov-btn">入室</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">青浪贴掌心再拍 · 品红虚响放过</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
