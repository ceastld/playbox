<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0608" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>砖弹 · GBAR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0608'/%3E%3Crect x='4' y='5' width='6' height='3' rx='.5' fill='%23ff8a28'/%3E%3Crect x='11' y='5' width='6' height='3' rx='.5' fill='%23ffc14a'/%3E%3Crect x='18' y='5' width='6' height='3' rx='.5' fill='%23ff3db8'/%3E%3Crect x='25' y='5' width='3' height='3' rx='.4' fill='%23c8d4e0'/%3E%3Crect x='4' y='9' width='6' height='3' rx='.5' fill='%23ffc14a'/%3E%3Crect x='11' y='9' width='6' height='3' rx='.5' fill='%23ff8a28'/%3E%3Crect x='18' y='9' width='6' height='3' rx='.5' fill='%2300f0ff'/%3E%3Crect x='14.4' y='14' width='3.2' height='7' rx='.6' fill='%23ffc14a'/%3E%3Ccircle cx='16' cy='18' r='2.2' fill='%23fff4d8'/%3E%3Crect x='9' y='24' width='14' height='4.2' rx='1.2' fill='%23ff8a28'/%3E%3Crect x='12' y='22.4' width='8' height='3' rx='.8' fill='%23ffc14a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>砖弹</b>
        <span>GBAR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">砖阵</span>
          <span id="tag-label">GBAR</span>
          <span id="gun-label">枪</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="砖弹，挡板接球打砖，空格开枪碎砖"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左">左</button>
        <button type="button" id="btn-fire" aria-label="开枪">射</button>
        <button type="button" id="btn-right" aria-label="向右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GBAR</p>
          <h1 id="ov-title">砖弹</h1>
          <p class="lead" id="ov-lead">挡板接球打砖，空格开枪碎砖。钢砖要球砸，爆砖会连锁。短关之后是堡墙。漏球丢命。</p>
          <p class="ops" id="ov-ops">← → / AD 挡板 · 空格开枪 · ↑/W 发球 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-stages">砖阵</button>
            <button type="button" id="btn-rain">弹雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → / AD 挡板 · 空格开枪 · ↑/W 发球 · 漏球丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
