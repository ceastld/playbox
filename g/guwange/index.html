<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#12060e" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>弓眼 · GUWA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312060e'/%3E%3Cpath d='M8 22V12h2v-2h12v2h2v10h-2v2H10v-2H8zm4-8h8v6h-8z' fill='%23ef398e'/%3E%3Cellipse cx='16' cy='17' rx='3.2' ry='2.4' fill='%23ffc45a'/%3E%3Ccircle cx='16' cy='17' r='1.2' fill='%2312060e'/%3E%3Cpath d='M16 6l2.2 5H13.8z' fill='%237af4e8'/%3E%3Ccircle cx='22' cy='8' r='2.4' fill='%237af4e8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>弓眼</b>
        <span>GUWA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">狩灵</span>
          <span id="wpn-label" class="wpn">矢</span>
          <div class="fill" id="lock-wrap" title="式神锁定">
            <em>锁</em>
            <div class="fill-track" aria-hidden="true"><i id="lock-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-lock" title="Shift / Z" aria-label="式神锁定" aria-pressed="false">锁</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="弓眼游戏区，八向移动，空格射箭，Shift 放出式神锁定"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="式神锁定">锁</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">GUWA</p>
          <h1 id="ov-title">弓眼</h1>
          <p class="lead" id="ov-lead">纵卷夜巷。空格射灵矢，Shift 放出式神锁敌。锁杀掉魂，短关之后是弓眼。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格射箭 · Shift / Z 锁定 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-hunt">狩灵</button>
            <button type="button" id="btn-sea">怨海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格射箭 · Shift 式神锁敌 · 锁杀掉魂</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
