<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0703" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>先锋 · VANG</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0703'/%3E%3Cpath d='M0 0h32v7H0zM0 25h32v7H0z' fill='%231a0c06'/%3E%3Cpath d='M0 7h32M0 25h32' stroke='%23ff7a1a' stroke-width='1.2'/%3E%3Crect x='20' y='9' width='2.2' height='14' fill='%23ff3db8'/%3E%3Cpath d='M6 16l9-4v8z' fill='%2300f0ff'/%3E%3Crect x='12' y='14.4' width='6' height='3.2' rx='.5' fill='%23ffe36b'/%3E%3Crect x='16' y='15.2' width='5' height='1.6' fill='%23e8ffff'/%3E%3Crect x='14.6' y='8' width='1.4' height='4' fill='%2300f0ff'/%3E%3Crect x='14.6' y='20' width='1.4' height='4' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>先锋</b>
        <span>VANG</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">钻隧</span>
          <span id="zone-label">赭谷</span>
          <span id="face-label" class="face">向→</span>
          <div class="fill" id="fuel-wrap" title="燃油">
            <em>油</em>
            <div class="fill-track" aria-hidden="true"><i id="fuel-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="先锋，隧洞侧飞，四向开火，能量墙可打可等"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <div class="pad-grid">
          <button type="button" id="btn-fu" aria-label="向上开火">上</button>
          <button type="button" id="btn-fl" aria-label="向左开火">左</button>
          <button type="button" id="btn-shot" aria-label="面向开火">射</button>
          <button type="button" id="btn-fr" aria-label="向右开火">右</button>
          <button type="button" id="btn-fd" aria-label="向下开火">下</button>
        </div>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">VANG</p>
          <h1 id="ov-title">先锋</h1>
          <p class="lead" id="ov-lead">隧洞自己往前开。四向开火，能量墙可打可等。撞壁、油尽都会掉命。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 移动 · 空格朝面向开火 · IJKL 四向 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-zone">钻隧</button>
            <button type="button" id="btn-blitz">乱射</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格朝面向开火 · IJKL 四向 · 能量墙可打可等 · 撞壁即坠</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
