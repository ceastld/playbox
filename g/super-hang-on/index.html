<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#100610" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>超悬 · SHON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23100610'/%3E%3Cpath d='M2 24 L14 14 L18 14 L30 24 V30 H2Z' fill='%231a0a18'/%3E%3Cpath d='M12 30 L15 16 L17 16 L20 30' fill='%23ff3d88' opacity='.5'/%3E%3Ccircle cx='16' cy='22' r='3.4' fill='%23141018'/%3E%3Cpath d='M12 16 L16 8 L20 16' fill='%23ff3d88'/%3E%3Ccircle cx='16' cy='7.2' r='2.2' fill='%23fff0f6'/%3E%3Crect x='14' y='18' width='4' height='2.2' rx='.4' fill='%23ffe36b'/%3E%3Cpath d='M10 20 L6 26' stroke='%2300f0ff' stroke-width='.8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>超悬</b>
        <span>SHON</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score time" id="time-box">
            <em>时间</em>
            <b id="time">46.0</b>
          </div>
          <div class="score spd" id="spd-box">
            <em>时速</em>
            <b id="spd">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">非原</span>
          <span id="tag-label">超悬</span>
          <div class="fill clock" id="time-wrap" title="剩余时间">
            <em>限</em>
            <div class="fill-track" aria-hidden="true"><i id="time-bar"></i></div>
          </div>
          <div class="fill turbo" id="turbo-wrap" title="涡轮">
            <em>涡</em>
            <div class="fill-track" aria-hidden="true"><i id="turbo-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-turbo" title="Shift / Z" aria-label="涡轮">涡</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="超悬，把摩托挂进画面，涡轮顶上，别摔，终段冲悬团"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SHON</p>
          <h1 id="ov-title">超悬</h1>
          <p class="lead" id="ov-lead">把车身挂进画面。涡轮顶上，别摔。短关之后是终段悬团。</p>
          <p class="ops" id="ov-ops">方向 / WASD 压弯 · 空格 / ↑ 油门 · Shift / Z 涡轮 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-core">超悬</button>
            <button type="button" id="btn-dense">悬核</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再冲</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 压弯 · ↑ 油门 · Shift 涡轮撞飞 · 别摔 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
