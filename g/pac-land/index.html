<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0904" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>豆陆 · LAND</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0904'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23121008' stroke='%23ffe14a' stroke-width='1.4'/%3E%3Cpath d='M16 8.4a7.4 7.4 0 1 0 6.2 3.4L16 16z' fill='%23ffe36b'/%3E%3Ccircle cx='16.5' cy='11.2' r='1.1' fill='%230a0904'/%3E%3Crect x='13.2' y='18.4' width='2.2' height='4.2' rx='.6' fill='%23ffe36b'/%3E%3Crect x='16.8' y='18.4' width='2.2' height='4.2' rx='.6' fill='%23ffe36b'/%3E%3Ccircle cx='24.2' cy='21' r='2.3' fill='%23ff3db8'/%3E%3Ccircle cx='7.6' cy='21.4' r='1.4' fill='%23ffe14a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>豆陆</b>
        <span>LAND</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="stage-num">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">回家</span>
          <span id="tag-label">郊野</span>
          <span id="hat-label" class="hat">无帽</span>
          <div class="fill" id="power-wrap" hidden title="惊吓">
            <em>吓</em>
            <div class="fill-track" aria-hidden="true"><i id="power-bar"></i></div>
          </div>
          <div class="fill" id="hat-wrap" hidden title="帽子">
            <em>帽</em>
            <div class="fill-track hat" aria-hidden="true"><i id="hat-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-home" aria-pressed="true">回家</button>
          <button type="button" id="mode-night" aria-pressed="false">夜路</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="豆陆，侧向跑跳，吃豆躲鬼，帽子缓降喷火，把仙子送到尽头"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="喷火">火</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">LAND</p>
          <h1 id="ov-title">豆陆</h1>
          <p class="lead" id="ov-lead">跑跳回家，弹簧弹高。直升机帽缓降，火焰帽喷火。<br />能量豆反吃鬼，把仙子送到尽头。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 跑 · 空格 / 上 跳 · 下 喷火 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-home">回家</button>
            <button type="button" id="btn-night">夜路</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">跑跳吃豆 · 弹簧弹高 · 帽子能飞能射 · 把仙子送到尽头</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
