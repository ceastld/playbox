<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>长竿 · POLE</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M16 28 L16 8' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round'/%3E%3Crect x='12.5' y='4' width='7' height='7' rx='1.4' fill='none' stroke='%23ff3db8' stroke-width='1.6'/%3E%3Ccircle cx='16' cy='7.5' r='1.2' fill='%23ffe36b'/%3E%3Cpath d='M10 28h12' stroke='%2300f0ff' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>长竿</b>
        <span>POLE</span>
      </div>
      <div class="status">
        <div class="bal" id="bal-wrap" title="衡">
          <em>衡</em>
          <div class="bal-track" aria-hidden="true"><i id="bal-fill"></i></div>
        </div>
        <div class="row">
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="长竿平衡"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="向左平移">左</button>
        <button type="button" id="btn-right" aria-label="向右平移">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">POLE</p>
          <h1 id="ov-title">长竿</h1>
          <p class="lead" id="ov-lead">左右微调掌心，别让长竿倒下。<br />倒向哪边，掌心就跟过去。</p>
          <p class="ops" id="ov-ops">← → / A D 平移 · 拖屏幕 · M 静音</p>
          <button type="button" id="ov-btn">起竿</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">倒向哪边，掌心就跟过去 · 侧风会推竿</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
