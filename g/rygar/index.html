<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0c0702" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>莱加 · RYGA</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230c0702'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23140c04' stroke='%23ff8a14' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23ff8a14' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='12' cy='13' r='3.2' fill='%23ffe36b'/%3E%3Crect x='9.6' y='16' width='5.2' height='6.4' rx='.8' fill='%23ff8a14'/%3E%3Cpath d='M15.2 18h8.4' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Ccircle cx='24.2' cy='18' r='2.1' fill='%23ffe36b'/%3E%3Crect x='9.8' y='22.2' width='2' height='3' fill='%23c46a20'/%3E%3Crect x='12.6' y='22.2' width='2' height='3' fill='%23c46a20'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>莱加</b>
        <span>RYGA</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score hp" id="hp-box">
            <em>生命</em>
            <b id="hp">3</b>
            <span class="hp-track" aria-hidden="true"><i id="hp-fill"></i></span>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">荒丘</span>
          <span id="tag-label">盘击</span>
          <span id="disk-label" class="disk">短盘</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-disk" aria-pressed="true">盘击</button>
          <button type="button" id="mode-rush" aria-pressed="false">疾行</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="莱加，侧向走跳，飞盘往返斩敌，越过断崖打守护者"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-disk" aria-label="飞盘">盘</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">RYGA</p>
          <h1 id="ov-title">莱加</h1>
          <p class="lead" id="ov-lead">飞盘甩出去再收回。越过断崖，甲兵要打两下。<br />坠崖或生命打空都会丢命。关底有守护者。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 空格跳 · J / Z 飞盘 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-disk-start">盘击</button>
            <button type="button" id="btn-rush-start">疾行</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳过崖 · J/Z 飞盘往返 · 甲兵多下才倒 · 坠崖丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
