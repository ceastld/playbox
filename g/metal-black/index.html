<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#04141c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>黑金 · MBLK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2304141c'/%3E%3Cpath d='M0 22c8-4 12-10 20-6 4 2 8 1 12 4' fill='none' stroke='%2314c8c0' stroke-width='1' opacity='.7'/%3E%3Cpath d='M4 16l9-3.4V19.4z' fill='%233db8ff'/%3E%3Crect x='10' y='14' width='7' height='4' rx='.5' fill='%23ffe36b'/%3E%3Crect x='17' y='14.6' width='12' height='2.8' rx='.6' fill='%23ffe36b'/%3E%3Crect x='17' y='15.2' width='12' height='1.6' fill='%23e8f4ff'/%3E%3Ccircle cx='14' cy='10' r='1.6' fill='%23ffc44d'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>黑金</b>
        <span>MBLK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">黑海</span>
          <span id="tag-label">黑海</span>
          <span id="alone-label" class="alone">点射</span>
          <div class="fill" id="chg-wrap" title="新孤">
            <em>孤</em>
            <div class="fill-track" aria-hidden="true"><i id="chg-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="黑金游戏区，横向卷轴，空格点射，按住蓄新孤超武"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-fire" aria-label="射击蓄力">蓄</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MBLK</p>
          <h1 id="ov-title">黑金</h1>
          <p class="lead" id="ov-lead">收黑金、蓄新孤。松开放出贯穿全屏的超武。撞机掉命。先黑海后虚空。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格点射（按住蓄力）· R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-sea">黑海</button>
            <button type="button" id="btn-tide">核潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再飞</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">收黑金填槽 · 按住空格蓄新孤 · 松手贯穿全屏 · 撞机掉命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
