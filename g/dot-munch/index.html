<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>豆径 · PAC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='4' width='24' height='24' rx='4' fill='%230a0c18' stroke='%2300f0ff' stroke-width='1.3'/%3E%3Cpath d='M16 8.2a7.8 7.8 0 1 0 6.6 3.6L16 16z' fill='%23ffe36b'/%3E%3Ccircle cx='16.6' cy='11.2' r='1.15' fill='%2305030c'/%3E%3Ccircle cx='23.4' cy='20.6' r='2.4' fill='%23ff3db8'/%3E%3Ccircle cx='8.6' cy='21' r='2.1' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>豆径</b>
        <span>PAC</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score">
            <em>关</em>
            <b id="level">1</b>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box" hidden>
            <em>连吃</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">经典</span>
          <div class="fill fright" id="fright-wrap" hidden title="惊吓">
            <em>吓</em>
            <div class="fill-track" aria-hidden="true"><i id="fright-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <div class="board" id="board">
          <canvas id="c" tabindex="0" role="application" aria-label="豆径迷宫，吃豆躲鬼，能量豆可反吃"></canvas>
        </div>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PAC</p>
          <h1 id="ov-title">豆径</h1>
          <p class="lead" id="ov-lead">吃光豆子，躲鬼。能量豆反打。</p>
          <p class="ops" id="ov-ops">方向键或滑动 · 能量豆惊吓六秒 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-classic">经典</button>
            <button type="button" id="btn-fog">迷雾</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向键或滑动 · 能量豆反吃鬼 · 四鬼性格不同 · 迷雾只亮近处</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
