<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>倒带 · REWIND</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M7 16h10M17 10l8 6-8 6' fill='none' stroke='%2300f0ff' stroke-width='2' stroke-linejoin='round'/%3E%3Ccircle cx='8' cy='16' r='2.4' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>倒带</b>
        <span>REWIND</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="meters">
          <div class="tape" title="磁带">
            <em>磁带</em>
            <div class="tape-track" aria-hidden="true"><i id="tape-fill"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余倒带"></span>
          <span class="lives" id="lives" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M">声</button>
        <button type="button" id="btn-retry" title="R">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="倒带关卡"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <button type="button" id="btn-rew" class="rew-fab" hidden title="空格">倒带</button>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">REWIND</p>
          <h1 id="ov-title">倒带</h1>
          <p class="lead" id="ov-lead">按住倒带满三秒。旧的自己会停在原地，替你挡住新飞来的障碍。</p>
          <p class="ops" id="ov-ops">WASD / 方向键或拖拽移动 · 按住空格或「倒带」满三秒 · M 静音</p>
          <button type="button" id="ov-btn">开始</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走满三秒磁带 · 按住倒带留下旧自己 · 残影挡住新弹</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
