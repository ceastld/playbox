<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0a0308" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>忍 · SHINOBI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230a0308'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%23140810' stroke='%23ff2a62' stroke-width='1.4'/%3E%3Cpath d='M4 24h24' stroke='%23ff2a62' stroke-width='1.2' opacity='.5'/%3E%3Ccircle cx='15' cy='13' r='4.2' fill='%23ffe36b'/%3E%3Crect x='12.2' y='16.4' width='6' height='7.2' rx='1' fill='%23ff2a62'/%3E%3Cpath d='M18 12l8-2-6 4z' fill='%2300f0ff'/%3E%3Crect x='22' y='20' width='4' height='5' rx='.6' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>忍</b>
        <span>SHINOBI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">码头</span>
          <span id="tag-label">营救</span>
          <span id="host-label" class="hosts">人质 0/0</span>
          <span id="ninj-label" class="ninj">忍 3</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-rescue" aria-pressed="true">营救</button>
          <button type="button" id="mode-night" aria-pressed="false">夜袭</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="忍，侧跳斩杀，手里剑远打，救出人质后对头目"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-slash" aria-label="斩或手里剑">斩</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-ninj" aria-label="忍术">忍</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SHINOBI</p>
          <h1 id="ov-title">忍</h1>
          <p class="lead" id="ov-lead">侧跳斩杀，手里剑远打。<br />救完人质，头目现身。Z 忍术清场。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走跳 · 空格斩或手里剑 · Z 忍术 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-rescue">营救</button>
            <button type="button" id="btn-night">夜袭</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳 · 空格近斩远镖 · 救人质 · Z 忍术清场 · 挨打丢命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
