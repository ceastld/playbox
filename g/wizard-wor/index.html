<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#080510" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>巫廊 · WOR</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080510'/%3E%3Crect x='3' y='3' width='26' height='26' rx='3' fill='%23120818' stroke='%23c44dff' stroke-width='1.4'/%3E%3Cpath d='M8 8h5M8 8v5M19 8h5v4M8 20v4h4M20 19h5v5' stroke='%23c44dff' stroke-width='1.2' fill='none'/%3E%3Ccircle cx='12' cy='18' r='2.1' fill='%2300f0ff'/%3E%3Cpath d='M13.8 18h5.4' stroke='%23ffe36b' stroke-width='1.4' stroke-linecap='round'/%3E%3Crect x='21' y='10' width='3.2' height='5.2' rx='.5' fill='%23ffe36b'/%3E%3Cpath d='M21.2 8.2l1.6-2.4 1.6 2.4z' fill='%23e84dff'/%3E%3Ccircle cx='22.8' cy='22.5' r='1.2' fill='%23ff3a7a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>巫廊</b>
        <span>WOR</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">地牢</span>
          <span id="tag-label">敌 —</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-dungeon" aria-pressed="true">地牢</button>
          <button type="button" id="mode-night" aria-pressed="false">夜巫</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="巫廊迷宫，四向走，空格一发一射，雷达看隐身，巫会晚些传送进来"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-fire" aria-label="开火">射</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">WOR</p>
          <h1 id="ov-title">巫廊</h1>
          <p class="lead" id="ov-lead">迷宫里一发一射。雷达看见隐身的黄影和赤踪。<br />巫会晚些传送进来。碰到或中弹掉命。</p>
          <p class="ops" id="ov-ops">WASD / 方向键走 · 空格开火（场上只有一发）· R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-dungeon">地牢</button>
            <button type="button" id="btn-night">夜巫</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">一发一射 · 雷达看隐身 · 左右门穿过 · 巫会来</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
