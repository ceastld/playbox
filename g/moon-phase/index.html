<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>月相 · MOON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2300f0ff' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='16' r='7.2' fill='%23ffe9c4'/%3E%3Ccircle cx='19.6' cy='16' r='6.2' fill='%2305030c'/%3E%3Cpath d='M16 3.2 L17.4 6.4 L16 5.6 L14.6 6.4 Z' fill='%23ff3db8'/%3E%3Ccircle cx='6' cy='8' r='0.8' fill='%2300f0ff'/%3E%3Ccircle cx='26' cy='11' r='0.6' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>月相</b>
        <span>MOON</span>
      </div>
      <div class="status">
        <span id="stage-label">—</span>
        <div class="row">
          <span id="fit-label">对 —</span>
          <span id="time-label">—</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-lock" title="空格" aria-label="落锁">落锁</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" aria-label="转圆盘对月相"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-ccw" aria-label="逆时针转盘">◀</button>
        <button type="button" id="btn-pad-lock" aria-label="落锁">落锁</button>
        <button type="button" id="btn-cw" aria-label="顺时针转盘">▶</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MOON</p>
          <h1 id="ov-title">月相</h1>
          <p class="lead" id="ov-lead">转圆盘，让仪月对上今夜月相。<br />差一线都不算，看清缺的那边再落锁。</p>
          <p class="ops" id="ov-ops">A/D 转盘 · 拖圆盘 · 空格落锁 · M 静音</p>
          <button type="button" id="ov-btn">观月</button>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">转圆盘对上今夜月相 · 空格落锁</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
