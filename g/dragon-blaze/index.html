<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#160804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>龙炎 · DBLZ</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23160804'/%3E%3Cpath d='M10 22c4-8 6-12 6-12s3 5 10 10c-5 1-8 4-12 8-1-2-3-4-4-6z' fill='%23ff4e1c'/%3E%3Cpath d='M16 8c1.8 3 2.6 6.4 2.2 10-.3 2.8-1.4 5.4-2.8 7.8-1.4-2.4-2.5-5-2.8-7.8C12.2 14.4 13.2 11 16 8z' fill='%23ffd24a'/%3E%3Cpath d='M12 12l-4 2 4 1M20 12l4 2-4 1' fill='%237ec8ff'/%3E%3Ccircle cx='14.4' cy='12.4' r='.9' fill='%23160804'/%3E%3Ccircle cx='17.6' cy='12.4' r='.9' fill='%23160804'/%3E%3Crect x='14.4' y='18' width='3.2' height='4' rx='.6' fill='%237ec8ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>龙炎</b>
        <span>DBLZ</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">龙炎</span>
          <span id="wpn-label" class="wpn">一焰</span>
          <span id="chg-label" class="chg">蓄</span>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="龙炎游戏区，骑龙八向飞，空格喷火蓄炎枪，Shift 扔炎柱，撞体扣命"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad" aria-label="爆弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DBLZ</p>
          <h1 id="ov-title">龙炎</h1>
          <p class="lead" id="ov-lead">骑龙北上。喷火清场，按住蓄炎枪，爆弹化炎柱。撞体扣命。三关之后是炎渊泰坦。</p>
          <p class="ops" id="ov-ops">方向 / WASD 飞 · 空格喷火 · Shift / Z 爆弹 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-blaze">龙炎</button>
            <button type="button" id="btn-sea">炎海</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">方向飞 · 空格喷火蓄枪 · Shift 炎柱 · 吃芯加速蓄</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
