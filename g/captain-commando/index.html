<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140604" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>队长 · CAPT</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140604'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231c0c08' stroke='%23ff3a12' stroke-width='1.4'/%3E%3Cpath d='M8 22h16' stroke='%23ff8a4a' stroke-width='1.2' opacity='.5'/%3E%3Crect x='11' y='9' width='10' height='8' rx='2' fill='%23ff3a12'/%3E%3Crect x='12.2' y='11.2' width='7.6' height='2.2' rx='.6' fill='%2300f0ff'/%3E%3Crect x='12' y='17' width='8' height='6' rx='.6' fill='%23ffe36b'/%3E%3Ccircle cx='9' cy='20' r='2.2' fill='%23ffb24a'/%3E%3Ccircle cx='23' cy='20' r='2.2' fill='%23ffb24a'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>队长</b>
        <span>CAPT</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">罪城</span>
          <span id="tag-label">巷战</span>
          <span id="hero-label" class="hero fist">拳</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill" id="sp-wrap" title="能量">
            <em>能</em>
            <div class="fill-track sp" aria-hidden="true"><i id="sp-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-street" aria-pressed="true">巷战</button>
          <button type="button" id="mode-tide" aria-pressed="false">机潮</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="队长，侧向巷战，选拳忍枪婴，近战加短技清场"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-jump" aria-label="跳跃">跳</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-atk" aria-label="攻击">打</button>
        <button type="button" id="btn-sp" aria-label="短技">技</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">CAPT</p>
          <h1 id="ov-title">队长</h1>
          <p class="lead" id="ov-lead">侧向巷战。选一位队员，近战加短技清场。街上是匪徒，机甲会射胸口光。体力打空扣一命。</p>
          <p class="ops" id="ov-ops">方向 / WASD 走 · 上跳 · 空格打 · Shift/Z 技 · R 重开 · M 静音</p>
          <div class="heroes" id="hero-row" role="radiogroup" aria-label="选队员">
            <button type="button" id="h-fist" data-id="fist" aria-pressed="true">拳</button>
            <button type="button" id="h-ninja" data-id="ninja" aria-pressed="false">忍</button>
            <button type="button" id="h-gun" data-id="gun" aria-pressed="false">枪</button>
            <button type="button" id="h-baby" data-id="baby" aria-pressed="false">婴</button>
          </div>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-street">巷战</button>
            <button type="button" id="btn-tide">机潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走跳打 · Shift 短技 · 跳开机光 · 四队员不同招</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
