<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#160808" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>爆射 · BLST</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23160808'/%3E%3Cpath d='M16 4 L26 10 L26 22 L16 28 L6 22 L6 10 Z' fill='none' stroke='%23ff4a1c' stroke-width='1.3'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='8' r='1.4' fill='%23ff4a1c'/%3E%3Ccircle cx='23' cy='13' r='1.4' fill='%234ad4ff'/%3E%3Ccircle cx='23' cy='19' r='1.4' fill='%23ffd428'/%3E%3Ccircle cx='16' cy='24' r='1.4' fill='%235cff7a'/%3E%3Ccircle cx='9' cy='19' r='1.4' fill='%23ffd428'/%3E%3Ccircle cx='9' cy='13' r='1.4' fill='%234ad4ff'/%3E%3Cpath d='M16 6l2 8 7 1.4-5.6 4.6 1.6 7-5-4.2-5 4.2 1.6-7L7 15.4 14 14z' fill='%23ff4a1c' opacity='.85'/%3E%3Crect x='14.8' y='12' width='2.4' height='10' rx='.6' fill='%23fff0e6'/%3E%3Ccircle cx='16' cy='10' r='2.4' fill='none' stroke='%23ffe36b' stroke-width='1.1'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>爆射</b>
        <span>BLST</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 关</span>
          <span id="tag-label">爆射</span>
          <span id="pat-label" class="pat red">红</span>
          <div class="fill" id="chg-wrap" title="成球">
            <em>球</em>
            <div class="fill-track" aria-hidden="true"><i id="chg-bar"></i></div>
          </div>
          <span id="bomb-label" class="bombs">爆 ×3</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-pat" title="X / C" aria-label="切式">式</button>
        <button type="button" id="btn-bomb" title="Shift / Z" aria-label="爆射弹">爆</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="爆射游戏区，纵向卷轴，空格射击按住成球，X 切四式，Shift 爆射"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-pad-pat" aria-label="切式">式</button>
        <button type="button" id="btn-pad" aria-label="爆射弹">爆</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BLST</p>
          <h1 id="ov-title">爆射</h1>
          <p class="lead" id="ov-lead">切四式环弹，按住成球穿甲。六角基先打炮再打核。短关之后是堡。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 飞 · 空格射击（按住成球）· X 切式 · Shift / Z 爆射 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-blast">爆射</button>
            <button type="button" id="btn-rain">炎雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">空格连射 · 按住成球 · X 切红蓝黄绿 · Shift 爆射</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
