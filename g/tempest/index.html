<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#080318" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>风暴 · TMPS</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23080318'/%3E%3Cpolygon points='16,3 27,9 27,19 16,25 5,19 5,9' fill='none' stroke='%23c44dff' stroke-width='1.15'/%3E%3Cpolygon points='16,10 22,13.5 22,18.5 16,22 10,18.5 10,13.5' fill='none' stroke='%23c44dff' stroke-width='0.85' opacity='.75'/%3E%3Cpath d='M16 3 L16 10 M27 9 L22 13.5 M27 19 L22 18.5 M16 25 L16 22 M5 19 L10 18.5 M5 9 L10 13.5' stroke='%239b3cff' stroke-width='0.7' opacity='.85'/%3E%3Cpath d='M12.6 26.2 L16 22.8 L19.4 26.2' fill='none' stroke='%23ffe36b' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 25.6 L16 21.2' stroke='%2300f0ff' stroke-width='1.1' stroke-linecap='round'/%3E%3Cpath d='M13.4 15.6 L16 13 L18.6 15.6' fill='none' stroke='%23ff3db8' stroke-width='1.2' stroke-linecap='round'/%3E%3Cpath d='M16 10 L16 16' stroke='%23ffe36b' stroke-width='1' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>风暴</b>
        <span>TMPS</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">风暴</span>
          <span id="tag-label">TMPS</span>
          <span id="zap-label" class="zap" hidden>超闪</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-zap" title="Z / Shift" aria-label="超闪" disabled>闪</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="风暴游戏区，沿管沿绕圈向内开火，清关后扎进钉管"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">TMPS</p>
          <h1 id="ov-title">风暴</h1>
          <p class="lead" id="ov-lead">骑在管沿向内开火。清关后扎进钉管。最后是钉心。</p>
          <p class="ops" id="ov-ops">← → / WASD 绕沿 · 空格开火 · Shift / Z 超闪 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-storm">风暴</button>
            <button type="button" id="btn-core">核管</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 绕沿 · 空格向内开火 · Shift/Z 超闪 · A 自动 · 清关扎钉</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
