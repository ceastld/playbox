<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>破砖 · BREAK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='4' y='5' width='6.2' height='3.2' rx='.6' fill='%23ff5a2a'/%3E%3Crect x='11.2' y='5' width='6.2' height='3.2' rx='.6' fill='%23ffe36b'/%3E%3Crect x='18.4' y='5' width='6.2' height='3.2' rx='.6' fill='%23ff3db8'/%3E%3Crect x='25.6' y='5' width='2.4' height='3.2' rx='.5' fill='%2300f0ff'/%3E%3Crect x='4' y='9.2' width='6.2' height='3.2' rx='.6' fill='%23ff8a4a'/%3E%3Crect x='11.2' y='9.2' width='6.2' height='3.2' rx='.6' fill='%23ff5a2a'/%3E%3Crect x='18.4' y='9.2' width='6.2' height='3.2' rx='.6' fill='%23ffe36b'/%3E%3Ccircle cx='16' cy='20' r='2.1' fill='%23e8ffff'/%3E%3Crect x='8' y='25.2' width='16' height='2.6' rx='1.2' fill='%2300f0ff'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>破砖</b>
        <span>BREAK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">闯关</span>
          <span id="tag-label">BREAK</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="破砖游戏区，挡板接球打砖"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">BREAK</p>
          <h1 id="ov-title">破砖</h1>
          <p class="lead" id="ov-lead">弹球打砖，别漏下去。</p>
          <p class="ops" id="ov-ops">← → 或拖动挡板 · 空格发球 · A 自动 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-campaign">闯关</button>
            <button type="button" id="btn-endless">无尽</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">左右或拖动挡板 · 空格发球 · A 自动 · 别漏球</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
