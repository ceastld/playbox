<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>宝洞 · ALI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='3' y='3' width='26' height='26' rx='4' fill='%23120808' stroke='%23ffb020' stroke-width='1.3'/%3E%3Crect x='6' y='6' width='5' height='5' rx='.8' fill='%23ffb020' opacity='.7'/%3E%3Crect x='21' y='6' width='5' height='5' rx='.8' fill='%23ffb020' opacity='.4'/%3E%3Crect x='6' y='21' width='5' height='5' rx='.8' fill='%23ffb020' opacity='.4'/%3E%3Ccircle cx='12' cy='20' r='2.6' fill='%23ffe8c8'/%3E%3Cpath d='M9.6 18.4h4.8c.2-1.6-1-2.6-2.4-2.6s-2.6 1-2.4 2.6z' fill='%23ff8a3d'/%3E%3Ccircle cx='11.3' cy='19.5' r='.35' fill='%2305030c'/%3E%3Ccircle cx='12.8' cy='19.5' r='.35' fill='%2305030c'/%3E%3Cellipse cx='21' cy='13' rx='2.2' ry='2.6' fill='%23c4782a'/%3E%3Ccircle cx='21' cy='12.2' r='1.1' fill='%23ffe36b'/%3E%3Ccircle cx='22.6' cy='22' r='2.4' fill='%23ff3db8'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>宝洞</b>
        <span>ALI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">寻宝</span>
          <span id="tag-label">金 0</span>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-camp" aria-pressed="true">寻宝</button>
          <button type="button" id="mode-hunt" aria-pressed="false">追兵</button>
        </div>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="宝洞迷宫，走格子捡金袋，空格踢晕卫兵，金够了走出洞口"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">连击 ×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-up" aria-label="上">上</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-kick" aria-label="踢卫兵">踢</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">ALI</p>
          <h1 id="ov-title">宝洞</h1>
          <p class="lead" id="ov-lead">迷宫里捡金袋。空格踢晕卫兵。<br />金够了出口才开，碰到卫兵扣一命。</p>
          <p class="ops" id="ov-ops">方向键 / WASD 走 · 空格踢 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-campaign">寻宝</button>
            <button type="button" id="btn-hunt">追兵</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">走格子捡金 · 空格踢晕卫兵 · 金够了出洞</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
