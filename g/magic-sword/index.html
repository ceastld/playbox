<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#140806" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>魔剑 · SWORD</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23140806'/%3E%3Crect x='2' y='2' width='28' height='28' rx='4' fill='%231c0c08' stroke='%23ff4a14' stroke-width='1.4'/%3E%3Cpath d='M4 25h24' stroke='%23ff4a14' stroke-width='1.2' opacity='.5'/%3E%3Crect x='7' y='16' width='6' height='9' rx='.8' fill='%23ff4a14'/%3E%3Ccircle cx='10' cy='14' r='2.6' fill='%23e8c090'/%3E%3Cpath d='M13 17l14-2.2-10 4.2z' fill='%23ffe36b'/%3E%3Cpath d='M13 19.4h13' stroke='%23ff8a3a' stroke-width='1.6'/%3E%3Crect x='22' y='8' width='2' height='7' fill='%23ff8a3a' opacity='.85'/%3E%3Ccircle cx='23' cy='7.2' r='1.6' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>魔剑</b>
        <span>SWORD</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连击</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">底层</span>
          <span id="tag-label">闯塔</span>
          <span id="wep-label" class="wep iron">铁剑</span>
          <span id="comp-label" class="comp off">同伴 —</span>
          <div class="fill" id="hp-wrap" title="体力">
            <em>体</em>
            <div class="fill-track" aria-hidden="true"><i id="hp-bar"></i></div>
          </div>
          <div class="fill boss" id="boss-wrap" hidden title="头目">
            <em id="boss-name">石魔</em>
            <div class="fill-track" aria-hidden="true"><i id="boss-bar"></i></div>
          </div>
          <span class="pips" id="pips" aria-label="剩余性命"></span>
        </div>
      </div>
      <div class="tools">
        <div class="modes" role="radiogroup" aria-label="模式">
          <button type="button" id="mode-climb" aria-pressed="true">闯塔</button>
          <button type="button" id="mode-tide" aria-pressed="false">魔潮</button>
        </div>
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="board-wrap">
        <canvas id="c" tabindex="0" role="application" aria-label="魔剑，侧向闯塔，长剑横扫，救出同伴并肩作战"></canvas>
      </div>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="chain-pop" class="chain-pop hidden" aria-hidden="true">×2</div>
      <div id="pad" class="pad">
        <button type="button" id="btn-jump" aria-label="跳跃或上楼">跳</button>
        <button type="button" id="btn-left" aria-label="左">左</button>
        <button type="button" id="btn-slash" aria-label="挥剑">斩</button>
        <button type="button" id="btn-right" aria-label="右">右</button>
        <button type="button" id="btn-down" aria-label="下梯">下</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SWORD</p>
          <h1 id="ov-title">魔剑</h1>
          <p class="lead" id="ov-lead">往右走、往上爬魔塔。长剑横扫，救出同伴并肩作战。小鬼、骑士、每层头目。体力打空扣一命。</p>
          <p class="ops" id="ov-ops">方向 / D 走 · 上跳/爬梯 · 空格挥剑 · A 自动 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-climb">闯塔</button>
            <button type="button" id="btn-tide">魔潮</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-again">再来</button>
            <button type="button" id="ov-menu">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">往右走、往上爬 · 空格长斩 · 劈笼救同伴 · A 自动 · 体力打空扣一命</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
