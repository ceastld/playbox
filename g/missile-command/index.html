<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#120804" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>导弹 · MSLC</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23120804'/%3E%3Cpath d='M5 6 L13 18' stroke='%23ff8820' stroke-width='1.3'/%3E%3Cpath d='M27 5 L20 16' stroke='%23ff3db8' stroke-width='1.3'/%3E%3Ccircle cx='16' cy='17' r='5.2' fill='none' stroke='%2300e8ff' stroke-width='1.4'/%3E%3Ccircle cx='16' cy='17' r='1.6' fill='%23e8ffff'/%3E%3Crect x='7' y='24' width='3' height='5' fill='%23ffe36b'/%3E%3Crect x='11' y='22' width='2.4' height='7' fill='%23ffb040'/%3E%3Crect x='19' y='23' width='2.6' height='6' fill='%23ffe36b'/%3E%3Crect x='23' y='24.5' width='3' height='4.5' fill='%23ffb040'/%3E%3Cpath d='M3 29 L8 21 L13 29Z' fill='%23ff8820'/%3E%3Cpath d='M19 29 L24 21 L29 29Z' fill='%23ff8820'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>导弹</b>
        <span>MSLC</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">导弹</span>
          <span id="tag-label">MSLC</span>
          <span id="ammo-label">弹 30</span>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余城市"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="导弹游戏区，瞄准拦截来袭导弹，护住城市"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">MSLC</p>
          <h1 id="ov-title">导弹</h1>
          <p class="lead" id="ov-lead">瞄准拦截来袭弹雨，护住六城。五波之后是智弹雨。</p>
          <p class="ops" id="ov-ops">点按 / 空格开火 · 方向键移准星 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-mslc">导弹</button>
            <button type="button" id="btn-rain">核雨</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">点按瞄准开火 · 火球吞弹 · 护住六城 · 智弹雨通关</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
