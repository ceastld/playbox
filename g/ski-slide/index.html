<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>雪道 · SKI</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M6 26 L12 8 L18 26' fill='none' stroke='%233df0ff' stroke-width='1.6'/%3E%3Cpath d='M20 26 L24 12 L28 26' fill='none' stroke='%233df0ff' stroke-width='1.2' opacity='.7'/%3E%3Ccircle cx='16' cy='11' r='2.2' fill='%23ff3db8'/%3E%3Cpath d='M16 13 L16 18' stroke='%23ffe36b' stroke-width='1.3'/%3E%3Cpath d='M13 20 L16 18 L19 20' stroke='%233df0ff' stroke-width='1.4' stroke-linecap='round'/%3E%3Cpath d='M12 22 L14 26 M20 22 L18 26' stroke='%2300f0ff' stroke-width='1.2' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>雪道</b>
        <span>SKI</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="dist-box">
            <em>距离</em>
            <b id="dist">0</b>
          </div>
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最远</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连擦</em>
            <b id="combo">×1</b>
          </div>
        </div>
        <div class="row">
          <span id="mode-label">自由</span>
          <span id="yeti-label" hidden>雪人</span>
          <span id="gate-label"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="雪道，往下滑躲开树和狗，猫腰加速"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">SKI</p>
          <h1 id="ov-title">雪道</h1>
          <p class="lead" id="ov-lead">往下滑，躲开树。猫腰加速，转弯更钝。</p>
          <p class="ops" id="ov-ops">← → 转向 · ↓ 猫腰 · 拖指 / 倾斜 · R 重开 · A 自动</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-free">自由</button>
            <button type="button" id="btn-gate">旗门</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再滑</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">← → 转向 · ↓ 猫腰加速 · 擦边连击 · R 重开 · A 自动 · M 静音</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
