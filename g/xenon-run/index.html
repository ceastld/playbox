<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#0b0614" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>异星 · XENON</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0614'/%3E%3Cpath d='M2 4h8v24H2zM22 4h8v24h-8z' fill='%23140822'/%3E%3Cpath d='M10 4v24M22 4v24' stroke='%23b44dff' stroke-width='1.2'/%3E%3Crect x='12' y='8' width='8' height='4' rx='.6' fill='%23ff3db8'/%3E%3Cpath d='M16 18l3.2 6h-2.1l-1.1 2.2-1.1-2.2H13z' fill='%2300f0ff'/%3E%3Crect x='13.2' y='20' width='5.6' height='3.2' rx='.5' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>异星</b>
        <span>XENON</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">第 1 区</span>
          <span id="tag-label">地表</span>
          <span id="form-label" class="form air">战机</span>
          <div class="fill" id="pow-wrap" title="火力">
            <em>火</em>
            <div class="fill-track" aria-hidden="true"><i id="pow-bar"></i></div>
          </div>
          <span id="combo-label" class="combo" hidden>连击</span>
          <span class="pips" id="pips" aria-label="剩余生命"></span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="异星游戏区，飞机飞过炮台，坦克碾碎炮台，C 变形"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="pad" class="pad">
        <button type="button" id="btn-xform" aria-label="变形">变</button>
      </div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">XENON</p>
          <h1 id="ov-title">异星</h1>
          <p class="lead" id="ov-lead">飞机飞过炮台，坦克碾碎炮台。C 或 Shift 变形。</p>
          <p class="ops" id="ov-ops">←↑↓→ / WASD 移动 · 空格开火 · C / Shift 变形 · R 重开 · M 静音</p>
          <div class="ov-actions" id="ov-start">
            <button type="button" id="btn-surf">地表</button>
            <button type="button" id="btn-raid">空袭</button>
          </div>
          <div class="ov-actions gone" id="ov-end">
            <button type="button" id="ov-retry">再来</button>
            <button type="button" id="ov-modes">换模式</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">飞机飞过炮台 · 坦克碾碎炮台 · C / Shift 变形</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
