<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>灌筐 · DUNK</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Crect x='24.2' y='4' width='2.2' height='18' rx='.6' fill='%2300f0ff'/%3E%3Cellipse cx='20' cy='14' rx='7.4' ry='2.1' fill='none' stroke='%23ff6a22' stroke-width='1.7'/%3E%3Cpath d='M14.2 15.2 C14.6 21 16.4 24.6 20 24.6 C23.6 24.6 25.4 21 25.8 15.2' fill='none' stroke='%2300f0ff' stroke-width='1.1' opacity='.85'/%3E%3Ccircle cx='10' cy='21' r='4.3' fill='%23ff6a22'/%3E%3Cpath d='M7.6 19.4 Q10 22.2 12.6 20.4' fill='none' stroke='%2305030c' stroke-width='.7'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>灌筐</b>
        <span>DUNK</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>得分</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
          <div class="score combo" id="combo-box">
            <em>连灌</em>
            <b id="combo">×0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">灌筐</span>
          <span id="tag-label">DUNK</span>
          <span id="power-label">—</span>
        </div>
      </div>
      <div class="tools">
        <button type="button" id="btn-mute" title="M" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="灌筐，侧视投篮，拖拽瞄准松手投出"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">DUNK</p>
          <h1 id="ov-title">灌筐</h1>
          <p class="lead" id="ov-lead">侧视投篮，一记空心最爽。<br />拖拽定角度和力度，松手出球。</p>
          <p class="ops" id="ov-ops">拖拽瞄准 · 空格投出 · 连灌不断直到投失 · 限时六十秒 · M 静音</p>
          <div class="ov-actions">
            <button type="button" id="btn-streak">连灌</button>
            <button type="button" id="btn-timed">限时</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">拖拽瞄准 · 空心入网 · R 重开</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
