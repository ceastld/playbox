<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#05030c" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>弹珠 · PIN</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2305030c'/%3E%3Cpath d='M7 26c0-2.2 2.4-3.6 9-3.6s9 1.4 9 3.6' fill='none' stroke='%23ff7a22' stroke-width='1.4'/%3E%3Ccircle cx='12.4' cy='13' r='2.4' fill='%23ff7a22'/%3E%3Ccircle cx='19.2' cy='10.6' r='2.7' fill='%23ffe36b'/%3E%3Ccircle cx='23.4' cy='15.2' r='2.2' fill='%23ff3db8'/%3E%3Ccircle cx='16.4' cy='20.2' r='1.7' fill='%23e8ffff'/%3E%3Cpath d='M8 23.2l5.6-2.2M24 23.2l-5.4-2.2' stroke='%2300f0ff' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="app">
    <header class="bar">
      <div class="brand">
        <b>弹珠</b>
        <span>PIN</span>
      </div>
      <div class="status">
        <div class="scores" aria-live="polite">
          <div class="score" id="score-box">
            <em>分数</em>
            <b id="score">0</b>
            <span id="score-add" class="score-add" hidden>+0</span>
          </div>
          <div class="score best">
            <em>最高</em>
            <b id="best">0</b>
          </div>
        </div>
        <div class="row">
          <span id="stage-label">弹珠</span>
          <span id="tag-label">PIN</span>
          <span id="combo-label" class="combo" hidden>×1</span>
          <span class="pips" id="pips" aria-label="剩余球数"></span>
        </div>
      </div>
      <div class="tools">
        <label class="speed-ctl" title="速度 慢 / 中 / 快 / 极快">
          <span>速度</span>
          <input type="range" id="speed" min="1" max="4" step="1" value="3" aria-label="速度" />
          <b id="speed-lab">快</b>
        </label>
        <button type="button" id="btn-auto" title="A" aria-label="自动" aria-pressed="false">自动</button>
        <button type="button" id="btn-mute" title="静音" aria-label="静音">声</button>
        <button type="button" id="btn-retry" title="R" aria-label="重开">重开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <canvas id="c" tabindex="0" role="application" aria-label="弹珠机台，左右弹板回击"></canvas>
      <div class="scan" aria-hidden="true"></div>
      <div id="toast" class="toast hidden"></div>
      <div id="overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="panel" id="panel">
          <p class="kicker" id="ov-kicker">PIN</p>
          <h1 id="ov-title">弹珠</h1>
          <p class="lead" id="ov-lead">弹板一磕，连撞爆炸。</p>
          <p class="ops" id="ov-ops">Z / M 或点左右半边弹板 · 空格发射 · A 自动</p>
          <div class="ov-actions">
            <button type="button" id="btn-classic">一球三命</button>
            <button type="button" id="btn-crazy">疯狂</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="hint" id="hint">Z 左弹板 · M 右弹板 · 空格发射 · 点左右半边也能打</footer>
  </div>
  <script src="js/game.js"></script>
</body>
</html>
