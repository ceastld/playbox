<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#07060f" />
  <title>百戏 · PLAYBOX</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2307060f'/%3E%3Ccircle cx='8' cy='16' r='3.2' fill='%23ff3db8'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%2300f0ff'/%3E%3Ccircle cx='24' cy='16' r='3.2' fill='%23ffe36b'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg"></div>
  <main id="lobby">
    <header class="top">
      <a class="brand" href="./">百戏</a>
      <p class="count" id="count">— 戏</p>
      <label class="search">
        <span class="sr-only">搜戏</span>
        <input id="q" type="search" placeholder="搜戏名、标签、简介" autocomplete="off" spellcheck="false" />
      </label>
    </header>
    <section class="hero">
      <p class="kicker">pick a room</p>
      <h1>百戏</h1>
      <p class="lead">先玩精选。复刻按射击、横版、清版这些小类挤在一起，点进去还能接着玩同类。</p>
    </section>
    <nav id="filters" class="filters" aria-label="分类"></nav>
    <nav id="subs" class="filters subs hidden" aria-label="小类"></nav>
    <p class="shelf-head" id="shelf-head"></p>
    <section id="grid" class="grid" aria-live="polite"></section>
    <p id="empty" class="empty hidden">没有叫这个的戏</p>
  </main>
  <section id="play" class="play hidden">
    <div class="play-bar">
      <button type="button" id="back">返回百戏</button>
      <div class="play-meta">
        <b id="play-title"></b>
        <span id="play-sub"></span>
      </div>
      <a id="open-tab" href="#" target="_blank" rel="noreferrer">新标签打开</a>
    </div>
    <nav id="more" class="more hidden" aria-label="类似游戏"></nav>
    <iframe id="frame" title="game" allow="autoplay"></iframe>
  </section>
  <script src="app.js"></script>
</body>
</html>
